server.port=${SERVER_PORT:8080}

nodeNet=localhost:19585

# Platform (hot-wallet) keystore for server-side signing (/api/v1/transfers/sign).
# Set wallet.keystore.json to the keystore JSON inline, or to a file path that will
# be read at startup. wallet.keystore.password is the keystore decryption password.
# When unset, /api/v1/transfers/sign falls back to requiring a caller-supplied keystore.
wallet.keystore.json=
wallet.keystore.password=

# === Exchange-wallet responsibility split (P2-4) ===
# The exchange-wallet module now organizes code into two responsibility packages:
#   org.nexus.wallet.wallet   — wallet management (custody, approval, whitelist,
#                               nonce pool, on-chain execution, node RPC)
#   org.nexus.wallet.signing  — signing service (platform keystore, MPC threshold
#                               signing, tx sign+broadcast, address/key derivation)
# Dependency direction: signing -> wallet (signing depends on wallet, never the reverse).
#
# Currently both packages are deployed in the same Spring Boot app (package-level split).
# To independently deploy the signing service as a separate nexus-signing-service module
# in the future, extract org.nexus.wallet.signing into its own Spring Boot app and point
# nexus.signing.base-url below at the standalone signing service; the wallet package
# would then call signing over HTTP instead of in-process.
# nexus.signing.base-url=http://localhost:8080
# nexus.signing.standalone=false


