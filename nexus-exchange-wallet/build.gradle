plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'org.nexus'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// 构建入口统一到自洽的 org.nexus.wallet 树（含 /api/v1/transfers/sign 等全部端点）。
// 旧的 com.sdk.server 镜像树已删除（其控制器不含签名端点，且只反向依赖 org.nexus.wallet.util.JsonUtil）。
springBoot {
    mainClass = 'org.nexus.wallet.ServerApplication'
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

dependencies {
    // Spring Boot 3.2.5 (managed by Boot plugin BOM, no explicit version)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Gson — still used by org.nexus.wallet.util.JsonUtil and JsonObject in controllers
    implementation 'com.google.code.gson:gson:2.10.1'

    // LevelDB
    implementation 'org.iq80.leveldb:leveldb:0.12'
    implementation 'org.iq80.leveldb:leveldb-api:0.12'

    // Rewritten wallet utilities (Jackson-based, replaces wcli.jar / nexus-java-sdk entirely).
    // Provides org.nexus.sdk.wallet.WalletUtils / TxUtils.
    implementation project(':nexus-sdk:java')
}
