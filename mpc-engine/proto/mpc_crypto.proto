// nexus-signing-service / MPC 密码学引擎 gRPC 接口定义
//
// v1.9.2：与 nexus-signing-service 的 src/main/proto/mpc_crypto.proto 完全对齐。
// Rust mpc-engine（tonic gRPC server）实现本服务；signing-service 的
// GrpcMpcCryptoEngine 作为 gRPC 客户端调用。字段名、hex 字符串编码、
// HealthCheck 均与 Java 侧契约一致，保证两端真正互通。

syntax = "proto3";

package nexus.mpc;

service MpcCryptoService {
  rpc Dkg(DkgRequest) returns (DkgResponse);
  rpc Sign(SignRequest) returns (SignResponse);
  rpc Aggregate(AggregateRequest) returns (AggregateResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  // v2.2.0 分散式（真门限安全）：协调器只做消息转发，不解密、不持密钥
  rpc RelayDkgMessage(DistDkgMessage) returns (RelayAck);
  rpc RelaySignMessage(DistSignMessage) returns (RelayAck);
  rpc DistStatus(DistStatusRequest) returns (DistStatusResponse);
  // v2.2.0 阶段二 F 批：CGGMP21 分散式门限签名生命周期（keygen/aux/sign
  // 全链路，原生 t-of-n 无 GG20 t+1 怪癖）。驱动线程 actor 模型（E 批）。
  // **index 全部 0-based**（与 CGGMP21 对齐；区别于 GG20 分散式的 1-based）。
  rpc CgStartKeygen(CgStartKeygenRequest) returns (CgPumpResponse);
  rpc CgPumpKeygen(CgPumpRequest) returns (CgPumpResponse);
  rpc CgStartAux(CgStartAuxRequest) returns (CgPumpResponse);
  rpc CgPumpAux(CgPumpRequest) returns (CgPumpResponse);
  rpc CgAssembleShare(CgSessionOnly) returns (CgAck);
  rpc CgStartSign(CgStartSignRequest) returns (CgSignPumpResponse);
  rpc CgPumpSign(CgPumpRequest) returns (CgSignPumpResponse);
  rpc CgVerifySignature(CgVerifyRequest) returns (CgVerifyResponse);
  rpc CgStatus(CgSessionOnly) returns (CgStatusResponse);
  // CGGMP21 消息中转（协调器字节管道）：发布 + 拉取（拉取自动排除自发消息）
  rpc CgRelayPublish(CgRelayMessage) returns (CgRelayAck);
  rpc CgRelayPull(CgRelayPullRequest) returns (CgRelayPullResponse);
}

// === DKG ===

message DkgRequest {
  string session_id = 1;
  int32 threshold = 2;
  int32 total_parties = 3;
  int32 party_index = 4;
  string curve = 5;
  repeated string peer_endpoints = 6;
}

message DkgResponse {
  string public_key = 1;   // 聚合公钥（hex 编码曲线点）
  string key_share = 2;    // 本节点密钥份额（hex）
  string proof = 3;        // DKG 正确性 ZK 证明（hex）
  bool success = 4;
  string error = 5;
}

// === Sign ===

message SignRequest {
  string session_id = 1;
  string public_key = 2;      // 聚合公钥（hex）
  string key_share = 3;       // 本节点密钥份额（hex）
  string message_hash = 4;    // 消息哈希（hex，32 字节）
  int32 party_index = 5;
  repeated string peer_endpoints = 6;
}

message SignResponse {
  string partial_signature = 1;  // 本节点部分签名（hex）
  string proof = 2;
  bool success = 3;
  string error = 4;
}

// === Aggregate ===

message AggregateRequest {
  string session_id = 1;
  string public_key = 2;
  string message_hash = 3;
  repeated string partial_signatures = 4;
}

message AggregateResponse {
  string signature = 1;   // 聚合签名 r||s（hex，64 字节）
  string r = 2;
  string s = 3;
  int32 recovery_id = 4;
  bool success = 5;
  string error = 6;
}

// === HealthCheck ===

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  bool healthy = 1;
  string status = 2;
}

// === v2.2.0 分散式（真门限安全） ===
// 协调器仅转发各方的协议消息（round_based::Msg<ProtocolMessage> 的
// serde_json 序列化），任何一方（含协调器自身）都无法接触他方份额。

message DistDkgMessage {
  string session_id = 1;
  // 发送方在协议中的 party index（1-based，与 multi-party-ecdsa Keygen::new 对齐）
  uint32 sender_index = 2;
  // 可选接收方 index（0 = 广播）
  uint32 receiver_index = 3;
  // round_based::Msg<keygen::ProtocolMessage> 的 serde_json 序列化载荷
  string payload_json = 4;
}

message DistSignMessage {
  string session_id = 1;
  uint32 sender_index = 2;
  uint32 receiver_index = 3;
  // round_based::Msg<sign::ProtocolMessage> 的 serde_json 序列化载荷
  string payload_json = 4;
}

message RelayAck {
  bool success = 1;
  string error = 2;
}

message DistStatusRequest {
  string session_id = 1;
}

message DistStatusResponse {
  // 当前协议轮次（Keygen 0-4；OfflineStage 递进；5=Final）
  uint32 current_round = 1;
  bool finished = 2;
  string error = 3;
}

// =========================================================================
// v2.2.0 阶段二 F 批：CGGMP21 分散式门限签名生命周期
// =========================================================================
// 驱动线程 actor（E 批）：所有 Cg* RPC 经 CgDriverHandle 信封指令转发到
// 专用驱动线程执行（状态机 !Send——独占线程是硬约束）。协议消息是
// cggmp21 协议 Msg 的 serde JSON（协调器不理解、不落盘、不修改）。

// --- 启动/泵动 ---

message CgStartKeygenRequest {
  string session_id = 1;
  // eid 防重放序号（同 session 同协议重试单调递增；首次 0）
  uint32 counter = 2;
  uint32 my_index = 3;       // 0-based 本方索引
  uint32 total_parties = 4;  // n
  uint32 threshold = 5;      // t（签名所需方数）
}

message CgStartAuxRequest {
  string session_id = 1;
  uint32 counter = 2;
  uint32 my_index = 3;   // 0-based
  uint32 total_parties = 4;
}

// 泵动通用请求：喂入协调器转来的消息（可为空——取回新产出的 outgoing）
message CgPumpRequest {
  string session_id = 1;
  repeated CgRelayMessage incoming = 2;
}

// keygen/aux 泵结果（sign 用 CgSignPumpResponse——完成时携带签名）
message CgPumpResponse {
  repeated CgRelayMessage outgoing = 1;
  bool finished = 2;
  // keygen 完成时的聚合公钥（压缩 SEC1 hex）——三方一致，可任一方导出
  string aggregate_public_key = 3;
  bool success = 4;
  string error = 5;
}

message CgSessionOnly {
  string session_id = 1;
}

message CgAck {
  bool success = 1;
  string error = 2;
}

message CgStartSignRequest {
  string session_id = 1;
  uint32 counter = 2;
  // 本方在**本批签名方**中的 0-based 序号（0..t）
  uint32 my_index_in_signers = 3;
  // 本批签名方在 keygen 时的原始 0-based 索引（恰好 t 个）
  repeated uint32 signers_at_keygen = 4;
  // 32 字节消息哈希（原始字节非 hex——与 CGGMP21 DataToSign 对齐）
  bytes message_hash = 5;
}

// sign 泵结果（完成时携带 r/s 大端 hex）
message CgSignPumpResponse {
  repeated CgRelayMessage outgoing = 1;
  bool finished = 2;
  string r_hex = 3;  // 完成时签名 r（32 字节大端 hex）
  string s_hex = 4;  // 完成时签名 s
  bool success = 5;
  string error = 6;
}

// --- 验签（引擎用 session 聚合公钥本地验——S4 同款信任根基） ---

message CgVerifyRequest {
  string session_id = 1;
  bytes signature_r = 2;  // 32 字节
  bytes signature_s = 3;  // 32 字节
  bytes message_hash = 4; // 32 字节
}

message CgVerifyResponse {
  bool valid = 1;
  bool success = 2;  // 指令执行成功（区别于验签结果 valid）
  string error = 3;
}

// --- 状态查询 ---

message CgStatusResponse {
  bool has_keygen_state = 1;
  bool has_aux_state = 2;
  bool has_sign_state = 3;
  bool has_core_share = 4;
  bool has_aux_info = 5;
  bool has_key_share = 6;
  bool success = 7;
  string error = 8;
}

// --- 消息中转（协调器字节管道；与 DistDkgMessage 同构但 0-based） ---

message CgRelayMessage {
  string session_id = 1;
  // 0-based 发送方索引（注意：GG20 的 DistDkgMessage 是 1-based）
  uint32 sender_index = 2;
  // 0-based 目标方索引（仅 is_p2p=true 时有效）
  uint32 receiver_index = 3;
  // cggmp21 协议消息 serde JSON（keygen/aux/sign 按会话阶段区分）
  string payload_json = 4;
  // **F 批修正（哨兵冲突）**：CGGMP21 PartyIndex 0-based——p2p 目标方 0
  // 与"广播"哨兵 0 冲突（Some(0) 被压平成 0 后无法与 None 区分，
  // 目标方 0 的定向消息被当广播喂入 → MismatchedMessageType）。
  // is_p2p=true 表示定向（receiver_index 有效）；false 表示广播。
  bool is_p2p = 5;
}

message CgRelayAck {
  bool success = 1;
  string error = 2;
}

message CgRelayPullRequest {
  string session_id = 1;
  // 拉取方自己的 0-based 索引（服务端自动排除自发消息）
  uint32 my_index = 2;
}

message CgRelayPullResponse {
  repeated CgRelayMessage messages = 1;
  bool success = 2;
  string error = 3;
}
