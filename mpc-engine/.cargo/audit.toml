# cargo-audit 豁免白名单（2026-08-28, P4 审计增补）
# ============================================================================
# 处置原则：仅豁免「上游依赖锁定 / 无可用修复版本」的 advisory，避免用 ignore
# 掩盖可修复的依赖漏洞。可修复项一律升级（见 Cargo.lock：h2 0.4.15→0.4.19、
# hyper/rustls-webpki/rand/log/syn 等 8 项已 cargo update 升级）。
# 豁免项均附带上游锁定依据，跟踪上游发版后移除。

[advisories]
ignore = [
    # curve25519-dalek 3.2.0（RUSTSEC-2024-0344, CVE-2024-58262, timing variability）
    # patched >= 4.1.3 属 major 升级；curv-kzen 0.9（multi-party-ecdsa 0.8.1 依赖链）
    # 声明 curve25519-dalek = "^3"，无 3.x 修复版本，升级 4.x 需 multi-party-ecdsa
    # 上游先升级 —— 与 Cargo.toml secp256k1 REQ-26 同类（密码学依赖链锁定，延后）
    "RUSTSEC-2024-0344",

    # secp256k1 0.20.3（RUSTSEC-2022-0070, unsound, timing side-channel）
    # patched >= 0.22.2 但 multi-party-ecdsa 0.8.1 / curv-kzen 0.9 绑定 0.20 API
    # （secp256k1::Signature 导出、verify()/Message::from_slice 等 breaking 变更），
    # 已在 Cargo.toml 注释声明 REQ-26 延后：等 multi-party-ecdsa 上游发版后升级
    "RUSTSEC-2022-0070",

    # derivative 2.2.0（RUSTSEC-2024-0388, unmaintained）
    # 传递依赖（经 multi-party-ecdsa 依赖链），无修复版本，仅 informational 维护状态
    "RUSTSEC-2024-0388",

    # rand_os 0.1.3（RUSTSEC-2025-0124, unmaintained）
    # 传递依赖（经 curv-kzen 旧链），无修复版本，仅 informational 维护状态
    "RUSTSEC-2025-0124",

    # rustls-pemfile 2.2.0（RUSTSEC-2025-0134, unmaintained）
    # 传递依赖（经 tonic/tls 链），无修复版本，仅 informational 维护状态
    "RUSTSEC-2025-0134",

    # rand 0.7.x（RUSTSEC-2026-0097, unsound——自定义 logger 场景下 rand::rng() 未定义行为）
    # rand 0.7 与 curv-kzen 0.9 / multi-party-ecdsa 0.8.1 绑定（Cargo.toml REQ-26 注释），
    # 项目实际使用为 GCM nonce 生成（aes-gcm 0.10），未启用自定义 logger 路径，
    # 升级 0.8 需 multi-party-ecdsa 上游先升级——与 RUSTSEC-2022-0070 同类延后
    "RUSTSEC-2026-0097",

    # cggmp21 0.6.3（RUSTSEC-2025-0127, CVE-2025-66017, crypto-failure）
    # 漏洞面：presignature 的两种削弱用法——①Presignature::set_derivation_path
    # （HD 派生路径后选，安全级降至 85bit）；②raw signing（PrehashedDataToSign
    # 未观测原文即签，签名伪造）。修复仅随 cggmp24 v0.7.0-alpha.2+（API 变更式
    # 修复，0.6.x 无补丁版）。
    # 豁免依据（advisory 官方 workaround 原文："unpatched versions can be used
    # safely as long as presignatures are not used in the two scenarios above"）：
    # mpc-engine 仅使用 cggmp21::signing(eid,i,parties,key_share).sign_sync()
    # 完整签名协议（cggmp.rs sign_state_machine），**从不调用 generate_presignature /
    # issue_partial_signature / set_derivation_path**（HD-wallet feature 未启用，
    # Cargo.toml features=[state-machine, curve-secp256k1]）。签名消息哈希经
    # DataToSign::from_digest 构造（原文哈希，非任意 prehash）。
    # 升级路线：cggmp24 v0.7 正式版发布后迁移（CGGMP21_MIGRATION.md 四步），
    # 届时移除本豁免。见 docs/plan/ v2.2.0 阶段二批注。
    # 移除触发条件（A 批注记 2026-09-05，任一满足即应重估并迁移）：
    #   ① cggmp24 0.7 stable 正式发布（Cargo Audit 自动监视——本文件即其触发器，
    #      新 advisory / 版本发布均会使 cargo audit 门禁告警提醒重估）；
    #   ② 出现影响本项目实际用法（sign_sync 完整签名路径）的新 CVE——同上自动监视；
    #   ③ cggmp21 0.6.x 与未来工具链不兼容（rustc edition/新 MSRV/GMP API 变更
    #      导致无法编译），被迫升级时的窗口期同样适用本豁免依据。
    "RUSTSEC-2025-0127",
]
