[package]
name = "mpc-engine"
version = "0.1.0"
edition = "2021"
description = "NexusChain MPC 密码学引擎（GG18/GG20 DKG/Sign/Aggregate），审计报告 §4.1 方案 A"
license = "Apache-2.0"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === 阈值签名密码学库（真实 GG18/GG20 门限 ECDSA）===
# ZenGo-X/KZen multi-party-ecdsa：GG18/GG20 ECDSA 阈值签名的成熟 Rust 实现
# （真实 Paillier 密钥、Feldman VSS、MtA、ZK 证明，非模拟）。
# 许可证 GPL-3.0-or-later。mpc-engine 作为独立进程经 gRPC 与外界通信，
# GPL 传染性限于本二进制，不影响仓库其余 Apache-2.0 组件（进程隔离）。
# 版本 0.8.1 依赖 curv-kzen 0.9 / kzen-paillier 0.4.2 / sha2 0.9 / secp256k1 0.20，
# 此处显式声明同版本以让 cargo 统一解析。
multi-party-ecdsa = "0.8.1"
curv-kzen = "0.9"
paillier = { version = "0.4.2", package = "kzen-paillier" }
zk-paillier = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# secp256k1 版本锁定 0.20：multi-party-ecdsa 0.8.1 / curv-kzen 0.9 依赖
# secp256k1 0.20 的 API。曾尝试升级至 0.29，但 0.29 存在 breaking API 变更：
#   1) `secp256k1::Signature` 不再从 crate 根导出（需改用 `secp256k1::ecdsa::Signature`）；
#   2) `Secp256k1::verify()` 被移除，替换为 `verify_ecdsa()`；
#   3) `Message::from_slice` 被弃用（改用 `from_digest_slice`）。
# 升级 0.29 需同步重写 gg20.rs 的 secp256k1 调用，且 multi-party-ecdsa 0.8.1
# 内部仍绑定 0.20 API，会导致版本分裂。故在 multi-party-ecdsa 升级至支持
# secp256k1 0.29+ 的版本之前，此处保持 0.20 不变。
secp256k1 = { version = "0.20", features = ["global-context"] }
hex = "0.4"
sha2 = "0.9"

[build-dependencies]
tonic-build = "0.12"

[features]
tls = ["tonic/tls"]
