[package]
name = "mpc-engine"
version = "0.1.0"
edition = "2021"
description = "NexusChain MPC 密码学引擎（GG18/GG20 DKG/Sign/Aggregate），审计报告 §4.1 方案 A"
license = "Apache-2.0"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === 阈值签名密码学库 ===
# 审计报告 §4.1：GG18/GG20 成熟实现集中在 Rust 生态，Java 生态无成熟实现。
# 骨架阶段暂不启用重型密码学依赖（避免阻断结构编译验证）；正式接入时取消注释其一。
#
# 选项 1（推荐，ECDSA 链）：ZenGo-X/tss-lib —— GG18/GG20 ECDSA 阈值签名
# tss = { git = "https://github.com/ZenGo-X/tss-lib.git" }
#
# 选项 2（BLS 共识）：celo-org/celo-threshold-bls-rs —— BLS 阈值签名
# threshold-bls = { git = "https://github.com/celo-org/celo-threshold-bls-rs.git" }
#
# 注：任务模板原写 `multi-party-ecdsa = { git = "celo-threshold-bls-rs" }`，
# 但该仓库 crate 名为 threshold-bls 且为 BLS 而非 ECDSA，此处按实际仓库命名修正。
# 骨架内部用 eyre::Result 返回未实现错误（见 src/dkg.rs / sign.rs / aggregate.rs）。

[build-dependencies]
tonic-build = "0.12"