[package]
name = "mpc-engine"
version = "0.1.0"
edition = "2021"
description = "NexusChain MPC 密码学引擎（CGGMP21 门限 ECDSA：keygen/aux/sign）"
license = "Apache-2.0"

# lib target 暴露全部业务模块，供 tests/cggmp_*.rs 集成测试引用。
[lib]
name = "mpc_engine"
path = "src/lib.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === 门限签名密码学库（唯一路径：CGGMP21）===
# LFDT-Lockness/cggmp21 0.6.3：state-of-art 门限 ECDSA（Kudelski 审计）。
# 关键能力（旧 GG20 路径无法做到的）：
#   1. 全部协议消息类型 pub（keygen ThresholdMsg/signing Msg/AuxOnlyMsg）——
#      分布式转发的前提（GG20 的 OfflineProtocolMessage 是 crate 私有）
#   2. 原生 t-of-n 门限（签名恰好 t 方）
#   3. 活跃维护；许可证 MIT OR Apache-2.0
# 依赖链注意：crates.io 锁定 paillier-zk 0.4.3 → fast-paillier 0.1.1 → rug/GMP
# 硬依赖（Windows 本地构建需 MSYS2 m4+make；Linux CI 直接可用）。
# 依赖策略：cggmp21 自带 generic-ec/round-based 0.4.x（其 re-export 即可用），
# 不在此显式声明版本。
#
# **GG20 退役（PLAN-001-R2，2026-10-08）**：GG20 可信协调器路径及其 GPL-3.0 系
# crate（multi-party-ecdsa / centipede / bulletproof-kzen / round-based 0.1 /
# zk-paillier）已从依赖树整体删除——本 crate 现无 GPL/AGPL 依赖。
cggmp21 = { version = "0.6.3", features = ["state-machine", "curve-secp256k1"] }
# sha2 0.10：cggmp21 依赖 digest 0.10 trait（GenericArray 等新 API）。
# 别名 sha2_010 为历史命名（退役前用于与 GG20 系的 sha2 0.9 隔离）——
# 依赖树中现已无第二个 sha2 版本，可择机在后续清理批次改回 `sha2`。
sha2_010 = { package = "sha2", version = "0.10" }
# rand_core：cggmp21 链路（keygen rng）与 persistence nonce 生成使用。
# features=["getrandom"]：提供 OsRng（密码学随机源）。
rand_core = { version = "0.6", features = ["getrandom"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# === MPC-P1-05 安全止血：份额落盘 AES-256-GCM 加密 ===
# aes-gcm 0.10：AES-256-GCM AEAD（认证加密），用于加密 CGGMP21 协议产物
# （含私钥份额，明文落盘可被任意提取）。密钥从 MPC_STORAGE_KEY 环境变量读取。
aes-gcm = "0.10"

# === 密钥材料安全擦除（zeroize）===
# zeroize 1.8：提供 Zeroize trait 与派生宏，用于在密钥材料（storage_key 等）
# 离开作用域前将其内存清零，防止残余密钥被内存转储/冷启动攻击提取。
zeroize = { version = "1.8", features = ["derive"] }

[build-dependencies]
tonic-build = "0.12"

[features]
tls = ["tonic/tls"]

# === 集成测试依赖（tests/cggmp_*.rs）===
# serial_test：persistence 测试家族依赖全局 MPC_STORAGE_KEY_VERSION env，
# 并行测试下 set/remove 交错导致 flaky。#[serial] 标记 env 竞态用例。
[dev-dependencies]
serial_test = "3"
# cggmp_rpc_e2e.rs / cggmp_persistence_recovery.rs 进程内 tonic server 需要
# TcpListenerStream。
tokio-stream = { version = "0.1", features = ["net"] }
