# NexusChain gitleaks 配置（P4 修复，2026-08-27；P0 审计修复 2026-08-28）
# -----------------------------------------------------------------------------
# 背景：CI 的 gitleaks-scan job 引用 GITLEAKS_CONFIG=.gitleaks.toml 但文件缺失，
# 且默认规则对项目内 dev 默认值/测试数据产生 514 处误报（generic-api-key 高熵命中）。
# 本配置：
#   1. 继承 gitleaks 内置默认规则（extend.useDefault = true）——真实密钥规则全部保留
#   2. allowlist 精确排除确认的误报（dev 默认值 / 测试数据 / 注释样例）
# 修复后本地 `gitleaks detect` 应 0 泄漏。
#
# P0 审计修复说明：原文件 [extend] 段缺少 useDefault = true 且未定义任何自定义
# [rules]，gitleaks v8 语义下生效规则集为 0——CI 的密钥扫描永远报 0 泄漏，
# "514 处误报清零"实为清零了全部检测能力。补回 useDefault = true 后，
# 真实密钥检测恢复；下方白名单保留并对最宽泛的模式收窄。
#
# 白名单原则（只排除"明确不是密钥"的模式，不放过真实密钥）：
#   - 项目贯穿使用的 dev 默认 storage key（docker-compose.yml / start-node.bat / 各 yml 同值）
#   - 测试数据文件（dbdump/StorageDictionary/组件测试占位符）
#   - 注释中 JWT 样例与测试专用假密钥

title = "NexusChain gitleaks config"

[extend]
# P0 审计修复：显式继承 gitleaks 内置默认规则集。
# 缺少 useDefault = true 时 [extend] 不继承任何规则，且本文件未定义 [rules]，
# 生效规则集为 0，密钥扫描整体失效。
useDefault = true

[allowlist]
description = "NexusChain 项目级白名单：dev 默认值 + 测试数据 + 误报排除"

# === 1. dev 默认值（贯穿仓库，非真实密钥）===
regexes = [
    # 开发默认 storage key：0123 开头 + 60 个 hex 字符（64 字符全长，
    # docker-compose / start-node.bat / yml 共用；通配形式避免明文密钥入库）。
    # 审计收窄：仅匹配纯 hex 形态（原 0123 前缀 hex 64 位不变）。
    '''0123[0-9a-f]{60}''',
    # 同一 dev 密钥的 base64 编码（application-dev.yml keystore.encryption-key，
    # "0123456789abcdef..." 全假数据，44 字符 = MDEy + 39 主体 + '='）。
    # 修正（2026-08-31 历史重写后验证）：原模式 [AQgw]= 的 padding 前字符
    # 假设与真实形态不匹配导致残留误报；改为定长 39 主体 + '=' 收尾。
    '''MDEy[A-Za-z0-9+/]{39}=''',
    # 上述 dev 密钥经 base64 解码后的字面量（32 hex 字符；gitleaks 部分规则会
    # 解码匹配）。精确豁免该假数据本身。
    '''0123456789abcdef''',
    # 开发默认 auth token（docker-compose / start-node.bat 共用）
    '''dev-mpc-engine-token-change-in-prod''',
    # Nacos 3.x 鉴权占位 token（docker-compose.yml dev 凭据，仅本机网络可达）。
    # 两种形态都精确豁免：token 的 base64 体（SecretKey+60 数字）与
    # 环境变量注入形式的完整默认值（远端 gitleaks-action 最新版规则
    # generic-api-key 命中 NACOS_AUTH_TOKEN=<值> 整行，本地旧版不命中，
    # 故对两种写法都加白）。占位值本身即 nacos 官方文档示例串，非真实密钥。
    '''SecretKey[0-9]{60}''',
    '''NACOS_AUTH_TOKEN=SecretKey[0-9]{60}''',
    '''NACOS_AUTH_TOKEN=\$\{NACOS_AUTH_TOKEN:-SecretKey[0-9]{60}\}''',
    # 测试专用 JWT 样例（注释中，含 hmac secret 的 demo token）
    '''eyJhbGciOiJIUzI1NiJ9\.eyJqdGkiOiIxIiwiaWF0IjoxNTcyNDE2MTYw''',
    # 代码标识符误报：generic-api-key 规则将类型名/参数名误判为密钥
    '''X509Certificate''',
    '''Groth16VerifyingKey''',
    # --- 2026-10-01 CI run 36767107602 剩余误报（精准值豁免，非整文件放行）---
    # SensitiveDataFilterTest 的 Stripe 假夹具：**刻意不写完整字面量**。
    # 教训（自食其果）：一旦把 sk_live_... 原文写进本文件，Trivy fs 的密钥扫描会把
    # .gitleaks.toml 自身判为 CRITICAL: Stripe (stripe-secret-token)，反而把
    # 「CRITICAL,HIGH 阻断」步骤打红 —— 豁免文件不能内含密钥材料。
    # 改用字符类描述：`\b` 锚定 16 位后缀，真实 Stripe key（sk_live_ + 24 位以上）
    # 在该位置没有词边界，不会被子串误伤。
    '''\bsk_live_[a-z0-9]{16}\b''',
    '''\bpk_live_[a-z0-9]{16}\b''',
    # DeveloperPortalService 开发者门户文档占位符（实测 11 处全是 YOUR_API_KEY 字面占位，
    # 供前端/SDK 文档复制使用，非凭据）
    '''YOUR_API_KEY''',
]

# === 2. 测试数据 / 测试代码（非生产文件）===
paths = [
    # --- 2026-10-01：调试临时文件（1e14397 已从仓库删除，但其 blob 仍留在历史 commit 中，
    # 全历史扫描（CI gitleaks-action / 本地 gitleaks detect）必然命中，故按路径豁免）---
    #   .tmp-gitleaks-probe/Probe.java —— 本次排查 gitleaks 豁免语义时自建的一次性探针
    #   _hmacprobe.ps1 —— 早期 HMAC 联调脚本，内含本地生成的临时 cpk_ 测试密钥（非生产凭据）
    '''\.tmp-gitleaks-probe/''',
    '''_hmacprobe\.ps1''',
    '''src/test/resources/dbdump/''',
    '''src/test/resources/db/''',
    '''newanalogTest''',
    '''KeystoreTests''',
    '''PosConsensusIntegrationTest''',
    '''ErrorMessageSanitizerTest''',
    '''__tests__/''',
    '''transaction-test-example.jsonc''',
]

# === 3. 历史密钥重写记录（2026-08-31 完成）===
# 此前此处有两笔历史 commit 豁免（34ca4ea7 / 46706934——已轮换 JWT 密钥
# 与 dev storage key）。2026-08-31 已执行 git filter-repo 历史重写：
#   - 两个已轮换 JWT 密钥全历史 blob 替换为 REDACTED-ROTATED-JWT-SECRET
#     （git log -S 全历史零命中验证）
#   - 重写后全部 commit SHA 变化，旧豁免已随 SHA 失效，整块移除
# 备份：重写前镜像存于仓库外（NexusChain-pre-rewrite.git，HEAD 9e932dc）。

# === 自定义规则（2026-09-17，立即项 #2：硬编码静态凭据设防）===
# 背景：审计发现两处随源码入库的静态凭据，gitleaks **默认规则集均未命中**：
#   1) nexus-core/.../command/RpcInterceptor.java —— 孵化 RPC 令牌以明文字面量
#      与请求头比较（具体字面量已从本文件注释中移除，见 git 历史）；
#   2) nexus-core/.../controller/PoolController.java —— 池管理令牌的 sha3 摘要
#      常量随源码入库（同上）。
# 两处均已改为配置注入 + 常量时间比较 + fail-closed（见上述类注释与
# application.properties 的「安全配置补全」节）。
# 本规则针对该反模式设防：名为 token/apikey/secret/password 等的变量
# **直接与字符串字面量 equals**（正确做法是配置/密钥管理 + 常量时间比较）。
# 注意：本规则会命中 git 历史中的旧实现（全历史扫描见下 allowlist 说明）。
[[rules]]
id = "nexus-hardcoded-token-literal"
description = "硬编码静态凭据：token/apikey/secret/password 等变量与字符串字面量直接 equals 比较（应改为配置注入 + 常量时间比较）"
# 2026-10-01 修复（实测根因）：原正则用捕获组 (token|hash|...) —— gitleaks 取**第一个
# 捕获组**作为 secret，于是 secret 变成变量名本身（token → entropy 2.321928=log2(5)、
# hash → 1.500000，与 CI run #313 日志一致，日志里被 REDACTED 的也是变量名而非字面量）。
# 因此 [rules.allowlist] 中用字面量写的 regexes 拿 secret（=变量名）去匹配，**永远匹配不上**，
# 豁免形同不存在 —— RpcInterceptor/PoolController 的历史字面量在 CI 与本地全历史扫描中
# 持续报红，即由此而来。
# 改为非捕获组 (?:...) 后 secret = 整条匹配文本（含字面量），豁免才真正生效；
# 且不削弱检测能力：新硬编码探针 ZZZNEWSECRET1234567890 实测仍被拦下。
regex = '''(?i)\b(?:token|tokenhash|hash|digest|shahash|api_?key|apikey|secret|passwd|password|credential)\s*\.\s*equals\s*\(\s*"[^"\s]{8,}"\s*\)'''
tags = ["nexus", "credential"]

# 仅豁免上述两个**已移除**的历史字面量（它们在 git 历史中已公开、当前代码已改配置注入）。
# 精确到这两个值：任何"新"硬编码令牌不匹配此白名单，仍会被上面的规则拦下。
[rules.allowlist]
description = "历史已移除的两处静态凭据字面量（防全历史扫描对已修复 commit 报警）"
regexes = [
    '''NUMtD0dEXungVX7eLuXkEurH5BCJzw''',
    '''a772c260ae19e8972f1da3af77492fdb6b40f34a9b34b4a9021ecfd900f21e53''',
    # a7a897f 的 Javadoc 里以**缩写形式**引用了旧代码作为 S-1 修复说明：
    #   {@code if (token.equals("NUMtD0..."))}
    # 这不是凭据（HEAD 已无任何形式的该令牌），但全历史扫描仍会命中该注释行，
    # 故用该已轮换令牌的唯一前缀同时覆盖"全称"与"缩写"两种出现形式。
    # 前缀取自一次性轮换令牌自身，新的真实密钥不会以此开头 → 不构成漏检口子。
    '''NUMtD0''',
]
