# 集成测试 profile — H2 内存数据库 + Nacos / Sentinel / Seata 禁用
#
# 激活方式：@ActiveProfiles("test")
# 集成测试环境无 Nacos / Sentinel Dashboard / Seata Server，禁用外部中间件
# 以保证 ApplicationContext 可独立加载（与 nexus-bridge / nexus-wallet-service
# test profile 对齐，参考 nexus-bridge/src/test/resources/application-test.yml）。
#
# 注意：
# 1. build.gradle 引入了 spring-cloud-starter-alibaba-nacos-discovery / -config /
#    -sentinel / -seata 依赖，主配置 application.yml + bootstrap.yml 会触发
#    Nacos 连接 / Sentinel Dashboard 心跳 / GlobalTransactionScanner 初始化，
#    在无外部中间件的测试环境必然失败，因此必须在测试 profile 禁用。
# 2. 现有集成测试（GatewayCoreIntegrationTest 等）使用 @ActiveProfiles("sandbox")，
#    sandbox profile 的禁用配置在 main/resources/application-sandbox.yml 中补充。
#    本文件作为标准 test profile 供新测试使用。
spring:

  # === 允许 Bean 定义覆盖：PaymentE2EIntegrationTest 等测试需要覆盖部分 Bean ===
  # 修复 BeanDefinitionOverrideException
  main:
    allow-bean-definition-overriding: true
  datasource:
    # MODE=MySQL（2026-08-31）：ShedLock usingDbTime() 生成 TIMESTAMPADD/MICROSECOND
    # 等 MySQL 方言 SQL，H2 兼容模式下可执行（与 wallet-service 测试库同款做法）。
    url: jdbc:h2:mem:nexus_gateway_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # S3/S1 测试适配（2026-08-31）：测试库 Flyway 禁用、ddl-auto 只建 @Entity 表，
  # 而 ShedLock 的 shedlock 表无 JPA 实体——@Scheduled 调度器（含由 @PreAuthorize
  # AOP 链激活的启动期首个任务）打该表报 Table not found，异常经调度冒泡为
  # 端点 500。此处经 sql.init 在 H2 启动时建表（与 V11 migration 同构，H2 语法）。
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-shedlock-init.sql
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: false
  # === 集成测试禁用 Nacos / Sentinel（无外部依赖） ===
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    sentinel:
      enabled: false

# 测试环境禁用 Seata（无 Seata Server 可连接，避免 GlobalTransactionScanner 初始化失败）
seata:
  enabled: false

# 测试环境禁用 Zipkin 上报（无 Zipkin Server）
management:
  tracing:
    sampling:
      probability: 0.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Sandbox 风格的业务配置（测试无链节点/钱包服务运行）
nexus:
  # P1-4: 请求签名密钥（HMAC-SHA256）。测试环境使用固定密钥，
  # 供 RequestSignatureInterceptor 验证签名。生产环境必须通过 Vault/KMS 注入。
  security:
    requestSigningSecret: test-signing-secret-do-not-use-in-prod
  # === LocalFileKeyManager 加密密钥（Base64 编码的 32 字节 AES-256 密钥） ===
  # 修复 IllegalStateException: LocalFileKeyManager requires an encryption key
  # 测试环境使用固定密钥（32 个 0 字节的 Base64 编码），生产环境通过 Vault/KMS 注入
  keystore:
    encryption-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  chain:
    rpc-url: http://localhost:3000
    skip-confirmation: true
  consortium:
    rpc-url: http://localhost:8080
    skip-confirmation: true
  exchange-wallet:
    base-url: http://localhost:8081
    platform-pubkey: "1TestPlatformPubkey000000000000000000000000000"
    enabled: false
  settlement:
    risk:
      amount-threshold: 1000000000
      velocity-max-count: 10000
  routing:
    dual-chain:
      enabled: false

logging:
  level:
    org.nexus: DEBUG