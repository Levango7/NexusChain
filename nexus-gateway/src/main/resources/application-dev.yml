# Development profile: use H2 in-memory database (no MySQL required)

# 显式设置 server.port=8080：Nacos config 可能在 bootstrap context 外加载
# 并覆盖 application.yml 中的端口。在 application-dev.yml 中显式设置确保优先级。
server:
  port: 8080

# Dev/DAST 健康端点显示完整详情（定位 DOWN 的健康指标）
management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    # discovery 健康指标与下方 spring.cloud.nacos.discovery.enabled 同门控：
    # NEX_NACOS_ENABLED=true 时（dev compose / kind 演练）恢复真值上报，
    # 未设置时（纯本地 bootRun，无 Nacos）保持关闭避免 UNKNOWN 噪音。
    discovery:
      enabled: ${NEX_NACOS_ENABLED:false}

spring:
  datasource:
    url: jdbc:h2:mem:nexus_gateway;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # dev profile 用 H2 内存库，validate 模式要求 Flyway 迁移覆盖所有实体表，
      # 若有新增实体（如 currency_wallets）未在迁移脚本中则启动失败。
      # update 模式让 Hibernate 自动建表，适合 dev/DAST 场景。
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

  # Dev/DAST 环境无 Seata TC server（seataio/seata-server:2.5.0 镜像不可用），
  # 排除 SeataAutoConfiguration 避免 can not connect to 127.0.0.1:8091 启动失败。
  # 生产环境通过 application-prod.yml 启用 Seata（有 TC server 部署）。
  autoconfigure:
    exclude:
      - org.apache.seata.spring.boot.autoconfigure.SeataAutoConfiguration
      - org.apache.seata.spring.boot.autoconfigure.SeataDataSourceAutoConfiguration
      - com.alibaba.cloud.seata.SeataAutoConfiguration
      - com.alibaba.cloud.nacos.NacosConfigAutoConfiguration
      - com.alibaba.cloud.nacos.client.NacosConfigBootstrapAutoConfiguration

  # Nacos discovery 门控（2026-09-14 10a 收尾）：dev profile 此前硬编码
  # enabled=false——compose 无 Nacos 时代的遗留开关，全栈演练暴露为
  # "Discovery Client not initialized"（Backlog 10a 的 gateway 侧真根因；
  # PR #8 已修活 signing，gateway 因本开关仍关闭）。现改为 env 门控：
  #   NEX_NACOS_ENABLED=true（dev compose / kind 演练已设置）→ 启用发现+注册
  #   未设置（纯本地 bootRun，无 Nacos）→ 保持禁用，避免连接超时拖慢启动
  cloud:
    nacos:
      discovery:
        enabled: ${NEX_NACOS_ENABLED:false}
        register-enabled: ${NEX_NACOS_ENABLED:false}
      # 禁用 Nacos config loading：dev 环境不拉取共享配置（nexus-common 等
      # 由各服务自带默认值兜底），生产 prod profile 启用。
      config:
        enabled: false
    # Sentinel transport 也尝试连接 localhost:8858（sentinel-dashboard），
    # DAST 环境未启动 sentinel-dashboard，连接超时延迟启动。禁用 Sentinel。
    sentinel:
      enabled: false

  # ShedLock 表在 H2 中可能未被 Flyway 创建（早期迁移失败或迁移顺序问题）。
  # spring.sql.init 在 Flyway 之前执行，确保 shedlock 表存在。
  # mode: embedded 仅对嵌入式数据库（H2）生效，不影响生产 MySQL/PostgreSQL。
  sql:
    init:
      mode: embedded
      schema-locations: classpath:db/shedlock-init.sql

# Seata 禁用：dev/DAST 无 TC server，且 SeataAutoDataSourceProxyCreator
# 会对 H2 DataSource 创建代理并报 "AT mode don't support the dbtype: h2"
seata:
  enabled: false
  enable-auto-data-source-proxy: false
  data-source-proxy-mode: off

# Dev-mode: skip real chain confirmation when core node is not running
nexus:
  chain:
    skip-confirmation: true
  consortium:
    skip-confirmation: true
  # Dev/DAST 环境无下游服务（signing-service, wallet-service, chain node），
  # 自定义 HealthIndicator 探测这些服务会报 DOWN → /actuator/health 返回 503。
  # 禁用下游健康指标，仅保留标准健康指标（ping, db, diskSpace）。
  health:
    downstream-indicators:
      enabled: false
  # === Dev/DAST 环境无 Kafka broker ===
  # KafkaEventStore（@ConditionalOnProperty matchIfMissing=true）默认使用 kafka，
  # DeadLetterQueueService 同理。dev 环境切换到内存实现，避免 KafkaTemplate bean 缺失。
  event-sourcing:
    store: memory
  webhook:
    dlq:
      store: memory
      wait-for-ack: false
  # === REQ-15 安全加固：dev profile 覆盖 CORS 为本地开发前端地址 ===
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080
  # === B-24 修复：LocalFileKeyManager 私钥加密存储 ===
  # dev profile 提供默认开发用 AES-256 密钥（Base64 编码的 32 字节）。
  # 生产环境通过环境变量 NEX_LOCAL_KEYSTORE_KEY 注入，不落配置文件。
  # 此密钥仅用于本地开发，切勿用于生产。
  keystore:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# === REQ-14 安全加固：dev profile 关闭 Feign TLS（本地开发降级） ===
feign:
  tls:
    enabled: false