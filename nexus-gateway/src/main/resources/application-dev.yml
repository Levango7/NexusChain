# Development profile: use H2 in-memory database (no MySQL required)
spring:
  datasource:
    url: jdbc:h2:mem:nexus_gateway;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

# Dev-mode: skip real chain confirmation when core node is not running
nexus:
  chain:
    skip-confirmation: true