# Sandbox profile: full local simulation without external dependencies
# Usage: --spring.profiles.active=sandbox
spring:
  datasource:
    url: jdbc:h2:mem:nexus_sandbox;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

nexus:
  chain:
    rpc-url: http://localhost:3000
    skip-confirmation: true
  exchange-wallet:
    base-url: http://localhost:8081
    # Sandbox-only: fake platform pubkey so refund/settlement signing paths are exercised.
    # The matching private key lives in exchange-wallet's keystore; never real in sandbox.
    platform-pubkey: "1SandboxPlatformPubkey0000000000000000000000000"
  # Risk rule overrides for sandbox: integration tests use amounts up to 500000
  # and the concurrency stress test bursts >10 orders/merchant within 60s, so the
  # production defaults would falsely reject them.
  settlement:
    risk:
      amount-threshold: 1000000000
      velocity-max-count: 10000

logging:
  level:
    org.nexus: DEBUG
