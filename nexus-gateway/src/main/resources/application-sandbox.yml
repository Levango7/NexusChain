# Sandbox profile: full local simulation without external dependencies
# Usage: --spring.profiles.active=sandbox
#
# 注意：sandbox 语义为「无外部依赖的本地模拟」，集成测试（@ActiveProfiles("sandbox")）
# 在无 Nacos / Sentinel Dashboard / Seata Server 的 CI 环境运行，因此禁用外部中间件
# 以保证 ApplicationContext 可独立加载（与 nexus-bridge test profile 对齐）。
spring:
  # === 允许 Bean 定义覆盖：部分集成测试需要覆盖 Bean ===
  # 修复 BeanDefinitionOverrideException
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:nexus_sandbox;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  # === 禁用 Nacos / Sentinel（sandbox 无外部中间件） ===
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    sentinel:
      enabled: false
  # === P3-T3：sandbox 禁用 Kafka 事件总线（无 Kafka broker，避免 @KafkaListener 启动失败） ===
  # spring-kafka 自动配置仍生效（KafkaTemplate 可创建），但 @KafkaListener 不自动启动
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

# sandbox 禁用 Seata（无 Seata Server，避免 GlobalTransactionScanner 初始化失败）
seata:
  enabled: false

# sandbox 禁用 Zipkin 上报（无 Zipkin Server）
management:
  tracing:
    sampling:
      probability: 0.0

nexus:
  chain:
    rpc-url: http://localhost:3000
    skip-confirmation: true
  consortium:
    rpc-url: http://localhost:8080
    skip-confirmation: true
  exchange-wallet:
    base-url: http://localhost:8081
    # Sandbox-only: fake platform pubkey so refund/settlement signing paths are exercised.
    # The matching private key lives in exchange-wallet's keystore; never real in sandbox.
    platform-pubkey: "1SandboxPlatformPubkey0000000000000000000000000"
  # Risk rule overrides for sandbox: integration tests use amounts up to 500000
  # and the concurrency stress test bursts >10 orders/merchant within 60s, so the
  # production defaults would falsely reject them.
  settlement:
    risk:
      amount-threshold: 1000000000
      velocity-max-count: 10000
  # Dual-chain routing disabled in sandbox: the consortium and core nodes are not
  # running, so the mock connector must remain the default target for E2E tests.
  routing:
    dual-chain:
      enabled: false
  # === P3-T3：事件溯源配置（sandbox 用内存存储，禁用投影） ===
  event-sourcing:
    store: memory
    projection:
      enabled: false
  # === P4-T5：sandbox 使用内存死信队列（无 Kafka broker） ===
  webhook:
    dlq:
      store: memory
  # === P1-3：HMAC 请求签名。拦截器已覆盖 /api/v1/orders|refunds|payments/**，
  # 未配置密钥时 fail-closed 全拒；sandbox 提供固定测试密钥供本地联调与集成测试签名。
  # 仅限沙箱，禁止用于生产。
  security:
    requestSigningSecret: "sandbox-signing-secret-do-not-use-in-prod"
  # === LocalFileKeyManager 加密密钥（Base64 编码的 32 字节 AES-256 密钥） ===
  # 修复 IllegalStateException: LocalFileKeyManager requires an encryption key
  # sandbox 使用固定密钥（32 个 0 字节的 Base64 编码），生产环境通过 Vault/KMS 注入
  keystore:
    encryption-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

logging:
  level:
    org.nexus: DEBUG
