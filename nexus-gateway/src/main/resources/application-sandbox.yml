# Sandbox profile: full local simulation without external dependencies
# Usage: --spring.profiles.active=sandbox
spring:
  datasource:
    url: jdbc:h2:mem:nexus_sandbox;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

nexus:
  chain:
    rpc-url: http://localhost:3000
    skip-confirmation: true
  exchange-wallet:
    base-url: http://localhost:8081

logging:
  level:
    org.nexus: DEBUG
