server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: nexus-gateway

  # Database configuration
  # NOTE: the default here is MySQL for local development. In k8s the datasource is
  # injected via ConfigMap as NEX_DB_URL pointing at the Postgres instance
  # (e.g. jdbc:postgresql://nexus-postgres:5432/nexus_gateway). The dialect below must
  # match the injected engine; for Postgres set spring.jpa.properties.hibernate.dialect
  # to org.hibernate.dialect.PostgreSQLDialect via the same ConfigMap.
  datasource:
    url: ${NEX_DB_URL:jdbc:mysql://localhost:3306/nexus_gateway?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8}
    username: ${NEX_DB_USERNAME:nexus}
    password: ${NEX_DB_PASSWORD:nexus_secret}
    driver-class-name: ${NEX_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# NexusChain Gateway configuration
nexus:
  # Token symbol used across the platform
  token-symbol: NEX

  # Chain / RPC node configuration (consumed by nexus-sdk)
  chain:
    # Core node listens on 19585 (nexus-core application.properties: server.port=${SERVER_PORT:19585}).
    # Override per-environment via NEX_CHAIN_RPC_URL (k8s ConfigMap).
    rpc-url: ${NEX_CHAIN_RPC_URL:http://localhost:19585}
    chain-id: 1
    confirmations: 12

  # Consortium (PoA sidechain) node configuration.
  # Consortium node listens on 8080 by default (nexus-consortium application.yml:
  # server.port: '8080'). Override via NEX_CONSORTIUM_RPC_URL.
  consortium:
    rpc-url: ${NEX_CONSORTIUM_RPC_URL:http://localhost:8080}
    chain-id: 2
    confirmations: 3

  # nexus-exchange-wallet service endpoint (for transfer construction & signing)
  exchange-wallet:
    base-url: http://localhost:8081
    transfer-path: /api/v1/transfers
    sign-path: /api/v1/transfers/sign
    timeout-ms: 10000
    # Platform (hot-wallet) public key used as the on-chain payer when delegating
    # signing to exchange-wallet. The private key lives ONLY in exchange-wallet's
    # keystore and is never transmitted to the gateway. SET THIS PER DEPLOYMENT.
    platform-pubkey: ""

  # Webhook callback configuration
  webhook:
    # Public base URL for chain event callbacks
    callback-url: http://localhost:8080/api/v1/webhooks/chain-events
    # Shared secret for verifying callback signatures
    callback-secret: ${NEX_WEBHOOK_SECRET:nexus_webhook_secret}

  # Checkout (cashier) configuration
  checkout:
    # Base URL for cashier redirect pages
    base-url: http://localhost:8080/api/v1/checkout
    # Order expiry time in minutes
    order-expiry-minutes: 30

  # Subscription configuration
  subscription:
    # Maximum retry count for failed recurring charges
    max-retry: 3
    # Retry interval in minutes
    retry-interval-minutes: 60

  # Routing configuration
  routing:
    # Dual-chain routing: split traffic between core mainnet (large/ final
    # settlement) and consortium sidechain (small/ high-frequency, low latency).
    dual-chain:
      enabled: true
      # Payments with amount < threshold go to consortium first.
      small-amount-threshold: 1000000
      # High-frequency window (reserved for future frequency-based routing).
      high-frequency-window: 60s
      # Preferred connectors per bucket (in failover order).
      preferred-connectors:
        small: ["consortium", "chain"]
        large: ["chain", "consortium"]

logging:
  level:
    org.nexus: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# Resilience4j circuit breaker configuration
resilience4j:
  circuitbreaker:
    instances:
      chainNode:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
      consortiumNode:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
      walletService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
  retry:
    instances:
      chainNode:
        max-attempts: 3
        wait-duration: 1s
      consortiumNode:
        max-attempts: 3
        wait-duration: 1s
      walletService:
        max-attempts: 2
        wait-duration: 2s

# Actuator health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
