# =============================================================================
# nexus-gateway 生产环境配置（数据库生产化：MySQL 8 家族）
# =============================================================================
#
# 激活方式：SPRING_PROFILES_ACTIVE=prod
#
# ⚠️ 2026-10-12 修正（安装阻断级）：本文件原指向 **PostgreSQL 16 + db/migration-pg**，
#    而 db/migration-pg **冻结在 V17**（维护中的 db/migration 已到 V96），
#    叠加 ddl-auto=validate ⇒ 该 profile 在 PG 上**根本无法启动**
#    （缺 orchestrated_payments / merchant_payout_accounts / audit_events 等表与列）。
#    同时它与仓库已决方向矛盾：ADR-033（2026-10-03 Accepted）定的是
#    **OceanBase 社区版（MySQL 模式）**，且 bridge / signing-service 在 prod 下
#    本来就走 MySQL（其 application.yml 默认 `jdbc:mysql://…`、无 prod profile 覆盖），
#    全仓唯一被维护的迁移集是 `db/migration`（MySQL）。
#    故 prod 数据源对齐 MySQL 家族：**同一套迁移、同一族方言**，
#    PG 目录保留但不再被引用（见 db/migration-pg/DEPRECATED.md）。
#    客户若使用 OceanBase（MySQL 模式）或 MySQL 8，连接串改 NEX_DB_URL 即可。
#
# 设计要点：
#   * 数据源指向 MySQL 8 实例（容器名 mysql，库 nexus_gateway）
#   * 用户名 / 密码从环境变量读取，禁止硬编码（K8s Secret / docker-compose env 注入）
#   * HikariCP 连接池参数针对生产负载调优（20 连接上限 + 泄漏检测）
#   * Flyway 指向 `db/migration`（**唯一**被维护的迁移集，V1..V96）
#   * Hibernate dialect = MySQLDialect，ddl-auto=validate（Flyway 管 schema）
#
# 相关文档：docs/database-production.md、docs/adr/ADR-033-database-evolution-oceanbase.md

spring:
  # === MySQL 8 生产数据源 ===
  # 主机名 mysql 为 docker-compose.prod.yml / K8s Service 名称
  # 库名 nexus_gateway 与 gateway 服务独立（wallet-service 用 nexus_wallet）
  datasource:
    url: ${NEX_DB_URL:jdbc:mysql://mysql:3306/nexus_gateway?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${NEX_DB_USERNAME:nexus_gateway}
    password: ${NEX_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # === HikariCP 连接池参数（生产调优） ===
      # maximum-pool-size=20：单服务最大连接数。MySQL 默认 max_connections=151，
      #   gateway(20) + wallet-service(20) + seata(少) 余量充足
      maximum-pool-size: 20
      # minimum-idle=5：最小空闲连接，避免冷启动建连开销
      minimum-idle: 5
      # connection-timeout=30000ms：获取连接最大等待时间，超时抛 SQLTransientConnectionException
      connection-timeout: 30000
      # idle-timeout=600000ms：空闲连接存活时长（10min），超过且池中连接 > minimum-idle 则释放
      idle-timeout: 600000
      # max-lifetime=1800000ms：连接最大生命周期（30min），到期强制重建，
      #   必须小于 MySQL wait_timeout（默认 28800s）与 tcp_keepalives_idle
      max-lifetime: 1800000
      # leak-detection-threshold=60000ms：连接泄漏检测阈值（60s），
      #   借出后 60s 未归还则记录 WARNING 日志（生产环境推荐 60s，开发可降至 0 关闭）
      leak-detection-threshold: 60000
      # 连接池名称（便于日志 / 监控识别）
      pool-name: nexus-gateway-hikari

  # === JPA / Hibernate（MySQL 方言） ===
  jpa:
    hibernate:
      # validate：Flyway 管理 schema，Hibernate 仅校验 Entity 与表结构一致
      # 生产环境禁止 ddl-auto=update / create（防止 Hibernate 自动改表结构）
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # MySQL 方言（OceanBase MySQL 模式同族；Hibernate 6/7 由 MySQLDialect 自动判版本）
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        # 生产环境 JDBC 批处理优化
        jdbc:
          batch_size: 50
          fetch_size: 200
        order_inserts: true
        order_updates: true

  # === Flyway 迁移（唯一维护集：db/migration，MySQL 方言） ===
  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate=true：非空库自动 baseline（兼容已有数据的库切换场景）
    baseline-on-migrate: true
    baseline-version: 0

# === 生产环境日志级别 ===
# SQL 日志降为 WARN（生产不输出 SQL 文本，靠慢查询日志 / APM 追踪）
logging:
  level:
    org.nexus: INFO
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: INFO

# === Redis 连接（短期项 #4b：防重放 nonce 多副本共享）===
# 默认仅注入连接参数；是否启用由 nexus.security.replay-store 决定
# （NEXUS_REPLAY_STORE=redis 时 RequestSignatureInterceptor 使用共享 nonce 表）。
# 未启用时本节不生效（幂等 store 仍走 DB，行为不变）。
spring.data.redis:
  host: ${NEX_REDIS_HOST:redis}
  port: ${NEX_REDIS_PORT:6379}
  password: ${NEX_REDIS_PASSWORD:}
  database: ${NEX_REDIS_DATABASE:0}
  timeout: 3000

nexus.security:
  replay-store: ${NEXUS_REPLAY_STORE:memory}