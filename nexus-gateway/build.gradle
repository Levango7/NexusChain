plugins {
    id 'org.springframework.boot' version '3.3.13'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'jacoco'
}

group = 'org.nexus'


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceCompatibility = 17

repositories {
    // SCA / Nacos / Sentinel 制品优先走阿里云镜像（与 signing-service build.gradle 对齐）
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    mavenCentral()
}

dependencies {
    // 共享通用库（tracing 等，合并自原模块内逐字节一致的拷贝）
    implementation project(':nexus-common')
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // === P0-1 安全加固：引入 Spring Security，启用 @PreAuthorize 方法级鉴权 ===
    // 商户管理写端点（verify / api-keys / revoke）要求 hasRole('ADMIN')。
    // 方法级鉴权需配合 @EnableMethodSecurity（见 SecurityConfig）。
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Database
    // Flyway 10.x（Boot 3.3.13 BOM 管理），10.x 需数据库专用模块
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // === P2-T8：PostgreSQL 生产化（设计文档 §4.1） ===
    // PostgreSQL 16 生产数据源驱动，runtimeOnly 仅运行时加载
    runtimeOnly 'org.postgresql:postgresql:42.5.4'

    // === 项10：ShedLock 分布式锁（ReconciliationTask 多实例去重） ===
    // ShedLock 6.2.0 兼容 Spring Boot 3.3.x，使用 JDBC provider
    // （复用 gateway 已有 MySQL/PostgreSQL 数据源，无需额外引入 Redis）。
    // shedlock-spring：核心注解 @SchedulerLock + @EnableSchedulerLock
    // shedlock-provider-jdbc-template：基于 JdbcTemplate 的 JdbcTemplateLockProvider，
    //   支持 builder + usingDbTime()（使用 DB 服务器时间避免多实例 JVM 时钟漂移）
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.2.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.2.0'

    // Observability
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // === Micrometer Tracing + Zipkin（Phase 3 任务 #61，设计文档 §4.3.1） ===
    // SpringBoot 3.3.13 BOM 管理版本（micrometer-tracing + zipkin-reporter-brave）
    // W3C traceparent 格式跨服务传播，Zipkin 上报，Feign 自动埋点
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'io.github.openfeign:feign-micrometer'

    // Resilience4j（保留：管理对链节点直接 HTTP 调用的熔断/重试，与 Sentinel 共存。
    // Sentinel 管理对 signing/wallet-service 的 Feign 调用。Phase 1 任务 #55 不删除。）
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.4.0'

    // === Spring Cloud BOM（管理 OpenFeign / LoadBalancer 版本，设计文档 §4.1） ===
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2023.0.3')
    // === Spring Cloud Alibaba BOM（管理 Nacos / Sentinel 版本） ===
    implementation platform('com.alibaba.cloud:spring-cloud-alibaba-dependencies:2023.0.3.4')

    // === Nacos 服务发现 + 配置中心（Phase 1 任务 #55） ===
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'

    // === Sentinel 熔断 / 限流（替代 Resilience4j） ===
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-sentinel'

    // === Seata 分布式事务（Phase 3 任务 #61） ===
    // SCA 2023.0.3.4 BOM 管理 seata-spring-boot-starter 版本（2.1.0），设计文档 §4.1 / §4.2.2
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-seata'

    // === P3-T3：事件溯源 + CQRS（Kafka 事件总线） ===
    // spring-kafka：支付事件持久化到 payment-events topic，由 nexus-analytics 投影消费
    // Spring Boot 3.3.13 BOM 管理 spring-kafka 版本，与 P3-T4 Kafka 部署对齐
    implementation 'org.springframework.kafka:spring-kafka'

    // === OpenFeign 声明式调用 + LoadBalancer（gateway → signing-service / wallet-service / bridge） ===
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // === P1-F1 安全加固：服务间 JWT 鉴权 ===
    // gateway 通过 Feign 调用 signing-service 时，由 FeignJwtRequestInterceptor
    // 自动在请求头注入 Authorization: Bearer <jwt>。token 用共享 JWT_SECRET 签发，
    // roles 含 SIGNING_SERVICE，signing-service 侧 SecurityConfig 校验通过。
    // jjwt 0.12.x 与 signing-service / nexus-core JWTUtil 对齐。
    // jjwt 版本与根 build.gradle subprojects.ext.jjwtVersion 对齐。
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // === bootstrap.yml 支持（Spring Cloud 2023.0.x 需显式引入） ===
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'

    // OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Utilities
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.apache.commons:commons-lang3'

    // 中间服务层（composite build 依赖替换，见根 settings.gradle 的 includeBuild）
    implementation 'org.nexus:nexus-settlement:2.1.0'
    implementation 'org.nexus:nexus-compliance:2.1.0'
    implementation 'org.nexus:nexus-analytics:2.1.0'
    implementation 'org.nexus:nexus-oracle:2.1.0'

    // P2 方向5「签名服务独立部署 PoC」：gateway 引用 nexus-sdk 中的
    // WalletMgmtClient / SigningServiceClient 接口与 ServiceDiscovery 骨架。
    // nexus-sdk:java 是根构建的 include 子模块，直接用 project() 引用。
    implementation project(':nexus-sdk:java')

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // === 测试期安全支持：提供 @WithMockUser 注解用于 MockMvc 方法级鉴权测试 ===
    // 集成测试中 verify / generateApiKey / revokeApiKey 端点要求 hasRole('ADMIN')，
    // 需通过 @WithMockUser 模拟认证用户与角色才能访问这些端点。
    testImplementation 'org.springframework.security:spring-security-test'
    // === Mockito inline mock maker：支持 mockStatic 静态方法 mock ===
    // Spring Boot 3.3.13 BOM 管理 Mockito 版本，mockito-inline 需显式指定版本对齐。
    // 修复 MockitoException: SubclassByteBuddyMockMaker does not support static mocks
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    // === P0-3a：PSP 集成测试 — WireMock 模拟 Stripe / Adyen HTTP API ===
    // WireMock 3.x standalone（含 Jetty）兼容 JUnit 5 + Spring Boot 3.2
    testImplementation 'org.wiremock:wiremock-standalone:3.5.2'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

// Coverage gate (W5). A conservative global floor is enforced now; the
// orchestration-package rule is reported (not enforced) until a full baseline
// is measured on a build machine, after which raise the orchestration minimum toward 0.60.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.30
            }
        }
        rule {
            element = 'PACKAGE'
            includes = ['org.nexus.gateway.orchestration']
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}