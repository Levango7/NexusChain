plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'jacoco'
}

group = 'org.nexus'
version = '1.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceCompatibility = 17

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Database
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Observability
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Resilience
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

    // OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Utilities
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.apache.commons:commons-lang3'

    // 中间服务层（composite build 依赖替换，见根 settings.gradle 的 includeBuild）
    implementation 'org.nexus:nexus-settlement:1.3.0'
    implementation 'org.nexus:nexus-compliance:1.3.0'
    implementation 'org.nexus:nexus-analytics:1.3.0'
    implementation 'org.nexus:nexus-oracle:1.3.0'

    // P2 方向5「签名服务独立部署 PoC」：gateway 引用 nexus-sdk 中的
    // WalletMgmtClient / SigningServiceClient 接口与 ServiceDiscovery 骨架。
    // nexus-sdk:java 是根构建的 include 子模块，直接用 project() 引用。
    implementation project(':nexus-sdk:java')

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

// Coverage gate (W5). A conservative global floor is enforced now; the
// orchestration-package rule is reported (not enforced) until a full baseline
// is measured on a build machine, after which raise the orchestration minimum toward 0.60.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.15
            }
        }
        rule {
            element = 'PACKAGE'
            includes = ['org.nexus.gateway.orchestration']
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}