// NexusChain 统一构建系统 - 根级构建配置
// 管理所有 Java/Gradle 子模块的共享依赖和构建规则
// 兼容 Gradle 7.x+

// === SAST: SpotBugs + FindSecBugs（P2-T7） ===
// 静态应用安全测试（SAST）：检测 Java 代码安全漏洞
//   - SpotBugs：基于字节码的模式分析（空指针、资源泄漏等）
//   - FindSecBugs：安全漏洞专用规则集（SQL 注入、XSS、硬编码密码、
//     不安全的加密、LDAP 注入、XSS、路径遍历等 90+ 规则）
// 插件：com.github.spotbugs.snom:spotbugs-gradle-plugin:5.1.5
// 配置：effort=max（最大分析深度），threshold=low（报告 low+ 中危+高危）
// 报告：HTML（人工审阅）+ XML（CI 解析 / SARIF 转换）
// 排除：测试代码（spotbugsTest.enabled=false）、protobuf 生成代码
plugins {
    id 'com.github.spotbugs' version '5.1.5' apply false
    // 2026-10-01（PR #17）：SCA = OWASP Dependency-Check **官方 Gradle 插件**。
    // 版本钉死 13.0.0（连带 org.owasp:dependency-check-core:13.0.0，插件 POM 实测）；
    // 12.1.0+ 是 NVD API 变更后的强制下限。该插件**只发布在 Gradle Plugin Portal**
    // （自 11.0.0 起不再发 Maven Central）——settings.gradle 的 pluginManagement
    // 已首位声明 gradlePluginPortal()，故此处按 id 解析即可。
    // **刻意 apply false**：仅当显式传 -PowaspScan 时才 apply（理由见下方 SCA 段落）。
    // 若不这样，DC 插件会把 dependencyCheck* 接到 `check` 任务上（官方文档明示
    // check.dependsOn dependencyCheckAnalyze/Aggregate），而 ci.yml 的 Build & Test
    // 跑 `./gradlew check` 且**没有** NVD_API_KEY → 2400 个测试的 job 会额外触发
    // 20 分钟 NVD 全量下载并失败。
    id 'org.owasp.dependencycheck' version '13.0.0' apply false
}

allprojects {
    group = 'org.nexus'
    // 2026-08-29 审计对齐：此前 2.30.0 与 README/CHANGELOG 的 v2.40.0 漂移。
    // 建议后续由 release.yml 从 CHANGELOG 自动同步此号，避免再次失配。
    // 2026-09-22：2.50.0 → 2.50.2。此前 v2.50.1 tag 已存在但从未成功发布
    // （发布流水线因 GHCR 仓库名大写问题失败），且 CHANGELOG 无 2.50.1 小节；
    // 本次以 2.50.2 作为首个真正产出制品的版本。
    // 2026-09-28：2.50.2 → 2.51.0（Payment Orchestration Wave 1-16）。
    // 与 version.properties / README 头注的一致性由 CI 门禁
    // scripts/check-version-consistency.sh 保护。
    version = '2.51.0'

    repositories {
        // 权威源优先；镜像仅用于加速与容错
        mavenCentral()
        maven {
            name = 'springPluginsRelease'
            url = 'https://repo.spring.io/plugins-release'
        }
        // 2026-09-21：仓库一律**命名**。匿名仓库报错时只显示 "Repository maven"，
        // 无法定位是哪个源。实测一次 CI 失败正因此难以定位：
        //   "Repository maven is disabled due to earlier error below:
        //    Could not GET https://maven.aliyun.com/.../reactor-test-3.8.7.module
        //      -> 502 Bad Gateway"
        // 根因：Gradle 在仓库返回 5xx 后会禁用该仓库且**不回退**，
        // 单点镜像故障会打死整个构建（表现为 `Build & Test` 偶发失败，非代码缺陷）。
        // 故增加两个独立镜像以提高容错。
        maven {
            name = 'aliyunPublic'
            url = 'https://maven.aliyun.com/nexus/content/groups/public/'
        }
        maven {
            name = 'tencentPublic'
            url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
        }
        maven {
            name = 'huaweiPublic'
            url = 'https://repo.huaweicloud.com/repository/maven/'
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    // JaCoCo 覆盖率报告（统一配置）。nexus-gateway 在自身 build.gradle 中
    // 覆盖 html.required=true 与 jacocoTestCoverageVerification 门禁，其余模块
    // 仅生成 xml 报告供聚合。P2-10: 覆盖率门禁 30% 起步，渐进提升。
    jacoco {
        toolVersion = "0.8.11"
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = false
        }
    }

    // P2-10: JaCoCo 覆盖率门禁（30% 行覆盖起步，渐进提升）
    // 当前项目覆盖率不高，先设低门槛，后续随测试补全逐步上调
    //
    // 测试体系中期建设（2026-08-30）：全局接线 check.dependsOn（见下）。
    // 规则注入用 afterEvaluate + ext 标记判断（subprojects 闭包先于子项目脚本
    // 执行，配置期无法看到子项目的标记，必须延后到子项目配置完成后）：
    // 模块自身声明 ext.jacocoGateOverridden = true 即走自定义渐进线
    // （7 个模块：sdk/api-gateway/analytics/compliance/signing/wallet/core，
    // 如 core 的 0.25 现状线）；未声明的模块（gateway/bridge/settlement/oracle 等）
    // 由根 0.30 生效——审计三层落差中"定义了但从不运行"至此闭合。
    afterEvaluate {
        if (!project.hasProperty('jacocoGateOverridden')) {
            jacocoTestCoverageVerification {
                violationRules {
                    rule {
                        limit {
                            minimum = 0.30  // 30% 行覆盖起步门禁（渐进提升）
                        }
                    }
                }
            }
        }
    }

    // 测试体系中期建设（2026-08-30）：覆盖率门禁全局接线。
    // 审计发现：根 subprojects 定义了 0.30 门禁但从未接线 check——仅 7 个模块
    // 自行 check.dependsOn（各自覆盖为 0.15），gateway/bridge/settlement/oracle
    // 实际无任何生效门禁；且 CI 从不运行 check，门禁在 CI 永不触发（三层落差）。
    // 全局接线后各模块 check（含 test）强制走覆盖率验证；模块自有 0.15 覆盖
    // 继续叠加生效（取更严格者）。无测试输入时 jacocoTestCoverageVerification
    // 对空 classDirectories 自然通过，不误伤。
    check.dependsOn jacocoTestCoverageVerification

    // === SAST: SpotBugs + FindSecBugs 配置（P2-T7） ===
    // 在 java 插件之后应用 spotbugs 插件
    apply plugin: 'com.github.spotbugs'

    spotbugs {
        // SpotBugs 引擎版本（4.8.6 兼容 JDK 8-21，支持 FindSecBugs 1.13.0）
        toolVersion = '4.8.6'
        // effort=max：最大分析深度，启用所有检测器
        effort = 'max'
        // reportLevel=low：报告 low priority 及以上的 bug（threshold=low）
        // 即输出所有发现（low + medium + high）
        reportLevel = 'low'
        // 不因 spotbugs 发现而中断构建（由 CI 门禁单独控制）
        ignoreFailures = true
        showProgress = false
    }

    // FindSecBugs 规则集作为 spotbugs 插件依赖
    dependencies {
        spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0'
        // spotbugs-annotations 提供 @SuppressFBWarnings 注解，供源码中
        // 精确抑制已缓解的 FindSecBugs/SpotBugs 告警（如 CIPHER_INTEGRITY
        // 已由上层 MAC 保护、OBJECT_DESERIALIZATION 已由 ObjectInputFilter 缓解）
        compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
    }

    // spotbugsMain：扫描 main source set，产出 HTML + XML 报告
    spotbugsMain {
        reports {
            html {
                required = true
                outputLocation = file("$buildDir/reports/spotbugs/main.html")
            }
            xml {
                required = true
                outputLocation = file("$buildDir/reports/spotbugs/main.xml")
            }
        }
        // P4-A（2026-08-28）：全仓 SpotBugs 基线过滤——豁免已审计/风格类存量告警
        // （详见根目录 spotbugs-exclude-filter.xml，与 .trivyignore 同策略：
        // 仅豁免存量基线 + 附 justification，安全敏感类不豁免由 CI gate 拦截）。
        // signing-service 既有模块级 spotbugs-exclude-filter.xml 继续生效。
        excludeFilter = rootProject.file('spotbugs-exclude-filter.xml')
        // 排除 protobuf 生成代码（com.google.protobuf.* 及 *OrBuilder）
        // 这些由 protoc 自动生成，不符合安全规则也无业务逻辑
        classes = classes.filter { file ->
            !file.path.contains('/generated/') &&
            !file.path.contains('\\generated\\') &&
            !file.path.replace('\\', '/').contains('/com/google/protobuf/')
        }
    }

    // 不扫描测试代码（测试代码不进入生产攻击面）
    spotbugsTest {
        enabled = false
    }

    // B1 baseline (2026-08-03): Java level is declared EXPLICITLY per module
    // (gateway/bridge via java toolchain 17; core 17; consortium/sdk/
    // exchange-wallet 1.8). The previous global `sourceCompatibility = 17`
    // here was overridden by every module and masked the real Java tiering —
    // removed to make the two-tier Java strategy honest and single-sourced.

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.warnings = false
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "failed"
            exceptionFormat "short"
        }
        systemProperty "file.encoding", "UTF-8"
    }

    // === 共享版本变量（TD-14 清理后仅保留主构建树内有 ${} 消费点的变量） ===
    // 消费点（rg '\$\{...Version\}' 复核，2026-08-26；v2.40.0 TD-05/06 后更新）：
    //   slf4j/jackson → nexus-core；leveldb/netty/grpc/protobuf/postgresql/
    //   hibernateValidator → core 与 signing-service 各自消费。
    // mockito 已不再由根注入：TD-06 移除 subprojects 强制注入，各模块统一走
    // 各自的 Boot BOM 管理（Boot 4.0.8，2026-09 Boot4 兼容批后），消除三代并存。
    ext {

        slf4jVersion = '2.0.16'
        postgresqlVersion = '42.7.12'
        leveldbVersion = '0.12'
        hibernateValidatorVersion = '8.0.1.Final'
        nettyVersion = '4.1.115.Final'
        grpcVersion = '1.75.0'
        protobufVersion = '3.25.5'
        // CVE-2026-68497 在 Jackson 2 线上有两段受影响范围：>= 2.14.0, < 2.18.10 与
        // >= 2.19.0, < 2.21.6（修复版分别为 2.18.10、2.21.6）。取 2.21.6 而非 2.18.10：
        // nexus-gateway 经 Boot BOM 实际解析到 2.21.5，压到 2.18.10 属跨 minor 降级，
        // 可能移除 gateway 已使用的 2.21 API —— 用升级消除 CVE，不拿功能风险换告警清零。
        // 2026-10-01 续追（Trivy 库 09-30 增补的第二波）：CVE-2026-91776 / CVE-2026-91777
        // 命中 com.fasterxml.jackson.core:jackson-databind 2.21.6 与 tools.jackson.core:jackson-databind
        // 3.1.6 —— 即上一轮 68497 的修复版本身；修复线 2.x 为 2.18.11/2.21.7/2.22.3、
        // Jackson 3 为 3.1.7/3.2.3。故本变量续升到 2.21.7（同 minor 补丁线，不跨线）。
        // 取证：master push run 36773548701 镜像扫描 nexus-core:scan Java(jar) = Total: 4 HIGH，
        // 全部为该两条 CVE（OS 层 debian 13.7 为 Total: 0）。
        jacksonVersion = '2.21.7'
        guavaVersion = '33.4.8-jre'
        // Tomcat embed-core 11.0.24 有 3 个新 CVE（CVE-2026-65182 CRITICAL
        // 安全约束绕过 / CVE-2026-65905 HIGH DIGEST 重放 / CVE-2026-68525 HIGH
        // FORM 认证绕过），修复版 11.0.25。Spring Boot 4.0.8 BOM 管理解析为
        // 11.0.24——此处 override 到 11.0.25（可修复一律升级，不用 ignore）。
        tomcatVersion = '11.0.25'
        // CVE-2026-68497（HIGH）：受影响坐标是 Jackson 3 的
        // tools.jackson.core:jackson-databind，镜像内实装 3.1.5，修复版 3.1.6/3.2.2
        // （扫描表直读；告警里的 com.fasterxml 只是 vendor 别名）。该版本由
        // spring-boot-jackson:4.0.8 → tools.jackson:jackson-bom:3.1.5 管理，
        // 因此走 io.spring.dependency-management 的 BOM 属性覆盖（同 tomcat 先例：
        // 根 resolutionStrategy force 对 Boot BOM 无效，模块注释已实测）。
        // 与 jacksonVersion（Jackson 2 线）是两套坐标，互不替代。
        // 合并解析（PR #14 × PR #15）：本处原为 set('jackson-bom.version','3.1.6')，
        // 与下方 ext['jackson-bom.version'] 同属性且同值 —— 只保留 ext[] 一处赋值，
        // 避免同一属性两处写入后失同步。

    }

    // 去版本号的 jackson 声明（gateway/bridge/sdk-java 等）由 BOM 决定，光改上面的
    // jacksonVersion 移不动它们。ext['<BOM 属性名>'] 是 io.spring.dependency-management
    // 的官方覆盖机制（先例见 nexus-gateway/build.gradle:14 的 tomcat.version；
    // 那里已实测 resolutionStrategy force 对 Boot BOM 无效）。
    // 属性名取自 spring-boot-dependencies:4.0.8 pom：
    //   jackson-2-bom.version = 2.21.5 → com.fasterxml.jackson（2.x 线）
    //   jackson-bom.version   = 3.1.5  → tools.jackson（Jackson 3 线）
    // CVE-2026-68497 同时命中这两条坐标（Trivy 给的修复线：2.x 为 2.18.10/2.21.6/2.22.2，
    // Jackson 3 为 3.1.6/3.2.2）。2026-09-29 实测：只提 2.x 那一拨，六个镜像仍红——
    // 阻断 finding 变成 tools.jackson.core:jackson-databind 3.1.5（run 36597047157 日志）。
    // 两条都必须提，取各自同 minor 的补丁版以免跨线行为变化。
    // 2026-10-01 续追 CVE-2026-91776 / CVE-2026-91777（第二波，详见上方同批注释）：
    // 两条坐标一起抬（只抬一条会留下另一条继续红），2.21.6→2.21.7、3.1.6→3.1.7。
    ext['jackson-2-bom.version'] = '2.21.7'
    ext['jackson-bom.version'] = '3.1.7'

    // B1 baseline (2026-08-03): NO global forced test deps.
    // Historically this block injected `junit:junit:4.13.2` and
    // `spring-boot-starter-test:2.7.18` into EVERY subproject, which silently
    // clashed with the Boot 3.2.5 gateway/bridge (a Boot 2.7 test BOM on a
    // Boot 3.2 app) and masked the real per-module test setup. Each module now
    // declares its OWN test dependencies (Boot apps via their boot plugin's
    // dependency-management; nexus-core keeps explicit JUnit 4 + starter-test
    // 2.7.18; sdk/consortium declare their own).
    // TD-06（v2.40.0）：此前唯一共享的 mockito-core 注入亦已移除——根注入的
    // 4.11.0 是 Mockito 三代并存（4.11.0 / 5.2.0 / 5.11.0）的根源；Mockito 5 起
    // inline mock maker 为默认实现，各模块统一交由 Boot 3.2.5 BOM 管理（5.2.0）。
    dependencies {
        // ArchUnit 架构合规测试（P1-T11）：分层依赖、模块边界、命名约定
        testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    }

    javadoc {
        options.encoding = "UTF-8"
        options.author = true
        options.header = project.name
        options.addStringOption('-quiet')
    }
}

// === SCA: OWASP Dependency-Check（真实依赖图，2026-10-01 / PR #17） ===
// -----------------------------------------------------------------------------
// 为什么必须换成官方 Gradle 插件（而不是继续 `docker run … --scan .`）：
//   旧做法只做**文件级**识别。本仓库提交物里既没有 gradle.lockfile 也没有被跟踪的
//   pom.xml，而 Trivy 不解析 build.gradle → 实测 dependency-check-report.json 里
//   dependencies=54 条全是 .js/.json/gradle-wrapper.jar，**CPE 命中 0/54**，
//   jackson 这类 JVM 依赖从未被任何门禁真正分析过（「空心绿」根因）。
//   取证：docs/audit/2026-09-29-ci-gate-and-mpc-default-findings.md §10。
//   官方插件在 configuration 阶段读取**已解析的依赖图**（GAV 坐标），交给同一个
//   DC 引擎做 CPE/NVD 比对 —— 这才是"真覆盖"。
//
// 为什么用条件 apply：
//   官方文档明示插件会把 check 接到 dependencyCheckAnalyze/Aggregate 上
//   （"check.dependsOn dependencyCheckAnalyze"）。本仓库 ci.yml 的 Build & Test
//   执行 `./gradlew check`（2400+ 测试）且**没有** NVD_API_KEY —— 无条件 apply 会让
//   那个 job 额外触发 20 分钟 NVD 全量下载并以"缺 key"失败。故这里把插件应用收窄到
//   显式开关：`./gradlew dependencyCheckAggregate -PowaspScan`（CI 的 OWASP job 与本地排查）。
//   其余一切 Gradle 调用（check / test / build / spotbugsAll…）**完全不受影响**。
//
// 版本与来源：13.0.0（连带 dependency-check-core:13.0.0，/POM 实测）钉死在 plugins{} 块；
//   该插件只发布在 Gradle Plugin Portal（settings.gradle pluginManagement 已声明）。
// -----------------------------------------------------------------------------
if (project.hasProperty('owaspScan')) {
    apply plugin: 'org.owasp.dependencycheck'

    dependencyCheck {
        // 只扫"会随产物发布"的运行时依赖集（implementation/runtimeOnly/api 的传递闭包）。
        // compileOnly/annotationProcessor 属构建期工具，不随产物发布，纳入只会制造噪声。
        // 用**显式白名单**而非默认全扫，是为了让"到底扫了哪些配置"可审计。
        scanConfigurations = ['runtimeClasspath']

        // 聚合扫描：一次覆盖所有子模块，产出单份报告（便于 CI 解析与归档）
        formats = ['HTML', 'JSON']
        outputDirectory = layout.buildDirectory.dir('reports/dependency-check')

        // 阻断阈值与旧 docker CLI 的 --failOnCVSS=9 对齐。
        // 注意插件默认值是 **11**（CVSS 上限 10）＝永不失败 —— 不改就是"接了门禁却不拦"。
        failBuildOnCVSS = 9.0f

        // 误报出口：确认为误报时写 suppressions 并附到期时间（用法见
        // docs/dependency-check-update-policy.md；文件不得内含真实密钥材料）
        suppressionFiles = [project.file('config/dependency-check-suppressions.xml').absolutePath]

        analyzers {
            // 只保留 NVD（+ DC 官方 hosted suppressions）这一条数据源。
            // NodeAudit/RetireJS 对本仓库无消费点（无 JS 运行时依赖）；
            // OSS Index 匿名访问会限流、KEV 需额外拉 CISA 源 —— 三者都是"多一个
            // 联网失败面"，会让 failOnError=true（默认）的门禁随机变红。
            nodeAuditEnabled = false
            ossIndexEnabled = false
            retirejs { enabled = false }
            kev { enabled = false }
        }

        nvd {
            // API key **只从环境变量**读取（CI 由 secrets 注入 env）。
            // 绝不用 -PnvdApiKey 传参：那会进进程参数与 CI 日志。
            def key = System.getenv('NVD_API_KEY')
            if (key) { apiKey = key }
            // 带 key 时的官方建议请求间隔，避免触发 NVD 限流
            delay = 8000
        }

        data {
            // 显式数据目录（默认在 Gradle user home 下，这里写出来便于审计与后续缓存）：
            // 首次全量拉取 NVD 约 20 分钟，7 天内复用只需数秒。
            // 注：CI 目前**未**缓存该目录（体积大），实测占用后可再评估。
            directory = new File(gradle.gradleUserHomeDir, 'dependency-check-data').absolutePath
        }
    }
}

// === 顶层聚合任务 ===
task buildAll {
    description = '构建所有 Java 子模块'
    dependsOn subprojects.findAll { it.plugins.hasPlugin('java') }.collect { it.tasks.getByName('build') }
}

task testAll {
    description = '运行所有 Java 子模块的测试'
    dependsOn subprojects.findAll { it.plugins.hasPlugin('java') }.collect { it.tasks.getByName('test') }
}

task cleanAll {
    description = '清理所有子模块的构建产物'
    dependsOn subprojects.findAll { it.plugins.hasPlugin('java') }.collect { it.tasks.getByName('clean') }
}

// === SAST 聚合任务（P2-T7） ===
