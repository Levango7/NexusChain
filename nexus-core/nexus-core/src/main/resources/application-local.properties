# ============================================================
# NexusChain core 本地联调配置（容器化 Postgres 16，真机联调）
# 用法：先确保 PG 就绪（推荐：powershell -ExecutionPolicy Bypass -File scripts\dev-pg-up.ps1，
#       或 Linux/CI: scripts/dev-pg-up.sh），再：
#   gradlew :nexus-core:nexus-core:run --args="--spring.profiles.active=local"
# 一键版（PG 就绪 + 前台起 core）：scripts\dev-pg-up.ps1 -StartCore
# PG 服务定义见仓库根 docker-compose.yml 的 nexus-pgsql（凭据与此文件严格一致）。
# 生产环境使用默认 application.properties（postgresql）。
# ============================================================

# Docker Postgres（55432 = localhost 映射，绑定回环；见 docker-compose.yml nexus-pgsql）
spring.datasource.url=jdbc:postgresql://localhost:55432/nexuschain
spring.datasource.username=nexus
spring.datasource.password=nexus123
spring.datasource.driver-class-name=org.postgresql.Driver

# 共识：PoS（NexFinality 最终性层）
nexus.consensus.mode=pos
nexus.consensus.allow-fork=false
# 出块开关（默认 false，多节点/最终性验证需开启）
nexus.consensus.enable-mining=true

# 最终性参数
nexus.finality.epoch-length=4

# 端口（Controller/NodeInfo 监听，避免与 gateway 冲突）
server.port=19585

# 链配置
miner.coinbase=19JNq2jAprkxVrpkgBiRaa1m47WcUMXtCb
miner.validators=genesis/validators.json
nexus.consensus.genesis=genesis/NexusChain-genesis-generator.json