################################# NexusChain L2↔L1 桥合约配置（YAML 视图） #################################
# P5-T6: L2 L1 真实节点测试环境
#
# 本文件提供 l2.l1.* 配置的 YAML 视图，与 application.properties 中的
# nexus.l2.l1-bridge.* / nexus.l2.l1.* 配置项等价。
# Spring Boot 加载顺序：application.properties 优先级高于 application.yml，
# 因此 properties 中的环境变量占位符仍生效；本文件主要用于：
#   1. 文档化 l2.l1.* 配置结构
#   2. 提供默认值（被 properties 中的 ${...} 占位符引用）
#   3. 供测试 profile（application-test.yml）覆盖
#
# @since 2.0
#########################################################################################

nexus:
  l2:
    # L1 桥合约配置（真实节点切换）
    l1:
      # true  = 真实 L1 节点（Hardhat/Ganache/Sepolia/Mainnet）
      # false = 内存模拟（L1ContractClient fallback，适用于单元测试与离线开发）
      real-l1-enabled: false
      # L1 JSON-RPC 端点
      rpc-url: http://localhost:8545
      # L2 桥合约地址（部署后填入；空表示未部署）
      bridge-contract-address: ""
      # 挑战期（秒），默认 7 天
      challenge-period: 604800
      # 发送方地址（空则从 private-key 推导）
      from-address: ""
      # 发送方私钥（0x 前缀 32 字节 hex；生产环境应通过密钥管理服务注入）
      private-key: ""
      # L1 链 ID（1=mainnet, 5=goerli, 11155111=sepolia, 1337=本地 devnet, 31337=Hardhat）
      chain-id: 31337
      # gas 上限
      gas-limit: 500000
      # gas price（wei，默认 1 Gwei；运行时优先从链上 eth_gasPrice 获取）
      gas-price: 1000000000

    # 兼容旧配置命名空间 nexus.l2.l1-bridge.*
    # 通过引用 nexus.l2.l1.* 实现联动，保持向后兼容
    l1-bridge:
      enabled: ${nexus.l2.l1.real-l1-enabled:false}
      rpc-endpoint: ${nexus.l2.l1.rpc-url:http://localhost:8545}
      contract-address: ${nexus.l2.l1.bridge-contract-address:0x0000000000000000000000000000000000000000}
      from-address: ${nexus.l2.l1.from-address:}
      private-key: ${nexus.l2.l1.private-key:}
      chain-id: ${nexus.l2.l1.chain-id:31337}
      gas-limit: ${nexus.l2.l1.gas-limit:500000}
      gas-price: ${nexus.l2.l1.gas-price:1000000000}

  # ==================== 治理配置（since 2.1） ====================
  # GovernanceExecutor 集成 OnChainGovernanceClient 配置示例
  #
  # 链上治理集成采用双开关设计：
  #   1. nexus.governance.on-chain-enabled  — 控制 OnChainGovernanceClient bean 是否创建
  #                                          （@ConditionalOnProperty，见 OnChainGovernanceClient）
  #   2. nexus.governance.on-chain.enabled  — 控制 GovernanceExecutor 是否实际调用链上方法
  #                                          （本执行器开关，默认 false）
  #
  # 启用链上治理需同时设置两项为 true。默认全 false 保证向后兼容（仅内存版 TimelockController 生效）。
  # 链上调用失败仅记录 warn 日志，不影响内存版执行结果（内存版作为 fallback）。
  governance:
    # --- GovernanceExecutor 链上执行开关 ---
    # true = execute()/schedule()/cancel() 在完成内存版操作后同步到链上 NexusGovernor
    # false = 仅内存版（默认，向后兼容）
    on-chain:
      enabled: false
    # --- OnChainGovernanceClient bean 创建开关 ---
    # true = 创建 OnChainGovernanceClient bean（需配置下方 RPC/合约地址/私钥）
    # false = 不创建 bean，GovernanceExecutor.onChainGovernanceClient 为 null
    on-chain-enabled: ${nexus.governance.on-chain.enabled:false}
    # L1 JSON-RPC 端点
    rpc-url: http://localhost:8545
    # NexusGovernor 合约地址（部署后填入）
    governor-address: ""
    # TimelockController 合约地址（部署后填入）
    timelock-address: ""
    # 发送方地址（空则从 private-key 推导）
    from-address: ""
    # 发送方私钥（0x 前缀 32 字节 hex；生产环境应通过密钥管理服务注入）
    # P0/密钥管理修复：优先从环境变量 NEXUS_GOVERNANCE_PRIVATE_KEY 读取。
    # on-chain-enabled=true 但私钥缺失时，OnChainGovernanceClient.init() fail-closed 拒绝启动。
    private-key: ${NEXUS_GOVERNANCE_PRIVATE_KEY:}
    # 链 ID（31337=Hardhat, 11155111=Sepolia, 1=Mainnet）
    chain-id: 31337
    # gas 上限
    gas-limit: 500000
    # gas price（wei，默认 1 Gwei；运行时优先从链上 eth_gasPrice 获取）
    gas-price: 1000000000

  # ==================== 安全配置（since 2.2） ====================
  # P0/密钥管理修复：JWT 签名密钥改为外部配置注入，移除硬编码。
  # 生产环境必须通过环境变量 NEXUS_JWT_APP_ID / NEXUS_JWT_APP_SECRET 注入，
  # 启动时 JWTUtil.init() 校验非空，缺失则 fail-closed 拒绝启动。
  security:
    jwt:
      # JWT App ID（原硬编码 "REDACTED-ROTATED-JWT-SECRET" 已移除）
      # 优先从环境变量读取；空值将导致启动失败
      app-id: ${NEXUS_JWT_APP_ID:}
      # JWT App Secret（原硬编码 "REDACTED-ROTATED-JWT-SECRET" 已移除）
      # 优先从环境变量读取；空值将导致启动失败
      app-secret: ${NEXUS_JWT_APP_SECRET:}