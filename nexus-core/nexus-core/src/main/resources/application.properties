############################### 数据库连接配置 ###########################################
spring.datasource.url=${DATA_SOURCE_URL:jdbc:postgresql://localhost:5432/your-data-base}
spring.datasource.username=${DB_USERNAME:username}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.type=org.apache.commons.dbcp2.BasicDataSource
########################################################################################
#################################### 共识参数 ###########################################
# 共识模式：dpos（默认，DPoS 出块）或 pos（PoS 出块）
# mode=dpos 时使用 DPoS/PoW 出块骨架（PackageMiner/Miner/MineThread）
# mode=pos  时启用 PoS 共识引擎（PosConsensusEngine/DefaultPosConsensus）
nexus.consensus.mode=${CONSENSUS_MODE:dpos}
# 矿工收益地址
miner.coinbase=${NEX_MINER_COINBASE:your coin base address}
# 验证者节点配置
miner.validators=${VALIDATORS:genesis/validators.json}
# 创世区块文件
nexus.consensus.genesis=${GENESIS_FILE:genesis/nexus-genesis-generator.json}
# 出块间隔 用于难度值调整
nexus.consensus.block-interval=${BLOCK_INTERVAL:30}
# 每个节点进行工作量证明的限制时间
nexus.consensus.pow-wait=${POW_WAIT:90}
# 一个纪元包含多少区块，用于难度值调整
# 因为创世区块不是挖出来的所以 创世区块不包含在第0个纪元中
# 0号纪元的第一个区块是1号区块，0号纪元的最后一个区块是120号区块
# 以此类推
# n纪元的第一个区块是n*120+1, n纪元的最后一个区块是(n+1)*120
nexus.consensus.blocks-per-era=${BLOCKS_PER_ERA:120}
# 是否开启挖矿
nexus.consensus.enable-mining=${ENABLE_MINING:false}
# 是否允许临时分叉 deprecated
nexus.consensus.allow-fork=${ALLOW_FORK:true}
# 被认为不可逆转的区块数量
nexus.allow-miner-joins-era=${ALLOW_MINER_JOINS_ERA:2380}
# 切换到 10s 一个出块的纪元,
nexus.block-interval-switch-era=${BLOCK_INTERVAL_SWITCH_ERA:2380}
nexus.block-interval-switch-to=${BLOCK_INTERVAL_SWITCH_TO:10}
########################################################################################
#################################### 事务参数 ###########################################
#天区块数
transaction.day.count=${TRANSACTION_DAY_COUNT:2880}
#最低手续费
min.procedurefee=200000
#nonce最大数
transaction.nonce=${TRANSACTION_NONCE:128}
########################################################################################
#################################### 事务内存池参数 ######################################
#事务内存池清除小时，默认2个小时
pool.clear.days=2
#queued上限
pool.queued.maxcount=60000
#pending上限
pool.pending.maxcount=30000
#queued到pending最大事务数
pool.queuedtopending.maxcount=5000
########################################################################################
#################################### p2p配置 ###########################################
# p2p 通信方式，默认是 rest
# grpc 是可选项
p2p.mode=${P2P_MODE:grpc}
# lru 缓存大小，防止p2p过量泛洪`
p2p.packet-cacheSize=${P2P_PACKET_CACHE_SIZE:256}
# grpc 节点发现配置
# 设置自己的节点地址 格式为 nexus://节点私钥@ip地址:端口 或者 nexus://ip地址:端口
# 如果不填写私钥，节点会创建密钥对，启动后可以在日志里查看自己的地址
p2p.address=${P2P_ADDRESS:nexus://localhost:9235}
# p2p 种子节点地址 多个用逗号分割 格式为 nexus://节点公钥@ip地址:端口, 公钥可以省略
# 例如 BOOTSTRAPS=nexus://localhost:9001,nexus://localhost:9002,nexus://localhost:9003
p2p.bootstraps=${BOOTSTRAPS:}
# 信任节点地址，多个用逗号分割 格式为 nexus://节点公钥@ip地址:端口， 公钥不可以省略
p2p.trustedpeers=${TRUSTED_PEERS:}
# 是否开启节点发现功能
# 若不开启节点发现，邻居节点固定为 种子节点+信任节点
# 若开启节点发现，初始邻居节点为种子节点+信任节点，随着节点运行会动态删增邻居节点，但信任节点不会被删除
p2p.enable-discovery=${ENABLE_DISCOVERY:false}
p2p.max-blocks-per-transfer=${MAX_BLOCKS_PER_TRANSFER:256}
p2p.enable-message-log=${ENABLE_MESSAGE_LOG:false}
# === REQ-19 安全加固：P2P gRPC TLS 配置 ===
# 生产环境启用 TLS（mTLS 双向认证），证书通过环境变量注入。
# 节点本地证书+定期轮换脚本（非 Nacos 管理），避免证书分发单点故障。
# dev 环境通过 GRPC_TLS_ENABLED=false 关闭（本地开发降级）。
p2p.tls.enabled=${GRPC_TLS_ENABLED:false}
p2p.tls.cert-chain-path=${GRPC_TLS_CERT_CHAIN:}
p2p.tls.private-key-path=${GRPC_TLS_PRIVATE_KEY:}
p2p.tls.trust-store-path=${GRPC_TLS_TRUST_STORE:}
########################################################################################
#################################### 节点配置 ###########################################
# 启动时是否清除数据
clear-data=${CLEAR_DATA:false}
clear-cache=${CLEAR_CACHE:false}
# 节点类型，exchange 不校验孵化事务
node-character=${NODE_CHARACTER:default}
# rpc 端口配置
server.port=${SERVER_PORT:19585}
########################################################################################
# 节点程序版本
nexus.version=v2.1.0
########################################################################################
# 事务的过期时间
nexus.ipc-config.lifetime=3600
# queued到pending的写入周期
nexus.ipc-config.queued_to_pending_cycle=*/5 * * * * ?
# queued与pending的清理周期
nexus.ipc-config.clear-cycle=0 */1 * * * ?
# 是否允许本机客户端才能连接
nexus.ipc-config.local-only=false
nexus.cache-dir=${CACHE_DIR:}
#只允许本地获取的动态token才可以访问rpc
nexus.localonly=${LOCALONLY:false}

# 是否开启检查点
nexus.open-check-point=${OPEN_CHECK_POINT:false}

########################################################################################
#################################### NexusChain 支付扩展参数 #################################
# 支付模式开关（开启后启用快速确认和支付通道）
nexus.payment.enabled=${NEXUS_PAYMENT_ENABLED:true}
# 支付场景快速确认区块数（默认1个区块即确认）
nexus.payment.fast-confirm-blocks=${NEXUS_FAST_CONFIRM_BLOCKS:1}
# 支付场景目标出块时间（秒），在支付模式下覆盖 block-interval
nexus.payment.target-block-interval=${NEXUS_PAYMENT_BLOCK_INTERVAL:5}
# 支付通道参数
nexus.payment.channel.lock-time=${NEXUS_CHANNEL_LOCK_TIME:1440}
nexus.payment.channel.max-participants=${NEXUS_CHANNEL_MAX_PARTICIPANTS:2}
nexus.payment.channel.dispute-period=${NEXUS_CHANNEL_DISPUTE_PERIOD:100}
# 批量转账参数
nexus.payment.batch.max-recipients=${NEXUS_BATCH_MAX_RECIPIENTS:100}
nexus.payment.batch.max-total-amount=${NEXUS_BATCH_MAX_TOTAL:1000000000000}
# 稳定币参数
nexus.stablecoin.enabled=${NEXUS_STABLECOIN_ENABLED:true}
nexus.stablecoin.collateral-ratio=${NEXUS_COLLATERAL_RATIO:150}
nexus.stablecoin.liquidation-penalty=${NEXUS_LIQUIDATION_PENALTY:10}
nexus.stablecoin.min-mint-amount=${NEXUS_MIN_MINT:100000000}
 # 跨链桥参数
 nexus.bridge.enabled=${NEXUS_BRIDGE_ENABLED:true}
 nexus.bridge.validator-threshold=${NEXUS_BRIDGE_THRESHOLD:3}
 nexus.bridge.timelock-blocks=${NEXUS_BRIDGE_TIMELOCK:100}
 nexus.bridge.daily-limit=${NEXUS_BRIDGE_DAILY_LIMIT:10000000000000}
 nexus.bridge.single-tx-limit=${NEXUS_BRIDGE_SINGLE_LIMIT:1000000000000}
  #################################### L2↔L1 桥合约参数（任务 #83，审计报告 §3.4 / P5-T6） ###################################
  # ===== 新配置命名空间 nexus.l2.l1.*（P5-T6 引入，与 application.yml 对齐）=====
  # true  = 真实 L1 节点（Hardhat/Ganache/Sepolia/Mainnet）
  # false = 内存模拟 fallback（L1ContractClient），适用于测试 / 离线开发
  nexus.l2.l1.real-l1-enabled=${NEXUS_L1_REAL_ENABLED:${NEXUS_L1_BRIDGE_ENABLED:false}}
  # L1 JSON-RPC 端点
  nexus.l2.l1.rpc-url=${NEXUS_L1_RPC_URL:${NEXUS_L1_BRIDGE_RPC:http://localhost:8545}}
  # L2 桥合约地址（0x 前缀 20 字节 hex，空表示未部署）
  nexus.l2.l1.bridge-contract-address=${NEXUS_L1_BRIDGE_CONTRACT_ADDR:${NEXUS_L1_BRIDGE_CONTRACT:0x0000000000000000000000000000000000000000}}
  # 挑战期（秒），默认 7 天
  nexus.l2.l1.challenge-period=${NEXUS_L1_CHALLENGE_PERIOD:604800}
  # 发送方地址（0x 前缀 20 字节 hex，留空则从 private-key 推导）
  nexus.l2.l1.from-address=${NEXUS_L1_FROM_ADDR:${NEXUS_L1_BRIDGE_FROM:}}
  # 发送方私钥（0x 前缀 32 字节 hex，用于签名 L1 交易；生产环境应通过密钥管理服务注入）
  nexus.l2.l1.private-key=${NEXUS_L1_PRIVATE_KEY:${NEXUS_L1_BRIDGE_PRIVATE_KEY:}}
  # L1 链 ID（1=mainnet, 5=goerli, 11155111=sepolia, 1337=本地 devnet, 31337=Hardhat）
  nexus.l2.l1.chain-id=${NEXUS_L1_CHAIN_ID:${NEXUS_L1_BRIDGE_CHAIN_ID:31337}}
  # gas 上限（L1 桥合约调用默认 500000）
  nexus.l2.l1.gas-limit=${NEXUS_L1_GAS_LIMIT:${NEXUS_L1_BRIDGE_GAS_LIMIT:500000}}
  # gas price（wei，默认 1 Gwei；运行时优先从链上 eth_gasPrice 获取）
  nexus.l2.l1.gas-price=${NEXUS_L1_GAS_PRICE:${NEXUS_L1_BRIDGE_GAS_PRICE:1000000000}}
  # ===== 兼容旧配置命名空间 nexus.l2.l1-bridge.*（向后兼容，引用 nexus.l2.l1.*）=====
  # L1 桥合约真实 Web3j 交互开关：
  #   false（默认/未设置）= 内存模拟 fallback（L1ContractClient），适用于测试 / 离线开发
  #   true                 = 真实 Web3j L1 合约调用（Web3jL1ContractClient），需配置 rpc-endpoint / contract-address / private-key
  nexus.l2.l1-bridge.enabled=${nexus.l2.l1.real-l1-enabled:false}
  # L1 JSON-RPC 端点（如 http://localhost:8545 或 https://mainnet.infura.io/v3/PROJECT_ID）
  nexus.l2.l1-bridge.rpc-endpoint=${nexus.l2.l1.rpc-url:http://localhost:8545}
  # L1 桥合约地址（0x 前缀 20 字节 hex）
  nexus.l2.l1-bridge.contract-address=${nexus.l2.l1.bridge-contract-address:0x0000000000000000000000000000000000000000}
  # 发送方地址（0x 前缀 20 字节 hex，留空则从 private-key 推导）
  nexus.l2.l1-bridge.from-address=${nexus.l2.l1.from-address:}
  # 发送方私钥（0x 前缀 32 字节 hex，用于签名 L1 交易；生产环境应通过密钥管理服务注入）
  nexus.l2.l1-bridge.private-key=${nexus.l2.l1.private-key:}
  # L1 链 ID（1=mainnet, 5=goerli, 11155111=sepolia, 1337=本地 devnet, 31337=Hardhat）
  nexus.l2.l1-bridge.chain-id=${nexus.l2.l1.chain-id:31337}
  # gas 上限（L1 桥合约调用默认 500000）
  nexus.l2.l1-bridge.gas-limit=${nexus.l2.l1.gas-limit:500000}
  # gas price（wei，默认 1 Gwei；运行时优先从链上 eth_gasPrice 获取）
  nexus.l2.l1-bridge.gas-price=${nexus.l2.l1.gas-price:1000000000}
# 订阅支付参数
nexus.subscription.max-duration=${NEXUS_SUB_MAX_DURATION:365}
nexus.subscription.min-interval-blocks=${NEXUS_SUB_MIN_INTERVAL:100}
########################################################################################
#################################### 链上状态快照持久化参数 #################################
# 合约存储 / 验证人注册表 / 质押服务 的 JSON 快照持久化（@PostConstruct 加载 + @PreDestroy 保存）
# 解决三个 ConcurrentHashMap 内存组件重启后状态丢失问题
# 是否启用快照持久化（false 时组件纯内存，测试场景可关闭）
nexus.chain.state-persist.enabled=${NEXUS_STATE_PERSIST_ENABLED:true}
# 快照文件目录（contract-storage-snapshot.json / validator-registry-snapshot.json / staking-snapshot.json）
nexus.chain.state-dir=${NEXUS_STATE_DIR:./data/}
########################################################################################



