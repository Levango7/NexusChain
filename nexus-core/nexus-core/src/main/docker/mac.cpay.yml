version: '3.1'

services:

  nexus_pgsql:
    image: nexus/nexus_pgsql
    restart: always
    container_name: nexus_pgsql
    privileged: true
    volumes:
      - /Users/sal/nexus_pgsql:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5433:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      NEX_POSTGRES_USER: ${NEX_POSTGRES_USER:-replica}
      NEX_POSTGRES_PASSWORD: ${NEX_POSTGRES_PASSWORD:-CHANGE_ME}

  nexus_core:
    image: nexus/nexus_core:v0.0.3
    restart: always
    container_name: nexus_core
    privileged: true
    volumes:
      - /Users/sal/nexus_logs:/logs
    ports:
      - 9585:9585
      - 19585:19585
    environment:
      DATA_SOURCE_URL: 'jdbc:postgresql://nexus_pgsql:5432/postgres'
      DB_USERNAME: ${DB_USERNAME:-replica}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      ENABLE_MINING: 'false'
      NEX_MINER_COINBASE: ${NEX_MINER_COINBASE:-CHANGE_ME_COINBASE}
