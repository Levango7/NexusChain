# ============================================================================
# @deprecated since v2.1.0 — 旧版 v0.0.3 部署清单，保留仅作历史参考。
# 当前生产部署使用仓库根 docker-compose.prod.yml，开发使用 docker-compose.yml。
# 不要基于本文件部署新环境。P2 清理项：标注 deprecated，后续迭代删除。
# ============================================================================
version: '3.1'

services:

  nexus_pgsql_v0.0.3:
    image: nexus/nexus_pgsql
    container_name: nexus_pgsql_v0.0.3
    privileged: true
    volumes:
      - /opt/nexus_pgsql_v0.0.3:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5433:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      NEX_POSTGRES_USER: ${NEX_POSTGRES_USER:-replica}
      NEX_POSTGRES_PASSWORD: ${NEX_POSTGRES_PASSWORD:-CHANGE_ME}

  nexus_core_v0.0.3:
    image: nexus/nexus_core:latest
    container_name: nexus_core_v0.0.3
    privileged: true
    volumes:
      - /opt/nexus_logs:/logs
      - /opt/nexus_logs_v0.0.3:/logs
      - ./entry_point.sh:/entry_point.sh
      - ./version.json:/version.json
      - /opt/nexus_leveldb:/leveldb
      - /opt/ipc:/root/ipc
    entrypoint: /usr/bin/env bash /entry_point.sh -d nexus_pgsql_v0.0.3:5432 -c '/usr/bin/env bash /run_nexus_core.sh';
    ports:
      - 19585:19585
      - 9585:9585
    environment:
      DATA_SOURCE_URL: 'jdbc:postgresql://nexus_pgsql_v0.0.3:5432/postgres'
      DB_USERNAME: ${DB_USERNAME:-replica}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      ENABLE_MINING: 'false'
      NEX_MINER_COINBASE: '12344'
      CLEAR_DATA: 'false'
      # 8.14 2019 增加以下三行
      P2P_MODE: 'grpc'
      P2P_ADDRESS: 'nexus://localhost:9585'
      # 这里建议把自己的 ip 从 BOOTSTRAPS 里面去掉，防止发消息给自己
      # P1-D6 安全加固：P2P 引导节点 IP 外部化注入，避免硬编码生产节点暴露
      BOOTSTRAPS: ${P2P_BOOTSTRAPS:-nexus://CHANGE_ME_BOOTSTRAP1:9585,nexus://CHANGE_ME_BOOTSTRAP2:9585}

