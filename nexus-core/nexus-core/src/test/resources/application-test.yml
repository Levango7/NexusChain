# ==================== nexus-core 测试 profile 配置 ====================
# 供 @ActiveProfiles("test") 的测试类（如 ParameterGovernanceMockTest）使用。
# 提供测试环境专用的非生产密钥默认值，避免 JWTUtil/OnChainGovernanceClient
# 的 fail-closed 启动校验拒绝测试上下文启动。
#
# 安全说明：本文件中的密钥仅为测试夹具，不可用于任何生产/预发环境。
# 生产密钥必须通过环境变量 NEXUS_JWT_APP_ID / NEXUS_JWT_APP_SECRET 注入。

# P0/密钥管理修复：测试用 JWT 密钥（固定夹具，非生产密钥）
nexus:
  security:
    jwt:
      app-id: ${NEXUS_JWT_APP_ID:test-app-id-not-for-production}
      app-secret: ${NEXUS_JWT_APP_SECRET:test-app-secret-not-for-production}

# 测试数据源：默认指向本地 nexus_test 库（可用环境变量覆盖指向 CI 数据库）
spring:
  datasource:
    url: ${DATA_SOURCE_URL:jdbc:postgresql://localhost:5432/nexus_test}
    username: ${DB_USERNAME:nexus_test}
    password: ${DB_PASSWORD:nexus_test_pw}
  jpa:
    hibernate:
      ddl-auto: update