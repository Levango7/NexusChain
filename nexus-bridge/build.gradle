// nexus-bridge
//
// Phase 2 微服务化（任务 #58）：跨链桥服务独立部署单元。
//
// 定位：跨链桥服务（lock/mint/burn/unlock）独立 Spring Boot 应用，
// 承载以下职责：
//   * 跨链资产锁定 / 铸造 / 销毁 / 解锁（BridgeController：/api/v1/bridge/**）
//   * EVM 兼容链适配器（adapter/*：Ethereum / BSC / Polygon）
//   * 跨链桥接 handler（handler/*：EthereumBridgeHandler / BSCBridgeHandler）
//   * 流动性管理（liquidity/*：LiquidityManager / LiquidityPool）
//   * 密钥保管（keyvault/*：FileKeyVault）
//   * Ed25519 验签白名单（BridgeValidator，2026-08-06 起 MINT/UNLOCK 强制逐签验签）
//
// SCA 版本矩阵（设计文档 §4.1）：
//   Spring Boot 3.2.5 / Spring Cloud 2023.0.3 / SCA 2023.0.1.0
//   Nacos 2.3.2 / Sentinel 1.8.8 / OpenFeign 4.1.0
//
// 详见 .codeartsdoer/specs/microservice-phase1-2/design.md §3.3 / §4.1。

plugins {
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

// === 生产专用运行时依赖配置（L3 复验缺陷 #34） ===
// 声明必须在 dependencies {} **之前**（Gradle 按脚本顺序解析 DSL）。
// Boot 4 把 tracing 自动配置拆到 spring-boot-zipkin 模块，生产需要真实 Tracer bean；
// starter 直接进 runtimeClasspath 会与测试的 @MockitoBean 冲突（gateway 注释实测）。
configurations {
    productionRuntimeOnly
}

// CVE-2026-65182（CRITICAL 安全约束绕过）/ CVE-2026-65905（HIGH DIGEST 重放）
// / CVE-2026-68525（HIGH FORM 认证绕过）：tomcat-embed-core 11.0.24 修复于
// 11.0.25。ext['tomcat.version'] 是 io.spring.dependency-management 插件的
// 官方 BOM 属性覆盖机制（根 build.gradle 的 resolutionStrategy force 对
// Spring Boot BOM 无效，已实测）。
ext['tomcat.version'] = '11.0.25'

group = 'org.nexus'
version = '2.30.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceCompatibility = 17

repositories {
    // SCA / Nacos / Sentinel 制品优先走阿里云镜像（与 signing-service / gateway build.gradle 对齐）
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    mavenCentral()
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

dependencies {
    // 共享通用库（tracing 等，合并自原模块内逐字节一致的拷贝）
    implementation project(':nexus-common')
    // === Spring Boot ===
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // C 批（2026-09-08）：/actuator/prometheus 指标输出——供 ServiceMonitor 抓取
    //（actuator 只给端点框架，registry-prometheus 才给 Prometheus 格式数据）
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // L3 预演缺陷 #21（2026-10-13）：logback-spring.xml 的 JSON_FILE appender 用
    // LogstashEncoder，但本模块缺该依赖 → logback 配置即报 ClassNotFound，
    // 应用连启动日志都出不来（与 gateway 的 7.4 对齐）。
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // === P0-6 安全加固：Spring Security 方法级鉴权 ===
    // 引入 spring-boot-starter-security 启用 @PreAuthorize 方法级鉴权，
    // 配合 SecurityConfig(@EnableMethodSecurity) 对 BridgeController 危险端点
    // （lock/mint/burn/unlock/pause/resume）强制角色控制。
    // bridge 为独立部署的 Spring Boot 应用（buildJar 产出 fat jar，直接暴露 HTTP 端点），
    // 故鉴权在本服务内实现，而非 gateway FeignClient 层。
    // 参考 nexus-signing-service/build.gradle 的安全依赖配置方式。
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // === Micrometer Tracing + Zipkin（Phase 3 任务 #61，设计文档 §4.3.1） ===
    // SpringBoot 4.0.8 BOM 管理版本（micrometer-tracing 1.6.7 + zipkin-reporter-brave 3.5.3）
    // W3C traceparent 格式跨服务传播，Zipkin 上报，Feign 自动埋点
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'io.github.openfeign:feign-micrometer'
    // L3 复验缺陷 #34：Boot 4 把 tracing 自动配置拆到 spring-boot-zipkin 模块，
    // 只引上述三件时**生产缺 Tracer bean**（BridgeServiceImpl 构造器注入失败，
    // 现象与 gateway 注释同源）。starter 走 productionRuntimeOnly：只进生产 bootJar，
    // 不进测试运行时类路径 → 不与 @MockitoBean 冲突（gateway 的实测结论）。
    productionRuntimeOnly 'org.springframework.boot:spring-boot-starter-zipkin'

    // Web3j: 用于与 EVM 兼容链（Ethereum / BSC / Polygon）进行 JSON-RPC 交互
    // 排除 jc-kzg-4844（EIP-4844 blob 交易支持），桥合约调用不需要且该依赖在
    // 当前仓库配置下不可解析（tech.pegasys:jc-kzg-4844:0.8.0 仅存在于特定仓库）
    implementation('org.web3j:core:4.11.0') {
        exclude group: 'tech.pegasys', module: 'jc-kzg-4844'
    }

    // === Spring Cloud BOM（管理 OpenFeign / LoadBalancer 版本，设计文档 §4.1） ===
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.0')
    // === Spring Cloud Alibaba BOM（管理 Nacos / Sentinel 版本） ===
    implementation platform('com.alibaba.cloud:spring-cloud-alibaba-dependencies:2025.1.0.0')

    // === Nacos 服务发现 + 配置中心（Phase 2 任务 #58） ===
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'
    // P4-A（2026-08-29）：Nacos client 传递引入 httpcore5 5.3.6（CVE-2026-54399/54428 HIGH，
    // HTTP/HPACK 头 DoS），显式声明 5.4.3 强制升级消除（与 nexus-gateway 对齐）
    implementation 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
    implementation 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    // P4-A：Seata/Spring Cloud 传递引入 commons-fileupload 1.5（CVE-2025-48976 HIGH），
    // 显式声明 1.6.0 强制升级消除（与 nexus-gateway 对齐）
    implementation 'commons-fileupload:commons-fileupload:1.6.0'
    // P4-A：web3j/传递依赖引入 bcprov-jdk18on 1.81（CVE-2025-14813 CRITICAL，GOSTCTR
    // 实现缺陷），显式声明 1.81.1 强制升级消除
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'

    // === Sentinel 熔断 / 限流 ===
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-sentinel'
    // L3 复验缺陷 #36：application.yml 配了 sentinel 的 nacos 数据源
    // （spring.cloud.sentinel.datasource.ds1.nacos），但 starter 不含该连接器
    // → 启动即 NoClassDefFoundError: com.alibaba.csp.sentinel.datasource.nacos.NacosDataSource
    // （wallet/signing 早已有本依赖，bridge 漏配）。
    implementation 'com.alibaba.csp:sentinel-datasource-nacos'

    // === Seata 分布式事务（Phase 3 任务 #61） ===
    // SCA 2023.0.1.0 BOM 管理 seata-spring-boot-starter 版本（2.0.0），设计文档 §4.1 / §4.2.2
    // bridge 当前无跨服务事务需求（设计文档 §2.1.1），但依赖统一接入便于未来扩展
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-seata'

    // === OpenFeign 声明式调用 + LoadBalancer（bridge 作为独立微服务，预留 Feign 调用能力） ===
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // === 中6 改进：ShedLock 分布式锁（recoverIncompleteSagas / retryFailedSagas 多实例去重） ===
    // ShedLock 6.2.0 兼容 Spring Boot 3.3.x，使用 JDBC provider
    // （复用 bridge 已有 MySQL 数据源，无需额外引入 Redis）。
    // shedlock-spring：核心注解 @SchedulerLock + @EnableSchedulerLock
    // shedlock-provider-jdbc-template：基于 JdbcTemplate 的 JdbcTemplateLockProvider，
    //   支持 usingDbTime()（使用 DB 服务器时间避免多实例 JVM 时钟漂移）
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.2.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.2.0'

    // === bootstrap.yml 支持（Spring Cloud 2023.0.x 需显式引入） ===
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // === Spring Boot 4.0 模块化：@AutoConfigureMockMvc 移到 spring-boot-webmvc-test ===
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // === 测试期安全支持：提供 @WithMockUser 注解用于 MockMvc 方法级鉴权测试 ===
    // BridgeController 的 lock/mint/burn/unlock 端点有 @PreAuthorize("hasRole('OPERATOR')")，
    // 集成测试需通过 @WithMockUser 模拟认证用户与角色才能访问这些端点。
    testImplementation 'org.springframework.security:spring-security-test'
}

// 跨链桥服务为独立部署的 Spring Boot 应用，启用 bootJar 产出可执行 fat jar。
bootJar {
    enabled = true
    archiveClassifier = ''
}

jar {
    enabled = true
    archiveClassifier = 'plain'
}

test {
    useJUnitPlatform()
}

// === 生产专用运行时依赖（L3 复验缺陷 #34） ===
// 自定义 productionRuntimeOnly：只并入 bootJar 类路径，不进测试运行时类路径。
// 注意：必须用 sourceSets.main.runtimeClasspath（含本项目 classes 输出）——
// 直接用 configurations.runtimeClasspath 会丢掉应用类（实测 bootJar 出空 classes）。
tasks.named('bootJar') {
    classpath = sourceSets.main.runtimeClasspath + configurations.productionRuntimeOnly
}

// === 覆盖率门禁 ===
// 子模块不再覆盖 jacocoTestCoverageVerification，统一由根 build.gradle 的 0.30 门禁生效，
// 避免子模块 0.15 与根 0.30 不一致导致门禁语义混乱（实际覆盖率 66.32% 远高于两者）。
