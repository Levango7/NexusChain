spring:
  datasource:
    url: jdbc:h2:mem:nexus_bridge;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

# === REQ-14 安全加固：dev profile 关闭 Feign TLS（本地开发降级） ===
feign:
  tls:
    enabled: false