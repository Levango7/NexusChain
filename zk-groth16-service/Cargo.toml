[package]
name = "zk-groth16-service"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-bn254 = "0.4"
ark-groth16 = { version = "0.4", features = ["parallel"] }
ark-snark = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
ark-relations = "0.4"
ark-std = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
eyre = "0.6"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
