plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'org.nexus'
version = '2.26.0'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = 17
    targetCompatibility = 17
}

repositories {
mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-properties'

    // === REQ-21 安全加固：引入 Flyway 数据库迁移管理 ===
    // 替代 Hibernate ddl-auto 进行 schema 演进管理，确保生产环境 schema 受控、可审计、可回滚。
    // Spring Boot starter 自动配置 Flyway，在 JPA 初始化前执行迁移脚本。
    implementation 'org.flywaydb:flyway-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 测试环境用 H2 内存库（生产走 Postgres；占位 datasource 导致 JPA 无法确定 Dialect，
    // 测试上下文加载失败——基线环境问题修复）
    testImplementation 'com.h2database:h2'



    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
    implementation project(':common')
    implementation project(':crypto')
    // BouncyCastle 1.78 (jdk18on): crypto 模块用 implementation 引入 bcprov/bcpkix 不会传递到本模块，
    // 而 ByteUtil/RLPUtils 直接使用了 org.bouncycastle.util.encoders.Hex 和
    // org.bouncycastle.util.BigIntegers，因此这里需要显式声明。
    // jdk18on 与 signing-service/sdk 统一，修复 bcprov 1.70 的 CVE。
    implementation "org.bouncycastle:bcprov-jdk18on:${bouncycastleVersion}"
    implementation "org.bouncycastle:bcpkix-jdk18on:${bouncycastleVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    implementation "com.google.guava:guava:${guavaVersion}"
    implementation "commons-cli:commons-cli:${commonsCliVersion}"
    implementation "io.grpc:grpc-all:${gRPCVersion}"
    implementation "org.java-websocket:Java-WebSocket:${webSocketVersion}"

    // === P1-9：LevelDB 持久化存储实现 ===
    // 替换 Start.store() 中的 no-op 实现，使区块数据真正落盘。
    // 使用纯 Java 实现 org.iq80.leveldb:leveldb:0.12，避免 JNI 平台依赖。
    implementation 'org.iq80.leveldb:leveldb:0.12'

}

task runTestCommunicationTool(type: JavaExec){
    main = "org.nexus.consortium.util.vm.wasm.TestCommunicationTool"
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    if (project.hasProperty("appArgs")) {
        args appArgs.split(" ")
    }
}

task copyDependencies(type: Copy) {
    from configurations.runtimeClasspath
    destinationDir = file('build/libs/lib')
}

test {
    useJUnitPlatform()
}
