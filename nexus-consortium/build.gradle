plugins {
    // 2026-10-18 批次⑦：composite 模块 SpotBugs 接入——类路径在此声明
    // （与根构建 5.1.5 同版本），子项目在 afterEvaluate 内 apply。
    id 'com.github.spotbugs' version '5.1.5' apply false
}

apply from: 'config.gradle'

subprojects { proj ->
    proj.apply plugin: 'jacoco'

    proj.jacoco {
        toolVersion = "0.8.11"
    }

    proj.afterEvaluate {
        if (proj.plugins.hasPlugin('java')) {
            // 2026-10-18 批次⑦：SpotBugs + FindSecBugs（共享配置脚本，与根
            // 构建同口径；SAST 门禁此前对 includeBuild 子项目空转）。
            // 实测教训：嵌套闭包内必须显式 proj 接收者——隐式 `apply from:`
            // 会沿 owner 链解析到 consortium 根项目（无 java 插件、无
            // compileOnly 配置），在共享脚本里炸 "Could not find method
            // compileOnly()"。全块统一显式接收者，消除解析歧义。
            proj.apply plugin: 'com.github.spotbugs'
            proj.apply from: "${proj.rootDir}/../gradle/composite-spotbugs.gradle"

            proj.jacocoTestReport {
                reports {
                    xml.required = true
                    html.required = false
                }
            }
            proj.jacocoTestCoverageVerification {
                violationRules {
                    rule {
                        limit {
                            // 默认 0.30 BUNDLE 指令覆盖门禁（与根构建 0.30 对齐）。
                            // crypto 补测批次（2026-09-09）：新增 SM2/SM3/SM4/Base58/
                            // HashFunctions/Ed25519/AES256CTR 测试套件（44 用例），
                            // 实测指令覆盖 ~42%，0.00 占位提升为统一 0.30。
                            minimum = 0.30
                        }
                    }
                }
            }
            proj.check.dependsOn proj.jacocoTestCoverageVerification
        }
    }
}
