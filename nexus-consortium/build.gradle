apply from: 'config.gradle'

subprojects {
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = "0.8.11"
    }

    afterEvaluate {
        if (plugins.hasPlugin('java')) {
            jacocoTestReport {
                reports {
                    xml.required = true
                    html.required = false
                }
            }
            jacocoTestCoverageVerification {
                violationRules {
                    rule {
                        limit {
                            // 默认 0.30 BUNDLE 指令覆盖门禁（与根构建 0.30 对齐）。
                            // crypto 补测批次（2026-09-09）：新增 SM2/SM3/SM4/Base58/
                            // HashFunctions/Ed25519/AES256CTR 测试套件（44 用例），
                            // 实测指令覆盖 ~42%，0.00 占位提升为统一 0.30。
                            minimum = 0.30
                        }
                    }
                }
            }
            check.dependsOn jacocoTestCoverageVerification
        }
    }
}
