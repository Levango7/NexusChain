[package]
# ConPay Rust 合约模板
name = "conpay-contract-template"
version = "0.1.0"
edition = "2021"
description = "ConPay (CPAY) 链上 WASM 合约模板"
license = "MIT"

[lib]
# 编译为 cdylib 以生成 WASM
crate-type = ["cdylib"]

[dependencies]
# ConPay 合约 SDK（骨架阶段为占位依赖）
# conpay-sdk = { version = "0.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }

[profile.release]
# 优化 WASM 体积
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
