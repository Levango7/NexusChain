plugins {
    id 'java-library'
    id 'maven-publish'
    // signing 插件用于 GPG 签名（发布到 Maven Central 需要）
    // 但不强制配置签名——仅在 gradle.properties 中有 signing.keyId 时才激活
}

group = 'org.nexus'
version = '2.30.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // TD-04（tech-debt-audit）：jackson-databind 移除硬编码 2.14.2，改由下方
    // implementation platform 引入的 Spring Boot 3.2.5 BOM 管理（解析为 2.15.4），
    // 与微服务群（BOM 2.15.4）及 nexus-core（根 ext 2.15.4）对齐，消除三轨并存。
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78'
    // Reuse nexus-core keystore/crypto/util classes (org.nexus.keystore.*)
    implementation project(':nexus-core:nexus-core')

    // Protobuf (TxUtils uses com.google.protobuf.ByteString; matches nexus-core 3.22.2)
    implementation 'com.google.protobuf:protobuf-java:3.22.2'
    // Guava (WalletUtils uses com.google.common.primitives.Bytes; matches nexus-core 33.4.8-jre)
    // TD-05（tech-debt-audit）：由 31.1-jre 统一至 33.4.8-jre，32.0.0 修复 CVE-2023-2976。
    implementation 'com.google.guava:guava:33.4.8-jre'

    // Gson — shared JsonUtil (org.nexus.sdk.util.JsonUtil) migrated from exchange-wallet in Phase 1.
    // Version aligned with exchange-wallet (2.10.1) and root build.gradle ext.gsonVersion.
    implementation 'com.google.code.gson:gson:2.10.1'

    // === Phase 1: Feign 接口骨架（org.nexus.sdk.client.feign.*）所需注解 ===
    // 仅编译期需要 @FeignClient / @PostMapping 等注解；运行期由各消费方微服务
    // （gateway / signing-service / wallet-service，均为 Spring Boot 应用）提供实现。
    // 用 compileOnly + BOM 约束版本，不向消费方传递 Spring 运行期依赖。
    // 版本矩阵对齐设计文档 §4.1：Spring Boot 3.2.5 / Spring Cloud 2023.0.3 / SCA 2023.0.1.0。
    // TD-04：Boot BOM 由 compileOnly platform 提升为 implementation platform——
    // compileOnly 的平台约束不传播到 runtimeClasspath（Gradle configuration 继承语义），
    // 无版本号的 jackson-databind 在测试/运行期将无法解析；implementation platform
    // 使约束同时覆盖编译与运行期，且与消费方自身 Boot 3.2.5 BOM 完全一致、无行为变化。
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
    compileOnly platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.0')
    compileOnly 'org.springframework.cloud:spring-cloud-starter-openfeign'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'

    // JUnit 5 (Jupiter) — SdkUnitTest uses @Nested/@Test/@DisplayName
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // JUnit 5 platform launcher (required for gradle to discover Jupiter tests)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// === 覆盖率门禁（与 nexus-bridge / nexus-gateway 对齐，minimum 0.15） ===
// BUNDLE 级别指令覆盖率下限 0.15；check 依赖 jacocoTestCoverageVerification 以强制门禁
// jacoco 插件与 jacocoTestReport 由根 build.gradle subprojects 块统一应用/配置
// 测试体系中期建设：模块自定义覆盖率渐进线，根 0.30 门禁不注入（见根 build.gradle）
ext.jacocoGateOverridden = true
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                element = 'BUNDLE'
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

// === Maven Central 发布配置（P4-T9）===
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'org.nexus'
            artifactId = 'nexus-sdk-java'
            version = '2.30.0'

            pom {
                name = 'NexusChain SDK for Java'
                description = 'NexusChain blockchain payment orchestration SDK - v2.30.0'
                url = 'https://github.com/Levango7/NexusChain'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        id = 'nexus'
                        name = 'NexusChain Team'
                    }
                }
                scm {
                    url = 'https://github.com/Levango7/NexusChain'
                    connection = 'scm:git:https://github.com/Levango7/NexusChain.git'
                }
            }
        }
    }
}
