// nexus-api-gateway
//
// P3-T2：Spring Cloud Gateway 统一 API 入口。
//
// 定位：作为 NexusChain 平台对外唯一的 HTTP 入口，统一鉴权、限流、日志、CORS，
// 并以路由 DSL 将请求转发至下游 4 个 Spring Boot 服务：
//   * /api/v1/payments/** → nexus-gateway       (8080，支付网关)
//   * /api/v1/bridge/**   → nexus-bridge        (8084，跨链桥)
//   * /api/v1/signing/**  → nexus-signing-service (8082，签名服务)
//   * /api/v1/wallet/**   → nexus-wallet-service  (8083，钱包服务)
//
// 技术栈：
//   * Spring Boot 3.2.5 / Spring Cloud 2023.0.3 / Spring Cloud Alibaba 2023.0.1.0
//   * Spring Cloud Gateway（基于 WebFlux + Reactor Netty，非阻塞响应式）
//   * Nacos 服务发现 + 配置中心（与下游服务同 namespace/group）
//   * Redis 令牌桶限流（spring-boot-starter-data-redis-reactive）
//   * Actuator + Micrometer Prometheus 指标暴露
//
// 注意：Spring Cloud Gateway 必须运行在 WebFlux 之上，禁止引入 spring-boot-starter-web
// （Tomcat 阻塞容器与 Reactive 编程模型冲突）。
//
// 详见 P3-T2 任务说明 / nexus-api-gateway/README.md。

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.4'
}

// CVE-2026-68497（HIGH）：本模块是 composite build（独立构建根），拿不到根
// build.gradle 的 ext，jackson 全靠 Boot 4.0.8 BOM 解析为 2.21.5 / tools.jackson 3.1.5
// （两条坐标都在受影响区间，实测只提 2.x 仍红）。覆盖机制同 nexus-gateway/build.gradle:14
// 的 tomcat.version 先例。
// 2026-10-01 续追（第二波）：CVE-2026-91776 / CVE-2026-91777 命中上一轮的修复版
// 2.21.6 / 3.1.6 本身（master push run 36773548701 镜像扫描），本模块同样要抬到
// 2.21.7 / 3.1.7 —— composite build 的 ext 副本不会随根 build.gradle 自动跟随，
// 这是本模块第二次需要手工同步（根改而此处不改时，该镜像会静默滞后）。
ext['jackson-2-bom.version'] = '2.21.7'
ext['jackson-bom.version'] = '3.1.7'

group = 'org.nexus'
version = '2.30.0'

java {
    sourceCompatibility = 17
    targetCompatibility = 17
}

repositories {
    // SCA / Nacos / Sentinel 制品优先走阿里云镜像（与其他服务 build.gradle 对齐）
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    mavenCentral()
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

dependencies {
    // === Spring Cloud Gateway（含 WebFlux + Reactor Netty） ===
    // 审计修复：Spring Cloud 2025.x 将 gateway starter 更名为
    // spring-cloud-starter-gateway-server-webflux（旧坐标不在 2025.1.0 BOM 中，
    // 声明后解析为空版本导致依赖解析失败）。
    // 引入它会传递引入 spring-boot-starter-webflux，
    // 切勿再引入 spring-boot-starter-web（Tomcat），否则启动失败。
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    // === Spring Boot Actuator（健康检查 / 指标暴露） ===
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // === Reactive Redis（限流令牌桶基于 Redis Lua 脚本） ===
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // === Micrometer Tracing + Zipkin（与下游服务链路打通） ===
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

    // === Prometheus 指标暴露 ===
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // === Spring Cloud BOM（管理 Gateway / LoadBalancer 版本） ===
    // 审计修复：Boot 4.0.8 需要配套的 Spring Cloud 2025.1.x 线（2023.0.3 只兼容
    // Boot 3.2.x）。与 gateway/wallet/bridge 的 ca7e0ba 升级对齐。
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.0')
    // === Spring Cloud Alibaba BOM（管理 Nacos / Sentinel 版本） ===
    implementation platform('com.alibaba.cloud:spring-cloud-alibaba-dependencies:2025.1.0.0')

    // === Nacos 服务发现 + 配置中心（与下游服务一致） ===
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'
    // P4-A（2026-08-29）：Nacos client 传递引入 httpcore5 5.3.6（CVE-2026-54399/54428 HIGH），
    // 显式声明 5.4.3 强制升级消除（与 nexus-gateway 对齐）
    implementation 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
    implementation 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    // P4-A：Spring Cloud/网关依赖传递引入 bcprov-jdk18on 1.81（CVE-2025-14813 CRITICAL，
    // GOSTCTR 实现缺陷），显式声明 1.81.1 强制升级消除
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'

    // === Spring Cloud LoadBalancer（Gateway 路由 lb:// 协议依赖） ===
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // === bootstrap.yml 支持（Spring Cloud 2023.0.x 需显式引入） ===
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'

    // === 工具库 ===
    // 去掉硬编码 3.12.0：本模块用 org.springframework.boot 插件 4.0.8 + dependency-management，
    // Boot BOM 会把 commons-lang3 管到 3.19.0（实测），与根构建其它模块一致。
    // 原先这里是全仓两处旧钉之一（另一处 nexus-core/nexus-core/build.gradle:159），
    // Trivy 镜像扫描报的 CVE-2025-48924（< 3.18.0）正来自这两个镜像。
    implementation 'org.apache.commons:commons-lang3'
    // HMAC 签名验证使用 JDK 内置 javax.crypto，无需额外依赖

    // === 测试 ===
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

// 独立部署的 Spring Boot 应用，启用 bootJar 产出可执行 fat jar。
bootJar {
    enabled = true
    archiveClassifier = ''
}

jar {
    enabled = true
    archiveClassifier = 'plain'
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = false
    }
}

// === 覆盖率门禁（与 nexus-bridge / nexus-gateway 对齐，minimum 0.15） ===
// BUNDLE 级别指令覆盖率下限 0.15；check 依赖 jacocoTestCoverageVerification 以强制门禁
// 测试体系中期建设：模块自定义覆盖率渐进线，根 0.30 门禁不注入（见根 build.gradle）
ext.jacocoGateOverridden = true
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                element = 'BUNDLE'
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification