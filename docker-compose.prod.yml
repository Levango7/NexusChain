version: '3.8'
services:
  nexus-gateway:
    build: ./nexus-gateway
    expose: ['8080']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/actuator/health']
      interval: 30s
      retries: 3
    restart: always
    depends_on:
      nexus-core:
        condition: service_healthy
  nexus-core:
    build: ./nexus-core
    expose: ['19585']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:19585/height']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
  nexus-bridge:
    build: ./nexus-bridge
    expose: ['8082']
    depends_on:
      nexus-core:
        condition: service_healthy
    restart: always
  postgres:
    image: postgres:15-alpine
    volumes: [pgdata:/var/lib/postgresql/data]
    expose: ['5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 10s
      retries: 5
    restart: always
  redis:
    image: redis:7-alpine
    expose: ['6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 3
    restart: always
  prometheus:
    image: prom/prometheus:latest
    expose: ['9090']
    restart: always
  grafana:
    image: grafana/grafana:latest
    expose: ['3000']
    restart: always
volumes:
  pgdata:
