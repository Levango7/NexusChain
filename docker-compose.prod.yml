version: '3.8'

# NexusChain 生产环境编排
# ============================================================================
# REQ-36 / T36：补全 16 个服务定义，解除生产部署阻断。
#
# 与 docker-compose.yml（dev）的差异：
#   1. 端口用 expose（不绑定宿主机），由前置负载均衡/Ingress 暴露
#   2. SPRING_PROFILES_ACTIVE=prod
#   3. 基础设施凭据用占位符（CHANGE_ME_*），外部化注入
#   4. restart: always（生产自愈）
#
# 端口约定（与各服务 application.yml server.port 对齐）：
#   gateway:8080 / signing:8082 / wallet:8083 / bridge:8084 / api-gateway:8085
#   core:19585 / mpc:50051 / zk:50061(gRPC)+50062(HTTP)
#   nacos:8848 / sentinel:8858 / seata:8091+7091 / zipkin:9411
#   postgres:5432 / redis:6379 / prometheus:9090 / grafana:3000
# ============================================================================

services:
  # ==================== 应用服务 ====================
  nexus-gateway:
    build: ./nexus-gateway
    expose: ['8080']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    depends_on:
      nexus-core:
        condition: service_healthy
      nacos:
        condition: service_healthy

  nexus-core:
    build: ./nexus-core
    expose: ['19585']
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:19585/height']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # === 签名服务（端口 8082，TCC 分布式事务） ===
  nexus-signing-service:
    build: ./nexus-signing-service
    expose: ['8082']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEX_NACOS_SERVER=nacos:8848
      - NEX_SEATA_SERVER=seata:8091
      - NEX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      # P0-1 Task 239: MPC 多端点路由（逗号分隔的 host:port 列表）
      - NEX_MPC_ENGINE_ENDPOINTS=mpc-engine-0:50051,mpc-engine-1:50051,mpc-engine-2:50051
      # mTLS 证书路径（生产通过 Secret / 挂载卷注入）
      - NEX_MPC_ENGINE_TLS_TRUST_CERT=/etc/mpc/certs/ca/CA.pem
      - NEX_MPC_ENGINE_TLS_CLIENT_CERT=/etc/mpc/certs/node-A/cert.pem
      - NEX_MPC_ENGINE_TLS_CLIENT_KEY=/etc/mpc/certs/node-A/key.pem
    volumes:
      - mpc-certs:/etc/mpc/certs:ro
    depends_on:
      nexus-core:
        condition: service_healthy
      mpc-engine-0:
        condition: service_started
      mpc-engine-1:
        condition: service_started
      mpc-engine-2:
        condition: service_started
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8082/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # === 钱包管理服务（端口 8083，提现审批 TCC） ===
  nexus-wallet-service:
    build: ./nexus-wallet-service
    expose: ['8083']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEX_NACOS_SERVER=nacos:8848
      - NEX_SEATA_SERVER=seata:8091
      - NEX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      nexus-core:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8083/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # === 桥接服务（端口 8084，REQ-29 修正：原 8082→8084） ===
  nexus-bridge:
    build: ./nexus-bridge
    expose: ['8084']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      nexus-core:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8084/api/v1/bridge/status']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  # === API 网关（端口 8085，统一入口 Spring Cloud Gateway） ===
  nexus-api-gateway:
    build: ./nexus-api-gateway
    expose: ['8085']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEX_REDIS_HOST=redis
      - NEX_REDIS_PORT=6379
    depends_on:
      nexus-gateway:
        condition: service_healthy
      nexus-bridge:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8085/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # ==================== 密码学服务 ====================
  # === MPC 引擎（Rust，gRPC 50051，3 节点分散式部署） ===
  # P0-1 Task 239：从单节点升级为 3 节点分散式（2-of-3 阈值签名）
  #   mpc-engine-0 → party_index=0, 证书 node-A
  #   mpc-engine-1 → party_index=1, 证书 node-B
  #   mpc-engine-2 → party_index=2, 证书 node-C
  # 三节点共享 nexus-net 网络，通过服务名互连
  mpc-engine-0:
    build: ./mpc-engine
    expose: ['50051']
    environment:
      - RUST_LOG=info
      - MPC_ENGINE_HOST=0.0.0.0
      - MPC_ENGINE_PORT=50051
      - MPC_PARTY_INDEX=0
      - MPC_PARTY_ID=party-0
      - MPC_PEERS=party-1@mpc-engine-1:50051,party-2@mpc-engine-2:50051
      - MPC_STORAGE_KEY=${MPC_STORAGE_KEY:-CHANGE_ME_MPC_STORAGE_KEY}
      - MPC_AUTH_TOKEN=${MPC_AUTH_TOKEN:-CHANGE_ME_MPC_AUTH_TOKEN}
      - MPC_REQUIRE_AUTH=true
    volumes:
      - mpc-certs:/etc/mpc/certs:ro
      - mpc-engine-0-data:/app/data
    depends_on:
      nexus-core:
        condition: service_healthy
    restart: always

  mpc-engine-1:
    build: ./mpc-engine
    expose: ['50051']
    environment:
      - RUST_LOG=info
      - MPC_ENGINE_HOST=0.0.0.0
      - MPC_ENGINE_PORT=50051
      - MPC_PARTY_INDEX=1
      - MPC_PARTY_ID=party-1
      - MPC_PEERS=party-0@mpc-engine-0:50051,party-2@mpc-engine-2:50051
      - MPC_STORAGE_KEY=${MPC_STORAGE_KEY:-CHANGE_ME_MPC_STORAGE_KEY}
      - MPC_AUTH_TOKEN=${MPC_AUTH_TOKEN:-CHANGE_ME_MPC_AUTH_TOKEN}
      - MPC_REQUIRE_AUTH=true
    volumes:
      - mpc-certs:/etc/mpc/certs:ro
      - mpc-engine-1-data:/app/data
    depends_on:
      nexus-core:
        condition: service_healthy
    restart: always

  mpc-engine-2:
    build: ./mpc-engine
    expose: ['50051']
    environment:
      - RUST_LOG=info
      - MPC_ENGINE_HOST=0.0.0.0
      - MPC_ENGINE_PORT=50051
      - MPC_PARTY_INDEX=2
      - MPC_PARTY_ID=party-2
      - MPC_PEERS=party-0@mpc-engine-0:50051,party-1@mpc-engine-1:50051
      - MPC_STORAGE_KEY=${MPC_STORAGE_KEY:-CHANGE_ME_MPC_STORAGE_KEY}
      - MPC_AUTH_TOKEN=${MPC_AUTH_TOKEN:-CHANGE_ME_MPC_AUTH_TOKEN}
      - MPC_REQUIRE_AUTH=true
    volumes:
      - mpc-certs:/etc/mpc/certs:ro
      - mpc-engine-2-data:/app/data
    depends_on:
      nexus-core:
        condition: service_healthy
    restart: always

  # === ZK Groth16 验证服务（Rust，gRPC 50061 + HTTP 50062） ===
  zk-groth16-service:
    build: ./zk-groth16-service
    expose: ['50061', '50062']
    environment:
      - ZK_SERVICE_PORT=50061
      - ZK_HTTP_PORT=50062
      - GROTH16_SETUP_DIR=/setup
    volumes:
      - zk-groth16-setup:/setup
    depends_on:
      mpc-engine-0:
        condition: service_started
      mpc-engine-1:
        condition: service_started
      mpc-engine-2:
        condition: service_started
    restart: always

  # ==================== 基础设施 ====================
  # === 服务发现 + 配置中心（Nacos 2.3.2） ===
  # REQ-36/T36.4: prod 认证开启，凭据用占位符外部化注入
  # P1-8: 生产环境建议部署 Nacos 集群（至少 3 节点）+ MySQL 后端存储
  # 当前为 standalone 单点模式，仅适用于开发/测试
  # 集群部署参考：https://nacos.io/zh-cn/docs/cluster-mode-quick-start.html
  # 集群配置示例（注释形式，按需取消注释并调整）：
  # nacos-1:
  #   image: nacos/nacos-server:v3.1.2
  #   environment:
  #     - MODE=cluster
  #     - NACOS_SERVERS=nacos-1:8848 nacos-2:8848 nacos-3:8848
  #     - SPRING_DATASOURCE_PLATFORM=mysql
  #     - MYSQL_SERVICE_HOST=postgres
  #     - MYSQL_SERVICE_PORT=5432
  #     - MYSQL_SERVICE_DB_NAME=nacos
  #   ...
  nacos:
    image: nacos/nacos-server:v3.1.2
    container_name: nexus-nacos-prod
    expose: ['8848', '9848']
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
      # prod 认证开启（凭据通过环境变量注入，禁止硬编码）
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-CHANGE_ME_NACOS_KEY}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-CHANGE_ME_NACOS_VALUE}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-CHANGE_ME_NACOS_TOKEN}
      - NACOS_USERNAME=${NACOS_USERNAME:-CHANGE_ME_NACOS_USER}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-CHANGE_ME_NACOS_PASS}
    volumes:
      - nacos-logs:/home/nacos/logs
    healthcheck:
      # CI 审计修复：Nacos 3.x v1 readiness 端点已移除（410 Gone）——
      # 实测 3.1.2 可用就绪探针为 admin API /nacos/v3/admin/core/state（200）
      test: ['CMD', 'curl', '-f', 'http://localhost:8848/nacos/v3/admin/core/state']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # === 分布式事务协调器（Seata 2.5.0） ===
  # REQ-36/T36.4: 配置加密 key 用占位符
  seata:
    image: seataio/seata-server:2.5.0
    container_name: nexus-seata-prod
    expose: ['8091', '7091']
    environment:
      - SEATA_PORT=8091
      - STORE_MODE=db
      # P1-7: 生产环境使用 DB 存储事务日志（替代 file 模式，避免单点丢失）
      - SEATA_STORE_DB_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SEATA_STORE_DB_URL=jdbc:postgresql://postgres:5432/seata
      - SEATA_STORE_DB_USER=${POSTGRES_USER:-nexus}
      - SEATA_STORE_DB_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME}
      - SEATA_REGISTRY_NAME=nacos
      - SEATA_REGISTRY_NACOS_SERVER_ADDR=nacos:8848
      - SEATA_REGISTRY_NACOS_NAMESPACE=prod
      - SEATA_REGISTRY_NACOS_GROUP=SEATA_GROUP
      - SEATA_REGISTRY_NACOS_CLUSTER_NAME=default
      - SEATA_CONFIG_NAME=nacos
      - SEATA_CONFIG_NACOS_SERVER_ADDR=nacos:8848
      - SEATA_CONFIG_NACOS_NAMESPACE=prod
      - SEATA_CONFIG_NACOS_GROUP=SEATA_GROUP
      # 配置加密 key（占位符外部化）
      - SEATA_CONFIG_KEY=${SEATA_CONFIG_KEY:-CHANGE_ME_SEATA_KEY}
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/8091"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # === 链路追踪（Zipkin 3.4） ===
  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: nexus-zipkin-prod
    expose: ['9411']
    environment:
      - STORAGE_TYPE=mem
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/9411"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

  # === 熔断/限流控制台（Sentinel Dashboard 1.8.8） ===
  # REQ-36/T36.4: 凭据用占位符外部化
  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: nexus-sentinel-prod
    expose: ['8858']
    environment:
      - JAVA_OPTS=-Dserver.port=8080 -Dcsp.sentinel.dashboard.server=localhost:8080 -Dproject.name=nexus-sentinel-dashboard
      # Sentinel Dashboard 登录凭据（占位符外部化，禁止默认 nacos/nacos）
      - SENTINEL_USERNAME=${SENTINEL_USERNAME:-CHANGE_ME_SENTINEL_USER}
      - SENTINEL_PASSWORD=${SENTINEL_PASSWORD:-CHANGE_ME_SENTINEL_PASS}
    volumes:
      - sentinel-logs:/root/logs
    depends_on:
      nacos:
        condition: service_healthy
    restart: always

  # === 数据库（Postgres 16-alpine，REQ-28 与 dev 统一） ===
  # P1-7: Seata DB 存储模式需独立 seata 数据库。
  #   创建方式：挂载 init 脚本至 /docker-entrypoint-initdb.d/，例如：
  #     volumes:
  #       - ./deploy/config/init-seata-db.sql:/docker-entrypoint-initdb.d/init-seata-db.sql:ro
  #   init-seata-db.sql 内容：CREATE DATABASE seata;
  #   （也可由运维手动执行：psql -U <user> -c "CREATE DATABASE seata;"）
  postgres:
    image: postgres:16-alpine
    volumes: [pgdata:/var/lib/postgresql/data]
    expose: ['5432']
    environment:
      - POSTGRES_DB=nexuschain
      - POSTGRES_USER=${POSTGRES_USER:-CHANGE_ME_PG_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME_PG_PASS}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-CHANGE_ME_PG_USER} -d nexuschain']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  # === 缓存（Redis 7） ===
  # P2 加固：Redis 密码改为配置文件方式（--include /etc/redis/redis.conf）
  # 而非命令行 --requirepass，避免密码出现在进程参数（ps/inspect 可见）
  redis:
    image: redis:7-alpine
    expose: ['6379']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASS}
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed 's/__REDIS_PASSWORD_PLACEHOLDER__/'"$${REDIS_PASSWORD}"'/' /etc/redis/redis.conf.template > /tmp/redis.conf && \
        redis-server /tmp/redis.conf
    volumes:
      - ./deploy/config/redis.conf:/etc/redis/redis.conf.template:ro
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always

  # ==================== 监控 ====================
  prometheus:
    image: prom/prometheus:v2.50.0
    expose: ['9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: always

  grafana:
    image: grafana/grafana:10.4.0
    expose: ['3000']
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-CHANGE_ME_GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME_GRAFANA_PASS}
    volumes:
      - grafana-data:/var/lib/grafana
    restart: always

volumes:
  pgdata:
  nacos-logs:
  sentinel-logs:
  zk-groth16-setup:
  prometheus-data:
  grafana-data:
  # P0-1 Task 239: MPC 3 节点独立数据卷 + 共享证书卷
  mpc-engine-0-data:
  mpc-engine-1-data:
  mpc-engine-2-data:
  mpc-certs:
