version: '3.8'

# NexusChain 生产环境编排
# ============================================================================
# REQ-36 / T36：补全 16 个服务定义，解除生产部署阻断。
#
# 与 docker-compose.yml（dev）的差异：
#   1. 端口用 expose（不绑定宿主机），由前置负载均衡/Ingress 暴露
#   2. SPRING_PROFILES_ACTIVE=prod
#   3. 基础设施凭据**全部必填**（compose 的 required-with-error 形式）：未注入即直接报错退出。
#      2026-10-06 改动：原先是"没给就用 CHANGE_ME_* 占位默认值"——少设一个变量不会失败，
#      而是**用一份公开的占位口令把"生产"栈起来**（含 MPC_STORAGE_KEY 这份门限密钥
#      的落盘加密主钥）。现在改为 fail-closed，与本仓 JWTUtil.init() 的
#      "空值拒绝启动"同一口径。必填变量清单见 `.env.prod.example`（2026-10-12 起
#      数据库族改为 MySQL：POSTGRES_USER/POSTGRES_PASSWORD 由 MYSQL_* 取代）。
#   4. restart: always（生产自愈）
#   5. 2026-10-18（批次③）部署资产补全：全栈资源限额定档（deploy.resources.limits）；
#      healthcheck 补齐——mpc×3 与 zk 用 TCP 探针、prometheus/grafana 用 HTTP
#      探针（探针命令均在对应镜像实测通过）；nexus-core 补 restart: always；
#      sentinel 端口修正 8080→8858（与 helm/docs/服务端配置全仓约定对齐）；
#      redis 补 maxmemory 512mb（deploy/config/redis.conf，与容器限额联动）；
#      sentinel 健康探针留白（镜像工具链不可实测，见该服务注释）。
#
# 端口约定（与各服务 application.yml server.port 对齐）：
#   gateway:8080 / signing:8082 / wallet:8083 / bridge:8084 / api-gateway:8085
#   core:19585 / mpc:50051 / zk:50061(gRPC)+50062(HTTP)
#   nacos:8848 / sentinel:8858 / seata:8091+7091 / zipkin:9411
#   mysql:3306（业务库）/ postgres:5432（仅供 core）/ redis:6379 / prometheus:9090 / grafana:3000
# ============================================================================

services:
  # ==================== 应用服务 ====================
  nexus-gateway:
    # 2026-10-18：Java 模块构建上下文必须是 repo 根（Dockerfile 需根级 gradlew/
    # settings.gradle/build.gradle 解析 project() 依赖），此前指向模块目录会直接构建失败。
    build:
      context: .
      dockerfile: nexus-gateway/Dockerfile
    expose: ['8080']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 2026-10-12：DB 家族对齐 MySQL 8（原为 PostgreSQL，与 prod profile 的
      # db/migration-pg 一起构成"起不来"的组合：迁移冻结在 V17 而 ddl-auto=validate）。
      # 库名 = nexus_gateway（与 wallet 的 nexus_wallet 独立）。
      - NEX_DB_URL=jdbc:mysql://mysql:3306/nexus_gateway?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - NEX_DB_USERNAME=nexus_gateway
      - NEX_DB_PASSWORD=${MYSQL_PASSWORD:?prod 必需：禁止占位默认值}
      # 2026-10-18 补：JWT_SECRET 与 signing-service 共享（同一密钥跨服务验签）。
      # 此前 prod 面板未注入——JwtTokenProvider 会退化为进程内随机密钥
      # （不报错但跨服务鉴权必然失败），生产必须显式注入。
      - JWT_SECRET=${JWT_SECRET:?prod 必需：gateway/signing 共享 JWT 密钥（≥32 字节）}
      # 2026-10-26 参考交付口径（docs/deploy/reference-delivery-scope.md）：
      # 最小集交付不含 Kafka，而事件溯源/webhook 死信队列的代码默认都是 kafka
      # （KafkaEventStore / DeadLetterQueueService 均 matchIfMissing=true，
      #  L3 预演缺陷 #43 同款——helm 路径当时已兜底，compose 漏了）。
      # 显式 memory；接 Kafka 的部署把两个值改回 kafka。
      - NEXUS_EVENTSOURCING_STORE=memory
      - NEXUS_WEBHOOK_DLQ_STORE=memory
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    depends_on:
      nexus-core:
        condition: service_healthy
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy

  nexus-core:
    build:
      context: .
      dockerfile: nexus-core/Dockerfile
    expose: ['19585']
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:19585/height']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # 2026-10-18 批次③：补 restart——此前为全栈唯一缺失自愈策略的服务
    # （与文件头第 4 条声明不一致，core 挂掉后不会被拉起）。
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    environment:
      # 2026-10-12 更正：core **确实**需要关系库 —— 它没有 JPA/Flyway，但有 PG 方言的
      # JDBC 链存储（RDBMSBlockChainImpl + resources/ddl.sql，schema 用 bytea 与双引号
      # 标识符，见 ddl.sql）。故全栈 DB 族切 MySQL 时 **core 例外，仍用 PostgreSQL**：
      # 把 core 迁到 MySQL 需重写 ddl.sql（bytea→VARBINARY/BLOB）+ 核实 JDBC 读写路径，
      # 属独立批次（已在 CHANGELOG「未做」中列明）。
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexus_core
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-nexus}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?prod 必需：禁止占位默认值}
    depends_on:
      postgres:
        condition: service_healthy

  # === 签名服务（端口 8082，TCC 分布式事务） ===
  nexus-signing-service:
    build:
      context: .
      dockerfile: nexus-signing-service/Dockerfile
    expose: ['8082']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEX_NACOS_SERVER=nacos:8848
      - NEX_SEATA_SERVER=seata:8091
      - NEX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      # 2026-10-12：本服务无 prod profile（走 application.yml 默认，DB 默认即 MySQL），
      # 但默认值指向 `localhost:3306`（容器内=自身）⇒ 生产必须显式注入服务名。
      # 默认 URL 还带 requireSSL=true + classpath JKS 信任库，故此处整体覆盖为集群内连接
      # （客户若要求库连接 TLS，改这一行的 useSSL/sslMode 参数即可）。
      - NEX_DB_URL=jdbc:mysql://mysql:3306/nexus_signing?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - NEX_DB_USERNAME=nexus_signing
      - NEX_DB_PASSWORD=${MYSQL_PASSWORD:?prod 必需：禁止占位默认值}
      # #32：审批状态跨副本共享。审批请求的"创建"与"执行确认"是两次独立请求，经 LB 可能
      # 落到不同副本（Helm prod 为 nexus-signing-service.replicaCount=3）⇒ 若各副本只持有
      # 自己那份内存，pod A 建的审批在 B/C 查不到。DB 上面已接、JpaApprovalStore 早已实现，
      # 缺的就是这个开关。设为 jpa 后若 Repository 不可用，服务会**拒绝启动**而不是静默退回
      # 内存（本次同时把那条 fail-open 改成 fail-closed）。
      - NEX_APPROVAL_STORE_TYPE=jpa
      # P0-1 Task 239: MPC 多端点路由（逗号分隔的 host:port 列表）
      - NEX_MPC_ENGINE_ENDPOINTS=mpc-engine-0:50051,mpc-engine-1:50051,mpc-engine-2:50051
      # mTLS 证书路径（生产通过 Secret / 挂载卷注入）
      - NEX_MPC_ENGINE_TLS_TRUST_CERT=/etc/mpc/certs/ca/CA.pem
      - NEX_MPC_ENGINE_TLS_CLIENT_CERT=/etc/mpc/certs/node-A/cert.pem
      - NEX_MPC_ENGINE_TLS_CLIENT_KEY=/etc/mpc/certs/node-A/key.pem
      # === 2026-10-08：GG20 退役后本栈同为全分布式 CGGMP21（与 helm prod 同口径）===
      # 前置：三引擎以 PartyConfig 装配（scripts/gen-mpc-engine-configs.sh
      # --layout compose-prod 生成 ./mpc-certs/config-prod/nodeN.json，其中含
      # 份额落盘密钥）+ 每钱包跑过 DKG 仪式（scripts/mpc-wallet-ceremony.py）。
      - NEX_MPC_ENGINE_DISTRIBUTED=true
      - NEX_MPC_ENGINE_CGGMP_ENABLED=true
      - NEX_MPC_ENGINE_CGGMP_SIGNERS=0,1
      - NEX_MPC_ENGINE_CGGMP_DEADLINE_MS=300000
      - NEX_MPC_ENGINE_TLS_OVERRIDE_AUTHORITY=localhost
      # 2026-10-18 补：signing 调 mpc-engine（引擎侧 MPC_REQUIRE_AUTH=true）必须携带
      # 同一 token。此前 prod 面板只给引擎配了 MPC_AUTH_TOKEN，signing 侧为空
      # （MpcEngineRouter 仅告警）→ 冷钱包/签名路径会被引擎拒绝。与 engine 同值。
      - NEX_MPC_ENGINE_AUTH_TOKEN=${MPC_AUTH_TOKEN:?prod 必需：与 mpc-engine 的 MPC_AUTH_TOKEN 同值}
      # 2026-10-18 补：与 gateway 共享（跨服务 JWT 验签）。
      - JWT_SECRET=${JWT_SECRET:?prod 必需：与 gateway 共享（跨服务 JWT 验签）}
    volumes:
      - mpc-certs:/etc/mpc/certs:ro
    depends_on:
      nexus-core:
        condition: service_healthy
      mpc-engine-0:
        condition: service_started
      mpc-engine-1:
        condition: service_started
      mpc-engine-2:
        condition: service_started
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8082/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1280M

  # === 钱包管理服务（端口 8083，提现审批 TCC） ===
  nexus-wallet-service:
    build:
      context: .
      dockerfile: nexus-wallet-service/Dockerfile
    expose: ['8083']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEX_NACOS_SERVER=nacos:8848
      - NEX_SEATA_SERVER=seata:8091
      - NEX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      # 2026-10-12：DB 家族对齐 MySQL 8（原 PG + db/migration-pg 冻结在 V3，
      # 与 prod profile 的 ddl-auto=validate 组合会导致启动即失败：
      # missing table [wallet_audit_events]）。库名 nexus_wallet（与 gateway 独立）。
      - NEX_DB_URL=jdbc:mysql://mysql:3306/nexus_wallet?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - NEX_DB_USERNAME=nexus_wallet
      - NEX_DB_PASSWORD=${MYSQL_PASSWORD:?prod 必需：禁止占位默认值}
    depends_on:
      nexus-core:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8083/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1280M

  # === 桥接服务（端口 8084，REQ-29 修正：原 8082→8084） ===
  nexus-bridge:
    build:
      context: .
      dockerfile: nexus-bridge/Dockerfile
    expose: ['8084']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 2026-10-12：同 signing-service —— 无 prod profile、默认 URL 指向 localhost，
      # 此处显式注入服务名与库；默认 URL 的 requireSSL + JKS 信任库一并覆盖。
      - NEX_DB_URL=jdbc:mysql://mysql:3306/nexus_bridge?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - NEX_DB_USERNAME=nexus_bridge
      - NEX_DB_PASSWORD=${MYSQL_PASSWORD:?prod 必需：禁止占位默认值}
    depends_on:
      nexus-core:
        condition: service_healthy
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8084/api/v1/bridge/status']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # === API 网关（端口 8085，统一入口 Spring Cloud Gateway） ===
  nexus-api-gateway:
    build:
      context: .
      dockerfile: nexus-api-gateway/Dockerfile
    expose: ['8085']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEX_REDIS_HOST=redis
      - NEX_REDIS_PORT=6379
    depends_on:
      nexus-gateway:
        condition: service_healthy
      nexus-bridge:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8085/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # === 区块浏览器（对外展示面，端口 3000） ===
  # 2026-10-12 新增。单容器：Express BFF 同源托管前端产物 + /api/** 查询接口
  # （见 nexus-explorer/Dockerfile；前端 API 基址编译期留空 → 相对路径，无需跨源配置）。
  # 需要 repo 根上下文（COPY nexus-explorer/ 的两个 workspace）。
  nexus-explorer:
    build:
      context: .
      dockerfile: nexus-explorer/Dockerfile
    expose: ['3000']
    environment:
      # 容器内 core 的地址是服务名；缺省 localhost:19585 会指向容器自身 → 全部查询 500
      - NEXUS_RPC_URL=http://nexus-core:19585/rpc
    depends_on:
      nexus-core:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ==================== 密码学服务 ====================
  # === MPC 引擎（Rust，gRPC 50051，3 节点分散式部署） ===
  # P0-1 Task 239：从单节点升级为 3 节点分散式（2-of-3 阈值签名）
  #   mpc-engine-0 → party_index=0, 证书 node-A
  #   mpc-engine-1 → party_index=1, 证书 node-B
  #   mpc-engine-2 → party_index=2, 证书 node-C
  # 三节点共享 nexus-net 网络，通过服务名互连
  mpc-engine-0:
    # 构建上下文 = 仓库根（同 docker-compose.yml 的说明：Dockerfile 依赖
    # /app/mpc-engine 路径布局；context 给子目录会构建失败）
    build:
      context: .
      dockerfile: mpc-engine/Dockerfile
    expose: ['50051']
    environment:
      - RUST_LOG=info
      - MPC_ENGINE_HOST=0.0.0.0
      - MPC_ENGINE_PORT=50051
      - MPC_PARTY_INDEX=0
      - MPC_PARTY_ID=party-0
      - MPC_PEERS=party-1@mpc-engine-1:50051,party-2@mpc-engine-2:50051
      - MPC_STORAGE_KEY=${MPC_STORAGE_KEY:?prod 必需：禁止占位默认值}
      - MPC_AUTH_TOKEN=${MPC_AUTH_TOKEN:?prod 必需：禁止占位默认值}
      - MPC_REQUIRE_AUTH=true
      # 2026-10-08：PartyConfig 为唯一装配源（真 mTLS + 身份/peers）；
      # 份额落盘到 /app/data/sessions（持久卷；不设则 keygen 产出只在内存）。
      - MPC_CONFIG_PATH=/app/config/node.json
      - MPC_ENGINE_SESSION_DIR=/app/data/sessions
    volumes:
      - ./mpc-certs/config-prod/node0.json:/app/config/node.json:ro
      - mpc-certs:/etc/mpc/certs:ro
      - mpc-engine-0-data:/app/data
    depends_on:
      nexus-core:
        condition: service_healthy
    healthcheck:
      # 2026-10-18 批次③：Rust 引擎无 HTTP 探针；TCP 连通性探针（运行阶段
      # 基础镜像 debian:trixie-slim 含 bash，/dev/tcp 机制已实测）。
      # 依赖关系保持 service_started（就绪语义含 DKG 仪式，非 TCP 可表达；
      # 探针用于容器健康可视化与运维排障）。
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/50051"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  mpc-engine-1:
    # 构建上下文 = 仓库根（同 docker-compose.yml 的说明：Dockerfile 依赖
    # /app/mpc-engine 路径布局；context 给子目录会构建失败）
    build:
      context: .
      dockerfile: mpc-engine/Dockerfile
    expose: ['50051']
    environment:
      - RUST_LOG=info
      - MPC_ENGINE_HOST=0.0.0.0
      - MPC_ENGINE_PORT=50051
      - MPC_PARTY_INDEX=1
      - MPC_PARTY_ID=party-1
      - MPC_PEERS=party-0@mpc-engine-0:50051,party-2@mpc-engine-2:50051
      - MPC_STORAGE_KEY=${MPC_STORAGE_KEY:?prod 必需：禁止占位默认值}
      - MPC_AUTH_TOKEN=${MPC_AUTH_TOKEN:?prod 必需：禁止占位默认值}
      - MPC_REQUIRE_AUTH=true
      # 2026-10-08：PartyConfig 为唯一装配源（真 mTLS + 身份/peers）；
      # 份额落盘到 /app/data/sessions（持久卷；不设则 keygen 产出只在内存）。
      - MPC_CONFIG_PATH=/app/config/node.json
      - MPC_ENGINE_SESSION_DIR=/app/data/sessions
    volumes:
      - ./mpc-certs/config-prod/node1.json:/app/config/node.json:ro
      - mpc-certs:/etc/mpc/certs:ro
      - mpc-engine-1-data:/app/data
    depends_on:
      nexus-core:
        condition: service_healthy
    healthcheck:
      # 2026-10-18 批次③：同 mpc-engine-0（TCP 探针 + 依赖语义说明）。
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/50051"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  mpc-engine-2:
    # 构建上下文 = 仓库根（同 docker-compose.yml 的说明：Dockerfile 依赖
    # /app/mpc-engine 路径布局；context 给子目录会构建失败）
    build:
      context: .
      dockerfile: mpc-engine/Dockerfile
    expose: ['50051']
    environment:
      - RUST_LOG=info
      - MPC_ENGINE_HOST=0.0.0.0
      - MPC_ENGINE_PORT=50051
      - MPC_PARTY_INDEX=2
      - MPC_PARTY_ID=party-2
      - MPC_PEERS=party-0@mpc-engine-0:50051,party-1@mpc-engine-1:50051
      - MPC_STORAGE_KEY=${MPC_STORAGE_KEY:?prod 必需：禁止占位默认值}
      - MPC_AUTH_TOKEN=${MPC_AUTH_TOKEN:?prod 必需：禁止占位默认值}
      - MPC_REQUIRE_AUTH=true
      # 2026-10-08：PartyConfig 为唯一装配源（真 mTLS + 身份/peers）；
      # 份额落盘到 /app/data/sessions（持久卷；不设则 keygen 产出只在内存）。
      - MPC_CONFIG_PATH=/app/config/node.json
      - MPC_ENGINE_SESSION_DIR=/app/data/sessions
    volumes:
      - ./mpc-certs/config-prod/node2.json:/app/config/node.json:ro
      - mpc-certs:/etc/mpc/certs:ro
      - mpc-engine-2-data:/app/data
    depends_on:
      nexus-core:
        condition: service_healthy
    healthcheck:
      # 2026-10-18 批次③：同 mpc-engine-0（TCP 探针 + 依赖语义说明）。
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/50051"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # === ZK Groth16 验证服务（Rust，gRPC 50061 + HTTP 50062） ===
  zk-groth16-service:
    build:
      context: .
      dockerfile: zk-groth16-service/Dockerfile
    expose: ['50061', '50062']
    environment:
      - ZK_SERVICE_PORT=50061
      - ZK_HTTP_PORT=50062
      - GROTH16_SETUP_DIR=/setup
    volumes:
      - zk-groth16-setup:/setup
    depends_on:
      mpc-engine-0:
        condition: service_started
      mpc-engine-1:
        condition: service_started
      mpc-engine-2:
        condition: service_started
    healthcheck:
      # 2026-10-18 批次③：TCP 连通性探针（debian:trixie-slim 含 bash，已实测）；
      # gRPC 无 HTTP 健康面，可达性探针表达"进程在跑"（就绪语义依赖 setup 卷，
      # 非 TCP 可表达）。
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/50061"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # ==================== 基础设施 ====================
  # === 服务发现 + 配置中心（Nacos 2.3.2） ===
  # REQ-36/T36.4: prod 认证开启，凭据用占位符外部化注入
  # P1-8: 生产环境建议部署 Nacos 集群（至少 3 节点）+ MySQL 后端存储
  # 当前为 standalone 单点模式，仅适用于开发/测试
  # 集群部署参考：https://nacos.io/zh-cn/docs/cluster-mode-quick-start.html
  # 集群配置示例（注释形式，按需取消注释并调整）：
  # nacos-1:
  #   image: nacos/nacos-server:v3.1.2
  #   environment:
  #     - MODE=cluster
  #     - NACOS_SERVERS=nacos-1:8848 nacos-2:8848 nacos-3:8848
  #     - SPRING_DATASOURCE_PLATFORM=mysql
  #     - MYSQL_SERVICE_HOST=postgres
  #     - MYSQL_SERVICE_PORT=5432
  #     - MYSQL_SERVICE_DB_NAME=nacos
  #   ...
  nacos:
    image: nacos/nacos-server:v3.1.2
    container_name: nexus-nacos-prod
    expose: ['8848', '9848']
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
      # prod 认证开启（凭据通过环境变量注入，禁止硬编码）
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:?prod 必需：禁止占位默认值}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:?prod 必需：禁止占位默认值}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?prod 必需：禁止占位默认值}
      - NACOS_USERNAME=${NACOS_USERNAME:?prod 必需：禁止占位默认值}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?prod 必需：禁止占位默认值}
    volumes:
      - nacos-logs:/home/nacos/logs
    healthcheck:
      # CI 审计修复：Nacos 3.x v1 readiness 端点已移除（410 Gone）——
      # 实测 3.1.2 可用就绪探针为 admin API /nacos/v3/admin/core/state（200）
      test: ['CMD', 'curl', '-f', 'http://localhost:8848/nacos/v3/admin/core/state']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M

  # === 分布式事务协调器（Seata 2.5.0） ===
  # REQ-36/T36.4: 配置加密 key 用占位符
  seata:
    # L3 缺陷 #14：官方 apache/seata-server 镜像不含 MySQL 驱动，STORE_MODE=db
    # 会因缺 lib/jdbc 直接启动失败（caused-by: cannot find jdbc folder）。
    # 统一改用本仓封装镜像（deploy/seata/Dockerfile 把驱动放入 /lib/jdbc/）。
    image: nexuschain/seata-server:2.5.0-mysqldrv
    build:
      context: ./deploy/seata
    container_name: nexus-seata-prod
    expose: ['8091', '7091']
    environment:
      - SEATA_PORT=8091
      - STORE_MODE=db
      # P1-7: 生产环境使用 DB 存储事务日志（替代 file 模式，避免单点丢失）
      # 2026-10-12：随全栈 DB 家族对齐改为 MySQL（原 PostgreSQL 驱动 +
      # jdbc:postgresql://postgres:5432/seata）。Seata 2.x 的 db 模式首次启动会自动
      # 执行其内置 mysql 建表脚本（global_table/branch_table/lock_table/distributed_lock），
      # 故只需保证 seata 库存在（见 deploy/config/init-mysql-dbs.sql）。
      - SEATA_STORE_DB_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SEATA_STORE_DB_URL=jdbc:mysql://mysql:3306/seata?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SEATA_STORE_DB_USER=${MYSQL_USER:-nexus}
      - SEATA_STORE_DB_PASSWORD=${MYSQL_PASSWORD:?prod 必需：禁止占位默认值}
      - SEATA_REGISTRY_NAME=nacos
      - SEATA_REGISTRY_NACOS_SERVER_ADDR=nacos:8848
      - SEATA_REGISTRY_NACOS_NAMESPACE=prod
      - SEATA_REGISTRY_NACOS_GROUP=SEATA_GROUP
      - SEATA_REGISTRY_NACOS_CLUSTER_NAME=default
      - SEATA_CONFIG_NAME=nacos
      - SEATA_CONFIG_NACOS_SERVER_ADDR=nacos:8848
      - SEATA_CONFIG_NACOS_NAMESPACE=prod
      - SEATA_CONFIG_NACOS_GROUP=SEATA_GROUP
      # 配置加密 key（占位符外部化）
      - SEATA_CONFIG_KEY=${SEATA_CONFIG_KEY:?prod 必需：禁止占位默认值}
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/8091"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          # 官方镜像默认 JVM：-Xmx/-Xms 2048m + MaxDirectMemorySize 1024m +
          # MaxMetaspaceSize 256m（/seata-setup.sh 实测确认；JVM_XMX /
          # JVM_MaxDirectMemorySize 环境变量可调），限额定 4g 覆盖
          # 堆+直连内存+元空间+栈。客户下调 JVM 参数时可同步收紧。
          cpus: '2.0'
          memory: 4096M

  # === 链路追踪（Zipkin 3.4） ===
  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: nexus-zipkin-prod
    expose: ['9411']
    environment:
      - STORAGE_TYPE=mem
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/9411"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # === 熔断/限流控制台（Sentinel Dashboard 1.8.8） ===
  # REQ-36/T36.4: 凭据用占位符外部化
  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: nexus-sentinel-prod
    expose: ['8858']
    # 2026-10-18 批次③：端口修正——此前 JAVA_OPTS 把 dashboard 压到 8080，
    # 而 expose 与 helm（deploy/helm/values.yaml）、docs（k8s-deployment.md）、
    # 四个服务的 NEX_SENTINEL_SERVER 全仓约定均为 8858，构成监听端口与
    # 其他工件不一致的既有缺陷；此处对齐 8858（单一事实 = 8858）。
    environment:
      - JAVA_OPTS=-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=nexus-sentinel-dashboard
      # Sentinel Dashboard 登录凭据（占位符外部化，禁止默认 nacos/nacos）
      - SENTINEL_USERNAME=${SENTINEL_USERNAME:?prod 必需：禁止占位默认值}
      - SENTINEL_PASSWORD=${SENTINEL_PASSWORD:?prod 必需：禁止占位默认值}
    volumes:
      - sentinel-logs:/root/logs
    depends_on:
      nacos:
        condition: service_healthy
    # healthcheck 留白（2026-10-18 批次③核查）：镜像 bladex/sentinel-dashboard:1.8.8
    # 不在本环境镜像源白名单内、工具链（bash/wget）无法实测；为避免假死探针
    # 影响 service_healthy 使用方，待可实测环境补 TCP(8858) 探针。
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # === PostgreSQL 16（**仅供 core**：链状态 JDBC 存储为 PG 方言，见 core 段注释） ===
  # 业务库（gateway/wallet/signing/bridge/seata/Nacos）已全部切到下面的 MySQL。
  # core 的 DB 迁移（ddl.sql bytea → MySQL 类型）为独立批次，完成前保留此服务。
  postgres:
    image: postgres:16-alpine
    volumes: [pgdata:/var/lib/postgresql/data]
    expose: ['5432']
    environment:
      - POSTGRES_DB=nexus_core
      - POSTGRES_USER=${POSTGRES_USER:?prod 必需：禁止占位默认值}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?prod 必需：禁止占位默认值}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:?prod 必需：禁止占位默认值} -d nexus_core']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # === 数据库（MySQL 8.0，业务库；2026-10-12 由 PostgreSQL 16 切换而来） ===
  # 为什么切：① ADR-033（2026-10-03 Accepted）定的是 **OceanBase（MySQL 模式）** 方向，
  #   全仓唯一被维护的迁移集是 `db/migration`（MySQL 方言，gateway V1..V96）；
  #   ② bridge / signing-service 的默认数据源本来就是 MySQL，只有 gateway/wallet
  #   的 prod profile 还指向 PG——那套 `db/migration-pg` 冻结在 V17/V3 且配
  #   ddl-auto=validate ⇒ 该 profile 在 PG 上**启动即失败**（缺表/缺列）；
  #   ③ CI 的 MySQL 用例用的是 mysql:8.0，与本地安装预演同版本。
  # 客户若使用 OceanBase（MySQL 模式），把各服务 NEX_DB_URL 指过去即可（同族方言）。
  #
  # 初始化：四个业务库 + seata 库由 init 脚本建（幂等；seata 的**表**由 Seata 自己建）。
  #   挂载 deploy/config/init-mysql-dbs.sql 到 /docker-entrypoint-initdb.d/。
  mysql:
    image: mysql:8.0
    volumes:
      - mysqldata:/var/lib/mysql
      # initdb 脚本只在**数据目录为空**时执行一次（named volume 首次创建时）；
      # 客户自建实例可手工执行同一份脚本（见文件头注释）
      - ./deploy/config/init-mysql-dbs.sh:/docker-entrypoint-initdb.d/init-mysql-dbs.sh:ro
    expose: ['3306']
    command:
      # utf8mb4：中文/emoji 与审计明细文本必须；时区固定 UTC 与 NEX_DB_URL 的 serverTimezone 对齐
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?prod 必需：禁止占位默认值}
      # 业务账号：各库专用账号由 init 脚本按库授权（nexus_gateway / nexus_wallet /
      # nexus_signing / nexus_bridge）；此处只建一个通用账号供 seata 与运维使用
      - MYSQL_USER=${MYSQL_USER:-nexus}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?prod 必需：禁止占位默认值}
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # === 缓存（Redis 7） ===
  # P2 加固：Redis 密码改为配置文件方式（--include /etc/redis/redis.conf）
  # 而非命令行 --requirepass，避免密码出现在进程参数（ps/inspect 可见）
  redis:
    image: redis:7-alpine
    expose: ['6379']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?prod 必需：禁止占位默认值}
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed 's/__REDIS_PASSWORD_PLACEHOLDER__/'"$${REDIS_PASSWORD}"'/' /etc/redis/redis.conf.template > /tmp/redis.conf && \
        redis-server /tmp/redis.conf
    volumes:
      - ./deploy/config/redis.conf:/etc/redis/redis.conf.template:ro
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  # ==================== 监控 ====================
  prometheus:
    image: prom/prometheus:v2.50.0
    expose: ['9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      # 2026-10-18 批次③：镜像（busybox 基座）自带 wget，/-/healthy 探针已在
      # prom/prometheus:v2.50.0 上实测（exec 形 exit=0、端到端 healthy）。
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  grafana:
    image: grafana/grafana:10.4.0
    expose: ['3000']
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?prod 必需：禁止占位默认值}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?prod 必需：禁止占位默认值}
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      # 2026-10-18 批次③：镜像自带 busybox wget，/api/health 探针已在
      # grafana/grafana:10.4.0 上实测（exec 形 exit=0、端到端 healthy）。
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  # pgdata：core 专用（链状态 PG）；mysqldata：业务库 MySQL（2026-10-12 新增）
  pgdata:
  mysqldata:
  nacos-logs:
  sentinel-logs:
  zk-groth16-setup:
  prometheus-data:
  grafana-data:
  # P0-1 Task 239: MPC 3 节点独立数据卷 + 共享证书卷
  mpc-engine-0-data:
  mpc-engine-1-data:
  mpc-engine-2-data:
  mpc-certs:
