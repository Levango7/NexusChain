version: '3.8'

# NexusChain 生产环境编排
# ============================================================================
# REQ-36 / T36：补全 16 个服务定义，解除生产部署阻断。
#
# 与 docker-compose.yml（dev）的差异：
#   1. 端口用 expose（不绑定宿主机），由前置负载均衡/Ingress 暴露
#   2. SPRING_PROFILES_ACTIVE=prod
#   3. 基础设施凭据用占位符（CHANGE_ME_*），外部化注入
#   4. restart: always（生产自愈）
#
# 端口约定（与各服务 application.yml server.port 对齐）：
#   gateway:8080 / signing:8082 / wallet:8083 / bridge:8084 / api-gateway:8085
#   core:19585 / mpc:50051 / zk:50061(gRPC)+50062(HTTP)
#   nacos:8848 / sentinel:8858 / seata:8091+7091 / zipkin:9411
#   postgres:5432 / redis:6379 / prometheus:9090 / grafana:3000
# ============================================================================

services:
  # ==================== 应用服务 ====================
  nexus-gateway:
    build: ./nexus-gateway
    expose: ['8080']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    depends_on:
      nexus-core:
        condition: service_healthy
      nacos:
        condition: service_healthy

  nexus-core:
    build: ./nexus-core
    expose: ['19585']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:19585/height']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # === 签名服务（端口 8082，TCC 分布式事务） ===
  nexus-signing-service:
    build: ./nexus-signing-service
    expose: ['8082']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEX_NACOS_SERVER=nacos:8848
      - NEX_SEATA_SERVER=seata:8091
      - NEX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      nexus-core:
        condition: service_healthy
      mpc-engine:
        condition: service_started
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8082/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # === 钱包管理服务（端口 8083，提现审批 TCC） ===
  nexus-wallet-service:
    build: ./nexus-wallet-service
    expose: ['8083']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEX_NACOS_SERVER=nacos:8848
      - NEX_SEATA_SERVER=seata:8091
      - NEX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      nexus-core:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8083/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # === 桥接服务（端口 8084，REQ-29 修正：原 8082→8084） ===
  nexus-bridge:
    build: ./nexus-bridge
    expose: ['8084']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      nexus-core:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8084/api/v1/bridge/status']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  # === API 网关（端口 8085，统一入口 Spring Cloud Gateway） ===
  nexus-api-gateway:
    build: ./nexus-api-gateway
    expose: ['8085']
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEX_REDIS_HOST=redis
      - NEX_REDIS_PORT=6379
    depends_on:
      nexus-gateway:
        condition: service_healthy
      nexus-bridge:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8085/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # ==================== 密码学服务 ====================
  # === MPC 引擎（Rust，gRPC 50051） ===
  mpc-engine:
    build: ./mpc-engine
    expose: ['50051']
    environment:
      - RUST_LOG=info
      - MPC_ENGINE_HOST=0.0.0.0
      - MPC_ENGINE_PORT=50051
    depends_on:
      nexus-core:
        condition: service_healthy
    restart: always

  # === ZK Groth16 验证服务（Rust，gRPC 50061 + HTTP 50062） ===
  zk-groth16-service:
    build: ./zk-groth16-service
    expose: ['50061', '50062']
    environment:
      - ZK_SERVICE_PORT=50061
      - ZK_HTTP_PORT=50062
      - GROTH16_SETUP_DIR=/setup
    volumes:
      - zk-groth16-setup:/setup
    depends_on:
      mpc-engine:
        condition: service_started
    restart: always

  # ==================== 基础设施 ====================
  # === 服务发现 + 配置中心（Nacos 2.3.2） ===
  # REQ-36/T36.4: prod 认证开启，凭据用占位符外部化注入
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nexus-nacos-prod
    expose: ['8848', '9848']
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
      # prod 认证开启（凭据通过环境变量注入，禁止硬编码）
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-CHANGE_ME_NACOS_KEY}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-CHANGE_ME_NACOS_VALUE}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-CHANGE_ME_NACOS_TOKEN}
      - NACOS_USERNAME=${NACOS_USERNAME:-CHANGE_ME_NACOS_USER}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-CHANGE_ME_NACOS_PASS}
    volumes:
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8848/nacos/v1/console/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # === 分布式事务协调器（Seata 2.0.0） ===
  # REQ-36/T36.4: 配置加密 key 用占位符
  seata:
    image: seataio/seata-server:2.0.0
    container_name: nexus-seata-prod
    expose: ['8091', '7091']
    environment:
      - SEATA_PORT=8091
      - STORE_MODE=file
      - SEATA_REGISTRY_NAME=nacos
      - SEATA_REGISTRY_NACOS_SERVER_ADDR=nacos:8848
      - SEATA_REGISTRY_NACOS_NAMESPACE=prod
      - SEATA_REGISTRY_NACOS_GROUP=SEATA_GROUP
      - SEATA_REGISTRY_NACOS_CLUSTER_NAME=default
      - SEATA_CONFIG_NAME=nacos
      - SEATA_CONFIG_NACOS_SERVER_ADDR=nacos:8848
      - SEATA_CONFIG_NACOS_NAMESPACE=prod
      - SEATA_CONFIG_NACOS_GROUP=SEATA_GROUP
      # 配置加密 key（占位符外部化）
      - SEATA_CONFIG_KEY=${SEATA_CONFIG_KEY:-CHANGE_ME_SEATA_KEY}
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7091/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # === 链路追踪（Zipkin 3.4） ===
  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: nexus-zipkin-prod
    expose: ['9411']
    environment:
      - STORAGE_TYPE=mem
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9411/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

  # === 熔断/限流控制台（Sentinel Dashboard 1.8.8） ===
  # REQ-36/T36.4: 凭据用占位符外部化
  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: nexus-sentinel-prod
    expose: ['8858']
    environment:
      - JAVA_OPTS=-Dserver.port=8080 -Dcsp.sentinel.dashboard.server=localhost:8080 -Dproject.name=nexus-sentinel-dashboard
      # Sentinel Dashboard 登录凭据（占位符外部化，禁止默认 nacos/nacos）
      - SENTINEL_USERNAME=${SENTINEL_USERNAME:-CHANGE_ME_SENTINEL_USER}
      - SENTINEL_PASSWORD=${SENTINEL_PASSWORD:-CHANGE_ME_SENTINEL_PASS}
    volumes:
      - sentinel-logs:/root/logs
    depends_on:
      nacos:
        condition: service_healthy
    restart: always

  # === 数据库（Postgres 16-alpine，REQ-28 与 dev 统一） ===
  postgres:
    image: postgres:16-alpine
    volumes: [pgdata:/var/lib/postgresql/data]
    expose: ['5432']
    environment:
      - POSTGRES_DB=nexuschain
      - POSTGRES_USER=${POSTGRES_USER:-CHANGE_ME_PG_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME_PG_PASS}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-CHANGE_ME_PG_USER} -d nexuschain']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  # === 缓存（Redis 7） ===
  redis:
    image: redis:7-alpine
    expose: ['6379']
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASS}']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASS}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always

  # ==================== 监控 ====================
  prometheus:
    image: prom/prometheus:v2.50.0
    expose: ['9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: always

  grafana:
    image: grafana/grafana:10.4.0
    expose: ['3000']
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-CHANGE_ME_GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME_GRAFANA_PASS}
    volumes:
      - grafana-data:/var/lib/grafana
    restart: always

volumes:
  pgdata:
  nacos-logs:
  sentinel-logs:
  zk-groth16-setup:
  prometheus-data:
  grafana-data:
