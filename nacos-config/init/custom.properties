# Nacos Server 扩展配置（开发环境）
# 
# 本文件由 docker-compose.yml 挂载至 /home/nacos/init.d/custom.properties，
# Nacos 启动时自动加载，作为 Spring 配置扩展覆盖默认值。
# 
# 开发环境约定：
#   - 关闭鉴权（方便调试；生产环境必须开启）
#   - 关闭权限校验
#   - standalone 模式（由 docker-compose MODE=standalone 控制）

# === 鉴权（开发环境关闭）===
nacos.core.auth.enabled=false
nacos.core.auth.system.type=nacos
nacos.core.auth.plugin.nacos.token.cache.enable=false
nacos.core.auth.plugin.nacos.token.expire.seconds=18000

# === 控制台 ===
nacos.console.ui.enabled=true