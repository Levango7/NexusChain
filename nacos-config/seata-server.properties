# =============================================================================
# Seata Server 2.0.0 Nacos 配置
#
# 发布至 Nacos：
#   dataId : seataServer.properties
#   group  : SEATA_GROUP
#   type   : properties
#   namespace : dev / test / prod
#
# 设计文档 §3.1.3 Seata Server 部署需求 / §4.2.1 Seata Server 部署
#
# 说明：
#   - 开发环境：store.mode=file（内嵌存储，无需 MySQL），见文末注释
#   - 生产环境：store.mode=db（MySQL 持久化，需先执行 seata-server-db.sql 建表）
#   - 事务组 nexus-tx-group 为 NexusChain 所有微服务统一事务组
# =============================================================================

# === 事务组映射（Seata Server 侧） ===
# service.vgroup-mapping.{事务组名}={集群名}
# nexus-tx-group 映射到 default 集群（Seata Server 注册到 Nacos 的 cluster 名）
service.vgroup-mapping.nexus-tx-group=default

# === 存储模式 ===
# 生产环境：db（MySQL 持久化）
# 开发环境：file（内嵌存储，注释掉 store.mode=db 及 store.db.* 配置，启用 store.mode=file）
store.mode=db
store.lock.mode=db
store.session.mode=db

# === DB 存储（MySQL） ===
# 数据库连接（复用 Nacos 的 MySQL 或独立 MySQL，需先执行 seata-server-db.sql 建表）
store.db.datasource=druid
store.db.dbType=mysql
store.db.driverClassName=com.mysql.cj.jdbc.Driver
store.db.url=jdbc:mysql://mysql:3306/seata?useUnicode=true&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai
store.db.user=${SEATA_DB_USER:CHANGE_ME_SEATA_DB_USER}
store.db.password=${SEATA_DB_PASSWORD:CHANGE_ME_SEATA_DB_PASS}
store.db.minConn=5
store.db.maxConn=30
store.db.globalTable=global_table
store.db.branchTable=branch_table
store.db.distributedLockTable=distributed_lock
store.db.queryLimit=100
store.db.maxWait=5000

# === Server 超时 / 重试 ===
server.session.timeout=60000
server.session.retryDeadThreshold=130000
server.rollbackRetryTimeout=5000
server.rollbackRetryMax=3
server.maxCommitRetryTimeout=5000
server.maxRollbackRetryTimeout=5000
server.rollbackStatusUnretryPeriod=120000
server.enableCheckAuth=true
server.enableParallelRequest=true
server.applicationDataLimit=64000
server.applicationDataLimitCheck=true

# === XA 模式 ===
server.xaerNotaRetryTimeout=10000

# === metrics（Prometheus） ===
metrics.enabled=true
metrics.registryType=compact
metrics.exporterType=prometheus
metrics.exporterPrometheusPort=9898

# === 开发环境 file 模式配置（取消注释切换） ===
# store.mode=file
# store.lock.mode=file
# store.session.mode=file