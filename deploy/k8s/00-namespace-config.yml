apiVersion: v1
kind: Namespace
metadata:
  name: nexus
  labels:
    app.kubernetes.io/part-of: nexus
    # NetworkPolicy 基线（60-networkpolicy.yml）依赖此标签做 default-deny
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/nexus_gateway"
  SPRING_REDIS_HOST: "redis"
  NEXUS_CHAIN_RPC_URL: "http://nexus-core-0.nexus-core:19585"
  NEXUS_WALLET_BASE_URL: "http://nexus-gateway:8080"
---
# ⚠️ Secret 硬化须知（生产必读）：
# 1. 下方 stringData 仅为仓库占位模板，明文提交属正常脚手架做法，
#    但部署前 MUST 用真实值覆盖（推荐用 sealed-secrets / external-secrets /
#    SOPS 注入，而非把明文留在 git）。
# 2. NEX_MASTER_KEY 必须是 32 字节 BASE64（AES-256），CHANGE_ME_* 仅为占位。
# 3. 本命名空间内所有业务 Pod 已设 automountServiceAccountToken: false，
#    不依赖 K8s API，故 Secret 仅以 env 注入，不挂 projected token。
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: nexus
type: Opaque
stringData:
  NEX_DB_USERNAME: "nexus"
  NEX_DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  NEX_MASTER_KEY: "BASE64_ENCODED_32_BYTE_AES_KEY_HERE"
  NEX_WEBHOOK_SECRET: "CHANGE_ME_WEBHOOK_SECRET"
