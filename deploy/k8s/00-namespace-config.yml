apiVersion: v1
kind: Namespace
metadata:
  name: nexus
  labels:
    app.kubernetes.io/part-of: nexus
    # NetworkPolicy 基线（60-networkpolicy.yml）依赖此标签做 default-deny
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus
data:
  SPRING_PROFILES_ACTIVE: "prod"
  # 2026-10-12：**移除** SPRING_DATASOURCE_URL —— 该 ConfigMap 被多个服务 envFrom 注入，
  # 写死一个库名会让 wallet/bridge/signing 全部连到 nexus_gateway 库（Hibernate validate 必炸）。
  # 各服务改用自身 application-prod.yml / application.yml 的默认值
  # （jdbc:mysql://mysql:3306/<本服务库>?…），需要覆盖时由运维按服务单独注入 NEX_DB_URL。
  SPRING_REDIS_HOST: "redis"
  # L3 预演复验缺陷 #46：键名与应用读取的占位符必须逐字一致——
  # 应用侧 application.yml 是 ${NEX_CHAIN_RPC_URL:...}（NEX_ 前缀），
  # 此前误写 NEXUS_CHAIN_RPC_URL → 恒回落 localhost:19585 → chainNode 健康项
  # DOWN → /actuator/health 503 → liveness 反复杀 Pod。
  NEX_CHAIN_RPC_URL: "http://nexus-core-0.nexus-core:19585"
  # 注：应用侧 nexus.exchange-wallet.base-url 目前**没有** env 占位符
  # （硬编码 localhost:8081），此键暂无消费者；待该属性环境变量化后启用。
  # NEXUS_WALLET_BASE_URL: "http://nexus-gateway:8080"
---
# ⚠️ Secret 硬化须知（生产必读）：
# 1. 下方 stringData 仅为仓库占位模板，明文提交属正常脚手架做法，
#    但部署前 MUST 用真实值覆盖（推荐用 sealed-secrets / external-secrets /
#    SOPS 注入，而非把明文留在 git）。
# 2. NEX_MASTER_KEY 必须是 32 字节 BASE64（AES-256），CHANGE_ME_* 仅为占位。
# 3. 本命名空间内所有业务 Pod 已设 automountServiceAccountToken: false，
#    不依赖 K8s API，故 Secret 仅以 env 注入，不挂 projected token。
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: nexus
type: Opaque
stringData:
  NEX_DB_USERNAME: "nexus"
  NEX_DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  NEX_MASTER_KEY: "BASE64_ENCODED_32_BYTE_AES_KEY_HERE"
  NEX_WEBHOOK_SECRET: "CHANGE_ME_WEBHOOK_SECRET"
  # Nacos 鉴权三键（2026-10-13 L3 预演补：nacos-ha-statefulset 的启动脚本**强制校验**
  # 它们非空，缺任一容器 exit 255；NACOS_AUTH_TOKEN 须为 **Base64** 字符串）
  NACOS_AUTH_TOKEN: "CHANGE_ME_BASE64_32BYTE_KEY"
  NACOS_AUTH_IDENTITY_KEY: "CHANGE_ME_NACOS_IDENTITY_KEY"
  NACOS_AUTH_IDENTITY_VALUE: "CHANGE_ME_NACOS_IDENTITY_VALUE"
  # 审计修复：Redis 启用 requirepass（30-infrastructure.yml）。
  # 所有业务 Pod 经 envFrom: nexus-secrets 自动获得该变量，
  # Spring Data Redis 按 SPRING_DATA_REDIS_PASSWORD 读取认证。
  SPRING_DATA_REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  # API Gateway 商户 API Key 白名单（2026-10-13 L3 预演缺陷 #18：api-gateway 的
  # ${NEX_API_KEYS} 无默认值，chart envFrom nexus-secrets 注入；缺失则启动即
  # PlaceholderResolutionException。逗号分隔）。
  NEX_API_KEYS: "CHANGE_ME_MERCHANT_API_KEYS_COMMA_SEPARATED"
  # Nacos 客户端凭据（2026-10-13 L3 预演缺陷 #23：nacos.core.auth.enabled=true 后
  # 应用注册/配置拉取必须带用户名密码——应用侧读 NEX_NACOS_USERNAME/NEX_NACOS_PASSWORD
  # （见各服务 application.yml 的 spring.cloud.nacos.*.username/password）。
  # 服务端用户初始化：Nacos 3.x 空用户表时用控制台/API `POST /nacos/v3/auth/user/admin`
  # （返回自动生成的初始口令），再把口令填到这里。空值 = 401 User not found）。
  NEX_NACOS_USERNAME: "CHANGE_ME_NACOS_CLIENT_USER"
  NEX_NACOS_PASSWORD: "CHANGE_ME_NACOS_CLIENT_PASSWORD"
  # API Gateway HMAC 签名密钥（2026-10-14 L3 复验缺陷：api-gateway 的
  # ${NEX_HMAC_SECRET} 无默认值，缺失即启动失败——与 NEX_API_KEYS 同型）。
  NEX_HMAC_SECRET: "CHANGE_ME_HMAC_SECRET"
  # signing-service 的 MPC 密钥材料（2026-10-14 L3 复验缺陷：EncryptedFileKeyShareStore
  # 启动即校验 NEXUS_MPC_KEK，HmacSigner 用 NEXUS_MPC_MAK；均为 base64 32 字节，
  # 缺失 fail-closed 拒绝启动）。
  NEXUS_MPC_KEK: "CHANGE_ME_BASE64_32BYTE_MPC_KEK"
  NEXUS_MPC_MAK: "CHANGE_ME_BASE64_32BYTE_MPC_MAK"
  # core 链节点 JWT（L3 复验缺陷 #37：JWTUtil 启动即校验，fail-closed）
  NEXUS_JWT_APP_SECRET: "CHANGE_ME_BASE64_32BYTE_JWT_APP_SECRET"
