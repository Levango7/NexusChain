# ============================================================================
# mpc-engine 密钥密封（sealed-secrets 母本占位）
# ============================================================================
# **此文件不直接 apply**——管理员需在生产集群 controller 已部署后，
# 本地用 `kubeseal` 加密母本覆盖此文件（见 docs/runbooks/sealed-secrets.md）。
#
# 当前的明文占位仅用于：
#   1. 模板结构 + 字段名对版（管理员按此结构用 kubeseal 生成生产版）
#   2. CI 验证 helm template 渲染不会破坏
#
# **生产部署时**：
#   * controller 必须已就绪：kubectl get pod -n kube-system -l app.kubernetes.io/name=sealed-secrets
#   * 管理员用 `kubeseal -o yaml < plaintext-mpc-secret.yaml > 30-sealed-secret-mpc-engine.yaml`
#     生成 SealedSecret 后 commit 替换本占位
#   * mpc-engine chart 通过 `values.secrets.sealedSecretName=mpc-engine-secret`
#     引用本 Secret 名称（不再写明文 stringData）
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mpc-engine-secret
  namespace: nexus
  labels:
    app.kubernetes.io/name: mpc-engine
    app.kubernetes.io/component: mpc
    app.kubernetes.io/part-of: nexus
  annotations:
    # ⚠️ 此文件被覆盖前不要 apply 到任何集群——会创建出明文密钥 Secret
    sealed-secrets.nexus/deploy-state: "PLACEHOLDER-DO-NOT-APPLY"
type: Opaque
stringData:
  # 64 hex 字符（32 字节）AES-256-GCM 密钥。
  # **生产值由 `kubeseal` 加密为 SealedSecret 后 commit 覆盖此占位**。
  storage-key: "REPLACE_WITH_KUBESEAL_ENCRYPTED_SEALEDSECRET"
  # 密钥版本号（用于 NXC1 信封头），轮换时递增 + 同步重加密
  storage-key-version: "1"
---
# SealedSecret 母本结构（占位，**必须由本地 `kubeseal` 生成后覆盖**）
# ============================================================================
# 生成的 SealedSecret 大致结构（仅参考，**不要直接 commit 此段**）：
