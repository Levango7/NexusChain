# ============================================================================
# PLAN-064：PrometheusRule 告警的 promtool 单元测试（触发行为 + for: 窗口）
# ============================================================================
# 运行方式（CI 见 .github/workflows/k8s-sync-check.yml 的 "promtool 规则演练" 步）：
#   1) python3 scripts/extract-prometheus-rules.py \
#        deploy/k8s/50-prometheus-rules.yaml rules.yaml
#   2) cp deploy/k8s/tests/prometheus-rules.test.yaml .
#   3) promtool check rules rules.yaml
#   4) promtool test rules prometheus-rules.test.yaml
#   （promtool 固定版本与 sha256 见 workflow；测试文件里的 rule_files 用相对
#    路径 rules.yaml——两者必须放在同一目录运行。）
#
# 覆盖口径：规则文件全部 18 条告警逐条演练——
#   · 阈值触发：条件持续满足 ⇒ 在 for 窗口后触发（含 max() 聚合后标签变少的
#     BlockchainCoreStalled——exp_labels 按**实际会发出**的标签集断言）；
#   · 阈值不触发：条件不满足/低于阈值 ⇒ 不触发；
#   · for 窗口边界：条件满足但时长不足 ⇒ 不触发（例：5m 档在 4m 不响）。
#   exp_annotations 是**精确匹配**（promtool 语义）：{{ $labels.* }} / {{ $value }}
#   已按各用例样本标签展开固化；规则注解文案改动后本文件需要同步更新。
#
# 期望值校准说明：生成时以 promtool 实际输出为准（不是手抄的）——首跑就暴露过
# 两个事实：① max() 聚合后 job/pod 标签会消失；② PodCpu/PodMemory 两条告警
# 因两侧标签集不匹配**从未触发**（已随本 PLAN 修复，见规则文件内注释）。
# ============================================================================
rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: blockchain-core-stalled-flat-height
  interval: 1m
  input_series:
  - series: nexuschain_block_height{job="nexus-core", pod="nexus-core-0"}
    values: 100x16
  alert_rule_test:
  - eval_time: 9m
    alertname: BlockchainCoreStalled
    exp_alerts: []
  - eval_time: 11m
    alertname: BlockchainCoreStalled
    exp_alerts:
    - exp_labels:
        severity: critical
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 链核心 5min 块高无增长（停摆）
        description: max(nexuschain_block_height) 5 分钟内无增长——链停止出块。立即查 nexus-core Pod 日志（共识/存储）与 mpc-engine 状态。 genesis 链刚起或单节点 dev 环境预期也成立——仅 prod（ENABLE_MINING=true 集群）视为停摆。
- name: blockchain-core-stalled-genesis-zero
  interval: 1m
  input_series:
  - series: nexuschain_block_height{job="nexus-core", pod="nexus-core-0"}
    values: '0x12'
  alert_rule_test:
  - eval_time: 4m
    alertname: BlockchainCoreStalled
    exp_alerts: []
  - eval_time: 6m
    alertname: BlockchainCoreStalled
    exp_alerts:
    - exp_labels:
        severity: critical
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 链核心 5min 块高无增长（停摆）
        description: max(nexuschain_block_height) 5 分钟内无增长——链停止出块。立即查 nexus-core Pod 日志（共识/存储）与 mpc-engine 状态。 genesis 链刚起或单节点 dev 环境预期也成立——仅 prod（ENABLE_MINING=true 集群）视为停摆。
- name: block-write-failures-detected
  interval: 1m
  input_series:
  - series: nexus_block_writer_write_failures_total{job="nexus-core", pod="nexus-core-0"}
    values: 0 1x30
  alert_rule_test:
  - eval_time: 5m
    alertname: BlockWriteFailuresDetected
    exp_alerts: []
  - eval_time: 7m
    alertname: BlockWriteFailuresDetected
    exp_alerts:
    - exp_labels:
        job: nexus-core
        pod: nexus-core-0
        severity: warning
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 区块写库失败/跳块（10min 内有失败尝试）
        description: nexus-core-0 的 nexus_block_writer_write_failures_total 10 分钟内增长——写入尝试失败/跳块。该计数是**尝试次数**（同一高度重试重复计数），可能已被后续确认轮次补写。查 GET /consensus/block-writer 的 lastFailureHeight/lastFailureAtMillis 与 nexus-core 日志中的 'Failed to write block'；若同时 BlockPersistenceBacklog 触发，优先查 PG。
- name: block-write-failures-none
  interval: 1m
  input_series:
  - series: nexus_block_writer_write_failures_total{job="nexus-core", pod="nexus-core-0"}
    values: 7x30
  alert_rule_test:
  - eval_time: 15m
    alertname: BlockWriteFailuresDetected
    exp_alerts: []
- name: block-writer-state-update-timeouts
  interval: 1m
  input_series:
  - series: nexus_block_writer_state_update_timeouts_total{job="nexus-core", pod="nexus-core-0"}
    values: 0 1x30
  alert_rule_test:
  - eval_time: 5m
    alertname: BlockWriterStateUpdateTimeouts
    exp_alerts: []
  - eval_time: 7m
    alertname: BlockWriterStateUpdateTimeouts
    exp_alerts:
    - exp_labels:
        job: nexus-core
        pod: nexus-core-0
        severity: critical
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 区块状态更新等待超时（pendingBlock 被强制清空）
        description: nexus-core-0 的 nexus_block_writer_state_update_timeouts_total 10 分钟内增长——StateDB 等待账户状态更新超时并强制清空 pendingBlock 防死锁。可能卡住后续区块采纳。查 GET /consensus/block-writer 与 nexus-core 日志中的 'state update timeout'；结合 PG 连接池/长事务排查。
- name: block-writer-state-update-timeouts-none
  interval: 1m
  input_series:
  - series: nexus_block_writer_state_update_timeouts_total{job="nexus-core", pod="nexus-core-0"}
    values: 3x30
  alert_rule_test:
  - eval_time: 15m
    alertname: BlockWriterStateUpdateTimeouts
    exp_alerts: []
- name: block-persistence-backlog-memory
  interval: 1m
  input_series:
  - series: nexus_block_outbox_memory_pending{job="nexus-core", pod="nexus-core-0"}
    values: 1x30
  alert_rule_test:
  - eval_time: 9m
    alertname: BlockPersistenceBacklog
    exp_alerts: []
  - eval_time: 11m
    alertname: BlockPersistenceBacklog
    exp_alerts:
    - exp_labels:
        job: nexus-core
        pod: nexus-core-0
        severity: warning
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 区块持久化队列积压 ≥ 10min
        description: nexus-core-0 的内存重试队列或持久化 outbox 持续有积压——正常排空是秒级。查 GET /consensus/block-outbox 的 databasePending/oldestPendingCreatedAt/maxAttempts：年龄持续增长且 maxAttempts 高 ⇒ 可能有写不进去的行；结合 GET /consensus/block-writer 与 PG 状态。注意：outbox 行是恢复数据，不要手工删除。
- name: block-persistence-backlog-database
  interval: 1m
  input_series:
  - series: nexus_block_outbox_database_pending{job="nexus-core", pod="nexus-core-0"}
    values: 1x30
  alert_rule_test:
  - eval_time: 9m
    alertname: BlockPersistenceBacklog
    exp_alerts: []
  - eval_time: 11m
    alertname: BlockPersistenceBacklog
    exp_alerts:
    - exp_labels:
        job: nexus-core
        pod: nexus-core-0
        severity: warning
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 区块持久化队列积压 ≥ 10min
        description: nexus-core-0 的内存重试队列或持久化 outbox 持续有积压——正常排空是秒级。查 GET /consensus/block-outbox 的 databasePending/oldestPendingCreatedAt/maxAttempts：年龄持续增长且 maxAttempts 高 ⇒ 可能有写不进去的行；结合 GET /consensus/block-writer 与 PG 状态。注意：outbox 行是恢复数据，不要手工删除。
- name: block-persistence-backlog-none
  interval: 1m
  input_series:
  - series: nexus_block_outbox_memory_pending{job="nexus-core", pod="nexus-core-0"}
    values: '0x30'
  - series: nexus_block_outbox_database_pending{job="nexus-core", pod="nexus-core-0"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 15m
    alertname: BlockPersistenceBacklog
    exp_alerts: []
- name: block-outbox-unreadable
  interval: 1m
  input_series:
  - series: nexus_block_outbox_readable{job="nexus-core", pod="nexus-core-0"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 4m
    alertname: BlockOutboxUnreadable
    exp_alerts: []
  - eval_time: 6m
    alertname: BlockOutboxUnreadable
    exp_alerts:
    - exp_labels:
        job: nexus-core
        pod: nexus-core-0
        severity: warning
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 区块 outbox 已装配但连续 5min 读不到数据库
        description: nexus-core-0 的 nexus_block_outbox_readable=0——outbox 已装配但 databasePending 连续为 -1（PG 不可达/查询失败）。此时链可能仍在内存中出块，但补写/恢复能力受限；优先恢复 PG 连接，恢复后确认 databasePending 归零。
- name: block-outbox-readable-no-alert
  interval: 1m
  input_series:
  - series: nexus_block_outbox_readable{job="nexus-core", pod="nexus-core-0"}
    values: 1x20
  alert_rule_test:
  - eval_time: 15m
    alertname: BlockOutboxUnreadable
    exp_alerts: []
- name: block-adoption-abstain-risk
  interval: 1m
  input_series:
  - series: nexus_finality_abstain_risk{job="nexus-core", pod="nexus-core-0"}
    values: 1x20
  alert_rule_test:
  - eval_time: 4m
    alertname: BlockAdoptionAbstainRisk
    exp_alerts: []
  - eval_time: 6m
    alertname: BlockAdoptionAbstainRisk
    exp_alerts:
    - exp_labels:
        job: nexus-core
        pod: nexus-core-0
        severity: warning
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 区块采纳出现 unknown-proposer 弃权风险（单节点）
        description: nexus-core-0 的 nexus_finality_abstain_risk=1——某高度的 unknown-proposer defer 已达阈值（5）。查 GET /consensus/block-outbox 与日志中的 `abstain-risk` ERROR 行（含 deferCount 与高度），并用 GET /consensus/catch-up 的 validators 摘要与 GET /consensus/validator-set 回放地址对账（多余/僵死验证人会抬高总权重、换钥重启会留下新旧两个地址）。单节点弃权只影响该节点投票（其它节点仍在最终化，故本条为 warning）；全网死锁看 FinalityStalled。注意 abstain_risk 是进程内累计语义（历史见过也亮），不代表当前正在发生。
- name: block-adoption-abstain-risk-none
  interval: 1m
  input_series:
  - series: nexus_finality_abstain_risk{job="nexus-core", pod="nexus-core-0"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 15m
    alertname: BlockAdoptionAbstainRisk
    exp_alerts: []
- name: finality-stalled-frozen-watermark
  interval: 1m
  input_series:
  - series: nexus_finality_latest_voted_epoch{job="nexus-core", pod="nexus-core-0"}
    values: 5x40
  alert_rule_test:
  - eval_time: 9m
    alertname: FinalityStalled
    exp_alerts: []
  - eval_time: 12m
    alertname: FinalityStalled
    exp_alerts:
    - exp_labels:
        job: nexus-core
        pod: nexus-core-0
        severity: critical
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 最终性水位 15min 无增长（最终化停滞）
        description: nexus-core-0 的 nexus_finality_latest_voted_epoch 15 分钟内没有变化——最终性投票/收敛已停（健康时约每 epoch 推进，2 块/epoch×3s ≈ 6s 一次）。查 GET /consensus/finality 的 progress（votedWeight/totalWeight，看缺谁的票）与 /consensus/finality-outbox（补写队列）：票发不出看 P2P/对端存活，票写不进看 PG，门限不达看 /consensus/validator-set（验证人掉线/注册表异常）。链本身可能仍在出块，不要与 BlockchainCoreStalled 混淆——这是最危险的『出块正常但最终性死掉』形态（PLAN-047 实测复现过）。
- name: finality-stalled-advancing-watermark
  interval: 1m
  input_series:
  - series: nexus_finality_latest_voted_epoch{job="nexus-core", pod="nexus-core-0"}
    values: 5+1x40
  alert_rule_test:
  - eval_time: 20m
    alertname: FinalityStalled
    exp_alerts: []
- name: finality-below-quorum-sustained
  interval: 1m
  input_series:
  - series: nexus_finality_progress_percent{job="nexus-core", pod="nexus-core-0"}
    values: 50x24
  alert_rule_test:
  - eval_time: 9m
    alertname: FinalityBelowQuorum
    exp_alerts: []
  - eval_time: 11m
    alertname: FinalityBelowQuorum
    exp_alerts:
    - exp_labels:
        job: nexus-core
        pod: nexus-core-0
        severity: warning
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 最终性进度 < 100% 持续 10min（票没收齐）
        description: nexus-core-0 的 nexus_finality_progress_percent 连续 10min 不到 100%——水位 epoch 的票没收齐（某验证人未投票/票丢失/验签失败）。单次采样的 50% 是正常的提交时快照（会翻 100%），持续 10min 才是问题。查 GET /consensus/finality 的 votedWeight/totalWeight 与对端 /consensus/validator-set；疑丢票时配合 finality_vote_outbox 补写（PLAN-018）。3 验证人中 1 个掉线时进度会停在 67% 但 finalized 仍可为 true（2/3 达门限）——两者都看。
- name: finality-below-quorum-transient-dip
  interval: 1m
  input_series:
  - series: nexus_finality_progress_percent{job="nexus-core", pod="nexus-core-0"}
    values: 50x3 100x21
  alert_rule_test:
  - eval_time: 10m
    alertname: FinalityBelowQuorum
    exp_alerts: []
- name: finality-below-quorum-none
  interval: 1m
  input_series:
  - series: nexus_finality_progress_percent{job="nexus-core", pod="nexus-core-0"}
    values: 100x30
  alert_rule_test:
  - eval_time: 15m
    alertname: FinalityBelowQuorum
    exp_alerts: []
# ---- PLAN-066 投票拒绝计数告警（2026-11-02 追加）---------------------------
# increase() 语义要求 counter 真的在涨：values 用 `0+1x12` 表示每分钟 +1。
- name: finality-vote-rejected-none
  interval: 1m
  input_series:
  - series: nexus_finality_vote_rejected_total{reason="validator_unknown", phase="admission", job="nexus-core", pod="nexus-core-0"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: FinalityVoteRejected
    exp_alerts: []
- name: finality-vote-rejected-benign-reasons-do-not-fire
  interval: 1m
  input_series:
  - series: nexus_finality_vote_rejected_total{reason="validator_unknown", phase="convergence", job="nexus-core", pod="nexus-core-0"}
    values: 0+1x20
  alert_rule_test:
  - eval_time: 20m
    alertname: FinalityVoteRejected
    exp_alerts: []
- name: finality-vote-rejected-fires-after-for-window
  interval: 1m
  input_series:
  - series: nexus_finality_vote_rejected_total{reason="signature_invalid", phase="admission", job="nexus-core", pod="nexus-core-0"}
    values: 0+1x12
  alert_rule_test:
  - eval_time: 4m
    alertname: FinalityVoteRejected
    exp_alerts: []
  - eval_time: 6m
    alertname: FinalityVoteRejected
    exp_alerts:
    - exp_labels:
        reason: signature_invalid
        phase: admission
        job: nexus-core
        pod: nexus-core-0
        severity: warning
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 最终性投票出现异常拒绝（10min 内 6 次）
        description: nexus-core-0 的 nexus_finality_vote_rejected_total{reason="signature_invalid"} 10 分钟内增长 6 次——最终性投票在计票/落库前被拒。reason=signature_invalid|pubkey_mismatch 表示公钥正确但签名伪造（或票内公钥与注册公钥不一致）；reason=checkpoint_hash_invalid 表示检查点哈希不是 32 字节（畸形或放大攻击）；reason=checkpoint_limit_exceeded 表示单个验证人在一个 epoch 内试图新引入超过 4 个检查点键；reason=payload_too_large 表示 P2P 最终性载荷超过 2048 字节。合法节点之间正常不会发生；先查 nexus-core 日志里的 `Vote signature verification FAILED` / `Vote pubkey binding FAILED` / `Vote checkpoint hash invalid` / `per-validator checkpoint key limit reached` / `Dropped oversized finality payload` 行（含涉事验证人地址与 epoch），判断是配置错配（换钥后未重新注册）、历史脏行还是网络攻击。phase=convergence 表示库里躺着坏行（历史污染，配合启动恢复日志）；phase=admission 表示正在被网络攻击。被拒票已按 PLAN-065/067 在计票前被拒、不影响最终化，但它是 liveness 攻击前兆，应作安全事件处理。
- name: finality-vote-rejected-convergence-phase
  interval: 1m
  input_series:
  - series: nexus_finality_vote_rejected_total{reason="pubkey_mismatch", phase="convergence", job="nexus-core", pod="nexus-core-0"}
    values: 0+1x12
  alert_rule_test:
  - eval_time: 7m
    alertname: FinalityVoteRejected
    exp_alerts:
    - exp_labels:
        reason: pubkey_mismatch
        phase: convergence
        job: nexus-core
        pod: nexus-core-0
        severity: warning
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 最终性投票出现异常拒绝（10min 内 7 次）
        description: nexus-core-0 的 nexus_finality_vote_rejected_total{reason="pubkey_mismatch"} 10 分钟内增长 7 次——最终性投票在计票/落库前被拒。reason=signature_invalid|pubkey_mismatch 表示公钥正确但签名伪造（或票内公钥与注册公钥不一致）；reason=checkpoint_hash_invalid 表示检查点哈希不是 32 字节（畸形或放大攻击）；reason=checkpoint_limit_exceeded 表示单个验证人在一个 epoch 内试图新引入超过 4 个检查点键；reason=payload_too_large 表示 P2P 最终性载荷超过 2048 字节。合法节点之间正常不会发生；先查 nexus-core 日志里的 `Vote signature verification FAILED` / `Vote pubkey binding FAILED` / `Vote checkpoint hash invalid` / `per-validator checkpoint key limit reached` / `Dropped oversized finality payload` 行（含涉事验证人地址与 epoch），判断是配置错配（换钥后未重新注册）、历史脏行还是网络攻击。phase=convergence 表示库里躺着坏行（历史污染，配合启动恢复日志）；phase=admission 表示正在被网络攻击。被拒票已按 PLAN-065/067 在计票前被拒、不影响最终化，但它是 liveness 攻击前兆，应作安全事件处理。
- name: finality-vote-rejected-checkpoint-limit-exceeded
  interval: 1m
  input_series:
  - series: nexus_finality_vote_rejected_total{reason="checkpoint_limit_exceeded", phase="admission", job="nexus-core", pod="nexus-core-0"}
    values: 0+1x12
  alert_rule_test:
  - eval_time: 6m
    alertname: FinalityVoteRejected
    exp_alerts:
    - exp_labels:
        reason: checkpoint_limit_exceeded
        phase: admission
        job: nexus-core
        pod: nexus-core-0
        severity: warning
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 最终性投票出现异常拒绝（10min 内 6 次）
        description: nexus-core-0 的 nexus_finality_vote_rejected_total{reason="checkpoint_limit_exceeded"} 10 分钟内增长 6 次——最终性投票在计票/落库前被拒。reason=signature_invalid|pubkey_mismatch 表示公钥正确但签名伪造（或票内公钥与注册公钥不一致）；reason=checkpoint_hash_invalid 表示检查点哈希不是 32 字节（畸形或放大攻击）；reason=checkpoint_limit_exceeded 表示单个验证人在一个 epoch 内试图新引入超过 4 个检查点键；reason=payload_too_large 表示 P2P 最终性载荷超过 2048 字节。合法节点之间正常不会发生；先查 nexus-core 日志里的 `Vote signature verification FAILED` / `Vote pubkey binding FAILED` / `Vote checkpoint hash invalid` / `per-validator checkpoint key limit reached` / `Dropped oversized finality payload` 行（含涉事验证人地址与 epoch），判断是配置错配（换钥后未重新注册）、历史脏行还是网络攻击。phase=convergence 表示库里躺着坏行（历史污染，配合启动恢复日志）；phase=admission 表示正在被网络攻击。被拒票已按 PLAN-065/067 在计票前被拒、不影响最终化，但它是 liveness 攻击前兆，应作安全事件处理。
- name: finality-vote-rejected-payload-too-large
  interval: 1m
  input_series:
  - series: nexus_finality_vote_rejected_total{reason="payload_too_large", phase="admission", job="nexus-core", pod="nexus-core-0"}
    values: 0+1x12
  alert_rule_test:
  - eval_time: 6m
    alertname: FinalityVoteRejected
    exp_alerts:
    - exp_labels:
        reason: payload_too_large
        phase: admission
        job: nexus-core
        pod: nexus-core-0
        severity: warning
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 最终性投票出现异常拒绝（10min 内 6 次）
        description: nexus-core-0 的 nexus_finality_vote_rejected_total{reason="payload_too_large"} 10 分钟内增长 6 次——最终性投票在计票/落库前被拒。reason=signature_invalid|pubkey_mismatch 表示公钥正确但签名伪造（或票内公钥与注册公钥不一致）；reason=checkpoint_hash_invalid 表示检查点哈希不是 32 字节（畸形或放大攻击）；reason=checkpoint_limit_exceeded 表示单个验证人在一个 epoch 内试图新引入超过 4 个检查点键；reason=payload_too_large 表示 P2P 最终性载荷超过 2048 字节。合法节点之间正常不会发生；先查 nexus-core 日志里的 `Vote signature verification FAILED` / `Vote pubkey binding FAILED` / `Vote checkpoint hash invalid` / `per-validator checkpoint key limit reached` / `Dropped oversized finality payload` 行（含涉事验证人地址与 epoch），判断是配置错配（换钥后未重新注册）、历史脏行还是网络攻击。phase=convergence 表示库里躺着坏行（历史污染，配合启动恢复日志）；phase=admission 表示正在被网络攻击。被拒票已按 PLAN-065/067 在计票前被拒、不影响最终化，但它是 liveness 攻击前兆，应作安全事件处理。
- name: finality-finalize-rejected-none
  interval: 1m
  input_series:
  - series: nexus_finality_finalize_rejected_total{reason="aggregate_verification_failed", job="nexus-core", pod="nexus-core-0"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: FinalityFinalizeRejected
    exp_alerts: []
- name: finality-finalize-rejected-fires-after-for-window
  interval: 1m
  input_series:
  - series: nexus_finality_finalize_rejected_total{reason="aggregate_verification_failed", job="nexus-core", pod="nexus-core-0"}
    values: 0+1x16
  alert_rule_test:
  - eval_time: 9m
    alertname: FinalityFinalizeRejected
    exp_alerts: []
  - eval_time: 11m
    alertname: FinalityFinalizeRejected
    exp_alerts:
    - exp_labels:
        reason: aggregate_verification_failed
        job: nexus-core
        pod: nexus-core-0
        severity: critical
        component: blockchain-core
      exp_annotations:
        runbook_url: https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md
        summary: 最终化因聚合验签失败被拒（15min 内 11 次）
        description: nexus-core-0 的 nexus_finality_finalize_rejected_total 15 分钟内增长 11 次——已达 2/3 权重的检查点在聚合验签环节被 fail-closed 拒绝（不会最终化，权重停在那里）。每票入场前已做单票 Ed25519 验签（PLAN-065），此信号意味着验签口径不一致或投票集在两次校验之间被改变，属罕见安全告警。查日志 `Finality aggregate verification failed` 拿 checkpoint key，对照 GET /consensus/finality 与 finality_votes 表该 key 的签名列。链可能仍在出块，这是『出块正常但该检查点不再终局』的形态，与 BlockchainCoreStalled 不同。
