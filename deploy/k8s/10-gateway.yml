apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-gateway
  namespace: nexus
  labels:
    app: nexus-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-gateway
  template:
    metadata:
      labels:
        app: nexus-gateway
    spec:
      # 网关不调用 K8s API，禁用 SA token 挂载（缩最小攻击面）
      automountServiceAccountToken: false
      # REQ-40/P2: 跨可用区打散 Pod，避免单 AZ 故障导致全部 Pod 丢失
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nexus-gateway
      # Pod 级安全上下文：非root + seccomp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # TODO: 固定为不可变 tag（semver 或 sha256 digest）；:latest 不可重现、易漂移
          image: ghcr.io/levango7/nexuschain/nexus-gateway:2.1.0
          # 容器级安全上下文：丢弃全部 Linux capabilities、禁止提权
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # JVM 需写 /tmp；改 true 需额外挂 emptyDir 到 /tmp
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-gateway
  namespace: nexus
spec:
  selector:
    app: nexus-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexus-gateway-hpa
  namespace: nexus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexus-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-ingress
  namespace: nexus
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # 基础速率限制，缓解滥用（按业务需要调整）
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.nexus.network
      secretName: nexus-tls
  rules:
    - host: api.nexus.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-gateway
                port:
                  number: 8080
