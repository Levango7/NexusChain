# ============================================================================
# PrometheusRule: NexusChain 关键告警（PLAN-002 Step C）
# ============================================================================
# 依赖：kube-prometheus-stack（Prometheus Operator + PrometheusRule CRD）
# 部署：kubectl apply -f deploy/k8s/50-prometheus-rules.yaml
# 验证：本文件是 PrometheusRule CRD（非原生 rules 文件），promtool 不能直接校验；
#       由 scripts/extract-prometheus-rules.py 提取 spec.groups 后跑 promtool（check
#       rules + test rules）——测试用例见 deploy/k8s/tests/prometheus-rules.test.yaml，
#       CI 步骤见 k8s-sync-check.yml「promtool 规则演练」（PLAN-064，2026-11-01）。
#
# 设计原则（避免告警疲劳）：
#   1. 告警数 20 条（2026-09-09 "告警真值"整合 11 条 + PLAN-040 区块持久化 4 条
#      + PLAN-045 最终性 2 条 + PLAN-052 弃权风险 1 条；2026-11-01 PLAN-064
#      用 promtool 实测逐条计数时发现此处曾停留在 17——原门禁只断言"≥5"，
#      数量漂移从不触发；2026-11-02 PLAN-066 再 +2 条投票拒绝计数告警：
#      19 → 20）：
#      原 5 条 + 从 legacy deploy/monitoring/alerting-rules.yaml 并入 6 条真实指标告警
#      （JVM/GC、Pod 资源、ServiceDown、SeataTcDown）+ 2026-10-26 的 4 条区块持久化告警
#      + 2 条最终性告警；legacy 文件中 11 条引用幽灵指标名（代码从未注册）的告警
#      退役——规则只允许引用代码真实注册的应用指标或 kube_* 通用指标
#   2. 全部 for: 5m（避免抖动误报）
#   3. 用 `kube_*` 系列兜底（不依赖应用暴露 prom metrics）—— 2.x 阶段
#      逐步补应用 metrics 再细化
#   4. 标签统一（severity + component + service）便于 Slack/PagerDuty 路由
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nexuschain-alerts
  namespace: nexus
  labels:
    app.kubernetes.io/part-of: nexus
    nexus-chain.io/component: alerting
    # 2026-10-18：kube-prometheus-stack 的 ruleSelector 匹配 release=kube-prometheus-stack
    # （deploy/monitoring 的规则与 40-monitoring.yml 均带此 label）——缺此 label
    # 规则会被 Operator 静默忽略（告警不在线且无报错）。
    release: kube-prometheus-stack
spec:
  groups:
  # ---- 链核心（PLAN-002 后续 2026-09-07 升级：精确块高告警）----
  # nexus-core 已暴露 nexuschain_block_height gauge（CoreMetricsConfig，
  # /actuator/prometheus + nexus-core ServiceMonitor）。5 分钟块高无增长
  # 即链停摆——精确信号，替代此前仅靠 mpc-engine CrashLoop 的间接近似。
  # 保留 MpcEngineCrashLooping 作独立信号（两者互补：链停可能是 mpc-engine
  # 挂，也可能是共识/存储问题——块高告警覆盖后者的盲区）。
  - name: nexuschain.blockchain-core
    interval: 30s
    rules:
    - alert: BlockchainCoreStalled
      expr: |
        max(nexuschain_block_height) == 0
        or (max(nexuschain_block_height) - max(nexuschain_block_height offset 5m) == 0)
      for: 5m
      labels:
        severity: critical
        component: blockchain-core
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "链核心 5min 块高无增长（停摆）"
        description: "max(nexuschain_block_height) 5 分钟内无增长——链停止出块。立即查 nexus-core Pod 日志（共识/存储）与 mpc-engine 状态。 genesis 链刚起或单节点 dev 环境预期也成立——仅 prod（ENABLE_MINING=true 集群）视为停摆。"

  # ---- 区块持久化（PLAN-040 / roadmap #29 ③）----
  # 应用侧 BlockPersistenceMetrics（nexus-core）暴露以下指标：
  #   nexus_block_writer_write_failures_total（counter，尝试次数）
  #   nexus_block_writer_state_update_timeouts_total（counter）
  #   nexus_block_writer_last_failure_height / _age_seconds（gauge）
  #   nexus_block_outbox_{enabled,memory_pending,database_pending,
  #     oldest_pending_age_seconds,max_attempts,readable}（gauge；库不可读为 NaN）
  # outbox 的库读在应用内 30s 采样，抓取不查库——PG 抖动不会拖垮整页抓取。
  # 注意 write_failures 是**尝试次数**（同高度重试重复计数），单次失败可被
  # 后续确认轮次补写；它告警但不等同链停摆（后者看 BlockchainCoreStalled）。
  - name: nexuschain.block-persistence
    interval: 30s
    rules:
    - alert: BlockWriteFailuresDetected
      expr: increase(nexus_block_writer_write_failures_total[10m]) > 0
      for: 5m
      labels:
        severity: warning
        component: blockchain-core
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "区块写库失败/跳块（10min 内有失败尝试）"
        description: "{{ $labels.pod }} 的 nexus_block_writer_write_failures_total 10 分钟内增长——写入尝试失败/跳块。该计数是**尝试次数**（同一高度重试重复计数），可能已被后续确认轮次补写。查 GET /consensus/block-writer 的 lastFailureHeight/lastFailureAtMillis 与 nexus-core 日志中的 'Failed to write block'；若同时 BlockPersistenceBacklog 触发，优先查 PG。"

    - alert: BlockWriterStateUpdateTimeouts
      expr: increase(nexus_block_writer_state_update_timeouts_total[10m]) > 0
      for: 5m
      labels:
        severity: critical
        component: blockchain-core
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "区块状态更新等待超时（pendingBlock 被强制清空）"
        description: "{{ $labels.pod }} 的 nexus_block_writer_state_update_timeouts_total 10 分钟内增长——StateDB 等待账户状态更新超时并强制清空 pendingBlock 防死锁。可能卡住后续区块采纳。查 GET /consensus/block-writer 与 nexus-core 日志中的 'state update timeout'；结合 PG 连接池/长事务排查。"

    - alert: BlockPersistenceBacklog
      expr: |
        nexus_block_outbox_memory_pending > 0
        or nexus_block_outbox_database_pending > 0
      for: 10m
      labels:
        severity: warning
        component: blockchain-core
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "区块持久化队列积压 ≥ 10min"
        description: "{{ $labels.pod }} 的内存重试队列或持久化 outbox 持续有积压——正常排空是秒级。查 GET /consensus/block-outbox 的 databasePending/oldestPendingCreatedAt/maxAttempts：年龄持续增长且 maxAttempts 高 ⇒ 可能有写不进去的行；结合 GET /consensus/block-writer 与 PG 状态。注意：outbox 行是恢复数据，不要手工删除。"

    - alert: BlockOutboxUnreadable
      expr: nexus_block_outbox_readable == 0
      for: 5m
      labels:
        severity: warning
        component: blockchain-core
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "区块 outbox 已装配但连续 5min 读不到数据库"
        description: "{{ $labels.pod }} 的 nexus_block_outbox_readable=0——outbox 已装配但 databasePending 连续为 -1（PG 不可达/查询失败）。此时链可能仍在内存中出块，但补写/恢复能力受限；优先恢复 PG 连接，恢复后确认 databasePending 归零。"
  # ---- 区块采纳弃权风险（PLAN-052）----
  # 应用侧 AbstainMetrics（nexus-core）暴露：nexus_finality_defer_total（单调）、
  # nexus_finality_defer_max_height / max_count（最可能卡住的采纳点）、
  # nexus_finality_abstain_risk（0/1，任一高度达 defer 阈值 5 即亮）。
  # 与 FinalityStalled/BelowQuorum 的关系：后两条是"结果维度"（滞后 15min 窗口），
  # 本条是"原因维度、单节点、最早出现症状"（第一次 unknown-proposer  defer 即可见）。
  # 口径：计数按高度独立累计、只增不减 ⇒ abstain_risk=1 的含义是"本进程启动以来
  # 见过弃权风险"，不是"当前正在弃权"（如需当前语义属后续切片）。
  - name: nexuschain.block-adoption
    interval: 30s
    rules:
    - alert: BlockAdoptionAbstainRisk
      expr: nexus_finality_abstain_risk == 1
      for: 5m
      labels:
        severity: warning
        component: blockchain-core
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "区块采纳出现 unknown-proposer 弃权风险（单节点）"
        description: "{{ $labels.pod }} 的 nexus_finality_abstain_risk=1——某高度的 unknown-proposer defer 已达阈值（5）。查 GET /consensus/block-outbox 与日志中的 `abstain-risk` ERROR 行（含 deferCount 与高度），并用 GET /consensus/catch-up 的 validators 摘要与 GET /consensus/validator-set 回放地址对账（多余/僵死验证人会抬高总权重、换钥重启会留下新旧两个地址）。单节点弃权只影响该节点投票（其它节点仍在最终化，故本条为 warning）；全网死锁看 FinalityStalled。注意 abstain_risk 是进程内累计语义（历史见过也亮），不代表当前正在发生。"

  # ---- 最终性视图（PLAN-045；PLAN-047 重标定）----
  # 应用侧 FinalityMetrics（nexus-core）暴露 nexus_finality_* 指标，数据源是
  # GET /consensus/finality（PLAN-044）同一份只读内存快照：currentEpoch /
  # latestVotedEpoch（**粘滞水位**）/ lag / progress_percent / finalized /
  # finalized_checkpoints。非 pos 模式（未装配最终性共识）时指标缺失（无序列），
  # 表达式自然不成立，不会误报。
  #
  # PLAN-047 实测重标定（勿凭直觉改阈值）：
  #   ① 健康 3 验证人拓扑 lag 基线恒为 2（轮转+视图切换使投票稳定落后链头 2 个
  #      epoch）⇒ 旧的 `lag>=2` 会持续误报 critical；
  #   ② 最终性真死锁时旧定义（回溯窗内取最近有票 epoch）会变 NaN ⇒ 告警熄火——
  #      最该响的时候哑了。故 lag 改为"粘滞水位"定义：记录在就前进、不在就保持，
  #      死锁时 lag 无界增长、progress 冻结在最后已知值。
  # 现在两条规则都用**持续量**：水位是否在动（changes）+ 进度是否够（percent）。
  - name: nexuschain.finality
    interval: 30s
    rules:
    - alert: FinalityStalled
      expr: changes(nexus_finality_latest_voted_epoch[15m]) == 0
      for: 10m
      labels:
        severity: critical
        component: blockchain-core
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "最终性水位 15min 无增长（最终化停滞）"
        description: "{{ $labels.pod }} 的 nexus_finality_latest_voted_epoch 15 分钟内没有变化——最终性投票/收敛已停（健康时约每 epoch 推进，2 块/epoch×3s ≈ 6s 一次）。查 GET /consensus/finality 的 progress（votedWeight/totalWeight，看缺谁的票）与 /consensus/finality-outbox（补写队列）：票发不出看 P2P/对端存活，票写不进看 PG，门限不达看 /consensus/validator-set（验证人掉线/注册表异常）。链本身可能仍在出块，不要与 BlockchainCoreStalled 混淆——这是最危险的『出块正常但最终性死掉』形态（PLAN-047 实测复现过）。"

    - alert: FinalityBelowQuorum
      expr: nexus_finality_progress_percent < 100
      for: 10m
      labels:
        severity: warning
        component: blockchain-core
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "最终性进度 < 100% 持续 10min（票没收齐）"
        description: "{{ $labels.pod }} 的 nexus_finality_progress_percent 连续 10min 不到 100%——水位 epoch 的票没收齐（某验证人未投票/票丢失/验签失败）。单次采样的 50% 是正常的提交时快照（会翻 100%），持续 10min 才是问题。查 GET /consensus/finality 的 votedWeight/totalWeight 与对端 /consensus/validator-set；疑丢票时配合 finality_vote_outbox 补写（PLAN-018）。3 验证人中 1 个掉线时进度会停在 67% 但 finalized 仍可为 true（2/3 达门限）——两者都看。"

    # ---- 投票拒绝计数（PLAN-065 缺口 → PLAN-066 指标化；PLAN-067 扩展尺寸/键上界）----
    # 应用侧 FinalityRejectionMetrics（nexus-core）暴露：
    #   nexus_finality_vote_rejected_total{reason, phase}（counter）
    #     reason: validator_unknown / validator_inactive / malformed_vote /
    #             pubkey_mismatch / signature_invalid / zero_total_weight /
    #             checkpoint_hash_invalid / checkpoint_limit_exceeded / payload_too_large
    #     phase:  admission（网络/本地提交）/ convergence（库里坏行）/ restore（启动恢复）
    #   nexus_finality_finalize_rejected_total{reason}（counter）
    # 告警过滤出"异常输入"类 reason：伪造票（公钥是公开信息，攻击者无需私钥即可
    # 构造公钥正确、签名垃圾的票）、畸形/超长检查点哈希、单验证人单 epoch 造键超限、
    # 超长 P2P 载荷。其余 reason 多是启动期/治理期正常现象，逐条告警只会产生噪声。
    # validator 地址故意不做标签：否则攻击者用随机地址洪泛即可让标签基数无界增长，
    # "被观测对象会被观测本身打垮"；按人定位仍看日志（WARN 行含地址与 epoch）。
    - alert: FinalityVoteRejected
      expr: increase(nexus_finality_vote_rejected_total{reason=~"signature_invalid|pubkey_mismatch|checkpoint_hash_invalid|checkpoint_limit_exceeded|payload_too_large"}[10m]) > 0
      for: 5m
      labels:
        severity: warning
        component: blockchain-core
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "最终性投票出现异常拒绝（10min 内 {{ $value }} 次）"
        description: "{{ $labels.pod }} 的 nexus_finality_vote_rejected_total{reason=\"{{ $labels.reason }}\"} 10 分钟内增长 {{ $value }} 次——最终性投票在计票/落库前被拒。reason=signature_invalid|pubkey_mismatch 表示公钥正确但签名伪造（或票内公钥与注册公钥不一致）；reason=checkpoint_hash_invalid 表示检查点哈希不是 32 字节（畸形或放大攻击）；reason=checkpoint_limit_exceeded 表示单个验证人在一个 epoch 内试图新引入超过 4 个检查点键；reason=payload_too_large 表示 P2P 最终性载荷超过 2048 字节。合法节点之间正常不会发生；先查 nexus-core 日志里的 `Vote signature verification FAILED` / `Vote pubkey binding FAILED` / `Vote checkpoint hash invalid` / `per-validator checkpoint key limit reached` / `Dropped oversized finality payload` 行（含涉事验证人地址与 epoch），判断是配置错配（换钥后未重新注册）、历史脏行还是网络攻击。phase=convergence 表示库里躺着坏行（历史污染，配合启动恢复日志）；phase=admission 表示正在被网络攻击。被拒票已按 PLAN-065/067 在计票前被拒、不影响最终化，但它是 liveness 攻击前兆，应作安全事件处理。"

    - alert: FinalityFinalizeRejected
      expr: increase(nexus_finality_finalize_rejected_total[15m]) > 0
      for: 10m
      labels:
        severity: critical
        component: blockchain-core
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "最终化因聚合验签失败被拒（15min 内 {{ $value }} 次）"
        description: "{{ $labels.pod }} 的 nexus_finality_finalize_rejected_total 15 分钟内增长 {{ $value }} 次——已达 2/3 权重的检查点在聚合验签环节被 fail-closed 拒绝（不会最终化，权重停在那里）。每票入场前已做单票 Ed25519 验签（PLAN-065），此信号意味着验签口径不一致或投票集在两次校验之间被改变，属罕见安全告警。查日志 `Finality aggregate verification failed` 拿 checkpoint key，对照 GET /consensus/finality 与 finality_votes 表该 key 的签名列。链可能仍在出块，这是『出块正常但该检查点不再终局』的形态，与 BlockchainCoreStalled 不同。"
  # ---- MPC 引擎 ----
  - name: nexuschain.mpc-engine
    interval: 30s
    rules:
    # 引擎 CrashLoopBackOff 持续 5 分钟——这是 step A/B 改进后最容易
    # 暴露的"寂静失败"——必须 5 分钟内 PagerDuty 唤醒
    - alert: MpcEngineCrashLooping
      expr: |
        kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", container="mpc-engine"} == 1
      for: 5m
      labels:
        severity: critical
        component: mpc-engine
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "mpc-engine CrashLoopBackOff 持续 {{ $value }}min"
        description: "Pod {{ $labels.pod }} 在命名空间 {{ $labels.namespace }} 持续 CrashLoopBackOff——签名服务停摆。立即查 kubectl describe + logs。"

    # 引擎任意 Pod 非 Ready 持续 5 分钟——单副本挂掉 t=2 仍能签，但
    # 已损失安全冗余；持续 Ready=0 标志真故障
    - alert: MpcEngineNotReady
      expr: |
        kube_pod_status_ready{condition="true", namespace="nexus"} == 0
        and on(namespace) kube_deployment_status_replicas_ready{namespace="nexus"} > 0
      for: 5m
      labels:
        severity: warning
        component: mpc-engine
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "mpc-engine 至少 1 副本 NotReady 5min"
        description: "命名空间 nexus 内至少一个 mpc-engine Pod 非 Ready 持续 5min。"

    # 关键 K8s 资源未绑定（PVC 失败或 Deployment 卡 Pending）持续 5min
    - alert: MpcEngineResourceUnbound
      expr: |
        kube_persistentvolumeclaim_status_phase{phase!="Bound", namespace="nexus"} == 1
        or kube_pod_status_phase{phase!="Running", namespace="nexus", pod=~"mpc-engine-.*"} == 1
      for: 5m
      labels:
        severity: critical
        component: mpc-engine
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "mpc-engine 资源 5min 未就绪"
        description: "PVC 未绑定或 Pod 非 Running 持续 5min——可能存储后端故障或调度问题。"

  # ---- 链路服务（NexusChain 内 Java 编排服务）----
  - name: nexuschain.services
    interval: 30s
    rules:
    # 任何 Java 服务的 Deployment 非 Ready 持续 5min
    - alert: NexusServiceUnhealthy
      expr: |
        (kube_deployment_status_replicas_unavailable{namespace="nexus"} > 0)
        and
        (changes(kube_deployment_status_replicas_unavailable{namespace="nexus"}[10m]) > 0
         or
         (kube_deployment_status_replicas_unavailable{namespace="nexus"}
          / kube_deployment_spec_replicas{namespace="nexus"} > 0.5)
        )
      for: 5m
      labels:
        severity: warning
        component: service
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "{{ $labels.deployment }} 不可用副本 > 50%"
        description: "Deployment {{ $labels.deployment }} 不可用副本持续 5min。检查 Pod 状态 + 日志。"

  # ---- JVM 健康（2026-09-09 告警真值整合：自 legacy alerting-rules.yaml 并入） ----
  # jvm_gc_pause_seconds / jvm_memory_used_bytes 是 Micrometer 标准指标，
  # 所有接 micrometer-registry-prometheus 的服务都会上报（真实存在）。
  # 注意：service 标签来自 Prometheus Operator 对 ServiceMonitor 抓取的
  # 自动注入（endpoint/pod/service 保留标签），值为 K8s Service 名
  # （nexus-gateway 等）——与 regex nexus-.* 匹配。
  - name: nexuschain.jvm
    interval: 30s
    rules:
    # GC 时间占比 > 20% 持续 5m——内存压力 / Full GC 前兆
    - alert: JvmGcTimeHigh
      expr: |
        (
          sum(rate(jvm_gc_pause_seconds_sum{service=~"nexus-.*"}[5m])) by (service, instance)
          /
          clamp_min(sum(rate(process_uptime_seconds{service=~"nexus-.*"}[5m])) by (service, instance), 1)
        ) > 0.20
      for: 5m
      labels:
        severity: warning
        component: jvm
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "{{ $labels.service }} GC 时间占比高于 20%"
        description: "{{ $labels.service }} ({{ $labels.instance }}) GC 时间占运行时间比例持续超过 20%，存在内存压力或频繁 Full GC。"

    # 堆内存使用 > 85% 持续 5m——OOM 风险
    - alert: JvmHeapUsageHigh
      expr: |
        (
          sum(jvm_memory_used_bytes{service=~"nexus-.*", area="heap"}) by (service, instance)
          /
          clamp_min(sum(jvm_memory_max_bytes{service=~"nexus-.*", area="heap"}) by (service, instance), 1)
        ) > 0.85
      for: 5m
      labels:
        severity: warning
        component: jvm
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "{{ $labels.service }} 堆内存使用率高于 85%"
        description: "{{ $labels.service }} ({{ $labels.instance }}) 堆内存使用率持续超过 85%，OOM 风险升高。请检查内存泄漏或扩容。"

  # ---- Pod 资源（2026-09-09 告警真值整合：自 legacy alerting-rules.yaml 并入） ----
  # container_* / kube_* 来自 cAdvisor 与 kube-state-metrics，K8s 集群
  # 开箱即有（kube-prometheus-stack 默认启用）。
  - name: nexuschain.resource
    interval: 30s
    rules:
    # Pod CPU > limit 80% 持续 10m——节流影响延迟
    # 2026-11-01 PLAN-064（promtool 单测首跑发现）：分母原为裸
    # kube_pod_container_resource_limits，与左侧 sum by (pod, container) 的标签集
    # 不同（RHS 多 resource/job/instance），除法向量匹配恒空 ⇒ 该告警**从未触发**。
    # 实测：恒定 85% 使用率 20 分钟 got:[]；改为 sum by (pod, container) 归一
    # 标签集后同一序列正常触发。（缺 limit 序列时两侧无匹配、仍不触发——语义保留。）
    - alert: PodCpuUsageHigh
      expr: |
        (
          sum(rate(container_cpu_usage_seconds_total{namespace="nexus", container!="", container!="POD"}[5m])) by (pod, container)
          /
          clamp_min(sum by (pod, container) (kube_pod_container_resource_limits{namespace="nexus", resource="cpu"}), 1)
        ) > 0.80
      for: 10m
      labels:
        severity: warning
        component: resource
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "Pod {{ $labels.pod }} CPU 使用率高于 80%"
        description: "容器 {{ $labels.container }} CPU 使用率持续超过 limit 的 80%，可能触发 CPU 节流（throttling）影响延迟。"

    # Pod 内存 > limit 90% 持续 10m——OOMKilled 风险
    # 2026-11-01 PLAN-064：同 PodCpuUsageHigh 的标签集不匹配缺陷——两侧都按
    # pod/container 归一后才可能匹配（原式 LHS 带 namespace/container，RHS 多
    # resource，恒空 ⇒ 从未触发；实测恒定 95% 使用率 14 分钟 got:[]）。
    - alert: PodMemoryUsageHigh
      expr: |
        (
          sum by (pod, container) (container_memory_working_set_bytes{namespace="nexus", container!="", container!="POD"})
          /
          clamp_min(sum by (pod, container) (kube_pod_container_resource_limits{namespace="nexus", resource="memory"}), 1)
        ) > 0.90
      for: 10m
      labels:
        severity: warning
        component: resource
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "Pod {{ $labels.pod }} 内存使用率高于 90%"
        description: "容器 {{ $labels.container }} 内存使用率持续超过 limit 的 90%，OOMKilled 风险高。请扩容或排查内存泄漏。"

  # ---- 基础设施可达性（2026-09-09 告警真值整合：自 legacy alerting-rules.yaml 并入） ----
  - name: nexuschain.infra
    interval: 30s
    rules:
    # 任何 NexusChain 服务抓取失败 1m——最基础的服务在线信号
    - alert: ServiceDown
      expr: |
        up{job=~"nexus-.*", namespace="nexus"} == 0
      for: 1m
      labels:
        severity: critical
        component: service
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "服务 {{ $labels.job }} 不可达"
        description: "Prometheus 抓取 {{ $labels.job }} ({{ $labels.instance }}) 连续 1 分钟失败。可能因 Pod 崩溃、Service 端口错误或 NetworkPolicy 阻断。"

    # Seata TC 不可达 1m——分布式事务协调器（gateway/wallet/signing 依赖）
    # 注意：仅当 Seata TC 有对应 Prometheus 抓取目标（job=seata-tc）时生效；
    # 无抓取目标时 up 序列缺失、表达式无数据、不触发（部署演练 2026-09-10
    # 实测修正：原 absent() 分支在无目标时恒为 1 造成永久假告警——已移除，
    # 与 ServiceDown 同语义）。
    - alert: SeataTcDown
      expr: |
        up{job="seata-tc", namespace="nexus"} == 0
      for: 1m
      labels:
        severity: critical
        component: seata
      annotations:
        runbook_url: "https://github.com/Levango7/NexusChain/blob/master/docs/runbooks/alerts.md"
        summary: "Seata TC 事务协调器不可达"
        description: "Seata TC Server 连续 1 分钟不可达，分布式事务无法提交/回滚，可能造成支付与桥操作挂起。请优先恢复 Seata TC。"
