# core 链节点 genesis ConfigMap —— K8s 清单路径
# ============================================================================
# L3 预演缺陷 #19：nexus-core chart 与 20-core-statefulset.yml 都引用
# ConfigMap `nexus-genesis`（init 容器 cp /genesis/* /data/；应用读
# /data/nexus-genesis-generator.json 与 /data/validators.json），
# 但**两条交付路径都没有创建它**、runbook 也无该步骤 → core Pod 永久
# FailedMount / PodInitializing。
#
# 内容源 = 本目录 genesis.json（链参数）与 validators.json（初始验证人集合）。
# 两条路径都需先 apply 本文件（helm 路径同样，chart 有意不管理 genesis 内容——
# 生产替换为客户自己的链参数文件）。
# 生产注意：validators.json 的 pubkey 占位符必须替换为客户真实验证人公钥。
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-genesis
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus-core
    app.kubernetes.io/part-of: nexus
data:
  nexus-genesis-generator.json: |
    {
      "version": 1,
      "chainId": "nexus-mainnet",
      "timestamp": 1700000000,
      "difficulty": 1,
      "blockInterval": 10,
      "maxBlockSize": 2097152,
      "initialAllocations": [
        {"address": "1GenesisFundAddress000000000000000", "amount": 100000000000000},
        {"address": "1ValidatorReserve000000000000000000", "amount": 50000000000000}
      ],
      "consensus": {
        "type": "pow+vrf",
        "minValidators": 3,
        "maxValidators": 21,
        "epochLength": 100,
        "vrfSeed": "nexus-genesis-seed-v1"
      },
      "paymentExtensions": {
        "channelEnabled": true,
        "stableCoinEnabled": true,
        "bridgeEnabled": true,
        "subscriptionEnabled": true,
        "minCollateralRatio": 150
      }
    }
  validators.json: |
    {
      "validators": [
        {"id": "nexus-core-0", "pubkey": "validator0_pubkey_placeholder", "weight": 1},
        {"id": "nexus-core-1", "pubkey": "validator1_pubkey_placeholder", "weight": 1},
        {"id": "nexus-core-2", "pubkey": "validator2_pubkey_placeholder", "weight": 1},
        {"id": "nexus-core-3", "pubkey": "validator3_pubkey_placeholder", "weight": 1}
      ],
      "threshold": 3
    }
