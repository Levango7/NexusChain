# ============================================================================
# REQ-37 / T37: nexus-bridge Deployment + Service
# 端口 8084（与 application.yml server.port 对齐，REQ-29 修正）
# 参照 10-gateway.yml 模式
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-bridge
  namespace: nexus
  labels:
    app: nexus-bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-bridge
  template:
    metadata:
      labels:
        app: nexus-bridge
    spec:
      automountServiceAccountToken: false
      # REQ-40/P2: 跨可用区打散 Pod
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nexus-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # P2 加固：readOnlyRootFilesystem 配套 emptyDir 卷
      volumes:
        - name: tmp
          emptyDir: {}
        - name: spring-tmp
          emptyDir: {}
      containers:
        - name: bridge
          image: ghcr.io/levango7/nexuschain/nexus-bridge:2.1.0
          securityContext:
            allowPrivilegeEscalation: false
            # P2 加固：readOnlyRootFilesystem + emptyDir 挂载 /tmp
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JAVA_TOOL_OPTIONS
              value: "-Djava.io.tmpdir=/tmp"
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          # P2 加固：可写临时目录挂载为 emptyDir
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spring-tmp
              mountPath: /app/tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/bridge/status
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/bridge/status
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-bridge
  namespace: nexus
spec:
  type: ClusterIP
  selector:
    app: nexus-bridge
  ports:
    - port: 8084
      targetPort: 8084
