apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexus-core
  namespace: nexus
spec:
  serviceName: nexus-core
  replicas: 4
  selector:
    matchLabels:
      app: nexus-core
  template:
    metadata:
      labels:
        app: nexus-core
    spec:
      # core 不调用 K8s API（共识/P2P 走 grpc），禁用 SA token
      automountServiceAccountToken: false
      # REQ-40/P2: 跨可用区打散 Pod（StatefulSet 用 ScheduleAnyway 容忍 zone 不均）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nexus-core
      # Pod 级安全上下文
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # L3 预演缺陷 #28：init-genesis 容器已移除（缺省用镜像内置 classpath genesis）。
      # 自定义 genesis 时恢复本块（并加回 /genesis 卷与 GENESIS_FILE/VALIDATORS env）：
      # initContainers:
      #   - name: init-genesis
      #     image: busybox:1.36
      #     command: ["sh", "-c", "cp /genesis/* /data/ 2>/dev/null || true"]
      #     volumeMounts:
      #       - name: genesis-config
      #         mountPath: /genesis
      #       - name: core-data
      #         mountPath: /data
      containers:
        - name: core
          # TODO: 固定为不可变 tag（semver 或 sha256 digest）
          image: ghcr.io/levango7/nexuschain/nexus-core:v2.75.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # 链数据写在挂载的 core-data PVC；/tmp 需可写
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 19585
              name: rpc
            - containerPort: 9585
              name: p2p
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 2026-10-12 更正：core **确实**需要 PG（链状态 JDBC 存储：RDBMSBlockChainImpl +
            # ddl.sql，schema 用 bytea / 双引号标识符）。业务库已切 MySQL，core 例外保留 PG。
            - name: DATA_SOURCE_URL
              value: "jdbc:postgresql://postgres:5432/nexus_core"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: NEX_DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: NEX_DB_PASSWORD
            - name: P2P_MODE
              value: "grpc"
            - name: ENABLE_MINING
              value: "true"
            # L3 复验缺陷 #32：ENABLE_MINING=true 时 coinbase 必须可解析为 base58 地址
            # （application.properties 默认值是占位句 → 解析失败 core 起不来）。
            # 生产替换为客户矿工地址。
            - name: NEX_MINER_COINBASE
              value: "19JNq2jAprkxVrpkgBiRaa1m47WcUMXtCb"
            - name: ENABLE_DISCOVERY
              value: "true"
            - name: BOOTSTRAPS
              value: "nexus://nexus-core-0.nexus-core:9585,nexus://nexus-core-1.nexus-core:9585,nexus://nexus-core-2.nexus-core:9585,nexus://nexus-core-3.nexus-core:9585"
            # L3 复验缺陷 #35：Leveldb 的 nexus.cache-dir 默认 ./leveldb（WORKDIR /app，
            # 非 root 不可写）→ 指向 PVC 子目录（core-data 挂 /data）
            - name: CACHE_DIR
              value: "/data/leveldb"
            # L3 复验缺陷 #37：JWTUtil 启动即校验 app-id/app-secret（fail-closed）
            - name: NEXUS_JWT_APP_ID
              value: "nexus-core"
            - name: NEXUS_JWT_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: NEXUS_JWT_APP_SECRET
            # L3 预演缺陷 #28：GENESIS_FILE / VALIDATORS 不再无条件指向 /data/*。
            # 缺省 = 用 core 镜像内置的 classpath genesis（nexus-core/src/main/resources/
            # genesis/，schema 以该目录文件为准）。自定义链参数 = 单独建 ConfigMap
            # （键 nexus-genesis-generator.json + validators.json，见 05-core-genesis.yml.example）
            # 并在此加回 GENESIS_FILE=/data/nexus-genesis-generator.json、
            # VALIDATORS=/data/validators.json 两个 env + /genesis 卷 + init 拷贝容器。
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - name: core-data
              mountPath: /data
            # L3 预演缺陷 #24：logback 写相对路径 ./logs（WORKDIR=/app，镜像内不可写）
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /height
              port: 19585
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /height
              port: 19585
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        # L3 预演缺陷 #24：/app/logs 空卷（logback 写相对路径 ./logs，镜像内 /app 不可写）
        - name: logs
          emptyDir: {}
        # L3 预演缺陷 #28：genesis 卷已移除（缺省用镜像内置 classpath genesis；自定义见 env 处注释）
  volumeClaimTemplates:
    - metadata:
        name: core-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-core
  namespace: nexus
spec:
  clusterIP: None
  selector:
    app: nexus-core
  ports:
    - name: rpc
      port: 19585
    - name: p2p
      port: 9585
