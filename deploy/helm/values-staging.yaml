# NexusChain staging 环境覆盖
# ============================================================================
# 用法：helm upgrade --install nexus-chain deploy/helm/ \
#        -f deploy/helm/values-staging.yaml -n nexus-staging
# 特征：双副本、中资源、HPA 2-4、镜像 tag=staging、PDB minAvailable=1
# ============================================================================

global:
  env: staging
  namespace: nexus-staging
  imagePullPolicy: IfNotPresent
  # L3 预演（缺陷 #17）：应用侧只发布 dev/prod/test profile，无 application-staging.yml；
  # staging **环境**（副本/资源/tag 不同）照样用 prod profile 启动应用。
  springProfile: prod
  serviceMonitor:
    enabled: true
  networkPolicy:
    enabled: true

# -- staging：副本 2、资源 512Mi/1、HPA 2-4、tag=staging
nexus-gateway:
  replicaCount: 2
  image:
    tag: staging
  resources:
    requests:
      memory: 512Mi
      cpu: 1000m
    limits:
      memory: 1Gi
      cpu: 2000m
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 1

nexus-bridge:
  replicaCount: 2
  image:
    tag: staging
  resources:
    requests:
      memory: 512Mi
      cpu: 1000m
    limits:
      memory: 1Gi
      cpu: 2000m
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 1

nexus-signing-service:
  replicaCount: 2
  image:
    tag: staging
  resources:
    requests:
      memory: 512Mi
      cpu: 1000m
    limits:
      memory: 1Gi
      cpu: 2000m
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 1
  # P0-10 审计修复：接入 mpc-engine（同 values-prod.yaml，证书来自 nexus-mpc-certs Secret）
  # === 2026-10-08：staging 升到全分布式 CGGMP21（与 prod 同口径，GG20 已退役）===
  # 此前 staging 只开传输层、协议层无真实引擎（cggmp-enabled=false ⇒ 冷钱包走
  # FROZEN skeleton 记账）。现对齐 prod：transport + distributed + cggmp 全开。
  # **集群前置（部署前必须齐备，否则 signing-service 启动 fail-closed 拒起）**：
  #   1. mpc-engine chart 已部署且 3 副本 Running（nodes 有 PVC，MPC_ENGINE_SESSION_DIR
  #      指向 /app/sessions ⇒ 份额落盘）；
  #   2. Secret：`mpc-engine-secret`（storage-key / storage-key-version / auth-token，
  #      经 sealed-secrets 或等价机制注入）与 `mpc-engine-tls`（每 Pod 证书；
  #      用 chart values `secrets.tlsCerts` 或 operator 预置——见
  #      docs/runbooks/sealed-secrets.md 与 deploy/k8s/SECRET-MANAGEMENT.md）；
  #   3. `nexus-mpc-certs`（signing-service 客户端证书 + CA，本文件下方挂载）；
  #   4. **每钱包跑过 DKG 仪式**（keyshare 供给）：
  #      python3 scripts/mpc-wallet-ceremony.py --wallet <walletId>   #        --endpoints mpc-engine-0.mpc-engine-headless:50051,...   #        --cacert <CA.pem> --client-cert <cert.pem> --client-key <key.pem> --token <MPC_AUTH_TOKEN>
  #      未跑仪式的钱包在签名时以 "key_share missing" fail-closed（不静默降级）。
  extraEnv:
    NEX_MPC_TRANSPORT_GRPC: "true"
    NEX_MPC_ENGINE_ENDPOINTS: "mpc-engine-0.mpc-engine-headless:50051,mpc-engine-1.mpc-engine-headless:50051,mpc-engine-2.mpc-engine-headless:50051"
    NEX_MPC_ENGINE_TLS_TRUST_CERT: "/etc/mpc/certs/ca/CA.pem"
    NEX_MPC_ENGINE_TLS_CLIENT_CERT: "/etc/mpc/certs/node-A/cert.pem"
    NEX_MPC_ENGINE_TLS_CLIENT_KEY: "/etc/mpc/certs/node-A/key.pem"
    # 与 prod 同值同语义（阈值/签名方集合/超时口径一致，staging 才有等价性）
    NEX_MPC_ENGINE_DISTRIBUTED: "true"
    NEX_MPC_ENGINE_CGGMP_ENABLED: "true"
    NEX_MPC_ENGINE_CGGMP_SIGNERS: "0,1"
    NEX_MPC_ENGINE_CGGMP_DEADLINE_MS: "300000"
    NEX_MPC_ENGINE_TLS_OVERRIDE_AUTHORITY: "localhost"
    # 另需 NEX_MPC_ENGINE_AUTH_TOKEN（与 mpc-engine 的 MPC_AUTH_TOKEN 同值），
    # 经 <chart>-secret（envFrom secretRef）注入，禁止明文入仓。"
  extraVolumes:
    - name: mpc-certs
      secret:
        secretName: nexus-mpc-certs
        optional: false
  extraVolumeMounts:
    - name: mpc-certs
      mountPath: /etc/mpc/certs
      readOnly: true

# -- mpc-engine（MPC 密码学引擎；GG20 退役后 staging 与 prod 同为全 CGGMP21）
# staging 的引擎密钥同样经 Secret 注入（禁止明文入仓）：
#   · 推荐：sealed-secrets（与 prod 同机制）——sealedSecretName 置 mpc-engine-secret；
#   · 冒烟/临时环境：可临时走 chart 明文 stringData 模式，但**不得提交真实密钥**。
# 证书：secrets.tlsCerts（每 Pod node-{0,1,2} 证书）或 operator 预置 mpc-engine-tls；
# 缺失时引擎因 MPC_REQUIRE_TLS=true 拒启（fail-closed，不会静默明文）。
mpc-engine:
  secrets:
    sealedSecretName: mpc-engine-secret

nexus-wallet-service:
  replicaCount: 2
  image:
    tag: staging
  resources:
    requests:
      memory: 512Mi
      cpu: 1000m
    limits:
      memory: 1Gi
      cpu: 2000m
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 1
  # A2（ADR-036 §2.2）：业务审批单笔豁免凭据——**当前关闭**（2026-10-31，创始人指示）。
  # 为什么关：开关自 2026-10-29 开启，但 staging 从未下发 NEX_WALLET_PLATFORM_PUBKEY，
  # A2 提现腿会在执行前 fail-closed 拒绝（每笔都失败）。该公钥须由部署方从 signing
  # 平台热钱包 keystore 导出（POST /api/v1/signing/keystoreToPubkey）后下发，值不入仓。
  # 回滚即本条：删 extraEnv 重部署，零迁移、零数据库变更。
  # 重开步骤：extraEnv 同时下发 NEX_WALLET_PLATFORM_PUBKEY 与
  # NEXUS_SIGNING_BUSINESS_APPROVAL_ENABLED: "true"（口径见板 20261031-0310）。

# -- 2026-10-19：区块浏览器（k8s/Helm 双路径补齐；前端为静态托管 + 只读查询，
#    资源需求低于 Java 栈）
nexus-explorer:
  replicaCount: 2
  image:
    tag: staging
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 1