# Deployment：通用模板，4 个服务子 chart 共享（通过 .Chart.Name 自动适配）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.global.namespace | default "nexus" }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ .Values.global.partOfLabel | default "nexus" }}
    {{- with .Values.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: {{ .Values.global.partOfLabel | default "nexus" }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # ConfigMap/Secret 变更时滚动重启（对 values 内容做 checksum）
        checksum/config: {{ .Values.config.applicationYml | sha256sum | quote }}
        checksum/secret: {{ .Values.secrets.stringData | toYaml | sha256sum | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.global.securityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image.repository | default (printf "%s/%s" .Values.global.imageRegistry .Chart.Name) }}:{{ .Values.image.tag | default .Values.global.env | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          ports:
            - name: {{ .Values.service.name }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | default .Values.global.springProfile | default .Values.global.env | default "prod" | quote }}
            {{- if .Values.dependencies.nacos }}
            - name: NEX_NACOS_SERVER
              value: {{ printf "%s:%s" .Values.global.infrastructure.nacos.host (toString .Values.global.infrastructure.nacos.httpPort) | quote }}
            - name: NEX_NACOS_GRPC_SERVER
              value: {{ printf "%s:%s" .Values.global.infrastructure.nacos.host (toString .Values.global.infrastructure.nacos.grpcPort) | quote }}
            {{- end }}
            {{- if .Values.dependencies.seata }}
            - name: NEX_SEATA_SERVER
              value: {{ printf "%s:%s" .Values.global.infrastructure.seata.host (toString .Values.global.infrastructure.seata.tcPort) | quote }}
            {{- end }}
            {{- if .Values.dependencies.sentinel }}
            - name: NEX_SENTINEL_SERVER
              value: {{ printf "%s:%s" .Values.global.infrastructure.sentinel.host (toString .Values.global.infrastructure.sentinel.port) | quote }}
            # L3 预演复验缺陷 #44：SentinelHealthIndicator 把"心跳发不到 dashboard"
            # 判成 DOWN → /actuator/health 503 → 探针杀 Pod 反复重启。
            # K8s 参考交付不含 Sentinel dashboard → 停用该健康项（熔断/限流功能不受影响）。
            - name: MANAGEMENT_HEALTH_SENTINEL_ENABLED
              value: "false"
            {{- end }}
            {{- if .Values.dependencies.zipkin }}
            - name: NEX_ZIPKIN_ENDPOINT
              value: {{ printf "http://%s:%s/api/v2/spans" .Values.global.infrastructure.zipkin.host (toString .Values.global.infrastructure.zipkin.port) | quote }}
            {{- end }}
            # L3 预演复验缺陷 #43：事件溯源/死信队列默认 store=kafka（matchIfMissing=true），
            # 而 K8s 参考交付**不含 Kafka** → KafkaTemplate bean 缺失、网关起不来
            # （dev/sandbox profile 早有同款 memory 开关，prod 漏了）。
            # 默认 memory；接 Kafka 的部署把 eventSourcingStore 改回 kafka。
            - name: NEXUS_EVENTSOURCING_STORE
              value: {{ .Values.eventSourcingStore | default "memory" | quote }}
            - name: NEXUS_WEBHOOK_DLQ_STORE
              value: {{ .Values.eventSourcingStore | default "memory" | quote }}
            {{- if .Values.dependencies.mysql }}
            - name: SPRING_DATASOURCE_URL
              value: {{ printf "jdbc:mysql://%s:%s/%s?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" .Values.global.infrastructure.mysql.host (toString .Values.global.infrastructure.mysql.port) (.Values.dependencies.mysqlDatabase | default (replace "-" "_" .Chart.Name)) | quote }}
            {{- end }}
            {{- if .Values.dependencies.redis }}
            - name: SPRING_REDIS_HOST
              value: {{ .Values.global.infrastructure.redis.host | quote }}
            - name: SPRING_REDIS_PORT
              value: {{ toString .Values.global.infrastructure.redis.port | quote }}
            {{- end }}
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
            # L3 缺陷 #15b：共享凭据库（nexus-secrets，SECRET-MANAGEMENT.md 唯一钥匙库：
            # NEX_DB_*/NEX_MASTER_KEY/NEX_WEBHOOK_SECRET）。放在本服务 secret 之前，
            # 同名键以后者为准 → 仍可按服务覆盖。
            - secretRef:
                name: nexus-secrets
            - secretRef:
                name: {{ .Chart.Name }}-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path }}
              port: {{ .Values.probes.liveness.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path }}
              port: {{ .Values.probes.readiness.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.httpGet.path }}
              port: {{ .Values.probes.startup.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config/application.yml
              subPath: application.yml
              readOnly: true
            # L3 预演复验缺陷 #42：logback（来自 nexus-core 共享 logback.xml）的 FILE
            # appender 写相对路径 ./logs/nexuscore.log，镜像内 /app 不可写，且被
            # AsyncAppender 包裹 → 致命错误随进程退出丢失（日志在 Flyway 后截断）。
            - name: logs
              mountPath: /app/logs
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Chart.Name }}-config
        - name: logs
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
