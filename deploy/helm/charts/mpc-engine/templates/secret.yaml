# Secret：敏感配置（storage_key / auth_token）+ TLS 证书引用
# ============================================================================
# ⚠️ 明文仅占位；生产用 sealed-secrets / external-secrets / SOPS 注入，避免明文入仓
#
# TLS 证书通过 Secret 卷挂载到 /etc/mpc/tls/，每副本通过 subPath 读取自己的证书：
#   mpc-engine-0 -> node-0 证书（tls.crt / tls.key）
#   mpc-engine-1 -> node-1 证书
#   mpc-engine-2 -> node-2 证书
# CA 证书（ca.crt）所有副本共享
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" .Chart.Name }}
  namespace: {{ .Values.global.namespace | default "nexus" }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ .Values.global.partOfLabel | default "nexus" }}
    app.kubernetes.io/component: mpc-engine
type: Opaque
stringData:
  # storage_key：AES-256-GCM 加密密钥（hex 32 字节 = 64 字符）
  # 生产环境通过 KMS / sealed-secrets 注入
  {{- if .Values.storageKey }}
  storage-key: {{ .Values.storageKey | quote }}
  {{- end }}
  # storage_key_version：密钥版本号（用于密钥轮换，默认 1）
  {{- if .Values.storageKeyVersion }}
  storage-key-version: {{ .Values.storageKeyVersion | quote }}
  {{- end }}
  # auth-token：gRPC Bearer token（MPC-P1-05）
  {{- if .Values.authToken }}
  auth-token: {{ .Values.authToken | quote }}
  {{- end }}
  # 用户自定义 stringData
  {{- with .Values.secrets.stringData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
# TLS 证书 Secret（每副本独立证书）
# ============================================================================
# K8s 说明（K 批 kind 冒烟修正）：原 type: kubernetes.io/tls + 嵌套键
# （node-0.tls.crt 等）是无效组合——kubernetes.io/tls 强制要求顶层
# tls.crt/tls.key 两键，嵌套 map 会被 API server 直接拒绝（此前从未
# 真实 install 故未暴露）。改为 Opaque + 扁平键名（点号展开）：
#   node-0.tls.crt / node-0.tls.key / node-1.* / node-2.* / ca.tls.crt
# initContainer 按 POD_ORDINAL 拷贝本方证书到 tmpfs /etc/mpc/tls/
# （容器内路径与 node.json 模板的 tls_cert/tls_key/tls_ca 对齐不变）。
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-tls" .Chart.Name }}
  namespace: {{ .Values.global.namespace | default "nexus" }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ .Values.global.partOfLabel | default "nexus" }}
    app.kubernetes.io/component: mpc-engine
type: Opaque
{{- with .Values.secrets.tlsCerts }}
stringData:
  {{- range $party, $certs := . }}
  {{- range $key, $val := $certs }}
  {{ printf "%s.%s" $party $key }}: |-
{{ $val | indent 4 }}
  {{- end }}
  {{- end }}
{{- end }}