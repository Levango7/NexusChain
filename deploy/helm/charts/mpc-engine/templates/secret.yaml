# Secret：敏感配置（storage_key / auth_token）+ TLS 证书引用
# ============================================================================
# ⚠️ 明文仅占位；生产用 sealed-secrets / external-secrets / SOPS 注入，避免明文入仓
#
# TLS 证书通过 Secret 卷挂载到 /etc/mpc/tls/，每副本通过 subPath 读取自己的证书：
#   mpc-engine-0 -> node-0 证书（tls.crt / tls.key）
#   mpc-engine-1 -> node-1 证书
#   mpc-engine-2 -> node-2 证书
# CA 证书（ca.crt）所有副本共享
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" .Chart.Name }}
  namespace: {{ .Values.global.namespace | default "nexus" }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ .Values.global.partOfLabel | default "nexus" }}
    app.kubernetes.io/component: mpc-engine
type: Opaque
stringData:
  # storage_key：AES-256-GCM 加密密钥（hex 32 字节 = 64 字符）
  # 生产环境通过 KMS / sealed-secrets 注入
  {{- if .Values.storageKey }}
  storage-key: {{ .Values.storageKey | quote }}
  {{- end }}
  # auth-token：gRPC Bearer token（MPC-P1-05）
  {{- if .Values.authToken }}
  auth-token: {{ .Values.authToken | quote }}
  {{- end }}
  # 用户自定义 stringData
  {{- with .Values.secrets.stringData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
# TLS 证书 Secret（每副本独立证书，通过 subPath 挂载）
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-tls" .Chart.Name }}
  namespace: {{ .Values.global.namespace | default "nexus" }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ .Values.global.partOfLabel | default "nexus" }}
    app.kubernetes.io/component: mpc-engine
type: kubernetes.io/tls
{{- with .Values.secrets.tlsCerts }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}