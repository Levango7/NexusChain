apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nexus-core.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "nexus-core.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ include "nexus-core.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nexus-core.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nexus-core.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # core 不调用 K8s API（共识/P2P 走 grpc），禁用 SA token
      automountServiceAccountToken: false
      # REQ-40/P2: 跨可用区打散 Pod（StatefulSet 用 ScheduleAnyway 容忍 zone 不均）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "nexus-core.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 初始化容器需拷贝 genesis；仅做文件复制，收紧提权与 capabilities
        - name: init-genesis
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command: ["sh", "-c", "cp /genesis/* /data/ 2>/dev/null || true"]
          volumeMounts:
            - name: genesis-config
              mountPath: /genesis
            - name: core-data
              mountPath: /data
      containers:
        - name: core
          image: {{ .Values.image.repository | default (printf "%s/%s" .Values.global.imageRegistry .Chart.Name) }}:{{ .Values.image.tag | default .Values.global.env | default "latest" }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default .Values.global.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # 链数据写在挂载的 core-data PVC；/tmp 需可写
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 19585
              name: rpc
            - containerPort: 9585
              name: p2p
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATA_SOURCE_URL
              value: {{ .Values.env.DATA_SOURCE_URL | quote }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: NEX_DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: NEX_DB_PASSWORD
            - name: P2P_MODE
              value: {{ .Values.env.P2P_MODE | quote }}
            - name: ENABLE_MINING
              value: {{ .Values.env.ENABLE_MINING | quote }}
            - name: ENABLE_DISCOVERY
              value: {{ .Values.env.ENABLE_DISCOVERY | quote }}
            - name: BOOTSTRAPS
              value: {{ include "nexus-core.bootstraps" . | quote }}
            - name: GENESIS_FILE
              value: "/data/nexus-genesis-generator.json"
            - name: VALIDATORS
              value: "/data/validators.json"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: core-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /height
              port: 19585
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /height
              port: 19585
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
      volumes:
        - name: genesis-config
          configMap:
            name: {{ .Values.genesisConfigMap }}
  volumeClaimTemplates:
    - metadata:
        name: core-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storageSize }}
