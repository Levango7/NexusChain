apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nexus-core.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "nexus-core.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ include "nexus-core.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nexus-core.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nexus-core.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # core 不调用 K8s API（共识/P2P 走 grpc），禁用 SA token
      automountServiceAccountToken: false
      # REQ-40/P2: 跨可用区打散 Pod（StatefulSet 用 ScheduleAnyway 容忍 zone 不均）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "nexus-core.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.genesisConfigMap }}
      initContainers:
        # 初始化容器需拷贝 genesis；仅做文件复制，收紧提权与 capabilities
        - name: init-genesis
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command: ["sh", "-c", "cp /genesis/* /data/ 2>/dev/null || true"]
          volumeMounts:
            - name: genesis-config
              mountPath: /genesis
            - name: core-data
              mountPath: /data
      {{- end }}
      containers:
        - name: core
          image: {{ .Values.image.repository | default (printf "%s/%s" .Values.global.imageRegistry .Chart.Name) }}:{{ .Values.image.tag | default .Values.global.env | default "latest" }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default .Values.global.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # 链数据写在挂载的 core-data PVC；/tmp 需可写
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 19585
              name: rpc
            - containerPort: 9585
              name: p2p
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATA_SOURCE_URL
              value: {{ .Values.env.DATA_SOURCE_URL | quote }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: NEX_DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: NEX_DB_PASSWORD
            - name: P2P_MODE
              value: {{ .Values.env.P2P_MODE | quote }}
            - name: ENABLE_MINING
              value: {{ .Values.env.ENABLE_MINING | quote }}
            # L3 复验缺陷 #32：ENABLE_MINING=true 时 ConsensusConfig 解析 coinbase
            # （base58）；application.properties 默认值是占位句 → 解析失败 core 起不来。
            - name: NEX_MINER_COINBASE
              value: {{ .Values.env.NEX_MINER_COINBASE | default "19JNq2jAprkxVrpkgBiRaa1m47WcUMXtCb" | quote }}
            - name: ENABLE_DISCOVERY
              value: {{ .Values.env.ENABLE_DISCOVERY | quote }}
            - name: BOOTSTRAPS
              value: {{ include "nexus-core.bootstraps" . | quote }}
            # L3 复验缺陷 #35：Leveldb 用 nexus.cache-dir（默认 ./leveldb → WORKDIR /app，
            # 非 root 不可写 → FileNotFoundException: /app/leveldb/LOCK）。指向 PVC 子目录。
            - name: CACHE_DIR
              value: "/data/leveldb"
            # L3 复验缺陷 #37：core 的 JWTUtil 启动即校验 nexus.security.jwt.app-id
            # 与 app-secret（fail-closed）。app-id 走普通 env，app-secret 走 nexus-secrets。
            - name: NEXUS_JWT_APP_ID
              value: "nexus-core"
            - name: NEXUS_JWT_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: NEXUS_JWT_APP_SECRET
            {{- if .Values.genesisConfigMap }}
            # 仅在提供自定义 genesis ConfigMap 时覆盖；否则用镜像内置 classpath
            # genesis（缺陷 #28：旧口径无条件指向 /data/*，ConfigMap 缺失即 genesis
            # bean 为 null、core 起不来）
            - name: GENESIS_FILE
              value: "/data/nexus-genesis-generator.json"
            - name: VALIDATORS
              value: "/data/validators.json"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: core-data
              mountPath: /data
            # L3 预演（缺陷 #24）：logback 的 FILE appender 写相对路径 ./logs/nexuscore.log
            # （WORKDIR=/app），而镜像内 /app 由 root 拥有且非 root 运行 → 无法建目录，
            # logback 配置即失败（IllegalStateException: Failed to create parent directories）。
            # 挂 emptyDir；pod fsGroup=1000 保证可写。
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /height
              port: 19585
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /height
              port: 19585
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
      volumes:
        {{- if .Values.genesisConfigMap }}
        - name: genesis-config
          configMap:
            name: {{ .Values.genesisConfigMap }}
        {{- end }}
        # L3 预演缺陷 #24（见容器 volumeMounts 注释）
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: core-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storageSize }}
