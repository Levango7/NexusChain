# nexus-core 子 chart 默认值
# P0-10 审计修复：此前 helm umbrella 不部署链节点（静态清单 deploy/k8s/20-core-statefulset.yml
# 与 helm 路径脱节），本 chart 以该清单为底稿收编进 umbrella。

# -- StatefulSet 副本数（验证人节点数；BOOTSTRAPS 按此生成）
replicaCount: 4

image:
  # -- 镜像仓库；为空时用 {{ global.imageRegistry }}/nexus-core
  repository: ""
  # -- 镜像 tag；为空时回退 global.env；发布流程由 release.yml --set 覆盖
  tag: ""

imagePullPolicy: IfNotPresent

# -- 链数据 PVC 大小
storageSize: 50Gi

# -- genesis ConfigMap（**可选**；L3 预演缺陷 #28 修正）
#    留空（默认）= 用镜像内置的 classpath genesis
#      （nexus-core/src/main/resources/genesis/NexusChain-genesis-generator.json
#       + validators.json；schema 以该文件为准——6.3 万行，超 ConfigMap 1MiB 上限，
#       自定义必须裁剪后单独建 ConfigMap）。
#    非空 = 挂该 ConfigMap 到 /genesis，init 容器复制到 /data，并设置
#      GENESIS_FILE=/data/nexus-genesis-generator.json 与 VALIDATORS=/data/validators.json。
#    ⚠️ deploy/k8s/genesis.json 与 validators.json 是旧占位、**schema 与 core 不符**，
#       不要直接拿来建：core 的 Genesis 模型要求 config{chainId,Block}/coinbase/nBits/
#       nonce/alloc{incubateAmount,initAmount,userIncubateAmount}，validators 是 URL 数组。
#       生产用客户自己的链参数。
genesisConfigMap: ""

# -- 既有凭据 Secret（nexus-secrets：NEX_DB_USERNAME / NEX_DB_PASSWORD）
existingSecret: nexus-secrets

env:
  # 2026-10-12 更正：core **确实**需要 PG（链状态 JDBC 存储，ddl.sql 为 PG 方言）。
  # 业务库已切 MySQL，core 例外保留 PG —— 详见 docker-compose.prod.yml 的 core 段注释。
  DATA_SOURCE_URL: "jdbc:postgresql://postgres.nexus.svc.cluster.local:5432/nexus_core"
  P2P_MODE: "grpc"
  ENABLE_MINING: "true"
  ENABLE_DISCOVERY: "true"
  # L3 复验缺陷 #32：ENABLE_MINING=true 时 ConsensusConfig 会解析 coinbase
  # （base58 地址），而 application.properties 的默认值是占位句
  # "your coin base address" → AuditCharacter 解析失败、core 起不来。
  # 默认值取仓库既有的 dev 地址（application-local.properties 同源）；
  # 生产必须替换为客户自己的矿工地址。
  NEX_MINER_COINBASE: "19JNq2jAprkxVrpkgBiRaa1m47WcUMXtCb"

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

# -- Prometheus 抓取（PLAN-002 后续 2026-09-07）：
# 应用侧已暴露 /actuator/prometheus（actuator + micrometer，同 19585 端口）；
# 启用条件 = 本开关 AND global.serviceMonitor.enabled（与 gateway 等 6 chart 一致）。
serviceMonitor:
  enabled: true
  # rpc 端口（19585，headless Service 定义）——actuator 与 RPC 同端口
  interval: ""

# -- 探针（/height 只读端点）
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10

global:
  # -- 部署目标环境：dev / staging / prod（同时作为镜像 tag 兜底）
  env: staging
  # -- GHCR registry 前缀
  imageRegistry: "ghcr.io/levango7/nexuschain"
  imagePullPolicy: IfNotPresent
  # -- ServiceMonitor 总开关（umbrella 层覆盖；子 chart 独立 lint 需此默认值，
  #    否则模板 nil pointer —— gateway 等 6 chart 同款结构）
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
    interval: 30s
