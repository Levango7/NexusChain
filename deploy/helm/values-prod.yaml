# NexusChain prod 环境覆盖
# ============================================================================
# 用法：helm upgrade --install nexus-chain deploy/helm/ \
#        -f deploy/helm/values-prod.yaml -n nexus
# 特征：三副本、高资源、HPA 3-10、PDB minAvailable=2、固定版本 tag、
#       多 AZ topologySpreadConstraints、imagePullPolicy=IfNotPresent
# ============================================================================

global:
  env: prod
  namespace: nexus
  imagePullPolicy: IfNotPresent
  springProfile: prod
  serviceMonitor:
    enabled: true
  networkPolicy:
    enabled: true

# -- prod：副本 3、资源 1Gi/2、HPA 3-10、PDB minAvailable=2、固定 tag、多 AZ
nexus-gateway:
  replicaCount: 3
  image:
    # 固定不可变 tag（semver），禁止 latest
    tag: 2.50.0
  resources:
    requests:
      memory: 1Gi
      cpu: 2000m
    limits:
      memory: 2Gi
      cpu: 4000m
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 2
  # 多 AZ 反亲和：topologySpreadConstraints 跨 zone 均匀分布
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nexus-gateway

nexus-bridge:
  replicaCount: 3
  image:
    tag: 2.50.0
  resources:
    requests:
      memory: 1Gi
      cpu: 2000m
    limits:
      memory: 2Gi
      cpu: 4000m
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nexus-bridge

nexus-signing-service:
  replicaCount: 3
  image:
    tag: 2.50.0
  resources:
    requests:
      memory: 1Gi
      cpu: 2000m
    limits:
      memory: 2Gi
      cpu: 4000m
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nexus-signing-service
  # P0-10 审计修复：接入 mpc-engine（umbrella 现已部署 mpc-engine chart，
  # 端点为 StatefulSet 逐 Pod headless DNS）。证书由 nexus-mpc-certs Secret
  # 提供（部署前注入 mTLS CA/客户端证书，见 SECRET-MANAGEMENT.md）。
  extraEnv:
    NEX_MPC_TRANSPORT_GRPC: "true"
    NEX_MPC_ENGINE_ENDPOINTS: "mpc-engine-0.mpc-engine-headless:50051,mpc-engine-1.mpc-engine-headless:50051,mpc-engine-2.mpc-engine-headless:50051"
    NEX_MPC_ENGINE_TLS_TRUST_CERT: "/etc/mpc/certs/ca/CA.pem"
    NEX_MPC_ENGINE_TLS_CLIENT_CERT: "/etc/mpc/certs/node-A/cert.pem"
    NEX_MPC_ENGINE_TLS_CLIENT_KEY: "/etc/mpc/certs/node-A/key.pem"
    # P0-1（B2 验收：无单进程全份额路径）——生产强制分布式 CGGMP21：
    #   distributed-mode=true：endpoints 必须 >=3，partyIndex 超界 fail-closed
    #     （不再回退端点 0，杜绝错误路由）；
    #   cggmp-enabled=true：编排层走 CGGMP21 原生 t-of-n，份额加密驻留各引擎
    #     进程（NXC1），signing-service 不持有任何份额；
    #   cggmp.signers=0,1：2-of-3 签名方集合（容忍 1 方离线）；
    #   tls.override-authority=localhost：证书 SAN 约定 = localhost
    #     （mpc-engine/scripts/generate-certs.sh；Pod DNS 名不进 SAN）。
    #     若运维改用含 Pod DNS SAN 的证书，本项须置空。
    # 另需 NEX_MPC_ENGINE_AUTH_TOKEN（与 mpc-engine 的 MPC_AUTH_TOKEN 同值），
    # 经 <chart>-secret（envFrom secretRef）注入，禁止明文入仓。
    NEX_MPC_ENGINE_DISTRIBUTED: "true"
    NEX_MPC_ENGINE_CGGMP_ENABLED: "true"
    NEX_MPC_ENGINE_CGGMP_SIGNERS: "0,1"
    # 单 RPC deadline 300s（application.yml 默认 120s）。理由：aux 首轮 Paillier
    # 安全素数生成慢机每方可达 ~80s（application.yml:294 注释），而 2-of-3 要三方
    # 并发跑在同一批 2 vCPU Pod 上。实测数据分两栏，勿混用：
    #   · 本机：含 aux 的集群 E2E 用例单例耗时 66~128s（3 轮，±45%）——注意这是
    #     整条用例的墙钟（keygen 本身仅 0.1~1.1s，慢在一次性 aux 的素数生成），
    #     不是"单次签名延迟"；签名的 isolated 耗时至今未测。
    #   · CI：该 job step 总耗时 256s（run #326 绿）与 374s（run #327 红），
    #     放宽到 300s 后 #328/#329 均绿。deadline 是每次 RPC 的上限，故 step 总耗时
    #     不能与单 RPC 耗时直接比较。
    # 抬高上限只增加失败延迟，不影响正常耗时。
    NEX_MPC_ENGINE_CGGMP_DEADLINE_MS: "300000"
    NEX_MPC_ENGINE_TLS_OVERRIDE_AUTHORITY: "localhost"
  extraVolumes:
    - name: mpc-certs
      secret:
        secretName: nexus-mpc-certs
        optional: false
  extraVolumeMounts:
    - name: mpc-certs
      mountPath: /etc/mpc/certs
      readOnly: true

nexus-wallet-service:
  replicaCount: 3
  image:
    tag: 2.50.0
  resources:
    requests:
      memory: 1Gi
      cpu: 2000m
    limits:
      memory: 2Gi
      cpu: 4000m
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
