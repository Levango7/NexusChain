# NexusChain prod 环境覆盖
# ============================================================================
# 用法：helm upgrade --install nexus-chain deploy/helm/ \
#        -f deploy/helm/values-prod.yaml -n nexus
# 特征：三副本、高资源、HPA 3-10、PDB minAvailable=2、固定版本 tag、
#       多 AZ topologySpreadConstraints、imagePullPolicy=IfNotPresent
# ============================================================================

global:
  env: prod
  namespace: nexus
  imagePullPolicy: IfNotPresent
  springProfile: prod
  serviceMonitor:
    enabled: true
  networkPolicy:
    enabled: true

# -- prod：副本 3、资源 1Gi/2、HPA 3-10、PDB minAvailable=2、固定 tag、多 AZ
nexus-gateway:
  replicaCount: 3
  image:
    # 固定不可变 tag（semver），禁止 latest
    tag: 2.50.0
  resources:
    requests:
      memory: 1Gi
      cpu: 2000m
    limits:
      memory: 2Gi
      cpu: 4000m
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 2
  # 多 AZ 反亲和：topologySpreadConstraints 跨 zone 均匀分布
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nexus-gateway

nexus-bridge:
  replicaCount: 3
  image:
    tag: 2.50.0
  resources:
    requests:
      memory: 1Gi
      cpu: 2000m
    limits:
      memory: 2Gi
      cpu: 4000m
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nexus-bridge

nexus-signing-service:
  replicaCount: 3
  image:
    tag: 2.50.0
  resources:
    requests:
      memory: 1Gi
      cpu: 2000m
    limits:
      memory: 2Gi
      cpu: 4000m
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nexus-signing-service
  # P0-10 审计修复：接入 mpc-engine（umbrella 现已部署 mpc-engine chart，
  # 端点为 StatefulSet 逐 Pod headless DNS）。证书由 nexus-mpc-certs Secret
  # 提供（部署前注入 mTLS CA/客户端证书，见 SECRET-MANAGEMENT.md）。
  extraEnv:
    NEX_MPC_TRANSPORT_GRPC: "true"
    NEX_MPC_ENGINE_ENDPOINTS: "mpc-engine-0.mpc-engine-headless:50051,mpc-engine-1.mpc-engine-headless:50051,mpc-engine-2.mpc-engine-headless:50051"
    NEX_MPC_ENGINE_TLS_TRUST_CERT: "/etc/mpc/certs/ca/CA.pem"
    NEX_MPC_ENGINE_TLS_CLIENT_CERT: "/etc/mpc/certs/node-A/cert.pem"
    NEX_MPC_ENGINE_TLS_CLIENT_KEY: "/etc/mpc/certs/node-A/key.pem"
  extraVolumes:
    - name: mpc-certs
      secret:
        secretName: nexus-mpc-certs
        optional: false
  extraVolumeMounts:
    - name: mpc-certs
      mountPath: /etc/mpc/certs
      readOnly: true

nexus-wallet-service:
  replicaCount: 3
  image:
    tag: 2.50.0
  resources:
    requests:
      memory: 1Gi
      cpu: 2000m
    limits:
      memory: 2Gi
      cpu: 4000m
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  pdb:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nexus-wallet-service

# -- mpc-engine（MPC 密码学引擎，prod 独有覆盖，PLAN-002 Step A）
# 生产密钥经 sealed-secrets 注入：
#   * sealedSecretName 非空 → chart secret.yaml 仅渲染元数据（无 stringData），
#     Pod env 经 secretKeyRef 引用集群内 controller 解密后的同名 Secret
#   * 集群前置：sealed-secrets controller 已部署 + 管理员已用 kubeseal
#     生成 SealedSecret（commit 覆盖 deploy/k8s/30-sealed-secret-mpc-engine.yaml
#     占位文件），见 docs/runbooks/sealed-secrets.md
#   * storageKey 不在此设置——明文路径生产禁用（防误用；紧急明文冒烟
#     请用 dev/staging 环境）
mpc-engine:
  secrets:
    sealedSecretName: mpc-engine-secret