{{/*
镜像拉取 Secret（私有仓库凭证）
============================================================================
启用条件：.Values.global.imagePullSecrets 非空
每个 secret 项 schema：
  - name: ghcr-pull-secret
    registry: ghcr.io
    username: ""
    password: ""
    email: ""
⚠️ 明文 password 仅用于 dev/sandbox；生产应改用外部密钥管理
   （sealed-secrets / external-secrets / SOPS），避免明文入仓。
*/}}
{{- range .Values.global.imagePullSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ include "nexus-chain.namespace" $ }}
  labels:
    {{- include "nexus-chain.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "nexus-chain.dockerconfigjson" (dict "ctx" $ "secret" .) }}
{{- end }}

{{/*
生成 base64 编码的 dockerconfigjson
传入 dict: (dict "ctx" $ "secret" .)
*/}}
{{- define "nexus-chain.dockerconfigjson" -}}
{{- $s := .secret -}}
{{- $auth := printf "%s:%s" $s.username $s.password | b64enc -}}
{{- $email := default "" $s.email -}}
{{- $cfg := printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" $s.registry $s.username $s.password $email $auth -}}
{{- $cfg | b64enc -}}
{{- end -}}
