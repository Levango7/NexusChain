# ============================================================================
# NexusChain - Istio Ingress Gateway 配置（外部入口）
# ============================================================================
# 用途：
#   配置 Istio Ingress Gateway 承接外部 HTTPS 流量，路由到 nexus-gateway。
#   - HTTPS 443 端口：终止外部 TLS，内部转 mTLS
#   - TLS 证书引用 K8s Secret（cert-manager 签发或手动注入）
#   - Gateway + VirtualService 定义外部路由规则
#   - HTTP 80 → 301 重定向到 HTTPS 443
#
# 应用：
#   kubectl apply -f deploy/istio/ingress-gateway.yaml -n nexus
#
# 前置：
#   1. TLS 证书 Secret 已创建：
#      kubectl create secret tls nexus-tls-secret \
#        --cert=fullchain.pem --key=privkey.pem -n istio-system
#   2. 或由 cert-manager 自动签发（见下方 Certificate 资源）
#   3. 域名 DNS 解析到 Ingress Gateway LoadBalancer 外部 IP
#
# 验证：
#   curl -v https://api.nexus.local/actuator/health
#   # 期望：200 + TLS 1.3 握手成功
# ============================================================================
---
# 1. Istio Gateway：定义外部入口端口 + TLS 证书
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: nexus-ingress-gateway
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus-gateway
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/component: service-mesh
  annotations:
    description: "NexusChain 外部 HTTPS 入口：443 终止 TLS，路由到 nexus-gateway"
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "api.nexus.local"
        - "nexus-chain.example.com"
      tls:
        mode: SIMPLE
        credentialName: nexus-tls-secret
        minProtocolVersion: TLSV1_2
        maxProtocolVersion: TLSV1_3
        cipherSuites:
          - ECDHE-ECDSA-AES256-GCM-SHA384
          - ECDHE-RSA-AES256-GCM-SHA384
          - ECDHE-ECDSA-CHACHA20-POLY1305
          - ECDHE-RSA-CHACHA20-POLY1305
          - ECDHE-ECDSA-AES128-GCM-SHA256
          - ECDHE-RSA-AES128-GCM-SHA256
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "api.nexus.local"
        - "nexus-chain.example.com"
      tls:
        httpsRedirect: true
---
# 2. Ingress VirtualService：外部路由到 nexus-gateway
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: nexus-ingress
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus-gateway
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/component: service-mesh
  annotations:
    description: "外部入口路由：api.nexus.local → nexus-gateway:8080"
spec:
  hosts:
    - "api.nexus.local"
    - "nexus-chain.example.com"
  gateways:
    - nexus-ingress-gateway
  http:
    - name: payment-api
      match:
        - uri:
            prefix: /api/v1/payments
        - uri:
            prefix: /api/v1/refunds
      route:
        - destination:
            host: nexus-gateway
            port:
              number: 8080
            subset: stable
          weight: 90
        - destination:
            host: nexus-gateway
            port:
              number: 8080
            subset: canary
          weight: 10
      timeout: 3s
      retries:
        attempts: 3
        perTryTimeout: 1s
        retryOn: 5xx,connect-failure,refused-stream,reset
    - name: business-api
      match:
        - uri:
            prefix: /api/v1/wallet
        - uri:
            prefix: /api/v1/bridge
        - uri:
            prefix: /api/v1/signing
      route:
        - destination:
            host: nexus-gateway
            port:
              number: 8080
            subset: stable
          weight: 90
        - destination:
            host: nexus-gateway
            port:
              number: 8080
            subset: canary
          weight: 10
      timeout: 3s
      retries:
        attempts: 3
        perTryTimeout: 1s
        retryOn: 5xx,connect-failure,refused-stream,reset
    - name: health
      match:
        - uri:
            exact: /health
        - uri:
            prefix: /actuator/health
      route:
        - destination:
            host: nexus-gateway
            port:
              number: 8080
      timeout: 2s
      retries:
        attempts: 1
    - name: default-deny
      match:
        - uri:
            prefix: /
      directResponse:
        status: 404
        body:
          string: "Not Found"
---
# 3. cert-manager Certificate（自动签发 / 续期 TLS 证书）
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nexus-tls-cert
  namespace: istio-system
  labels:
    app.kubernetes.io/name: nexus-gateway
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/component: service-mesh
  annotations:
    description: "cert-manager 自动签发 NexusChain 入口 TLS 证书"
spec:
  secretName: nexus-tls-secret
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - "api.nexus.local"
    - "nexus-chain.example.com"
  issuerRef:
    name: nexus-tls-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
    - server auth
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
    rotationPolicy: Always
---
# 4. DestinationRule：Ingress Gateway → nexus-gateway 的 mTLS
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: nexus-gateway-from-ingress
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus-gateway
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/component: service-mesh
  annotations:
    description: "Ingress Gateway 到 nexus-gateway 的 mTLS 连接策略"
spec:
  host: nexus-gateway.nexus.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      tcp:
        maxConnections: 200
        connectTimeout: 1s
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
        maxRequestsPerConnection: 20
        idleTimeout: 30s