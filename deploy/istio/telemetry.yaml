# ============================================================================
# NexusChain - Telemetry API 配置（Istio 1.22+）
# ============================================================================
# 用途：
#   使用 Istio Telemetry API（v1alpha1）统一配置 mesh 可观测性：
#   1. metrics：自定义 RED 指标（请求率 / 错误率 / 延迟）+ 业务维度标签
#   2. tracing：1% 采样率，OTLP 导出到 Jaeger Collector
#   3. access logs：JSON 格式输出到 stdout，由 K8s 日志驱动收集
#
# Telemetry API 是 Istio 1.22+ 推荐方式，替代旧的 Mixer / EnvoyFilter。
#
# 应用：
#   kubectl apply -f deploy/istio/telemetry.yaml -n nexus
#
# 与现有可观测性栈对接：
#   - Prometheus：kube-prometheus-stack 抓取 sidecar /actuator/prometheus
#   - Jaeger：jaeger-collector.nexus.svc.cluster.local:4317（OTLP gRPC）
#   - Grafana：kube-prometheus-stack-grafana（dashboard 见 deploy/monitoring/grafana-dashboards/）
# ============================================================================
---
# ============================================================================
# 1. Telemetry 资源：统一 metrics + tracing + access logs
# ============================================================================
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: nexus-mesh-telemetry
  namespace: nexus
  labels:
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/component: service-mesh
  annotations:
    description: "NexusChain mesh 可观测性：RED 指标 + 1% trace 采样 + JSON 访问日志"
spec:
  # -- 不指定 selector，对命名空间内所有 sidecar 生效

  # ============================================================================
  # 1.1 自定义 metrics：RED + 业务维度
  # ============================================================================
  metrics:
    - overrides:
        # -- 为 server-side 请求计数增加响应码维度
        - match:
            metric: REQUEST_COUNT
          tagOverrides:
            response_code:
              value: response.code
            # -- 增加目标服务版本维度（金丝雀分析）
            destination_version:
              value: destination.labels["app.kubernetes.io/version"]
            # -- 增加源服务名维度（调用拓扑分析）
            source_workload:
              value: source.workload.name
        # -- 为请求延迟增加 P99 直方图桶
        - match:
            metric: REQUEST_DURATION
          tagOverrides:
            response_code:
              value: response.code
            destination_version:
              value: destination.labels["app.kubernetes.io/version"]
        # -- TCP 连接指标（桥接 / 签名长连接）
        - match:
            metric: TCP_CONNECTIONS_OPENED
          tagOverrides:
            destination_service:
              value: destination.service.host
      providers:
        - name: prometheus

  # ============================================================================
  # 1.2 tracing：1% 采样率，OTLP 导出到 Jaeger
  # ============================================================================
  tracing:
    - randomSamplingPercentage: 1.0
      # -- 自定义 trace 标签（便于 Jaeger 按业务维度筛选）
      customTags:
        # -- 标识 mesh 内服务所属命名空间
        nexus-namespace:
          literal:
            value: nexus
        # -- 标识 mesh 版本（升级追踪）
        mesh-version:
          literal:
            value: "1-22"
        # -- 从请求头提取链路 ID（业务层 trace 关联）
        x-request-id:
          header:
            name: x-request-id
            defaultValue: "unknown"
        # -- 从请求头提取支付 ID（业务 trace 关联）
        x-payment-id:
          header:
            name: x-payment-id
            defaultValue: "unknown"
      # -- 限制 trace 上报路径，避免重复上报
      useRequestIdForTraceSampling: true
      providers:
        - name: otel-tracing

  # ============================================================================
  # 1.3 access logs：JSON 格式输出到 stdout
  # ============================================================================
  accessLogging:
    - providers:
        - name: envoy-stdout
      filter:
        # -- 排除健康检查 / 指标抓取噪声
        expression: |
          request.path != "/actuator/health" &&
          request.path != "/actuator/health/readiness" &&
          request.path != "/actuator/health/liveness" &&
          request.path != "/actuator/prometheus" &&
          request.path != "/actuator/metrics"
      # -- 自定义日志标签
      disabled: false
---
# ============================================================================
# 2. Prometheus Provider 引用（mesh 内 sidecar 指标暴露）
# ============================================================================
#    Istio 默认在 15090 端口暴露 /stats/prometheus
#    通过 ServiceMonitor 让 kube-prometheus-stack 抓取
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istio-sidecar-metrics
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/component: service-mesh
    release: kube-prometheus-stack
  annotations:
    description: "Prometheus 抓取 Istio sidecar 15090 端口指标"
spec:
  # -- 抓取所有带 sidecar 的 Pod（通过 podMonitor 形式）
  namespaceSelector:
    matchNames:
      - nexus
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nexus
  endpoints:
    - port: http-metrics
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 10s
      # -- 仅抓取 Istio 自定义指标（避免与业务 /actuator/prometheus 重复）
      params:
        filter:
          - "istio_"
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
          targetLabel: app
        - sourceLabels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_version
          targetLabel: version
        - sourceLabels:
            - __meta_kubernetes_namespace
          targetLabel: namespace
---
# ============================================================================
# 3. PodMonitor：抓取 sidecar 15090 端口（Pod 级，非 Service 级）
# ============================================================================
#    sidecar 15090 端口不通过 Service 暴露，需用 PodMonitor
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-sidecar-pods
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/component: service-mesh
    release: kube-prometheus-stack
  annotations:
    description: "PodMonitor 抓取 Istio sidecar 15090 端口（Pod 级抓取）"
spec:
  namespaceSelector:
    matchNames:
      - nexus
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nexus
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 10s
      params:
        filter:
          - "istio_"
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
          targetLabel: app
        - sourceLabels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_version
          targetLabel: version
        - sourceLabels:
            - __meta_kubernetes_namespace
          targetLabel: namespace