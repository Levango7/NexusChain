# Nacos HA 集群 ConfigMap 配置
#
# 包含两个关键配置：
#   1. application.properties — Nacos Server 主配置（外接 PostgreSQL、鉴权、集群模式）
#   2. cluster.conf           — 集群节点列表（3 节点 Raft 集群发现）
#
# 关联文件：
#   - nacos-ha-statefulset.yaml  挂载本 ConfigMap
#   - nacos-ha-service.yaml      Headless Service 提供 cluster.conf 中的域名解析
#
# 注意：
#   - 数据库密码不在此处明文，通过 Secret（nexus-secrets）注入
#   - cluster.conf 中的地址使用 Headless Service 域名，确保 Pod 重建后 IP 变化不影响集群
apiVersion: v1
kind: ConfigMap
metadata:
  name: nacos-config
  namespace: nexus
  labels:
    app: nacos
    component: config-center
  annotations:
    # 标注配置版本，便于运维追踪
    nexuschain.io/config-version: "v2.3.2-ha"
    nexuschain.io/nacos-cluster-size: "3"
data:
  # Nacos Server 主配置
  # 完整配置项参考：https://nacos.io/zh-cn/docs/v2/guide/deployment/
  application.properties: |
    #==========================================
    # Nacos Server 配置（HA 集群模式）
    #==========================================

    #---------- 服务器基础配置 ----------
    # 2026-10-13 L3 预演修正（缺陷⑤）：Nacos 3.x 把「主服务」与「Console」拆成**两个
    # Spring 上下文、两个端口**（v3 的 application.properties 里分别是
    # nacos.server.main.port=${NACOS_APPLICATION_PORT:8848} 与
    # nacos.console.port=${NACOS_CONSOLE_PORT:8080}）。
    # 原配置写的是 Spring 通配的 server.port=8848 —— 它会让 **Console 上下文也去绑 8848**，
    # 而主服务已经占了该端口 ⇒ `Port 8848 is already in use` 启动失败。
    # 改为 v3 的专有属性：主服务 8848，Console 8080。
    nacos.server.main.port=8848
    nacos.console.port=8080
    # 上下文路径（Console 侧）
    server.servlet.contextPath=/nacos
    # 关闭默认 Tomcat access log，使用 Nacos 内置日志
    server.tomcat.accesslog.enabled=false

    #---------- 集群模式 ----------
    # 启用集群模式（true = HA，false = 单机）
    nacos.standalone=false
    # 2026-10-13 L3 预演修正：显式声明成员发现走本地文件（cluster.conf）。
    # 不声明时 Nacos 在找不到 cluster.conf 的场合会回落 address-server 模式，
    # 去请求公网域名 jmenv.tbsite.net ⇒ UnknownHostException 直接启动失败。
    nacos.core.member.lookup.type=file
    # 集群配置文件路径
    # 2026-10-13 L3 预演修正（缺陷③）：原值把**文件路径**赋给了 nacos.member.list ——
    # 该属性语义是「成员地址列表」（address-server 模式的数据源），拿到路径后 Nacos
    # 会按地址去 HTTP 拉取（AddressServerMemberLookup）→ 连接失败 → 启动中止。
    # 集群成员列表由 docker-startup.sh 依据 NACOS_SERVERS 写入 cluster.conf（file 模式），
    # 故本行直接删除。

    #---------- 外接 MySQL 数据源 ----------
    # 2026-10-12：PostgreSQL → MySQL（与全栈数据库族一致）。
    # 额外收益：Nacos 2.x/3.x 的**外接数据源原生就是 MySQL**，PostgreSQL 反而需要额外
    # 数据源插件（nacos-postgresql-datasource-plugin），属自找的集成风险。
    # 注意：Nacos 内置 Derby，HA 模式必须外接 DB。
    spring.datasource.platform=mysql
    db.num=1
    db.url.0=jdbc:mysql://mysql.nexus.svc.cluster.local:3306/nacos_config?characterEncoding=utf8&connectTimeout=5000&socketTimeout=30000&autoReconnect=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    db.user.0=${DB_USER}
    db.password.0=${DB_PASSWORD}
    # 连接池配置
    db.pool.config.driverClassName=com.mysql.cj.jdbc.Driver
    db.pool.config.initialSize=10
    db.pool.config.maxActive=50
    db.pool.config.minIdle=5
    db.pool.config.maxWait=10000
    db.pool.config.connectionTimeout=10000
    db.pool.config.validationQuery=SELECT 1

    #---------- 鉴权配置 ----------
    # 启用鉴权（生产环境必须 true）
    nacos.core.auth.enabled=true
    # 鉴权类型（默认 token）
    nacos.core.auth.system.type=nacos
    # Server identity（防止未授权访问，生产环境应通过 Secret 注入）
    nacos.core.auth.server.identity.key=${NACOS_AUTH_IDENTITY_KEY:serverIdentity}
    nacos.core.auth.server.identity.value=${NACOS_AUTH_IDENTITY_VALUE:nexuschain-nacos-2026}
    # 默认 token（生产环境应通过 Secret 覆盖）
    nacos.core.auth.plugin.nacos.token.cache.enable=true
    nacos.core.auth.plugin.nacos.token.expire.seconds=18000
    nacos.core.auth.plugin.nacos.token.secret.key=${NACOS_AUTH_SECRET_KEY:SecretKey012345678901234567890123456789012345678901234567890123456789}

    #---------- 配置持久化 ----------
    # 配置变更日志保留天数
    nacos.config.retention.days=30
    # 是否开启配置灰度发布
    nacos.config.gray.enabled=true

    #---------- 服务发现 ----------
    # 客户端心跳间隔（ms）
    nacos.naming.client.beat.interval=5000
    # 服务实例持久化
    nacos.naming.data.store=db

    #---------- 监控 ----------
    # 暴露 Prometheus 指标
    management.endpoints.web.exposure.include=prometheus,health,info
    management.metrics.export.prometheus.enabled=true

    #---------- 日志 ----------
    # 日志级别
    logging.level.root=INFO
    logging.level.com.alibaba.nacos=INFO
    # 日志滚动配置
    logging.file.name=/home/nacos/logs/nacos-server.log
    logging.logback.rollingpolicy.max-file-size=100MB
    logging.logback.rollingpolicy.max-history=30

  # 集群节点列表（3 节点 Raft 集群发现）
  # 格式：IP:port 或 域名:port
  # 此处使用 Headless Service 域名，确保 Pod 重建后地址稳定
  # 域名格式：{pod-name}.{headless-service}.{namespace}.svc.cluster.local
  cluster.conf: |
    # Nacos HA 集群节点列表（3 节点 Raft）
    # 2026-10-13 L3 预演修正（缺陷④）：原值写的是**占位 IP 192.168.0.x:9849**，
    # 注释声称"部署时动态生成"但并无生成逻辑；节点地址实际是占位 ⇒ 集群永远组不起来。
    # 现直接写真实地址（Headless Service 域名，端口用主端口 8848——官方 docker
    # 集群模式口径；Pod 重建后 IP 变化不影响解析）。
    # 注意：节点数必须为奇数（3/5/7），改节点数需同步 nacos-ha-statefulset.yaml 的 replicas。
    nacos-0.nacos-headless.nexus.svc.cluster.local:8848
    nacos-1.nacos-headless.nexus.svc.cluster.local:8848
    nacos-2.nacos-headless.nexus.svc.cluster.local:8848