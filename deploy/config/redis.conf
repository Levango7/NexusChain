# ============================================================================
# Redis 生产配置（P2 加固：REQ-Redis 配置文件方式）
# 用法：docker-compose.prod.yml 通过 volumes 挂载本文件，启动时执行
#   redis-server /etc/redis/redis.conf
# 密码通过 REDIS_PASSWORD 环境变量在容器启动时由 entrypoint 脚本替换占位符
# ============================================================================
# 绑定地址（容器内监听全部接口，由 Docker 网络隔离）
bind 0.0.0.0
protected-mode yes
port 6379

# 认证密码（占位符，启动时由 entrypoint 替换为 ${REDIS_PASSWORD}）
requirepass __REDIS_PASSWORD_PLACEHOLDER__

# 持久化：AOF + RDB
appendonly yes
appendfilename "appendonly.aof"
save 900 1
save 300 10
save 60 10000

# 内存策略
maxmemory-policy allkeys-lru
timeout 300
tcp-keepalive 60

# 日志
loglevel notice
logfile ""

# 安全：禁用危险命令
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""