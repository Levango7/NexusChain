# deploy/kustomize/base（PLAN-002 Step B + 2026-09-07 完善批）
# ============================================================================
# Kustomize base——三套 overlay（dev/staging/prod）以此为共同骨架。
#
# **当前定位**（诚实标注）：GitOps 预备设施，非实际部署路径——
# 真实部署仍走 helm install/template（见 docs/deploy/kustomize.md）。
