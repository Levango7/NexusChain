apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod overlay
# 配套：helm template deploy/helm/ -f values-prod.yaml
#   | kubectl kustomize deploy/kustomize/overlays/prod
namespace: nexus

labels:
  - includeSelectors: false
    pairs:
      - key: nexus-chain.io/env
        value: prod
