apiVersion: v1
kind: Namespace
metadata:
  name: nexus-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-gateway
  namespace: nexus-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-gateway
  template:
    metadata:
      labels:
        app: nexus-gateway
    spec:
      containers:
        - name: gateway
          image: nexus-gateway:local
          imagePullPolicy: Never
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: sandbox
            - name: NEX_SETTLEMENT_ENABLED
              value: "false"
            - name: NEX_SETTLEMENT_MODE
              value: sandbox
          ports:
            - containerPort: 8080
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-gateway
  namespace: nexus-demo
spec:
  type: ClusterIP
  selector:
    app: nexus-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
