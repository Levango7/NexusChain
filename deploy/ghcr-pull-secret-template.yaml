# GHCR Pull Secret 模板（生产环境部署用）
# ==============================================
#
# 为什么：Helm chart 默认 `imagePullPolicy: Always`，如果 secret 未提供，
# k3s 会 `ErrImagePull`；如果本地镜像构建 + containerd 导入 + imagePullPolicy: Never
# 走 demo 路径，则不依赖此 secret。
#
# 用法（不要把它提交到仓库）：
#   - 复制到本地，替换下面的 <token> 占位符
#   - kubectl --kubeconfig=<prod-kubeconfig> apply -f ghcr-pull-secret-template.yaml
#   - Helm values 中加 spec.imagePullSecrets: [{name: ghcr-pull-secret}]
#
# 不需要拉 prod 镜像的环境（artifact-only-staging、demo）：
#   不部署此文件，改用 `deploy/local-k3s/gw-deploy.yaml`
#
---
# 命名空间（如果不存在）
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-prod
---
# ghcr.io/levango7/nexuschain 的 pull secret
# (不要把 <token>= 你写真的放进去版本控制)
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: nexus-prod
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |-
    {
      "auths": {
        "ghcr.io": {
          "username": "Levango7",
          "password": "<token>=<GITHUB_PAT_WITH_packages_read>",
          "email": "ops@example.com",
          "auth": "<base64 of Levango7:<GITHUB_PAT_WITH_packages_read>>"
        }
      }
    }
