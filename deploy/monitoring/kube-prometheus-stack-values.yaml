# ============================================================================
# NexusChain - kube-prometheus-stack Helm Chart 自定义 values
# ============================================================================
# Chart: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
# 安装：helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f deploy/monitoring/kube-prometheus-stack-values.yaml
#
# 设计要点：
#   1. Prometheus 保留 15 天数据，持久化 PVC 50Gi
#   2. Grafana admin 密码从 Secret 读取（monitoring/grafana-admin-secret）
#   3. AlertManager 配置 Slack + 邮件双通道，按严重级别路由
#   4. ServiceMonitor 通过 release=kube-prometheus-stack 标签发现（对齐 deploy/helm/values.yaml）
#   5. 默认抓取间隔 30s，与 Helm Chart ServiceMonitor.interval 一致
# ============================================================================

# -- 全局命名空间覆盖（kube-prometheus-stack 默认部署到 monitoring）
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8sContainerCpuUsage: true
    k8sContainerMemoryUsage: true
    k8sPodMissing: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    network: true
    node: true
    prometheus: true
    prometheusOperator: true

# -- 命名空间选择器：仅监控 nexus + monitoring 命名空间
prometheus:
  enabled: true
  prometheusSpec:
    # -- 评估告警间隔
    evaluationInterval: 30s
    # -- 抓取间隔
    scrapeInterval: 30s
    # -- 抓取超时
    scrapeTimeout: 10s
    # -- 保留 15 天数据
    retention: 15d
    # -- TSDB 块大小（超过则压缩）
    retentionSize: 40GB
    # -- 副本数（高可用：2 实例）
    replicas: 2
    # -- 启用 Admin API（用于管理 TSDB）
    enableAdminAPI: false
    # -- ServiceMonitor 自动发现（按 release 标签）
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    # -- PodMonitor 自动发现
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    # -- PrometheusRule 自动发现
    ruleSelectorNilUsesHelmValues: false
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
    # -- Alertmanager 配置
    alertingEndpoints:
      - name: kube-prometheus-stack-alertmanager
        namespace: monitoring
        port: web
        pathPrefix: "/"
        scheme: http
    # -- 持久化存储
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: fast-ssd
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
    # -- 资源限制
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 2000m
    # -- 容忍污点（监控组件可调度到任意节点）
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

# ----------------------------------------------------------------------------
# Alertmanager
# ----------------------------------------------------------------------------
alertmanager:
  enabled: true
  config:
    # -- 全局配置
    global:
      resolve_timeout: 5m
      # SMTP 邮件发件配置（占位，敏感值通过 Secret 注入或 helm --set 覆盖）
      smtp_smarthost: "smtp.example.com:587"
      smtp_from: "alertmanager@nexuschain.io"
      smtp_auth_username: "alertmanager@nexuschain.io"
      smtp_auth_password: "REPLACE_ME_SMTP_PASSWORD"
      smtp_require_tls: true
    # -- 路由树：按 severity 分流
    route:
      receiver: "default"
      group_by: ["alertname", "namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # critical → Slack #nexus-alerts-critical + 邮件 oncall
        - matchers:
            - severity = "critical"
          receiver: "critical-slack-and-email"
          group_wait: 10s
          repeat_interval: 1h
        # warning → Slack #nexus-alerts
        - matchers:
            - severity = "warning"
          receiver: "warning-slack"
          group_wait: 30s
          repeat_interval: 4h
    # -- 抑制规则：critical 触发时抑制同 namespace 同 alertname 的 warning
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["alertname", "namespace"]
    # -- 接收器定义
    receivers:
      - name: "default"
        slack_configs:
          - channel: "#nexus-alerts"
            api_url: "REPLACE_ME_SLACK_WEBHOOK_URL"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
      - name: "critical-slack-and-email"
        slack_configs:
          - channel: "#nexus-alerts-critical"
            api_url: "REPLACE_ME_SLACK_WEBHOOK_URL"
            send_resolved: true
            title: '[CRITICAL] {{ .CommonLabels.alertname }}'
            text: "{{ range .Alerts }}*Summary:* {{ .Annotations.summary }}\n*Description:* {{ .Annotations.description }}\n*Runbook:* {{ .Annotations.runbook_url | default \"N/A\" }}\n{{ end }}"
        email_configs:
          - to: "oncall@nexuschain.io"
            send_resolved: true
            headers:
              Subject: '[CRITICAL] {{ .CommonLabels.alertname }} - {{ .CommonLabels.namespace }}'
            html: "{{ range .Alerts }}<b>{{ .Annotations.summary }}</b><br>{{ .Annotations.description }}<br><br>{{ end }}"
      - name: "warning-slack"
        slack_configs:
          - channel: "#nexus-alerts"
            api_url: "REPLACE_ME_SLACK_WEBHOOK_URL"
            send_resolved: true
            title: '[WARNING] {{ .CommonLabels.alertname }}'
            text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
  # -- Alertmanager 副本数（高可用）
  alertmanagerSpec:
    replicas: 2
    # -- 持久化静默规则
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: fast-ssd
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

# ----------------------------------------------------------------------------
# Grafana
# ----------------------------------------------------------------------------
grafana:
  enabled: true
  # -- admin 密码从 Secret 读取（Secret 由外部密钥管理工具创建，见 README.md）
  admin:
    existingSecret: "grafana-admin-secret"
    userKey: "admin-user"
    passwordKey: "admin-password"
  # -- 副本数
  replicas: 2
  # -- 持久化存储（用户偏好、仪表盘元数据）
  persistence:
    enabled: true
    storageClassName: "fast-ssd"
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  # -- 资源限制
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m
  # -- 自动注入 Prometheus 数据源
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          isDefault: true
          jsonData:
            timeInterval: "30s"
        - name: Alertmanager
          type: alertmanager
          access: proxy
          url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
          jsonData:
            implementation: "prometheus"
  # -- 通过 ConfigMap 自动挂载仪表盘（仪表盘 JSON 由 grafana-dashboards/ 提供）
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "nexus-dashboards"
          orgId: 1
          folder: "NexusChain"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/nexus
  dashboardsConfigMaps:
    nexus-dashboards: "nexus-grafana-dashboards"
  # -- SMTP 配置（告警邮件测试用）
  smtp:
    enabled: true
    host: "smtp.example.com:587"
    user: "grafana@nexuschain.io"
    password: "REPLACE_ME_GRAFANA_SMTP_PASSWORD"
    from_address: "grafana@nexuschain.io"
    from_name: "NexusChain Grafana"
  # -- 服务暴露（Ingress）
  ingress:
    enabled: true
    ingressClassName: "nginx"
    hosts:
      - grafana.nexuschain.io
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.nexuschain.io

# ----------------------------------------------------------------------------
# Prometheus Operator
# ----------------------------------------------------------------------------
prometheusOperator:
  enabled: true
  # -- CRD 自动管理
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true
  # -- 资源限制
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# ----------------------------------------------------------------------------
# Node Exporter
# ----------------------------------------------------------------------------
nodeExporter:
  enabled: true

# ----------------------------------------------------------------------------
# kubeStateMetrics
# ----------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true

# ----------------------------------------------------------------------------
# 全局抓取配置补充（黑盒探针，用于 ServiceDown 告警）
# ----------------------------------------------------------------------------
prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      memory: 32Mi
      cpu: 25m
    limits:
      memory: 64Mi
      cpu: 100m

# -- 额外 ServiceMonitor / PodMonitor / PrometheusRule 通过独立 YAML 部署：
#    deploy/monitoring/alerting-rules.yaml
#    deploy/monitoring/micrometer-config.yaml