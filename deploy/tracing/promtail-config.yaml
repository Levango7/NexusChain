# ============================================================================
# NexusChain - Promtail 配置（P3-T5：trace_id 日志关联）
# ============================================================================
# 用途：
#   1. 采集 nexus 命名空间下 4 个 Spring Boot 服务的 JSON 日志
#   2. 从 JSON 日志中提取 traceId / spanId，作为 Loki 标签
#   3. 推送到 Loki，实现 trace ↔ log 联动（在 Grafana 中按 trace_id 检索日志）
#
# 部署：
#   kubectl apply -f deploy/tracing/loki-promtail-deployment.yaml -n nexus
#
# 依赖：
#   - Loki（本文件同目录 loki-stack 部署）
#   - Promtail（grafana/loki-stack Helm chart 的一部分，或独立部署）
#
# 日志格式（由 logback-spring.xml LogstashEncoder 产出）：
#   {"@timestamp":"2026-08-09T...","level":"INFO","logger":"...","message":"...",
#    "traceId":"abcdef1234567890","spanId":"1234567890abcdef","service":"nexus-gateway"}
#
# pipeline_stages 说明：
#   1. json：从原始日志行解析 JSON 字段（traceId / spanId / level / logger 等）
#   2. labels：将 traceId / spanId 提升为 Loki 标签（用于按 trace_id 检索）
#   3. timestamp：使用 @timestamp 作为日志时间戳
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: nexus
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/component: tracing
  annotations:
    description: "Promtail 配置：采集 nexus 服务 JSON 日志，提取 trace_id 推送到 Loki"
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: info

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.nexus.svc.cluster.local:3100/loki/api/v1/push
        tenant_id: nexus
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 10

    scrape_configs:
      # -- 采集 nexus 命名空间下所有 Pod 的 JSON 日志
      #    通过 Kubernetes SD 自动发现 Pod，挂载节点 /var/log/pods
      - job_name: nexus-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - nexus
        relabel_configs:
          # -- 仅采集包含 app.kubernetes.io/part-of=nexus 标签的 Pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
            action: keep
            regex: nexus
          # -- 提取 service 名（app.kubernetes.io/name 标签）
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service
          # -- 提取 namespace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          # -- 提取 Pod 名
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # -- 提取容器名
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # -- 构造日志路径：/var/log/pods/<namespace>_<pod>_<uid>/<container>/0.log
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/$1/$2/*.log
        pipeline_stages:
          # -- 1. 解析 JSON 日志（LogstashEncoder 产出）
          - json:
              expressions:
                traceId: traceId
                spanId: spanId
                level: level
                logger: logger
                service: service
                timestamp: "@timestamp"
          # -- 2. 将 traceId / spanId 提升为 Loki 标签
          #    注意：traceId 作为标签会产生高基数，仅在需要 trace ↔ log 联动时启用。
          #    生产环境可通过 Loki 的 label cardinality 限制或仅索引 sample trace_id。
          - labels:
              trace_id:
              span_id:
              level:
          # -- 3. 使用 @timestamp 作为日志时间戳
          - timestamp:
              source: timestamp
              format: RFC3339Nano
          # -- 4. 限制标签值长度（trace_id 32 字符，span_id 16 字符，无需截断）
          #    若日志中无 traceId（非 tracing 上下文日志），trace_id 标签为空

      # -- 采集 OTel Collector 自身日志（JSON 格式，便于排查 Collector 问题）
      - job_name: otel-collector
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - nexus
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: otel-collector
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/$1/$2/*.log
        pipeline_stages:
          - json:
              expressions:
                level: level
                msg: msg
          - labels:
              level: