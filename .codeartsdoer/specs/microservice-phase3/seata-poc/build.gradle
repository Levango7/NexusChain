// =============================================================================
// Seata 版本兼容 POC build.gradle
//
// 目标：验证 seata-spring-boot-starter 2.0.0 与 SpringBoot 3.2.5 + SCA 2023.0.1.0
//       依赖解析 + 编译通过（不需要真正启动 Seata Server / Nacos）。
//
// 版本矩阵（设计文档 §4.1）：
//   Spring Boot              3.2.5
//   Spring Cloud             2023.0.3
//   Spring Cloud Alibaba     2023.0.1.0
//   seata-spring-boot-starter 2.0.0（SCA BOM 管理）
//
// 验证策略：
//   1. 依赖解析：gradle dependencies 能解析 seata-spring-boot-starter:2.0.0
//   2. 编译通过：gradle compileJava 通过（@GlobalTransactional 注解可解析）
//   3. bootJar 打包通过（SpringBoot 自动配置加载无冲突）
// =============================================================================
plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'org.nexus.poc'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    // SCA / Nacos / Sentinel / Seata 制品优先走阿里云镜像（与 gateway build.gradle 对齐）
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    mavenCentral()
}

dependencies {
    // === Spring Boot 3.2.5 starters（最小化） ===
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // === Spring Cloud BOM（管理 OpenFeign / LoadBalancer 版本） ===
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2023.0.3')
    // === Spring Cloud Alibaba BOM（管理 Nacos / Sentinel / Seata 版本） ===
    implementation platform('com.alibaba.cloud:spring-cloud-alibaba-dependencies:2023.0.1.0')

    // === Seata 分布式事务（核心验证点） ===
    // SCA 2023.0.1.0 BOM 管理 seata-spring-boot-starter 版本（预期 2.0.0）
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-seata'

    // === 配套：Nacos 注册/配置（Seata Client 需要） ===
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'
    // bootstrap.yml 支持（Spring Cloud 2023.0.x 需显式引入）
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'

    // === OpenFeign + LoadBalancer（@GlobalTransactional 跨服务场景需要） ===
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}