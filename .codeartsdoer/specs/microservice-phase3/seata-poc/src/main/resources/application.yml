# Seata POC 应用配置
# 设计文档 §4.2.2 Seata Client application.yml 配置
server:
  port: 0   # 随机端口（POC 不需要固定端口）

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: nexus-tx-group
  service:
    vgroup-mapping:
      nexus-tx-group: default
    grouplist:
      default: ${NEX_SEATA_SERVER:127.0.0.1:8091}
  registry:
    type: nacos
    nacos:
      server-addr: ${NEX_NACOS_SERVER:127.0.0.1:8848}
      namespace: dev
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      server-addr: ${NEX_NACOS_SERVER:127.0.0.1:8848}
      namespace: dev
      group: SEATA_GROUP
  data-source-proxy-mode: AT