# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:nexus_wallet_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN

# ---------- nexus-core @Value placeholders (pulled transitively) ----------
nexus.cache-dir=${java.io.tmpdir}/nexus-wallet-test-leveldb
clear-cache=true
nexus.consensus.block-interval=30
nexus.block-interval-switch-era=-1
nexus.block-interval-switch-to=10
nexus.consensus.blocks-per-era=100
nexus.allow-miner-joins-era=-1
nexus.consensus.miner-pubkey-hash=0000000000000000000000000000000000000000
miner.validators=F:/Nexus/NexusChain/nexus-core/nexus-core/src/test/resources/genesis/validators-test.json
nexus.chain-id=0
nodeNet=localhost:19585
wallet.keystore.json=
wallet.keystore.password=