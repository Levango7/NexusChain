<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- P2-8: Content-Security-Policy 安全头（防 XSS / 数据外泄 / 点击劫持） -->
    <!-- 前端为纯 vite + react 开发环境（无 nginx 生产部署配置），通过 meta 标签注入 CSP -->
    <!-- 生产部署时应改由 nginx/CDN 在 HTTP 响应头下发，并收紧 'unsafe-inline' -->
    <!-- connect-src：同源 API 优先；localhost/127.0.0.1 的 BFF、gateway 与 wallet-service
       仅作本地联调白名单。不再出现「页面同源服务却默认硬编码跨源 API」导致的 CSP 自锁。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 http://localhost:8080 http://127.0.0.1:8080 http://localhost:8083 http://127.0.0.1:8083 https:; font-src 'self' data:"
    />
    <title>NexusChain Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
