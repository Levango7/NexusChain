plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.nexus'
version = '2.30.0'

java {
    sourceCompatibility = 17
    targetCompatibility = 17
}

repositories {
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.4'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.4'
    // === P3-T3：事件溯源 + CQRS（Kafka 事件总线） ===
    // spring-kafka：消费 payment-events topic 投影到 PaymentReadModel（CQRS 读模型）
    // Spring Boot 3.2.5 BOM 管理 spring-kafka 版本（3.1.4），与 P3-T4 Kafka 部署对齐
    implementation 'org.springframework.kafka:spring-kafka'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2:2.2.224'

    // CVE-2026-106451（HIGH：lz4-java 临时文件处理不当导致任意代码执行）：
    // spring-kafka → kafka-clients 传递引入 at.yawk.lz4:lz4-java 1.10.1，修复版 1.11.4。
    // 本模块是**库**（被其他应用消费），此处用 dependencyConstraint 而非仅本地
    // resolutionStrategy——约束会随 Gradle Module Metadata 传播到消费方，
    // 让消费方的 runtime 解析同样抬到 1.11.4（取证：master run 37817229721
    // nexus-gateway 镜像 Java(jar) Total: 1；根构建 subprojects 覆盖不达
    // composite build 的 included build，见 settings.gradle includeBuild）。
    constraints {
        implementation 'at.yawk.lz4:lz4-java:1.11.4'
    }
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = false
    }
}

// === 覆盖率门禁（与 nexus-bridge / nexus-gateway 对齐，minimum 0.15） ===
// BUNDLE 级别指令覆盖率下限 0.15；check 依赖 jacocoTestCoverageVerification 以强制门禁
// 测试体系中期建设：模块自定义覆盖率渐进线，根 0.30 门禁不注入（见根 build.gradle）
ext.jacocoGateOverridden = true
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                element = 'BUNDLE'
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

// 本模块是供其他应用消费的库（无 main class），不产出 Spring Boot fat jar：
// 关闭 bootJar、启用普通 jar，否则消费方无法解析编译类路径。
bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}
