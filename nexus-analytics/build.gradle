plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.nexus'
version = '2.1.0'

java {
    sourceCompatibility = 17
    targetCompatibility = 17
}

repositories {
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.4'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.4'
    // === P3-T3：事件溯源 + CQRS（Kafka 事件总线） ===
    // spring-kafka：消费 payment-events topic 投影到 PaymentReadModel（CQRS 读模型）
    // Spring Boot 3.2.5 BOM 管理 spring-kafka 版本（3.1.4），与 P3-T4 Kafka 部署对齐
    implementation 'org.springframework.kafka:spring-kafka'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2:2.2.224'
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = false
    }
}

// === 覆盖率门禁（与 nexus-bridge / nexus-gateway 对齐，minimum 0.15） ===
// BUNDLE 级别指令覆盖率下限 0.15；check 依赖 jacocoTestCoverageVerification 以强制门禁
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                element = 'BUNDLE'
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.15
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

// 本模块是供其他应用消费的库（无 main class），不产出 Spring Boot fat jar：
// 关闭 bootJar、启用普通 jar，否则消费方无法解析编译类路径。
bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}
