# NexusChain Gradle 配置
# Spring Boot 4.0 升级后依赖图扩大，Gradle daemon 解析依赖时 native 内存
# 需求增加。原默认 -Xmx512m -XX:MaxMetaspaceSize=384m 导致 daemon C2 编译
# DependencyGraphBuilder::resolveEdges 时 native malloc 失败（见 hs_err_pid*.log）。
# 此处持久化 daemon JVM 参数，避免依赖 GRADLE_OPTS 环境变量。
# 注意：org.gradle.jvmargs 控制 daemon JVM；--no-daemon 模式下由 GRADLE_OPTS
# 控制 wrapper JVM（见 .test-batch/retry-core.ps1）。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# 构建缓存加速
org.gradle.caching=true

# === 依赖下载韧性（2026-10-02）===
# 背景：docker 内 gradle **无依赖缓存**，每次构建都要重新下载全部依赖；上游
# Maven Central 瞬时抖动（5xx / 连接超时）曾打红 gateway 镜像构建，表现为
# "单点重跑即恢复"。Gradle 默认 max.retries=3、连接/读取超时 30s，不足以覆盖
# 数秒~数十秒级的抖动窗口。
# 属性名为 Gradle 内部 HTTP 客户端所用（org.gradle.internal.repository.*）；
# systemProp. 前缀使其作为系统属性传入 gradle JVM（daemon 与 --no-daemon 均生效）。
# 注意：这些属性只对**容器外**生效的前提是 gradle.properties 被 COPY 进构建上下文
# —— 各模块 Dockerfile 已同步补 `gradle.properties` 到 COPY 列表（此前缺失，
# 导致容器内连 org.gradle.jvmargs 都未生效）。
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000