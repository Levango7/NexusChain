// nexus-signing-service
//
// Phase 1 微服务化：签名服务独立部署单元。
//
// 定位：从 nexus-exchange-wallet 拆分出的「签名服务」独立 Spring Boot 应用，
// 承载以下职责：
//   * 平台热钱包签名（PlatformKeystore）
//   * MPC 多签流程（mpc/* 子包：barrier / persistence / router / security / transport / wal
//     + ColdWalletMultiSigService / MpcSigner / MpcSignatureAggregator 等）
//   * 链上交易构造 + 广播 REST 端点（TxController：/api/v1/transfers/sign 等）
//   * Nonce 池管理（pool/*：NoncePool / NonceState / PoolTask）
//   * 链节点 RPC 封装（controller/NodeController）
//   * LevelDB 持久化（storage/Leveldb）
//
// SCA 版本矩阵（设计文档 §4.1）：
//   Spring Boot 3.2.5 / Spring Cloud 2023.0.3 / SCA 2023.0.1.0
//   Nacos 2.3.2 / Sentinel 1.8.8 / OpenFeign 4.1.0
//
// 详见 .codeartsdoer/specs/microservice-phase1-2/design.md。

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    // === Phase 4 任务 #79：protobuf-gradle-plugin，从 src/main/proto/*.proto
    //     生成 Java gRPC stub（MpcCryptoServiceGrpc + message 类）。
    //     0.9.4 兼容 Gradle 8.x；与 nexus-core 的 grpcVersion/protobufVersion 对齐。 ===
    id 'com.google.protobuf' version '0.9.4'
}

group = 'org.nexus'
version = '2.1.0'

java {
    sourceCompatibility = 17
    targetCompatibility = 17
}

repositories {
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    mavenCentral()
}

// === Phase 4 任务 #79：MPC 密码学引擎 gRPC 接口版本矩阵（审计报告 §4.1 方案 A）
// 与根 build.gradle ext.grpcVersion/protobufVersion 及 nexus-core 对齐。 ===
ext {
    grpcVersion = '1.54.0'
    protobufVersion = '3.22.2'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

dependencies {
    // === Spring Boot ===
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // === Micrometer Tracing + Zipkin（Phase 3 任务 #61，设计文档 §4.3.1） ===
    // SpringBoot 3.2.5 BOM 管理版本（micrometer-tracing 1.2.5 + zipkin-reporter-brave 2.16.4）
    // W3C traceparent 格式跨服务传播，Zipkin 上报，Feign 自动埋点
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'io.github.openfeign:feign-micrometer'

    // === Spring Cloud BOM（管理 OpenFeign / LoadBalancer 版本） ===
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2023.0.3')
    // === Spring Cloud Alibaba BOM（管理 Nacos / Sentinel 版本） ===
    implementation platform('com.alibaba.cloud:spring-cloud-alibaba-dependencies:2023.0.1.0')

    // === Nacos 服务发现 + 配置中心 ===
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'

    // === Sentinel 熔断 / 限流 ===
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-sentinel'

    // === Seata 分布式事务（Phase 3 任务 #61） ===
    // SCA 2023.0.1.0 BOM 管理 seata-spring-boot-starter 版本（2.0.0），设计文档 §4.1 / §4.2.2
    // signing-service 作为 TCC 分支事务参与方（SigningTccAction，设计文档 §4.2.4）
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-seata'

    // === OpenFeign 声明式调用 + LoadBalancer ===
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // === bootstrap.yml 支持（Spring Cloud 2023.0.x 需显式引入） ===
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'

    // === 共享 SDK：签名服务消费 ApprovalPolicy / WalletTransactionRequest 等 DTO
    //     + Feign 接口骨架（SigningServiceFeignClient / WalletMgmtFeignClient / BridgeServiceFeignClient）。
    //     signing-service 作为根构建 include 子模块，直接用 project() 引用 nexus-sdk:java。 ===
    implementation project(':nexus-sdk:java')

    // === Gson（共享 JsonUtil + 控制器 Gson 反射用） ===
    implementation 'com.google.code.gson:gson:2.10.1'

    // === LevelDB（NoncePool 持久化） ===
    implementation 'org.iq80.leveldb:leveldb:0.12'
    implementation 'org.iq80.leveldb:leveldb-api:0.12'

    // === Jackson（WalletUtils / TxUtils 依赖） ===
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.4'

    // === Phase 4 任务 #79：MPC 密码学引擎 gRPC 客户端（审计报告 §4.1 方案 A） ===
    // Rust multi-party-ecdsa 引擎作为独立进程，signing-service 通过 gRPC 调用。
    // GrpcMpcCryptoEngine 用 blocking stub 调用 MpcCryptoService（DKG/sign/aggregate）。
    // 版本与 nexus-core 对齐（grpc 1.54.0 / protobuf 3.22.2）。
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    // gRPC protoc-gen-grpc-java 1.54.0 生成的 stub 用 @javax.annotation.Generated 注解
    // （非 jakarta.annotation）。Spring Boot 3.x 不传递引入 javax.annotation-api，需显式添加。
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    // jakarta.annotation.@PostConstruct/@PreDestroy 已由 spring-boot-starter-web 传递引入

    // === Phase 4 任务 #81：BouncyCastle ECDSA 签名验证（DefaultMpcService.aggregateSignature）
    //     用于聚合签名后对 (r, s) 做 secp256k1 ECDSA verify against joint publicKey。
    //     bcprov-jdk18on:1.78 与 nexus-sdk:java 对齐，适配 JDK 17/18。 ===
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78'

    // === 测试 ===
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // JUnit 5 (Jupiter) — 主测试框架
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    testImplementation 'org.mockito:mockito-junit-jupiter:4.11.0'
}

// 签名服务为独立部署的 Spring Boot 应用，启用 bootJar 产出可执行 fat jar。
bootJar {
    enabled = true
    archiveClassifier = ''
}

jar {
    enabled = true
    archiveClassifier = 'plain'
}

test {
    useJUnitPlatform()
}

// === Phase 4 任务 #79：protobuf-gradle-plugin 配置（审计报告 §4.1 方案 A）
// 从 src/main/proto/mpc_crypto.proto 生成 Java 类到 build/generated/source/proto/main/java
// 与 build/generated/source/proto/main/grpc。
// 生成类包名：org.nexus.signing.mpc.crypto.grpc（由 proto 的 java_package 指定）。
// GrpcMpcCryptoEngine import 这些生成类，DTO 类（同包 org.nexus.signing.mpc.crypto）
// 不依赖生成类，保持编排层与传输层解耦。 ===
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

// === 覆盖率门禁（与 nexus-gateway 对齐，minimum 0.15） ===
// BUNDLE 级别指令覆盖率下限 0.15；check 依赖 jacocoTestCoverageVerification 以强制门禁
jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.15
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
