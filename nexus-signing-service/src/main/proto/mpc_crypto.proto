// nexus-signing-service / MPC 密码学引擎 gRPC 接口定义
//
// Phase 4 任务 #79：MPC 密码学引擎 gRPC 接口（审计报告 §4.1 方案 A）。
//
// 方案 A：Rust multi-party-ecdsa 引擎作为独立进程运行，signing-service 通过
// gRPC 调用。本 proto 定义三个 RPC：
//   * Dkg       — 分布式密钥生成（DKG，GG18/GG20 第 1 阶段）
//   * Sign      — 部分签名（每个参与方本地执行签名轮次）
//   * Aggregate — 聚合部分签名为最终 ECDSA 签名 (r, s)
//
// Java 侧编排层（org.nexus.signing.mpc.*）通过 MpcCryptoEngine SPI 接口
// 调用本服务，GrpcMpcCryptoEngine 负责将纯 Java DTO 转换为 protobuf 生成类
// 并发起 gRPC 调用。DTO 与传输层解耦，便于未来切换为 in-process 引擎或
// 其他密码学后端。
//
// 详见 docs/audit-mpc-pos-l2-2026-08-07.html §4.1 方案 A。

syntax = "proto3";

package nexus.mpc;

option java_package = "org.nexus.signing.mpc.crypto.grpc";
// 不使用 java_multiple_files：让所有 message 嵌套在 MpcCryptoProto 外类中
// （MpcCryptoProto.DkgRequest 等），避免与同包 DTO（org.nexus.signing.mpc.crypto.DkgRequest）
// 同名冲突。GrpcMpcCryptoEngine 用 MpcCryptoProto.DkgRequest 引用生成类，DTO 用简单名。
option java_outer_classname = "MpcCryptoProto";

// MPC 密码学引擎服务。
//
// 由 Rust multi-party-ecdsa 引擎进程实现（tonic gRPC server），
// signing-service 作为 gRPC 客户端调用。
service MpcCryptoService {
  // 分布式密钥生成（DKG）。
  // 输入：会话 ID、t-of-n 阈值、本节点索引、曲线、其他参与方端点。
  // 输出：聚合公钥、本节点加密密钥份额、ZK 证明。
  rpc Dkg(DkgRequest) returns (DkgResponse);

  // 部分签名。每个参与方本地执行 GG18/GG20 签名轮次，产出部分签名 s_i。
  // 输入：会话 ID、聚合公钥、本节点密钥份额、消息哈希、参与方端点。
  // 输出：本节点部分签名、ZK 证明。
  rpc Sign(SignRequest) returns (SignResponse);

  // 聚合部分签名。收集 t 个部分签名后聚合为最终 ECDSA 签名 (r, s)。
  // 输入：会话 ID、聚合公钥、消息哈希、所有部分签名。
  // 输出：聚合签名 r||s、r、s、recovery_id。
  rpc Aggregate(AggregateRequest) returns (AggregateResponse);

  // 健康检查（gRPC Health Checking Protocol 之外的轻量级 ping）。
  // 用于 MpcCryptoEngine.healthCheck() SPI 方法。
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// === DKG ===

message DkgRequest {
  // 全局唯一会话 ID（编排层生成，跨所有参与方一致）。
  string session_id = 1;
  // 阈值 t（t-of-n）。
  int32 threshold = 2;
  // 总参与方数 n。
  int32 total_parties = 3;
  // 本节点索引（0-based）。
  int32 party_index = 4;
  // 椭圆曲线名称，如 "secp256k1"。
  string curve = 5;
  // 其他参与方 gRPC 端点（host:port 列表）。
  repeated string peer_endpoints = 6;
}

message DkgResponse {
  // 聚合公钥（hex 编码的曲线点）。
  string public_key = 1;
  // 本节点密钥份额（加密后的 hex，永不明文离开引擎进程）。
  string key_share = 2;
  // DKG 正确性 ZK 证明（hex）。
  string proof = 3;
  // 是否成功。
  bool success = 4;
  // 失败时的错误信息。
  string error = 5;
}

// === Sign ===

message SignRequest {
  // 全局唯一会话 ID。
  string session_id = 1;
  // 聚合公钥（hex）。
  string public_key = 2;
  // 本节点密钥份额（加密后的 hex）。
  string key_share = 3;
  // 待签名消息哈希（hex 编码，32 字节 / 256 位）。
  string message_hash = 4;
  // 本节点索引。
  int32 party_index = 5;
  // 其他参与方 gRPC 端点。
  repeated string peer_endpoints = 6;
}

message SignResponse {
  // 本节点部分签名（hex）。
  string partial_signature = 1;
  // 部分签名正确性 ZK 证明（hex）。
  string proof = 2;
  // 是否成功。
  bool success = 3;
  // 失败时的错误信息。
  string error = 4;
}

// === Aggregate ===

message AggregateRequest {
  // 全局唯一会话 ID。
  string session_id = 1;
  // 聚合公钥（hex）。
  string public_key = 2;
  // 待签名消息哈希（hex）。
  string message_hash = 3;
  // 所有参与方的部分签名（hex 列表，至少 t 个）。
  repeated string partial_signatures = 4;
}

message AggregateResponse {
  // 聚合签名 r||s（hex 拼接，64 字节）。
  string signature = 1;
  // 签名 r 部分（hex，32 字节）。
  string r = 2;
  // 签名 s 部分（hex，32 字节）。
  string s = 3;
  // 恢复 ID（0/1/2/3，用于从签名恢复公钥）。
  int32 recovery_id = 4;
  // 是否成功。
  bool success = 5;
  // 失败时的错误信息。
  string error = 6;
}

// === HealthCheck ===

message HealthCheckRequest {
  // 可选的探针名称（默认 "default"）。
  string service = 1;
}

message HealthCheckResponse {
  // 引擎是否就绪。
  bool healthy = 1;
  // 引擎版本 / 状态描述。
  string status = 2;
}