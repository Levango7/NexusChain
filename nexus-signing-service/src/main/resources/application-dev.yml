# signing-service 开发环境覆盖：H2 内存库替代 MySQL
#
# 激活方式：spring.profiles.active=dev
# H2 启用 MODE=MySQL 兼容模式 + DATABASE_TO_LOWER/CASE_INSENSITIVE_IDENTIFIERS，
# 使 Flyway migration（db/migration/V1__init_signing_approval_table.sql）的
# 同一份 SQL 在 H2 和 MySQL 下均可执行（与 nexus-wallet-service dev profile 范式一致）。
spring:
  datasource:
    url: jdbc:h2:mem:signing;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # Seata 排除（2026-09-12 B5/10e 对齐 gateway dev profile）：dev 环境无 Seata TC
  # server，SeataAutoConfiguration 连 127.0.0.1:8091 失败会阻断启动（全栈演练实证）。
  # 生产环境走 application-prod.yml 启用 Seata。
  autoconfigure:
    exclude:
      - org.apache.seata.spring.boot.autoconfigure.SeataAutoConfiguration
      - org.apache.seata.spring.boot.autoconfigure.SeataDataSourceAutoConfiguration
      - com.alibaba.cloud.seata.SeataAutoConfiguration