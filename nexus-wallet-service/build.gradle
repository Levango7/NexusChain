// nexus-wallet-service
//
// P2 方向5「签名服务独立部署 PoC」新建模块骨架。
//
// 定位：未来从 nexus-exchange-wallet 拆分出的「钱包管理服务」独立部署单元，
// 承载以下职责：
//   * 提现审批流程（approval/*：ApprovalPolicy / WithdrawalApprovalService /
//     DefaultWithdrawalApprovalService / WithdrawalRequest）
//   * 钱包托管策略（custody/*：CustodyPolicy / CustodyService / WalletTier）
//   * 地址白名单（whitelist/*：AddressWhitelistService / WhitelistEntry）
//   * Nonce 池管理（pool/*：NoncePool / NonceState / PoolTask）
//   * 链上执行通道（execution/*：OnChainExecutionClient / HttpOnChainExecutionClient）
//   * 钱包管理 REST 端点（controller/NodeController + wallet/WalletController）
//
// 当前阶段（PoC）：仅定义服务边界与接口骨架，不迁移实现代码。
// 实际钱包管理逻辑仍由 nexus-exchange-wallet 进程内提供，本模块通过
// WalletMgmtClient 接口（定义于 nexus-sdk）以 composite build 直连方式
// 调用，未来可平滑切换为 HTTP / Nacos 服务发现。
//
// 详见 docs/ 下 P2 方向5 设计文档与 README.md。

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.nexus'
version = '1.3.0'

java {
    sourceCompatibility = 17
    targetCompatibility = 17
}

repositories {
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.4'

    // 共享 SDK：钱包服务消费 ApprovalPolicy / WalletTransactionRequest / Result 等 DTO。
    // 当前 PoC 阶段：nexus-wallet-service 为 includeBuild 独立项目，nexus-sdk:java
    // 为根构建 include 子模块，二者无法通过 composite build 自动替换。
    // 骨架阶段不引用 nexus-sdk 共享 DTO（仅 Javadoc {@link} 提及，编译不需要）。
    // 未来完整迁移时改为根构建 include 子模块或通过其他方式接入 nexus-sdk。
    // implementation 'org.nexus:nexus-sdk:1.2.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// 本模块是供 nexus-gateway 等应用消费的库（经根构建 composite build 依赖替换接入），
// 不产出 Spring Boot fat jar：关闭 bootJar、启用普通 jar，否则消费方无法解析编译类路径。
bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}

test {
    useJUnitPlatform()
}