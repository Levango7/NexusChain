plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.4'
    // 2026-10-18 批次⑦：composite 模块 SpotBugs 接入（SAST 门禁此前对
    // includeBuild 模块空转）——共享配置见仓库根 gradle/composite-spotbugs.gradle。
    id 'com.github.spotbugs' version '5.1.5'
}

apply from: "${rootDir}/../gradle/composite-spotbugs.gradle"

group = 'org.nexus'
version = '2.30.0'

java {
    sourceCompatibility = 17
    targetCompatibility = 17
}

repositories {
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.4'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.4'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2:2.2.224'
}

// 本模块是供 nexus-gateway 等应用消费的库（经根构建 composite build 依赖替换接入），
// 不产出 Spring Boot fat jar：关闭 bootJar、启用普通 jar，否则消费方无法解析编译类路径。
bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = false
    }
}

// === 覆盖率门禁（与 nexus-bridge / nexus-gateway 对齐，minimum 0.15） ===
// BUNDLE 级别指令覆盖率下限 0.15；check 依赖 jacocoTestCoverageVerification 以强制门禁
// 测试体系中期建设：模块自定义覆盖率渐进线，根 0.30 门禁不注入（见根 build.gradle）
ext.jacocoGateOverridden = true
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                element = 'BUNDLE'
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
