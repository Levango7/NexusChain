name: NexusChain Release & Deploy

# ============================================================================
# REQ-03 / T03：tag-based 发布与部署 workflow
# 触发：推送 v*.*.* 格式的 git tag
# 流程：build-images → github-release → helm-publish → deploy-staging → deploy-prod
# prod 部署需 GitHub environment protection（production 环境 required reviewer，
# 2026-10-02 配置：单人仓库现状配 1 人 Levango7，第二维护者加入后补至 2 人）
# ============================================================================

on:
  push:
    tags:
      - 'v*.*.*'
  # 手动触发：两种用途，由 dry_run 区分
  #   · dry_run=true  → **试跑发布链路**：构建并推送镜像到 :dryrun 标签，
  #                     不创建 GitHub Release、不发 Helm chart、不部署。
  #                     用于在正式打 tag 前验证 build-images 能真正跑通
  #                     （2026-09-22 新增：该链路此前从未成功过，
  #                      仅做静态校验不足以证明可用）。
  #   · dry_run=false → 回滚流程（Task 284），需填 target_version 等。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '试跑发布链路（推 :dryrun 镜像，不建 Release / 不部署）'
        required: false
        type: boolean
        default: false
      target_version:
        description: '回滚目标版本号（git tag，如 v2.2.1）；dry_run=true 时忽略'
        required: false
        type: string
      environment:
        description: '回滚目标环境；dry_run=true 时忽略'
        required: false
        type: choice
        default: 'staging'
        options:
          - staging
          - production
      reason:
        description: '回滚原因；dry_run=true 时忽略'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  # ⚠️ 不要用于 GHCR 镜像/OCI 地址：GHCR 要求仓库名全小写，而本值为
  # `${{ github.repository }}`（含大写，如 Levango7/NexusChain）。
  # 需小写化后用各 job 内 `steps.prefix.outputs.value`（见 build-images /
  # helm-publish）。保留此项仅为向下兼容，勿新增引用。
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: write      # github-release job 创建 Release
  packages: write      # build-images / helm-publish 推送 GHCR

jobs:
  # ============================================================
  # 1. 构建并推送全部 13 个 Docker 镜像（tag = git tag 版本号）
  # ============================================================
  build-images:
    name: Build Images (${{ matrix.module }})
    # 正式发布（push tag）或试跑（workflow_dispatch + dry_run=true）
    if: github.event_name == 'push' || inputs.dry_run
    runs-on: ubuntu-24.04
    # P0 审计修复：移除 continue-on-error。原先任一镜像构建失败不阻断发布，
    # 会产出"部分缺失镜像"的 release 并照常部署；现在构建失败即终止发布流程。
    #
    # 2026-09-22：默认超时 10 → 20 分钟。v2.50.2 首次正式发布时
    # nexus-wallet-service 构建在 10 分钟处被 cancel（试跑同一镜像仅 2m33s，
    # 说明是构建耗时的方差，非代码问题）；10 分钟上限对含依赖下载的
    # Docker 构建过紧，一旦超时会导致整条发布链（Release / chart / 部署）全部跳过。
    timeout-minutes: ${{ matrix.timeout-minutes || 20 }}
    env:
      REGISTRY: ghcr.io
      # ⚠️ 不要用于 GHCR 镜像/OCI 地址：GHCR 要求仓库名全小写，而本值为
      # `${{ github.repository }}`（含大写，如 Levango7/NexusChain）。
      # 需小写化后用各 job 内 `steps.prefix.outputs.value`（见 build-images /
      # helm-publish）。保留此项仅为向下兼容，勿新增引用。
      IMAGE_PREFIX: ${{ github.repository }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module:
          - nexus-core
          - nexus-gateway
          - nexus-bridge
          - nexus-signing-service
          - nexus-wallet-service
          - nexus-api-gateway
          - nexus-settlement
          - nexus-compliance
          - nexus-analytics
          - nexus-oracle
          - mpc-engine
          - zk-groth16-service
          # 2026-10-12 新增：对外展示面（Express BFF 同源托管前端产物）。
          # 该镜像此前不存在 —— explorer 只有源码，发布链里没有它。
          - nexus-explorer
        include:
          - module: mpc-engine
            timeout-minutes: 25
          - module: zk-groth16-service
            timeout-minutes: 25
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      # 2026-09-22 修复：GHCR 要求镜像仓库名**全小写**。
      # 此前直接用 `${{ github.repository }}`（本仓库为 `Levango7/NexusChain`，
      # 含大写），docker buildx 报：
      #   invalid tag "ghcr.io/Levango7/NexusChain/nexus-compliance:v2.50.1":
      #   repository name must be lowercase
      # 即 **v2.50.0 / v2.50.1 两次发布均未产出任何镜像**（每次约 40 秒即失败，
      # 从未真正构建与推送）。
      # GitHub Actions 表达式无 lower() 函数，故用 bash 的 ${VAR,,} 转小写，
      # 经 step outputs 传递，避免硬编码仓库名（fork/重命名仍可用）。
      - name: 计算镜像仓库前缀（GHCR 要求全小写）
        id: prefix
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 试跑：只推 :dryrun 一个标签 —— 既不占用正式版本号，
      # 又能完整验证「标签合法性 + GHCR 认证 + 推送权限」这条此前一直失败的路径。
      - name: Build and push image（试跑：仅 :dryrun）
        id: push-dryrun
        if: inputs.dry_run
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.prefix.outputs.value }}/${{ matrix.module }}:dryrun

      - name: Build and push image（tag = git tag 版本号）
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.prefix.outputs.value }}/${{ matrix.module }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.prefix.outputs.value }}/${{ matrix.module }}:latest
            ${{ env.REGISTRY }}/${{ steps.prefix.outputs.value }}/${{ matrix.module }}:staging

      # 2026-11-06（发布后 digest 扫描）：把 buildx 自报的 manifest digest 落盘并上传。
      # 为什么必须记 digest：tag 可被覆盖（:latest / :staging 随下个版本移动），
      # 只有 `image@sha256:...` 固定指向本次发布的那批字节。
      # v2.77.0 的 digest 只存在于 build 日志（`##[group]Digest`），事后按 tag 取回
      # 也只能拿到「现在这个 tag 指向谁」，因此无法证明「发版镜像被扫过」。
      - name: 记录推送镜像的 manifest digest
        if: github.event_name == 'push' || inputs.dry_run
        env:
          MODULE: ${{ matrix.module }}
          DIGEST: ${{ steps.push.outputs.digest || steps.push-dryrun.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ steps.prefix.outputs.value }}/${{ matrix.module }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "::error title=缺少 manifest digest::build-push-action 未返回 digest，发布后扫描无法按产物取证"
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            export TAGS="dryrun"
          else
            export TAGS="${{ github.ref_name }},latest,staging"
          fi
          mkdir -p digests
          python3 - <<'PY'
          import json, os
          tags = [t.strip() for t in os.environ["TAGS"].split(",") if t.strip()]
          payload = {
              "module": os.environ["MODULE"],
              "image": os.environ["IMAGE"],
              "digest": os.environ["DIGEST"],
              "tags": tags,
          }
          with open(f"digests/{os.environ['MODULE']}.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
              f.write("\n")
          PY
          echo ">>> ${IMAGE}@${DIGEST}"

      - name: 上传 digest 清单（供 Release body 与发布后扫描）
        if: github.event_name == 'push' || inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.module }}
          path: digests/
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # 2. 创建 GitHub Release（从 CHANGELOG.md 提取对应版本段落）
  # ============================================================
  github-release:
    timeout-minutes: 10  # 观测峰值 0.2 min
    name: GitHub Release
    # 试跑不创建 Release（避免产出指向 :dryrun 镜像的正式 Release）
    if: github.event_name == 'push' && !inputs.dry_run
    needs: build-images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 从 CHANGELOG.md 提取当前 tag 对应版本段落，避免 Release body 包含全量历史。
      # CHANGELOG.md 格式：## [2.50.2] - 2026-09-22
      #
      # 2026-09-22 修复：原实现为
      #   awk "/## \[${V}\]/{flag=1} /## \[/{if(flag)exit} flag"
      # 该写法**恒返回空**——匹配到目标行时设 flag=1，但**同一行也命中
      # 第二个模式 `/## \[/`**，随即 exit，一行都没输出。
      # 实测 2.50.2 / 2.50.0 / 2.40.0 **三个版本均提取 0 字节**，
      # 于是每次都走下面的兜底分支、把**整份 CHANGELOG** 当作 Release body。
      # 因发布流水线此前从未成功过，该缺陷一直未被发现。
      #
      # 改用 index() 做前缀判断，既修掉上述逻辑错误，也避免正则转义问题。
      - name: Extract version changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # 去掉 v 前缀（tag 形如 v2.50.2，CHANGELOG 中为 2.50.2）
          VERSION_NUM="${VERSION#v}"
          echo ">>> Extracting changelog for version ${VERSION_NUM}"
          awk -v v="${VERSION_NUM}" '
            index($0, "## [" v "]") == 1 { f = 1; print; next }
            f && index($0, "## [") == 1 { exit }
            f { print }
          ' CHANGELOG.md > version_changelog.md
          echo ">>> Extracted changelog (head):"
          head -20 version_changelog.md
          # 兜底：若未提取到内容（版本号不匹配），使用全量 CHANGELOG 并告警
          if [ ! -s version_changelog.md ]; then
            echo "::warning::Version section ${VERSION_NUM} not found in CHANGELOG.md, falling back to full changelog"
            cp CHANGELOG.md version_changelog.md
          fi

      - name: 下载各镜像 digest 清单
        uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      # 2026-11-06：digest 必须进 Release body。
      # 此前 Release 只写 CHANGELOG，`v2.77.0` 的 manifest digest 只存在于 build
      # 日志里 —— 日志会过期、tag 会被覆盖，事后无法证明「这次发布推的是哪批字节」。
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: 生成镜像 digest 表并拼入 Release body
        run: |
          python3 scripts/security/release-digest-report.py \
            --digests image-digests \
            --tag "${{ github.ref_name }}" \
            --table-output digest-table.md
          {
            echo ""
            echo "## 发布镜像 digest"
            echo ""
            echo "> tag 可被覆盖（\`:latest\` / \`:staging\` 随下个版本移动），digest 才是本次发布的唯一身份。"
            echo ""
            cat digest-table.md
          } >> version_changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: version_changelog.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

  # ============================================================
  # 3. 打包并推送 Helm Chart 至 GHCR OCI Registry
  # ============================================================
  helm-publish:
    timeout-minutes: 15  # 观测峰值 0.1 min
    name: Helm Chart Publish
    if: github.event_name == 'push' && !inputs.dry_run
    needs: build-images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.14.0'

      # 2026-09-22 修复：与 build-images 同一根因 —— GHCR OCI 仓库名
      # 必须全小写，此处原直接用 `${{ github.repository }}`（含大写）。
      - name: 计算镜像仓库前缀（GHCR 要求全小写）
        id: prefix
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR OCI Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package and push Helm Chart
        run: |
          CHART_VERSION="${{ github.ref_name }}"
          # helm package：版本号去掉 v 前缀（Chart version 不含 v 前缀）
          CHART_VERSION_NUM="${CHART_VERSION#v}"
          helm package deploy/helm/ --version "${CHART_VERSION_NUM}" --app-version "${CHART_VERSION_NUM}" --destination ./chart-package
          helm push "./chart-package/nexus-chain-${CHART_VERSION_NUM}.tgz" "oci://${{ env.REGISTRY }}/${{ steps.prefix.outputs.value }}/charts"

  # ============================================================
  # 4. 自动部署至 staging 环境
  # ============================================================
  deploy-staging:
    timeout-minutes: 30  # 观测 0.1 min（多为 dry-run），留足真实部署余量
    name: Deploy to Staging
    if: github.event_name == 'push' && !inputs.dry_run
    needs: [github-release, helm-publish]
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      # 2026-09-22：未配置 KUBE_CONFIG_STAGING 时**明确跳过**而非失败。
      # 现状：该 secret 尚未配置（暂无 staging 集群），此前每次发布都在此
      # 报 "Kubernetes cluster unreachable"（空 kubeconfig → helm 连 localhost:8080），
      # 使发布流水线恒红、掩盖真实问题。
      # 语义区分：**未配置 → 跳过并告警**（不是失败）；**已配置但部署失败 → 仍然失败**。
      - name: 检查部署凭据是否配置
        id: creds
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            echo "::warning::未配置 secrets.KUBE_CONFIG_STAGING —— 跳过 staging 部署（发布产物已产出，仅未部署）。配置该 secret 后自动恢复部署。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Helm
        if: steps.creds.outputs.configured == 'true'
        uses: azure/setup-helm@v5
        with:
          version: 'v3.14.0'

      - name: Configure kubeconfig
        if: steps.creds.outputs.configured == 'true'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Helm upgrade --install（staging）
        if: steps.creds.outputs.configured == 'true'
        run: |
          CHART_VERSION="${{ github.ref_name }}"
          CHART_VERSION_NUM="${CHART_VERSION#v}"
          # P0 审计修复：镜像 tag 与发布版本联动。
          # 原先 values-staging/prod.yaml 中 image.tag 钉死 2.1.0，且 helm --version
          # 对本地路径 chart 无效——发布任何版本实际部署的都是 2.1.0 镜像。
          # build-images 推送的镜像 tag 为 ${{ github.ref_name }}（含 v 前缀），
          # 此处 --set 必须使用同一 tag 才能对上；CHART_VERSION_NUM（去 v）仅用于
          # GitHub Release 与 chart 元数据。
          IMAGE_TAG="${CHART_VERSION}"
          helm upgrade --install nexuschain deploy/helm/ \
            --namespace nexus-staging \
            --create-namespace \
            --version "${CHART_VERSION_NUM}" \
            -f deploy/helm/values-staging.yaml \
            --set nexus-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-bridge.image.tag="${IMAGE_TAG}" \
            --set nexus-signing-service.image.tag="${IMAGE_TAG}" \
            --set nexus-wallet-service.image.tag="${IMAGE_TAG}" \
            --set nexus-api-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-core.image.tag="${IMAGE_TAG}" \
            --set mpc-engine.image.tag="${IMAGE_TAG}" \
            --wait --timeout 10m

  # ============================================================
  # 5. 部署至 prod 环境（需 GitHub environment protection approval）
  # ============================================================
  deploy-prod:
    timeout-minutes: 30  # 同上
    name: Deploy to Production
    if: github.event_name == 'push' && !inputs.dry_run
    needs: deploy-staging
    runs-on: ubuntu-24.04
    # environment: production 触发 GitHub environment protection
    # required reviewer 已配置（2026-10-02：1 人 Levango7，can_admins_bypass=true
    # 保留紧急通道；单人仓库不启用 prevent_self_review 否则无人可批）
    environment: production
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      # 2026-09-22：与 deploy-staging 同策略 —— 未配置凭据则跳过并告警，
      # 不把一个"尚未配置"的状态渲染成"部署失败"。
      - name: 检查部署凭据是否配置
        id: creds
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_PROD }}" ]; then
            echo "::warning::未配置 secrets.KUBE_CONFIG_PROD —— 跳过 prod 部署（发布产物已产出，仅未部署）。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Helm
        if: steps.creds.outputs.configured == 'true'
        uses: azure/setup-helm@v5
        with:
          version: 'v3.14.0'

      - name: Configure kubeconfig
        if: steps.creds.outputs.configured == 'true'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config

      - name: Helm upgrade --install（prod）
        if: steps.creds.outputs.configured == 'true'
        run: |
          CHART_VERSION="${{ github.ref_name }}"
          CHART_VERSION_NUM="${CHART_VERSION#v}"
          # P0 审计修复：镜像 tag 与发布版本联动（覆盖 values-prod.yaml 钉死的 2.1.0）。
          # 镜像 tag 使用 build-images 推送的 ${{ github.ref_name }}（含 v 前缀）。
          IMAGE_TAG="${CHART_VERSION}"
          helm upgrade --install nexuschain deploy/helm/ \
            --namespace nexus-prod \
            --create-namespace \
            --version "${CHART_VERSION_NUM}" \
            -f deploy/helm/values-prod.yaml \
            --set nexus-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-bridge.image.tag="${IMAGE_TAG}" \
            --set nexus-signing-service.image.tag="${IMAGE_TAG}" \
            --set nexus-wallet-service.image.tag="${IMAGE_TAG}" \
            --set nexus-api-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-core.image.tag="${IMAGE_TAG}" \
            --set mpc-engine.image.tag="${IMAGE_TAG}" \
            --wait --timeout 15m

  # ============================================================
  # 6. 回滚流程（Task 284）—— 仅 workflow_dispatch 手动触发
  # ============================================================
  # 回滚策略说明（文档）：
  # ---------------------------------------------------------------------------
  # 本 job 仅在通过 Actions 页面 "Run workflow" 手动触发时执行
  # （inputs: target_version / environment / reason）。
  # 回滚采用 "以旧 chart 版本号重新 helm upgrade --install" 的方式，步骤如下：
  #   1) 配置目标环境的 kubeconfig（staging / production 对应不同 secret）。
  #   2) 列出当前 Helm release history，辅助人工确认当前部署 revision。
  #   3) 执行 helm upgrade --install 指定旧 chart 版本号重新安装，将镜像 tag
  #      锁定到 target_version（比 helm rollback <REVISION> 更可靠，直接锁定版本）。
  #   4) 回滚后人工核对：kubectl rollout status、关键业务接口健康检查、
  #      Flyway 迁移状态兼容性。
  # 备选方案（相邻 revision 回退）：
  #   helm rollback nexuschain <REVISION> --namespace <ns>
  # 重要约束：数据库迁移不可自动回滚——Flyway migrate 是单向的。回滚前务必确认
  #           目标版本的应用镜像与当前 DB schema 兼容（向后兼容假设）；
  #           如需回退 schema 须由 DBA 介入执行 flyway undo 或手动恢复，并评估数据兼容性。
  # ---------------------------------------------------------------------------
  rollback:
    timeout-minutes: 30  # 无历史数据，取宽裕值
    name: Rollback (${{ github.event.inputs.environment }})
    # 仅手动触发且**非试跑**时执行回滚
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-24.04
    # environment 用动态值：production 回滚会触发 environment protection（required reviewers approval）
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.14.0'

      - name: 解析回滚参数
        id: params
        run: |
          TARGET_VERSION="${{ github.event.inputs.target_version }}"
          ENV="${{ github.event.inputs.environment }}"
          REASON="${{ github.event.inputs.reason }}"
          echo "target_version=${TARGET_VERSION}" >> "$GITHUB_OUTPUT"
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo ">>> Rollback requested: version=${TARGET_VERSION}, env=${ENV}"
          echo ">>> Reason: ${REASON}"

      - name: Configure kubeconfig（${{ steps.params.outputs.environment }}）
        run: |
          ENV="${{ steps.params.outputs.environment }}"
          mkdir -p "$HOME/.kube"
          if [ "$ENV" = "production" ]; then
            echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > "$HOME/.kube/config"
            echo "namespace=nexus-prod" >> "$GITHUB_ENV"
            echo "values=values-prod.yaml" >> "$GITHUB_ENV"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
            echo "namespace=nexus-staging" >> "$GITHUB_ENV"
            echo "values=values-staging.yaml" >> "$GITHUB_ENV"
          fi

      # 列出 Helm release history，辅助定位当前 revision（人工确认）。
      - name: 列出 Helm release history
        run: |
          echo ">>> Helm history for nexuschain in ${namespace}:"
          helm history nexuschain --namespace "${namespace}" --max 10 || \
            echo "::warning::Helm release 'nexuschain' not found in namespace ${namespace}; 可能尚未部署过"

      # 回滚到目标版本：使用 helm upgrade --install 指定旧版本号重新安装，
      # 直接锁定镜像 tag = target_version。
      - name: Helm upgrade 回退到目标版本
        run: |
          TARGET_VERSION="${{ steps.params.outputs.target_version }}"
          CHART_VERSION_NUM="${TARGET_VERSION#v}"
          # P0 审计修复：回滚必须同时锁定镜像 tag（原先 --version 对本地路径
          # chart 无效且无 --set，回滚后部署的仍是 values 钉死的 2.1.0 镜像）。
          # target_version 输入应与 build-images 推送的 tag 一致（如 v2.40.0）；
          # 兼容传入不带 v 的纯版本号（自动补 v 前缀匹配镜像 tag）。
          if [[ "${TARGET_VERSION}" == v* ]]; then IMAGE_TAG="${TARGET_VERSION}"; else IMAGE_TAG="v${TARGET_VERSION}"; fi
          echo ">>> Rolling back to chart version ${CHART_VERSION_NUM} (image tag ${IMAGE_TAG}) in ${namespace}"
          helm upgrade --install nexuschain deploy/helm/ \
            --namespace "${namespace}" \
            --create-namespace \
            --version "${CHART_VERSION_NUM}" \
            -f "deploy/helm/${values}" \
            --set nexus-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-bridge.image.tag="${IMAGE_TAG}" \
            --set nexus-signing-service.image.tag="${IMAGE_TAG}" \
            --set nexus-wallet-service.image.tag="${IMAGE_TAG}" \
            --set nexus-api-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-core.image.tag="${IMAGE_TAG}" \
            --set mpc-engine.image.tag="${IMAGE_TAG}" \
            --wait --timeout 15m

      - name: 回滚后状态核对
        run: |
          echo ">>> Post-rollback status for ${namespace}:"
          helm status nexuschain --namespace "${namespace}"
          echo ">>> 请人工确认：kubectl rollout status、业务接口健康检查、Flyway 迁移兼容性"

  # ============================================================
  # 7. 发布后按 digest 扫描（**不阻断发版**）
  # ============================================================
  # 为什么要有这一层（2026-11-06）：
  # `security-scan.yml` 的 PR 门禁扫的是「本次构建的本地镜像」（`docker build -t <m>:scan`），
  # 它证明「将要合入的代码不引入新增漏洞」，但**证明不了已发布的那批字节**：
  # v2.77.0 的 13 个镜像由 `docker/build-push-action` 产出、带 provenance，
  # manifest digest 与 PR 门禁重建出来的镜像不同（**重建 ≠ 同一镜像**），
  # 且 release 链路此前没有任何扫描 —— 发版镜像从未被扫过。
  #
  # 语义约束：
  #   · 只扫**已推送的 manifest**，用 `image@sha256:...` 引用，不重新 build、不用 tag；
  #   · 判红语义完全复用 `trivy-baseline-gate.py`（新增 HIGH/CRITICAL 才算问题）；
  #   · **发版已发生，本 job 一律不判红**（`continue-on-error` + 脚本只产 summary），
  #     有问题走 issue（`release-digest-watch`），去重靠 issue 标题前缀 `[Release/<tag>]`。
  release-digest-scan:
    timeout-minutes: 30
    name: Post-release Digest Scan (${{ matrix.module }})
    if: always() && (github.event_name == 'push' || inputs.dry_run) && needs.build-images.result == 'success'
    needs: build-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read   # 按 digest 拉取 GHCR 私有镜像
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module:
          - nexus-core
          - nexus-gateway
          - nexus-bridge
          - nexus-signing-service
          - nexus-wallet-service
          - nexus-api-gateway
          - nexus-settlement
          - nexus-compliance
          - nexus-analytics
          - nexus-oracle
          - mpc-engine
          - zk-groth16-service
          - nexus-explorer
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 下载本模块 digest 清单
        uses: actions/download-artifact@v7
        with:
          name: image-digest-${{ matrix.module }}
          path: image-digests

      - name: 解析 digest → `image@sha256:...`
        id: ref
        run: |
          DIGEST=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"])' "image-digests/${{ matrix.module }}.json")
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.module }}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo ">>> 扫描对象：${IMAGE}"

      - name: Trivy 按 digest 扫描（原始 JSON，不套豁免）
        id: trivy
        continue-on-error: true   # 扫描失败不判红：信号转成 summary 缺失，由 triage 报 issue
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          # trivy 直连 registry 拉取（本 job 没有 build 出来的本地镜像可扫）
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          # trivy 版本锁定（不用浮动 tag）；发布后 digest 扫描为独立取证步，不占用门禁 DB 缓存
          version: v0.76.2
          image-ref: ${{ steps.ref.outputs.image }}
          format: json
          output: trivy-release-${{ matrix.module }}.json
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'
          # 显式指向空清单：不让根目录 `.trivyignore` 的 29 条历史豁免悄悄生效
          trivyignores: .github/trivyignore-empty

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: 基线差分门禁（只判新增；仅产出 summary，不判红）
        id: gate
        continue-on-error: true
        run: |
          mkdir -p gate-summaries
          set +e
          python3 scripts/security/trivy-baseline-gate.py \
            --baseline config/trivy-baseline.json \
            --report "trivy-release-${{ matrix.module }}.json" \
            --summary-json "gate-summaries/${{ matrix.module }}.json"
          rc=$?
          echo ">>> gate exit=${rc}（1=有新增/到期/策略违规，已转 issue；2=输入不可读）"
          # 步骤本身保持 green：发版不能因为「扫描判断出问题」而变红
          exit 0

      - name: 上传门禁 summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-summary-${{ matrix.module }}
          path: gate-summaries/
          retention-days: 14
          if-no-files-found: warn

  release-digest-triage:
    timeout-minutes: 10
    name: Post-release Digest Triage (${{ github.ref_name }})
    if: always() && (github.event_name == 'push' || inputs.dry_run) && needs.build-images.result == 'success'
    needs: [build-images, release-digest-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write   # 「有问题就开 issue」；不阻断发版
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # 某些腿失败时产物可能缺失；下载失败不判红，缺 summary 会在 issue 里列为「扫描异常」
      - name: 下载各镜像 digest 清单
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: 下载各腿门禁 summary
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: release-gate-summary-*
          path: gate-summaries
          merge-multiple: true

      - name: 汇总并创建/更新 issue（不判红）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/security/release-digest-report.py \
            --digests image-digests \
            --summaries gate-summaries \
            --tag "${{ inputs.dry_run && 'dryrun' || github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --label release-digest-watch \
            ${{ inputs.dry_run && '--dry-run' || '' }}
