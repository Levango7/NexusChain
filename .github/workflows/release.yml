name: NexusChain Release & Deploy

# ============================================================================
# REQ-03 / T03：tag-based 发布与部署 workflow
# 触发：推送 v*.*.* 格式的 git tag
# 流程：build-images → github-release → helm-publish → deploy-staging → deploy-prod
# prod 部署需 GitHub environment protection（required reviewers ≥ 2 人 approval）
# ============================================================================

on:
  push:
    tags:
      - 'v*.*.*'
  # Task 284：手动触发回滚流程（不触发正常发布 jobs，由各 job 的 if 条件隔离）
  workflow_dispatch:
    inputs:
      target_version:
        description: '回滚目标版本号（git tag，如 v2.2.1）'
        required: true
        type: string
      environment:
        description: '回滚目标环境'
        required: true
        type: choice
        default: 'production'
        options:
          - staging
          - production
      reason:
        description: '回滚原因（将记录到回滚日志）'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: write      # github-release job 创建 Release
  packages: write      # build-images / helm-publish 推送 GHCR

jobs:
  # ============================================================
  # 1. 构建并推送全部 12 个 Docker 镜像（tag = git tag 版本号）
  # ============================================================
  build-images:
    name: Build Images (${{ matrix.module }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # P0 审计修复：移除 continue-on-error。原先任一镜像构建失败不阻断发布，
    # 会产出"部分缺失镜像"的 release 并照常部署；现在构建失败即终止发布流程。
    timeout-minutes: ${{ matrix.timeout-minutes || 10 }}
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ${{ github.repository }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module:
          - nexus-core
          - nexus-gateway
          - nexus-bridge
          - nexus-signing-service
          - nexus-wallet-service
          - nexus-api-gateway
          - nexus-settlement
          - nexus-compliance
          - nexus-analytics
          - nexus-oracle
          - mpc-engine
          - zk-groth16-service
        include:
          - module: mpc-engine
            timeout-minutes: 15
          - module: zk-groth16-service
            timeout-minutes: 15
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image（tag = git tag 版本号）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:staging

  # ============================================================
  # 2. 创建 GitHub Release（从 CHANGELOG.md 提取对应版本段落）
  # ============================================================
  github-release:
    name: GitHub Release
    if: github.event_name == 'push'
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 从 CHANGELOG.md 提取当前 tag 对应版本段落，避免 Release body 包含全量历史。
      # CHANGELOG.md 格式：## [2.2.2] - 2026-08-18
      # awk 逻辑：匹配 ## [${VERSION#v}] 时开始打印，遇到下一个 ## [ 时退出。
      - name: Extract version changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # 去掉 v 前缀（tag 形如 v2.2.2，CHANGELOG 中为 2.2.2）
          VERSION_NUM="${VERSION#v}"
          echo ">>> Extracting changelog for version ${VERSION_NUM}"
          awk "/## \[${VERSION_NUM}\]/{flag=1} /## \[/{if(flag)exit} flag" CHANGELOG.md > version_changelog.md
          echo ">>> Extracted changelog (head):"
          head -20 version_changelog.md
          # 兜底：若未提取到内容（版本号不匹配），使用全量 CHANGELOG 并告警
          if [ ! -s version_changelog.md ]; then
            echo "::warning::Version section ${VERSION_NUM} not found in CHANGELOG.md, falling back to full changelog"
            cp CHANGELOG.md version_changelog.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: version_changelog.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

  # ============================================================
  # 3. 打包并推送 Helm Chart 至 GHCR OCI Registry
  # ============================================================
  helm-publish:
    name: Helm Chart Publish
    if: github.event_name == 'push'
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Login to GHCR OCI Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package and push Helm Chart
        run: |
          CHART_VERSION="${{ github.ref_name }}"
          # helm package：版本号去掉 v 前缀（Chart version 不含 v 前缀）
          CHART_VERSION_NUM="${CHART_VERSION#v}"
          helm package deploy/helm/ --version "${CHART_VERSION_NUM}" --app-version "${CHART_VERSION_NUM}" --destination ./chart-package
          helm push "./chart-package/nexus-chain-${CHART_VERSION_NUM}.tgz" "oci://${{ env.REGISTRY }}/${{ github.repository }}/charts"

  # ============================================================
  # 4. 自动部署至 staging 环境
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    if: github.event_name == 'push'
    needs: [github-release, helm-publish]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Helm upgrade --install（staging）
        run: |
          CHART_VERSION="${{ github.ref_name }}"
          CHART_VERSION_NUM="${CHART_VERSION#v}"
          # P0 审计修复：镜像 tag 与发布版本联动。
          # 原先 values-staging/prod.yaml 中 image.tag 钉死 2.1.0，且 helm --version
          # 对本地路径 chart 无效——发布任何版本实际部署的都是 2.1.0 镜像。
          # build-images 推送的镜像 tag 为 ${{ github.ref_name }}（含 v 前缀），
          # 此处 --set 必须使用同一 tag 才能对上；CHART_VERSION_NUM（去 v）仅用于
          # GitHub Release 与 chart 元数据。
          IMAGE_TAG="${CHART_VERSION}"
          helm upgrade --install nexuschain deploy/helm/ \
            --namespace nexus-staging \
            --create-namespace \
            --version "${CHART_VERSION_NUM}" \
            -f deploy/helm/values-staging.yaml \
            --set nexus-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-bridge.image.tag="${IMAGE_TAG}" \
            --set nexus-signing-service.image.tag="${IMAGE_TAG}" \
            --set nexus-wallet-service.image.tag="${IMAGE_TAG}" \
            --set nexus-api-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-core.image.tag="${IMAGE_TAG}" \
            --set mpc-engine.image.tag="${IMAGE_TAG}" \
            --wait --timeout 10m

  # ============================================================
  # 5. 部署至 prod 环境（需 GitHub environment protection approval）
  # ============================================================
  deploy-prod:
    name: Deploy to Production
    if: github.event_name == 'push'
    needs: deploy-staging
    runs-on: ubuntu-latest
    # environment: production 触发 GitHub environment protection
    # required reviewers ≥ 2 人 approval（在仓库 Settings → Environments 配置）
    environment: production
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config

      - name: Helm upgrade --install（prod）
        run: |
          CHART_VERSION="${{ github.ref_name }}"
          CHART_VERSION_NUM="${CHART_VERSION#v}"
          # P0 审计修复：镜像 tag 与发布版本联动（覆盖 values-prod.yaml 钉死的 2.1.0）。
          # 镜像 tag 使用 build-images 推送的 ${{ github.ref_name }}（含 v 前缀）。
          IMAGE_TAG="${CHART_VERSION}"
          helm upgrade --install nexuschain deploy/helm/ \
            --namespace nexus-prod \
            --create-namespace \
            --version "${CHART_VERSION_NUM}" \
            -f deploy/helm/values-prod.yaml \
            --set nexus-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-bridge.image.tag="${IMAGE_TAG}" \
            --set nexus-signing-service.image.tag="${IMAGE_TAG}" \
            --set nexus-wallet-service.image.tag="${IMAGE_TAG}" \
            --set nexus-api-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-core.image.tag="${IMAGE_TAG}" \
            --set mpc-engine.image.tag="${IMAGE_TAG}" \
            --wait --timeout 15m

  # ============================================================
  # 6. 回滚流程（Task 284）—— 仅 workflow_dispatch 手动触发
  # ============================================================
  # 回滚策略说明（文档）：
  # ---------------------------------------------------------------------------
  # 本 job 仅在通过 Actions 页面 "Run workflow" 手动触发时执行
  # （inputs: target_version / environment / reason）。
  # 回滚采用 "以旧 chart 版本号重新 helm upgrade --install" 的方式，步骤如下：
  #   1) 配置目标环境的 kubeconfig（staging / production 对应不同 secret）。
  #   2) 列出当前 Helm release history，辅助人工确认当前部署 revision。
  #   3) 执行 helm upgrade --install 指定旧 chart 版本号重新安装，将镜像 tag
  #      锁定到 target_version（比 helm rollback <REVISION> 更可靠，直接锁定版本）。
  #   4) 回滚后人工核对：kubectl rollout status、关键业务接口健康检查、
  #      Flyway 迁移状态兼容性。
  # 备选方案（相邻 revision 回退）：
  #   helm rollback nexuschain <REVISION> --namespace <ns>
  # 重要约束：数据库迁移不可自动回滚——Flyway migrate 是单向的。回滚前务必确认
  #           目标版本的应用镜像与当前 DB schema 兼容（向后兼容假设）；
  #           如需回退 schema 须由 DBA 介入执行 flyway undo 或手动恢复，并评估数据兼容性。
  # ---------------------------------------------------------------------------
  rollback:
    name: Rollback (${{ github.event.inputs.environment }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # environment 用动态值：production 回滚会触发 environment protection（required reviewers approval）
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: 解析回滚参数
        id: params
        run: |
          TARGET_VERSION="${{ github.event.inputs.target_version }}"
          ENV="${{ github.event.inputs.environment }}"
          REASON="${{ github.event.inputs.reason }}"
          echo "target_version=${TARGET_VERSION}" >> "$GITHUB_OUTPUT"
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo ">>> Rollback requested: version=${TARGET_VERSION}, env=${ENV}"
          echo ">>> Reason: ${REASON}"

      - name: Configure kubeconfig（${{ steps.params.outputs.environment }}）
        run: |
          ENV="${{ steps.params.outputs.environment }}"
          mkdir -p "$HOME/.kube"
          if [ "$ENV" = "production" ]; then
            echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > "$HOME/.kube/config"
            echo "namespace=nexus-prod" >> "$GITHUB_ENV"
            echo "values=values-prod.yaml" >> "$GITHUB_ENV"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
            echo "namespace=nexus-staging" >> "$GITHUB_ENV"
            echo "values=values-staging.yaml" >> "$GITHUB_ENV"
          fi

      # 列出 Helm release history，辅助定位当前 revision（人工确认）。
      - name: 列出 Helm release history
        run: |
          echo ">>> Helm history for nexuschain in ${namespace}:"
          helm history nexuschain --namespace "${namespace}" --max 10 || \
            echo "::warning::Helm release 'nexuschain' not found in namespace ${namespace}; 可能尚未部署过"

      # 回滚到目标版本：使用 helm upgrade --install 指定旧版本号重新安装，
      # 直接锁定镜像 tag = target_version。
      - name: Helm upgrade 回退到目标版本
        run: |
          TARGET_VERSION="${{ steps.params.outputs.target_version }}"
          CHART_VERSION_NUM="${TARGET_VERSION#v}"
          # P0 审计修复：回滚必须同时锁定镜像 tag（原先 --version 对本地路径
          # chart 无效且无 --set，回滚后部署的仍是 values 钉死的 2.1.0 镜像）。
          # target_version 输入应与 build-images 推送的 tag 一致（如 v2.40.0）；
          # 兼容传入不带 v 的纯版本号（自动补 v 前缀匹配镜像 tag）。
          if [[ "${TARGET_VERSION}" == v* ]]; then IMAGE_TAG="${TARGET_VERSION}"; else IMAGE_TAG="v${TARGET_VERSION}"; fi
          echo ">>> Rolling back to chart version ${CHART_VERSION_NUM} (image tag ${IMAGE_TAG}) in ${namespace}"
          helm upgrade --install nexuschain deploy/helm/ \
            --namespace "${namespace}" \
            --create-namespace \
            --version "${CHART_VERSION_NUM}" \
            -f "deploy/helm/${values}" \
            --set nexus-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-bridge.image.tag="${IMAGE_TAG}" \
            --set nexus-signing-service.image.tag="${IMAGE_TAG}" \
            --set nexus-wallet-service.image.tag="${IMAGE_TAG}" \
            --set nexus-api-gateway.image.tag="${IMAGE_TAG}" \
            --set nexus-core.image.tag="${IMAGE_TAG}" \
            --set mpc-engine.image.tag="${IMAGE_TAG}" \
            --wait --timeout 15m

      - name: 回滚后状态核对
        run: |
          echo ">>> Post-rollback status for ${namespace}:"
          helm status nexuschain --namespace "${namespace}"
          echo ">>> 请人工确认：kubectl rollout status、业务接口健康检查、Flyway 迁移兼容性"
