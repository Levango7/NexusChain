name: K8s Manifest Sync Check

# REQ-35/P2: 静态清单与 Helm Chart 同步校验
# -----------------------------------------------------------------------------
# 目的：对比 deploy/k8s/ 静态清单与 deploy/helm/ Helm Chart 渲染产物，
#       发现双路径漂移并在 PR 阶段告警，避免部署配置不一致。
# 触发：PR + master push，当 deploy/k8s/ 或 deploy/helm/ 有变更时运行
# 同时顺带执行 helm lint 与 kubeconform 校验（覆盖 REQ-08/P2）

on:
  push:
    branches: [master]
    paths:
      - 'deploy/k8s/**'
      - 'deploy/helm/**'
  pull_request:
    branches: [master]
    paths:
      - 'deploy/k8s/**'
      - 'deploy/helm/**'

# 最小权限原则：本 workflow 仅读取仓库代码并产出 artifact，无需写权限。
# actions/upload-artifact@v4 在限制范围内可正常上传（其使用 actions 内部 token）。
permissions:
  contents: read

jobs:
  helm-lint-and-sync:
    name: Helm Lint + K8s Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        # GitHub 官方 action，使用主版本标签 v4（官方供应链可信）
        # 如需进一步钉 sha：actions/checkout@v4 → 查询对应 commit sha
        uses: actions/checkout@v4

      - name: Setup Helm
        # azure/setup-helm 使用主版本标签 v4
        # TODO: 如需供应链强一致，可钉到具体 commit sha
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # P2-C3: yq 用于解析 YAML 的 kind/metadata.name/image 字段以做精确匹配与 diff
      - name: Install yq
        run: |
          curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Install kubeconform
        run: |
          # 2026-08-29 修复：kubeconform release 资产为 kubeconform-linux-amd64.tar.gz（压缩包），
          # 无裸二进制资产名；此前下载裸名得到 404 页面，mv 后执行报 exit 127 command not found。
          # 固定版本 v0.8.0 保证可复现（与下载策略一致，升级需显式改版本号）。
          KUBECONFORM_VER=v0.8.0
          curl -sSL -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VER}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/
          kubeconform -v

      - name: Helm lint（全部 Chart 与子 Chart）
        run: |
          set -e
          echo ">>> helm lint deploy/helm"
          helm lint deploy/helm
          # 子 chart 递归 lint
          find deploy/helm/charts -name Chart.yaml -exec dirname {} \; | while read chart; do
            echo ">>> helm lint $chart"
            helm lint "$chart"
          done

      # P2-C3: helm dependency build 确保 Chart.yaml 中 dependencies 已下载到 charts/，
      # 否则 helm template 会因缺子 chart 而失败或渲染不完整。
      - name: Helm dependency build
        run: |
          set -e
          echo ">>> helm dependency build deploy/helm"
          helm dependency build deploy/helm
          # 子 chart 同样 build（如有 dependencies）
          find deploy/helm/charts -name Chart.yaml -exec dirname {} \; | while read chart; do
            echo ">>> helm dependency build $chart"
            helm dependency build "$chart" || echo "[warn] $chart 无 dependencies 或 build 失败，忽略"
          done

      - name: kubeconform 校验静态清单
        run: |
          set -e
          echo ">>> kubeconform 校验 deploy/k8s/"
          # -strict 严格模式：未知字段报错（捕获 Helm 与静态清单字段漂移）
          # -kubernetes-version 指定目标集群版本
          # -ignore-missing-schemas 容忍 CRD（如 SealedSecret）未在本地定义
          kubeconform -strict -kubernetes-version 1.28.0 -ignore-missing-schemas deploy/k8s/*.yml

      # P2-C3: 用 diff -u 做 Helm 渲染产物与静态清单的实际 YAML 对比。
      # 策略（2026-08-29 审计修复）：
      #   1. helm template 渲染全部资源到 /tmp/helm-rendered/（--set 注入与
      #      静态清单一致的 registry/镜像 tag——原 --set global.image.tag
      #      不被 chart 消费（chart 读取 image.tag | global.env），渲染 tag
      #      恒为 staging，与静态清单 2.1.0 结构性必然不一致）
      #   2. 对每个 deploy/k8s/*.yml，按 (kind, metadata.name) 在渲染产物中查找匹配文件
      #   3. 完整 YAML diff 差异仅写入报告（WARN）——静态清单与 Helm 模板
      #      本就存在合法差异（helm 标签体系/探针/基础设施清单），整文件
      #      对比作为门禁会使 CI 永远漂移变红，失去信号价值
      #   4. 关键属性（image）不一致仍立即 exit 1（阻断）——镜像版本漂移
      #      是两者之间唯一"部署了什么"级别的实质漂移
      # 注：CI 无真实 k8s 集群，无法 `kubectl get -o yaml`，故与静态清单对比而非集群状态。
      - name: 渲染 Helm 模板并 diff 对比静态清单
        run: |
          set -e
          echo ">>> 渲染 Helm 模板到 /tmp/helm-rendered/"
          rm -rf /tmp/helm-rendered
          mkdir -p /tmp/helm-rendered
          # --set 参数验证：registry 与镜像 tag 与静态清单（deploy/k8s/*.yml）对齐
          helm template nexus deploy/helm \
            --set global.imageRegistry=ghcr.io/levango7/nexuschain \
            --set nexus-gateway.image.tag=2.1.0 \
            --set nexus-bridge.image.tag=2.1.0 \
            --set nexus-signing-service.image.tag=2.1.0 \
            --set nexus-wallet-service.image.tag=2.1.0 \
            --set nexus-api-gateway.image.tag=2.1.0 \
            --set nexus-core.image.tag=2.1.0 \
            --set mpc-engine.image.tag=2.1.0 \
            --include-crds \
            --output-dir /tmp/helm-rendered/

          DRIFT_REPORT=/tmp/k8s-drift-report.txt
          : > "$DRIFT_REPORT"
          DRIFT_FOUND=0

          echo ">>> 按 (kind, name) 匹配静态清单与 Helm 渲染产物并 diff -u 对比"
          for f in deploy/k8s/*.yml; do
            # 跳过非资源文件（namespace-config 仅含 Namespace + ConfigMap）
            # 提取每个静态清单中的 (kind, name) 对
            # 简单解析：取首个文档的 kind 与 metadata.name
            kind=$(yq e '.kind // ""' "$f" 2>/dev/null || true)
            name=$(yq e '.metadata.name // ""' "$f" 2>/dev/null || true)
            if [ -z "$kind" ] || [ -z "$name" ]; then
              echo "[skip] $f 无法解析 kind/name（可能为多文档 YAML 或非资源），仅做 kubeconform 校验"
              continue
            fi
            # 在 helm 渲染产物中查找同 kind+name 的文件
            matched=""
            while read hf; do
              hkind=$(yq e '.kind // ""' "$hf" 2>/dev/null || true)
              hname=$(yq e '.metadata.name // ""' "$hf" 2>/dev/null || true)
              if [ "$hkind" = "$kind" ] && [ "$hname" = "$name" ]; then
                matched="$hf"
                break
              fi
            done < <(find /tmp/helm-rendered -name '*.yaml' -type f)

            if [ -z "$matched" ]; then
              echo "[warn-drift] $f ($kind/$name) 在 Helm 渲染产物中无对应资源（基础设施类清单合法）" | tee -a "$DRIFT_REPORT"
              continue
            fi

            echo "--- diff -u $matched vs $f ---"
            # 完整 YAML diff（含 helm 注释行）：仅写入报告（WARN）。
            # 静态清单与 Helm 模板存在合法差异（标签体系/探针/env/基础设施类清单），
            # 整文件对比作为硬门禁会使 CI 永远漂移变红；有意义的漂移由下方
            # image 关键属性校验阻断。
            if ! diff -u "$matched" "$f" > /tmp/diff-out.txt 2>&1; then
              echo "[warn-drift] $kind/$name 存在结构差异（仅报告，不阻断）：" | tee -a "$DRIFT_REPORT"
              cat /tmp/diff-out.txt | tee -a "$DRIFT_REPORT"
            fi

            # 关键属性严格校验：image 与 replicas 必须一致
            static_images=$(yq e '.. | .image? // empty | select(. != null)' "$f" 2>/dev/null | sort || true)
            helm_images=$(yq e '.. | .image? // empty | select(. != null)' "$matched" 2>/dev/null | sort || true)
            if [ "$static_images" != "$helm_images" ]; then
              echo "[drift-CRITICAL] $kind/$name image 不一致：" | tee -a "$DRIFT_REPORT"
              diff -u <(echo "$helm_images") <(echo "$static_images") | tee -a "$DRIFT_REPORT"
              DRIFT_FOUND=1
            fi
          done

          echo ""
          echo "========== K8s Manifest Drift Summary =========="
          cat "$DRIFT_REPORT"
          echo "================================================="
          if [ "$DRIFT_FOUND" -ne 0 ]; then
            echo ">>> 检测到镜像版本漂移（Helm Chart 与 deploy/k8s/ 静态清单 image 不一致），CI 失败"
            exit 1
          fi
          echo ">>> 无镜像版本漂移；结构差异见上方报告（仅告警）"

      # PLAN-002 Step B: Kustomize overlay 验证（多环境部署入口）
      # 三套 overlay（dev/staging/prod）只做 namespace + image tag + env label
      # 差异——本质是声明式 GitOps 入口的 precondition。kubectl 内置 kustomize，
      # 此 step 不依赖 helm——独立验证 kustomization 合法性。
      - name: Kustomize overlay 验证
        run: |
          set -e
          for env in dev staging prod; do
            echo ">>> kubectl kustomize deploy/kustomize/overlays/${env}"
            kubectl kustomize "deploy/kustomize/overlays/${env}" > "/tmp/kustomize-${env}.yaml"
            # 文件行数 > 0（不是空模板）= 渲染成功
            [ -s "/tmp/kustomize-${env}.yaml" ] || { echo "FAIL: empty kustomize output for ${env}"; exit 1; }
            # 验证环境标签确实在（dev→env=dev 等）
            grep -q "nexus-chain.io/env: ${env}" "/tmp/kustomize-${env}.yaml" || \
              { echo "FAIL: env label not applied for ${env}"; exit 1; }
            echo "  ✓ ${env} overlay renders + env label applied"
          done

      # PLAN-002 Step C: PrometheusRule 静态校验（YAML 结构 + 告警数）
      # kubectl apply --dry-run=client 验 CRD schema——若集群无
      # monitoring.coreos.com CRD 则跳过。promtool 校验 PromQL 表达式
      # 需二进制安装（GitHub release 1 步），不强制——应用 prom metrics
      # 大部分 TODO（2.x 阶段补），告警表达式暂只基于 kube_* 通用 metrics。
      - name: PrometheusRule 静态校验
        run: |
          set -e
          # 1) YAML 语法 + CRD schema 校验（若 kubectl 集群访问可用）
          if kubectl apply --dry-run=client -f deploy/k8s/50-prometheus-rules.yaml >/dev/null 2>&1; then
            echo "  ✓ YAML 语法 + CRD schema 校验通过"
          else
            echo "  WARN: kubectl dry-run 失败（无 CRD 或无权限），仅做 YAML 解析"
            python3 -c "import yaml; yaml.safe_load(open('deploy/k8s/50-prometheus-rules.yaml'))" || \
              python -c "import yaml; yaml.safe_load(open('deploy/k8s/50-prometheus-rules.yaml'))" || \
              { echo "FAIL: even YAML parse 失败"; exit 1; }
          fi
          # 2) 告警数断言（PLAN-002 + ②升级：2026-09-07 应用 metrics 落地后
          #    BlockchainCoreStalled 使告警数 4→5）
          cnt=$(grep -c "^    - alert:" deploy/k8s/50-prometheus-rules.yaml)
          if [ "$cnt" -lt 5 ]; then
            echo "FAIL: 告警数 $cnt < 5（设计稿 4 条 + BlockchainCoreStalled）"; exit 1
          fi
          echo "  ✓ $cnt 条告警（>= 设计稿 5 条"
          # 3) for: 必填——避免抖动误报
          missing=$(grep -c "for:" deploy/k8s/50-prometheus-rules.yaml || true)
          if [ "$missing" -lt "$cnt" ]; then
            echo "FAIL: 部分 alert 缺少 for: 字段"; exit 1
          fi

      # PLAN-002 完善-修2：生产 SealedSecret 模式渲染断言——values-prod.yaml
      # 设 sealedSecretName 后，secret.yaml 必须【只渲染元数据、不写 stringData】
      # （否则明文密钥会经 values 泄漏到渲染产物）。此断言以前不存在——
      # sealed 模式从未被任何测试执行（健康扫描发现的盲点）。
      - name: SealedSecret 模式渲染断言（prod）
        run: |
          set -e
          helm template mpc-prod deploy/helm/charts/mpc-engine \
            -f deploy/helm/values-prod.yaml \
            > /tmp/mpc-prod-rendered.yaml
          # 断言 1：渲染产物中 mpc-engine Secret 不含 stringData（生产模式仅元数据）
          if grep -q "stringData" /tmp/mpc-prod-rendered.yaml; then
            echo "FAIL: prod 模式 secret 渲染仍含 stringData——明文泄漏路径未关闭"
            exit 1
          fi
          # 断言 2：sealedSecretName 确实在 values-prod 中接线（防误删）
          grep -q "sealedSecretName: mpc-engine-secret" deploy/helm/values-prod.yaml \
            || { echo "FAIL: values-prod.yaml 未设 sealedSecretName"; exit 1; }
          # 断言 3：statefulset 的 env secretKeyRef 指向 mpc-engine-secret
          # （Pod 经它读 controller 解密后的同名 Secret）
          grep -q "name: mpc-engine-secret" /tmp/mpc-prod-rendered.yaml \
            || { echo "FAIL: 渲染产物中 env secretKeyRef 未指向 mpc-engine-secret"; exit 1; }
          echo "  ✓ prod SealedSecret 模式：无 stringData + env 引用 mpc-engine-secret"

      # A 批（2026-09-08）：Alertmanager 路由树真实校验——此前 5 条告警 +
      # 路由配置全存在但**从未验证过路由语法**（健康扫描抓出的"看起来有
      # 但实际没有"同族盲点）。amtool check-config 验证 receivers/route/
      # inhibit_rules 全树语法（占位 URL 不影响语法校验）。
      - name: Install amtool + 校验 Alertmanager 路由树
        run: |
          # amtool 随 alertmanager 发布；固定 0.27.x 与 kube-prometheus-stack 依赖版本对齐
          AM_VER=0.27.0
          curl -sSL -o /tmp/amtool.tar.gz "https://github.com/prometheus/alertmanager/releases/download/v${AM_VER}/alertmanager-${AM_VER}.linux-amd64.tar.gz"
          tar -xzf /tmp/amtool.tar.gz -C /tmp
          sudo mv "/tmp/alertmanager-${AM_VER}.linux-amd64/amtool" /usr/local/bin/
          amtool --version
          # 从 kube-prometheus-stack values 抽出 alertmanager.config 段为 amtool 可读的独立文件
          yq '.alertmanager.config' deploy/monitoring/kube-prometheus-stack-values.yaml > /tmp/am-config.yaml
          # 占位 URL 替换为合法格式假值（amtool 校验 URL 格式，REPLACE_ME 会挂语法；
          # 真值部署时由运维按 runbook 替换——见 docs/runbooks/alerts.md）
          sed -i 's|REPLACE_ME_SLACK_WEBHOOK_URL|https://hooks.slack.com/services/T000/B000/XXXX|g; s|REPLACE_ME_SMTP_PASSWORD|fakepass|g; s|smtp.example.com:587|localhost:2525|g' /tmp/am-config.yaml
          # amtool check-config 要求顶层带 route——抽出的 config 段天然有
          amtool check-config /tmp/am-config.yaml
          echo "  ✓ Alertmanager 路由树语法通过（receivers/route/inhibit 全树）"
          # 额外断言：路由树必须覆盖两个 severity（critical/warning）——
          # 防止未来有人改 values 时不小心删掉一条路由
          SEV_COUNT=$(yq '.route.routes | length' /tmp/am-config.yaml)
          if [ "$SEV_COUNT" -lt 2 ]; then
            echo "FAIL: severity 路由数 $SEV_COUNT < 2（critical/warning 两级）"; exit 1
          fi
          echo "  ✓ $SEV_COUNT 条 severity 路由（critical + warning）"

      - name: 上传对比报告
        if: always()
        # GitHub 官方 action，使用主版本标签 v4
        uses: actions/upload-artifact@v4
        with:
          name: k8s-sync-report
          path: |
            /tmp/helm-rendered/
            /tmp/k8s-drift-report.txt
          if-no-files-found: ignore
          retention-days: 14