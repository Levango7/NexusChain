name: K8s Manifest Sync Check

# REQ-35/P2: 静态清单与 Helm Chart 同步校验
# -----------------------------------------------------------------------------
# 目的：对比 deploy/k8s/ 静态清单与 deploy/helm/ Helm Chart 渲染产物，
#       发现双路径漂移并在 PR 阶段告警，避免部署配置不一致。
# 触发：PR + master push，当 deploy/k8s/ 或 deploy/helm/ 有变更时运行
# 同时顺带执行 helm lint 与 kubeconform 校验（覆盖 REQ-08/P2）

on:
  push:
    branches: [master]
    paths:
      - 'deploy/k8s/**'
      - 'deploy/helm/**'
  pull_request:
    branches: [master]
    paths:
      - 'deploy/k8s/**'
      - 'deploy/helm/**'

jobs:
  helm-lint-and-sync:
    name: Helm Lint + K8s Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Helm lint（全部 Chart 与子 Chart）
        run: |
          set -e
          echo ">>> helm lint deploy/helm"
          helm lint deploy/helm
          # 子 chart 递归 lint
          find deploy/helm/charts -name Chart.yaml -exec dirname {} \; | while read chart; do
            echo ">>> helm lint $chart"
            helm lint "$chart"
          done

      - name: kubeconform 校验静态清单
        run: |
          set -e
          echo ">>> kubeconform 校验 deploy/k8s/"
          # -kubernetes-version 指定目标集群版本
          # -ignore-missing-schemas 容忍 CRD（如 SealedSecret）未在本地定义
          kubeconform -strict -kubernetes-version 1.28.0 -ignore-missing-schemas deploy/k8s/*.yml

      - name: 渲染 Helm 模板并对比静态清单
        run: |
          set -e
          echo ">>> 渲染 Helm 模板到 /tmp/helm-rendered/"
          mkdir -p /tmp/helm-rendered
          helm template nexus deploy/helm \
            --set global.image.tag=2.1.0 \
            --set global.image.registry=ghcr.io/nexus \
            --output-dir /tmp/helm-rendered/

          echo ">>> 对比 deploy/k8s/ 与 Helm 渲染产物"
          # 提取关键资源（Deployment/StatefulSet/Service）的 image tag 进行对比
          # 此处仅做关键属性对比，完整 YAML diff 需人工 review
          for f in deploy/k8s/*.yml; do
            echo "--- 静态清单: $f ---"
            grep -E 'kind:|name:|image:|replicas:' "$f" || true
          done

          echo ""
          echo "--- Helm 渲染产物关键属性 ---"
          find /tmp/helm-rendered -name '*.yaml' -exec grep -H -E 'kind:|name:|image:|replicas:' {} \; || true

      - name: 上传对比报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-sync-report
          path: |
            /tmp/helm-rendered/
          if-no-files-found: ignore
          retention-days: 14