name: NexusChain Security Scan

# P2-T7: 安全扫描自动化深化（SAST + DAST + SCA）
# -----------------------------------------------------------------------------
# 触发：push 到 master / 每周一定时扫描 / 手动触发(workflow_dispatch)
# 扫描器：
#   1. Trivy fs      — Gradle 依赖 + 源码配置漏洞扫描 + CycloneDX SBOM 产出
#   2. Trivy image   — Docker 镜像漏洞扫描（nexus-gateway / nexus-bridge）
#   3. OWASP Dep-Check — 备选方案，扫描 build.gradle 生成 HTML/JSON 报告
#   4. SpotBugs + FindSecBugs（SAST）— Java 静态安全扫描，产出 HTML/XML 报告
#   5. OWASP ZAP 基线扫描（DAST）— nexus-gateway API 动态扫描
#   6. 安全发现分诊 — 高危漏洞自动创建 GitHub Issue（遵循 SLA）
# 失败条件：发现 CRITICAL 级别漏洞 → workflow 失败（exit-code 1）
# SARIF 报告上传至 GitHub Security tab（Code Scanning Alerts）。
# SLA：P0 24h / P1 7d / P2 30d（见 docs/security-sla.md）

on:
  push:
    branches: [master]
  # 门禁前移（2026-09-29）：原先只有 push master + 周 cron —— 密钥泄露/依赖漏洞要等合进
  # master 才被发现，对合并零约束力。现 PR 也跑轻量子集并阻断；重子集（镜像扫描矩阵、
  # ZAP DAST）见各自 if，仍只在 push/cron 执行以控制 PR 时长；OWASP DC 例外——
  # 「永远上报」已于 2026-10-19 转正（同仓库 PR 亦真跑，见该 job 注释与策略文档）。
  pull_request:
    branches: [master]
  schedule:
    # 每周一 03:00 UTC（北京时间周一 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

# 并发控制（2026-10-18）
# ------------------------------------------------------------
# 同一 ref 的新 push 取消旧 run，避免同一 PR 反复 push 时堆积重复 run。
# **只对 pull_request 取消**：master push 若也取消，连续合并时中间提交会
# 失去 CI 验证（那正是本仓最需要信号的地方）。
# 已知边界：按 <workflow>-<ref> 分组只去重同一 ref，减少不了跨 PR 拥堵。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================
  # 1. Trivy 文件系统扫描（Gradle 依赖 + 源码配置）+ CycloneDX SBOM
  # ============================================================
  trivy-fs-scan:
    timeout-minutes: 15  # 观测峰值 1.1 min
    name: Trivy Filesystem Scan + SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # 上传 SARIF 到 Security tab 所需
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Trivy fs 扫描 → SARIF（全量漏洞，不阻断）
        # 钉 commit sha 提升供应链安全（v0.20.0 → b2933f565dbc598b29947660e66259e3c7bc8561）
        # 更新策略：随依赖升级一并更新，需安全负责人审批
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561  # v0.20.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          skip-dirs: build,out,target,.gradle,gradle,node_modules,jdk17,jdk-provision,.codeartsdoer
          # 2026-10-18：SARIF/JSON 步与阻断步对齐豁免白名单（此前 .trivyignore
          # 只在阻断步生效，已按政策处置的 CVE 仍会污染 Security tab 与分诊 JSON；
          # Docker 扫描 job 的 SARIF 步早已带此参数，属遗漏对齐）。
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: 0

      - name: 上传 SARIF 到 GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Trivy fs 扫描 → JSON（用于 issue 分诊）
        # 钉 commit sha 提升供应链安全（v0.20.0 → b2933f565dbc598b29947660e66259e3c7bc8561）
        # 更新策略：随依赖升级一并更新，需安全负责人审批
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561  # v0.20.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          skip-dirs: build,out,target,.gradle,gradle,node_modules,jdk17,jdk-provision,.codeartsdoer
          # 2026-10-18：与阻断步对齐豁免白名单（分诊 JSON 应与阻断判定同口径）。
          trivyignores: .trivyignore
          format: json
          output: trivy-fs-results.json
          exit-code: 0

      # === SCA: CycloneDX SBOM 产出（P2-T7） ===
      # 生成 CycloneDX 格式的软件物料清单（SBOM），用于依赖合规审计与漏洞追踪
      - name: Trivy 生成 CycloneDX SBOM
        # 钉 commit sha 提升供应链安全（v0.20.0 → b2933f565dbc598b29947660e66259e3c7bc8561）
        # 更新策略：随依赖升级一并更新，需安全负责人审批
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561  # v0.20.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: build,out,target,.gradle,gradle,node_modules,jdk17,jdk-provision,.codeartsdoer
          format: cyclonedx
          output: sbom-cyclonedx.json
          exit-code: 0

      - name: 上传 Trivy JSON + SBOM 报告
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-reports
          path: |
            trivy-fs-results.json
            sbom-cyclonedx.json
          retention-days: 30

      - name: Trivy fs 扫描（CRITICAL,HIGH 阻断）
        # 钉 commit sha 提升供应链安全（v0.20.0 → b2933f565dbc598b29947660e66259e3c7bc8561）
        # 更新策略：随依赖升级一并更新，需安全负责人审批
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561  # v0.20.0
        with:
          scan-type: fs
          scan-ref: .
          # P2-C7: 阻断门槛从 CRITICAL 提升至 CRITICAL,HIGH
          # 原 CRITICAL-only 会放过 HIGH 漏洞，不符合 P1 SLA（HIGH 7d 修复）
          severity: CRITICAL,HIGH
          skip-dirs: build,out,target,.gradle,gradle,node_modules,jdk17,jdk-provision,.codeartsdoer
          # P4-A: 与 Docker 扫描 job 同款豁免白名单（此前 fs 阻断从未踩中
          # 豁免项故遗漏；CVE-2025-66017 首例踩中，对齐 .trivyignore 生效路径）
          trivyignores: .trivyignore
          format: table
          exit-code: 1

  # ============================================================
  # 2. Trivy Docker 镜像扫描
  # ============================================================
  trivy-docker-scan:
    timeout-minutes: 30  # 观测峰值 5.5 min；含新增重试余量
    if: github.event_name != 'pull_request'  # PR 不跑（需构建镜像/起栈，成本高）
    name: Trivy Docker Image Scan (${{ matrix.module }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # P2-C7: 扩展至全部含 Dockerfile 的模块（与 ci.yml docker-build job 保持一致）
        module:
          - nexus-core
          - nexus-gateway
          - nexus-bridge
          - nexus-signing-service
          - nexus-wallet-service
          - nexus-api-gateway
          - nexus-settlement
          - nexus-compliance
          - nexus-analytics
          - nexus-oracle
          - mpc-engine
          - zk-groth16-service
          # 2026-10-18：补 nexus-explorer（ci.yml docker-build 矩阵早已包含，
          # 本矩阵注释声称"保持一致"但实际遗漏——explorer 镜像从未被 Trivy 扫描）。
          - nexus-explorer
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 构建 Docker 镜像（仅用于扫描，不推送）
        # 所有模块统一用 repo 根目录作构建上下文（-f 指定 Dockerfile 路径）。
        # Java 模块需根级 gradlew/build.gradle/project() 依赖；
        # Rust 模块 Dockerfile 内 COPY . . 后 WORKDIR 切到子目录。
        #
        # 2026-10-11 韧性加固：基础镜像拉取走 Docker Hub 认证端点 auth.docker.io，
        # 该端点会瞬时不可用（实测 master d194fabe：`failed to fetch oauth token:
        # unexpected status from POST request to https://auth.docker.io/token`），
        # docker build 立即 exit 1 → 12 个矩阵 job 中的 2 个变红。此失败与代码/CVE
        # 无关，属基础设施抖动，却会污染「红 = 代码问题」这一信号。
        # 故对构建加**有界重试**（3 次 / 间隔 15s）；3 次仍失败才判真实失败。
        run: |
          for attempt in 1 2 3; do
            if docker build -t ${{ matrix.module }}:scan -f ./${{ matrix.module }}/Dockerfile .; then
              echo "::notice::docker build 成功（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "::warning::docker build 第 ${attempt} 次失败（疑似 registry 抖动），15s 后重试"
            sleep 15
          done
          echo "::error::docker build 连续 3 次失败——判定为真实失败"
          exit 1

      - name: Trivy 镜像扫描 → SARIF
        # 钉 commit sha 提升供应链安全（v0.20.0 → b2933f565dbc598b29947660e66259e3c7bc8561）
        # 更新策略：随依赖升级一并更新，需安全负责人审批
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561  # v0.20.0
        with:
          image-ref: ${{ matrix.module }}:scan
          severity: CRITICAL,HIGH,MEDIUM,LOW
          format: sarif
          output: trivy-docker-${{ matrix.module }}.sarif
          trivyignores: .trivyignore
          exit-code: 0

      - name: 上传 SARIF 到 GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-docker-${{ matrix.module }}.sarif
          category: trivy-docker-${{ matrix.module }}

      - name: Trivy 镜像扫描（CRITICAL,HIGH 阻断）
        # 钉 commit sha 提升供应链安全（v0.20.0 → b2933f565dbc598b29947660e66259e3c7bc8561）
        # 更新策略：随依赖升级一并更新，需安全负责人审批
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561  # v0.20.0
        with:
          image-ref: ${{ matrix.module }}:scan
          # P2-C7: 镜像扫描同步提升至 CRITICAL,HIGH 阻断
          severity: CRITICAL,HIGH
          format: table
          # P4-A: 豁免上游声明不修的系统包漏洞（.trivyignore 白名单，
          # 含 zlib1g/libexpat1/libglib2.0-0/bsdutils，详见文件注释）
          trivyignores: .trivyignore
          exit-code: 1

  # ============================================================
  # 2b. 豁免清单时效复核（**不阻断**，2026-10-07）
  # -----------------------------------------------------------------------------
  # 为什么要有这条：`.trivyignore` 的处置原则是"只豁免上游无可用修复版本的系统包"，
  # 且每条都写了删除条件（"Debian 发布修复后移除"）。但上面 2. 的两步扫描都带
  # `trivyignores: .trivyignore` —— 被豁免的 finding 被抑制，于是"上游出了补丁"
  # 这件事在一条全绿的流水线里**根本看不见**。实测代价见
  # docs/audit/2026-10-06-open-alert-triage.md §6：25 条里 13 条已在两个在用
  # 运行阶段基础镜像上无命中（注释钉的是 bookworm-slim，而 Rust 模块 10-01 迁了
  # trixie-slim），另有 3 条非豁免项当日已出现修复版。
  #
  # 设计取舍（勿"顺手改成阻断"）：
  #   · 不阻断：豁免失效不是本仓代码缺陷，做成红门禁 = 让上游 DB 波动随机挡住合并；
  #   · 扫浮动 tag（与 Dockerfile 的 FROM 同一个引用）：钉 digest 会把这个 job
  #     存在的意义冻结掉——它就是要看上游有没有追上；
  #   · 不覆盖应用层依赖豁免（如 cggmp21 那条），那类由 cargo-audit 腿负责，
  #     所以脚本对"无命中"只说"作用域存疑"，不说"请删除"。
  # ============================================================
  trivyignore-staleness:
    timeout-minutes: 15  # 观测峰值 1.2 min
    name: Trivy 豁免时效复核（不阻断）
    runs-on: ubuntu-24.04
    # 与上面 2. 的镜像矩阵不同，本 job **在 PR 上也跑**：它不构建仓库镜像，只拉两个
    # 公开基础镜像（≈90s），而这正是有人改 `.trivyignore` 时最该被看一眼的时刻。
    # 刻意不用 matrix：判定 B（"在所有被扫镜像上都无命中"）必须同时看到两份结果，
    # 拆成两条 matrix 腿会让每条腿都把"对方才命中的 CVE"误报成作用域失效。
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Trivy 扫描 java17-debian13（**故意不带 .trivyignore**）→ JSON
        # 同一枚 pinned commit sha（见 2. 的更新策略注释）。
        # 关键差异：不传 trivyignores —— 否则被豁免项被抑制，复核无从谈起。
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561  # v0.20.0
        with:
          image-ref: gcr.io/distroless/java17-debian13:nonroot
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-staleness-java17-debian13.json
          exit-code: 0

      - name: Trivy 扫描 trixie-slim（Rust 模块运行阶段基础镜像）→ JSON
        # 依据 mpc-engine/Dockerfile:51 与 zk-groth16-service/Dockerfile:17：
        # 2026-10-01 起运行阶段是 debian:trixie-slim（不再是 bookworm-slim）。
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561  # v0.20.0
        with:
          image-ref: debian:trixie-slim
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-staleness-trixie-slim.json
          exit-code: 0

      - name: 上传扫描原始结果
        uses: actions/upload-artifact@v4
        with:
          name: trivy-staleness-raw
          path: trivy-staleness-*.json
          retention-days: 14

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # 2026-10-07 修正：本处原为 '3.12'（由 #53 新增该 job 时引入），
          # 与全仓 Python 3.14 统一口径（#45）不一致。本 job 只做 JSON 解析，
          # 升到 3.14 无兼容风险；统一后可避免"同一仓两套解释器"。
          python-version: '3.14'

      - name: 逐条对表 .trivyignore（A 应移除 / B 作用域存疑 / C 仍成立）
        # 脚本恒返回 0（除输入本身有问题），所以这里不写 continue-on-error：
        # 红 = "复核没跑成"，而不是"发现了漂移"——这两种情况必须可区分。
        run: |
          python3 scripts/check-trivyignore-staleness.py \
            --ignore .trivyignore \
            --scan "java17-debian13=trivy-staleness-java17-debian13.json" \
            --scan "trixie-slim=trivy-staleness-trixie-slim.json"

  # ============================================================
  # 依赖许可证策略扫描（2026-10-07 新增，**报告制**）
  # -----------------------------------------------------------------------------
  # 补齐 `docs/licensing.md` §4.3 自述的缺口：此前 CI 只有 Trivy（漏洞）/
  # gitleaks（密钥）/ OWASP DC（漏洞，**非许可**），**没有任何许可扫描器**。
  # 后果：新增 copyleft 依赖不会有任何门禁提示。
  #
  # 为什么必须报告制（不阻断）：本次首扫即发现 **5 个 GPL-3.0 系 crate**
  # （multi-party-ecdsa / centipede / bulletproof-kzen / round-based /
  # zk-paillier，均经 mpc-engine 传递引入）。若直接阻断，CI 会立刻常红，
  # 而"红"应表达"新引入的违规"，不是"存量待决策项"。故与 OWASP DC
  # 「永远上报」试运行、本文件 `Trivy 豁免时效复核（不阻断）` 同款处理：
  # **先取证、再拍板、后转阻断**（转阻断的前提是 licensing.md §5 的
  # "保留 LGPL/GPL 派生 vs 替换依赖"决策已落地）。
  #
  # 覆盖边界（诚实标注，勿高估）：
  #   · npm  — ✅ 解析全部 package-lock.json 的 license 字段（离线、确定）
  #   · Rust — ✅ 解析 Cargo.lock + crates.io 许可（带可提交缓存，离线可复现）
  #   · Java — ❌ **未覆盖**（Gradle 无锁文件，需解析已解析依赖树，另行评估）
  # 脚本本身对未覆盖项会在报告里显式标注，不假装全覆盖。
  # ============================================================
  license-policy:
    name: 依赖许可证策略（报告制）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: 许可证策略扫描（报告制，不阻断）
        # 脚本默认 exit 0（report-only）。加 --strict 才会在发现强传染许可时
        # 返回 1——待 licensing.md §5 决策落地后再切。
        run: python3 scripts/check-license-policy.py --out-dir build/license-report

      - name: 上传许可证报告（取证）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-policy-report
          path: build/license-report/
          retention-days: 30

  # ============================================================
  # 3. OWASP Dependency-Check（NVD CPE 视角，与 Trivy 互补）
  # -----------------------------------------------------------------------------
  # 生成 HTML + JSON 报告并上传为 artifact。
  # --failOnCVSS 9：CVSS >= 9.0（CRITICAL）时返回非零退出码，阻断流水线。
  #
  # 2026-10-01 恢复阻断语义（摘除 continue-on-error）：2026-09-14 降级为非阻断
  # 的唯一前提是「缺 NVD_API_KEY → 本 job 每次约 5~7 秒必红」，会把真实红项淹没
  # 在噪声里。该前提已消失：owner 于 2026-09-30 配置 secret，2026-10-01
  # workflow_dispatch run 36784537663 实测**运行 20 分 12 秒（22:31:36Z →
  # 22:51:48Z，NVD 全量库下载耗时）且 success**，报告 scanInfo 记录
  # `NVD API Last Checked = 2026-09-30T22:51:36Z`（引擎 13.0.0）——既证 key
  # 有效，也证它确实在拉 NVD（而非同名不同源的库）。
  #
  # ⚠️ 覆盖度边界（2026-10-01 实测，**勿高估本 job**）：同一份报告
  # dependencies = 54 条，构成为 37 个 .js + 15 个 .json + 2 个
  # gradle-wrapper.jar；**CPE（packages）命中 0 / 54、vulnerabilities 0**。
  # 即旧的 docker 做法只做「文件级识别」，**不解析 Gradle 依赖图**，对 jackson
  # 这类 JVM 依赖没有检测力——它的"绿"≠"JVM 依赖无漏洞"。
  #
  # === 2026-10-01（PR #17）：已升级为**真覆盖** ===
  # 本 job 改用 **官方 org.owasp.dependencycheck Gradle 插件（13.0.0）**运行
  # `./gradlew dependencyCheckAggregate -PowaspScan`：插件在 configuration 阶段读取
  # **已解析的依赖图**（GAV 坐标：runtimeClasspath 的传递闭包），交给同一个 DC 引擎
  # 做 CPE/NVD 比对 —— 这才是"扫到了 JVM 依赖"，而不是"扫到了仓库里的文件"。
  # 由此一并消解旧做法的一个供应链缺口：不再有浮动 `owasp/dependency-check:latest`
  # 镜像标签，引擎版本由**钉死的插件版本**（→ dependency-check-core:13.0.0）决定。
  # 覆盖度自检随之下调为"与真覆盖匹配"的语义：条目数/已识别数仍打印，
  # 但**覆盖度为 0 直接判失败**（不再是 warning）——能力回退不允许以绿色示人。
  #
  # 2026-09-21 保留：本 job 缺 key 时**约 5 秒内快速失败并给出明确指引**
  # （见下方 `if [[ -z "$NVD_API_KEY" ]]` 守卫），是刻意设计而非缺陷 ——
  # 与其静默跳过让人误以为扫过了，不如明确报错。
  # ============================================================
  owasp-dependency-check:
    # 2026-10-17（缺陷 #53）上限 25 → 40，并给红因分级。实测依据 = 本 workflow 最近
    # 26 次 run 的 owasp-dependency-check job（逐个取 started_at/completed_at 算耗时）：
    #   25 success / 1 cancelled；耗时 min 2.1、中位 6.0、max 20.4；
    #   唯一那次红 = **25.3 分钟被 timeout-minutes: 25 截掉**（master push 83705ae2，
    #   run 39001186130，job 结论 cancelled、被截的那一步是扫描本身）。
    # 同 26 次里「缓存 NVD 漏洞库」步骤 **26/26 success** ⇒ 长尾不是冷启动全量下载，
    # 而是 **NVD API 取数速度**（本文件上方自己记过：冷启 46m05s，与别的扫描并发抢配额
    # 时 3h03m）。原注释"观测峰值 7.4 min"已过期，按实测改掉。
    # 为什么是"单次 + 更宽的天花板"而不是加有界重试：NVD 拥塞以小时计，重试只把等待
    # 翻倍而不改变结论；#87/#118 那种重试适用于"暂时性拒绝"，这里慢的是取数量。
    timeout-minutes: 40
    # ✅ 「永远上报」已转正（2026-10-19 决议「完善」；试运行 2026-10-01 ~ 10-15 评估通过）——
    # 下面这个 if 即**最终形态**，不再回退（回退会同时破坏 required 语义，见策略文档历史注记）。
    # 语义：
    #   - 同仓库 PR：真跑全量扫描（依赖图 + NVD）→ 门禁结论在**并进 master 之前**就可见
    #     （本 job 已列于 required contexts，PR 阶段即拦截 SCA 回归）；
    #   - fork PR：跳过（无 NVD_API_KEY secret），checks 列表如实显示 skipped（**不伪装成
    #     绿**）；本仓为单一 owner（User 账号）无 fork PR 实际流量；未来若出现 fork 协作，
    #     先实测「skipped 对 required check 的判定」再放行（注意：required × 永不产生状态
    #     = 永久 pending 卡死，这是本仓踩过的形态，教训全文见策略文档）；
    #   - push master / 周 cron / workflow_dispatch：与以前一致。
    # 评估数据（2026-10-17 对最近 26 次 run 的逐次计量）：min 2.1 / 中位 6.0 / max 20.4
    # 分钟；25 success + 1 cancelled（唯一红 = 25.3 分钟被 timeout 25 截断，属 NVD 取数
    # 长尾，非扫描结论）→ 热缓存 ≤10 分钟通过线达成、失败可归因；周轮换缓存未挤爆配额。
    # 配套保留：NVD 缓存两步（下方，PR 真跑的成本前提）；时长韧性由本 job 的
    # timeout 40 + 步骤级 33m 截断与 rc 分级承担（缺陷 #53，2026-10-21 随本 PR 合入）。
    # 2026-10-21 实测补记：PR #170 的两次运行都被 25 分钟上限截断（job 结论 cancelled，
    # 被截步骤=扫描本身），复现了上面的长尾；这是本 PR 放宽上限的直接触发证据。
    # 附注（2026-10-17）：`gh api repos/…/branches/master/protection` 证实本 job 已在
    # required contexts 里（共 8 条）。⇒ 若将来要改成"PR 不跑"，必须**同时**把 required
    # contexts 中这条撤掉，否则 GitHub 会把"永不产生状态"的检查按 pending 处理，卡死此后每个 PR。
    # 结论文档：docs/dependency-check-update-policy.md「转正结论」节。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: OWASP Dependency-Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      # Python 版本口径（2026-10-06 新增，全仓统一 3.14）：
      # 本 job 的「扫描覆盖度自检」用 python3 heredoc 解析 dependency-check JSON，
      # 且该步骤是**门禁断言**（覆盖度为 0 时 ::error:: + sys.exit(1)）——
      # 此前无 setup-python，跑在 runner **预装**的 python3 上，版本随镜像漂移，
      # 与 ci.yml 已钉的 3.14 不一致。现统一钉 3.14，消除跨 workflow 解释器分裂。
      # 该脚本仅用标准库（json/os/pathlib/sys），无需额外 pip 安装。
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup JDK 17
        # PR #17：改用官方 Gradle 插件后，本 job 需要 JDK 17 + Gradle。
        # cache: gradle 用 setup-java 内置缓存（与 ci.yml 的 Build & Test 同一模式）。
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # === PR 恒上报的缓存配套（2026-10-19 转正后**保留**，勿删；见 job 级注释）===
      # 缓存 NVD 漏洞库目录（根 build.gradle：dependencyCheck.data.directory =
      # GRADLE_USER_HOME/dependency-check-data）。不缓存时每次全量拉取：2026-10-01 实测
      # 冷启动 46m05s（独占）~ 3h03m（与 master 侧扫描并发抢 NVD 配额）——PR 上不可接受；
      # 命中缓存后变为**增量更新**（build.gradle 注释原文：7 天内复用只需数秒）。
      # key 按 ISO 周轮换 → 一周至多一条，避免仓库 10GB 缓存被单一 job 挤满；
      # restore-keys 允许跨周命中上一周的库作为增量基线（未命中则退化为全量，语义不变）。
      - name: 计算 NVD 缓存键（按 ISO 周轮换）
        id: dc_week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: 缓存 NVD 漏洞库（dependency-check-data）
        uses: actions/cache@v5
        with:
          path: ~/.gradle/dependency-check-data
          key: dc-nvd-data-${{ runner.os }}-${{ steps.dc_week.outputs.week }}
          restore-keys: dc-nvd-data-${{ runner.os }}-

      # 历史沿革（保留备查，勿照抄）：2021~2026-08 用 Dependency-Check_Action
      # （钉 commit sha 75ba02d6…），但其 `others` input 经 action.yml 单引号拼接会把
      # 多参数合成**一个 argv**（2026-08-29 / 09-05 两轮实证）；2026-09-10 改直接
      # `docker run owasp/dependency-check`。2026-10-01（PR #17）再改为**官方 Gradle
      # 插件**：前两者都只能做文件级识别，对本仓库 JVM 依赖的检测力为 0（审计 §10）。
      - name: 运行 OWASP Dependency-Check（官方 Gradle 插件：真实依赖图 + NVD）
        id: owasp_scan
        # 2026-10-01（PR #17）取代 `docker run owasp/dependency-check --scan .`：
        # 旧做法只做**文件级**识别 —— 本仓库既无 gradle.lockfile 也无被跟踪的
        # pom.xml，且 Trivy 不解析 build.gradle（19 个），实测 CPE 命中 0/54，
        # jackson 这类 JVM 依赖从未被任何门禁真正分析过（审计 §10「空心绿」）。
        # 官方插件读取**已解析的依赖图**（runtimeClasspath 的 GAV 传递闭包），
        # 交给同一个 DC 引擎做 CPE/NVD 比对 → 真覆盖。
        # 供应链：插件版本 13.0.0 钉在根 build.gradle 的 plugins{}（连带
        # dependency-check-core:13.0.0），浮动 `:latest` 镜像标签随之消失。
        # -PowaspScan 才会 apply 该插件 —— 否则 `./gradlew check` 会被挂上 DC 任务，
        # 而 Build & Test 无 NVD key 且会多出 20 分钟 NVD 全量下载（见 build.gradle 注释）。
        env:
          # secrets 经 env 中转（2026-09-10）：直接在 if 里插值 secrets
          # 不存在时会以空串参与表达式，曾以空 key 触发
          # "Invalid API Key, length of 0"（run 34541005008 实证）
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # NVD 2023-12 起强制 API key（run 34541896852 实证：匿名+限速参数仍被
          # NVD 拒绝，客户端报 'Invalid API Key, length of 0'）。必须配置仓库 secret
          # NVD_API_KEY（申请：https://nvd.nist.gov/developers，免费）。
          if [[ -z "$NVD_API_KEY" ]]; then
            echo "::error::缺少 NVD_API_KEY secret——NVD 已强制 API key，匿名无法拉取漏洞库。请到 https://nvd.nist.gov/developers 申请（免费）并配置到仓库 secrets。"
            exit 1
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          # 首次运行需全量拉取 NVD（约 20 分钟；有 key 时受 nvd.delay=8000ms 限速）。
          # 报告输出：build/reports/dependency-check/dependency-check-report.{json,html}
          # 2026-10-17（缺陷 #53）：加**步骤级** 33 分钟上限（< job 的 40），把"被 job
          # 超时取消"变成"自己截断并说清是哪一类故障"——job 级超时把整个 run 记成
          # cancelled，读起来像人为取消或 CI 故障，而真因只是外部漏洞库取数慢。
          # 8000ms 限速 × NVD 条目数是本步骤耗时的主导项，与本次 diff 内容无关。
          #
          # 2026-10-22（PR #177）：**PR / push 路径不再在线取 NVD**，改用缓存库
          # （引擎设置 odc.autoupdate=false，即"用现有漏洞库、不做在线更新"）。
          # 原因（2026-10-21~22 实证）：NVD 侧拥塞时，本 job 连续多次在 33 分钟步骤
          # 上限被截断（rc=124），而它是 **required context** ⇒ 拥塞期间**所有 PR 都被
          # 阻塞**（同期 master 的 push 流水线同样红）。这不是代码问题，是外部服务问题。
          # 拆分方案：
          #   · PR / push      → 只读缓存库（快、确定，不受 NVD 拥塞影响）
          #   · schedule / 手动 → 仍做在线更新（刷新缓存库），失败只红那一次定时任务，
          #                      不会卡住任何人；缓存保留上一次成功的版本。
          # 数据新鲜度口径：PR 门禁用的是**缓存库的新鲜度**（周级；策略文档 §更新频率
          # 本就写明"7 天内复用只需数秒"）。报告里的 "NVD API Last Checked" 会如实
          # 打出该库的时间戳，运维据此判断新鲜度。
          set +e
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "NVD refresh run: 在线更新漏洞库并回写缓存。"
            timeout -k 60 33m ./gradlew dependencyCheckAggregate -PowaspScan --no-daemon --stacktrace
          else
            echo "PR/push run: 只读缓存库（odc.autoupdate=false），不做在线取数。"
            # 注意：-D 开关必须**加引号**。PowerShell 会把未加引号的 `-Dodc.autoupdate=false`
            # 按"成员访问"拆成两个参数（`-Dodc` + `.autoupdate=false`）导致 Gradle 报
            # "Task '.autoupdate=false' not found"；bash 虽不受影响，但加引号两边都安全。
            # 另外 -D 必须放在**任务名之前**：放在任务名之后会被 Gradle 当成该任务的选项解析。
            timeout -k 60 33m ./gradlew "-Dodc.autoupdate=false" dependencyCheckAggregate -PowaspScan --no-daemon --stacktrace
          fi
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::NVD 取数/扫描超过 33 分钟被截（rc=$rc）——这是**上游漏洞库取数链路慢**，不是「依赖有没有漏洞」的扫描结论；报告大概率未产出，下一步覆盖度自检会如实标注。处置：重跑本 run，或等 NVD 侧恢复。"
            exit "$rc"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::dependencyCheckAggregate 以 rc=$rc 结束——按真实门禁结论判红（CVSS>=9 命中或引擎自身报错），红因见上方 Gradle 输出，不要当成网络问题重跑。"
            exit "$rc"
          fi
          ls -la build/reports/dependency-check/

      # 2026-10-22（PLAN-022）：**基线比对** —— 补上"PR/push 只读缓存库"带来的增量盲区。
      # 背景：#177 之后，PR/push 路径的扫描用的是 NVD **缓存库**（周级新鲜度），
      #       所以 PR 扫描**看不到新披露的漏洞**（判定只覆盖"缓存库里已知的那批"）。
      #       本步骤在**刷新路径**（周 cron / 手动）上跑：此时漏洞库刚被刷新，
      #       报告里的漏洞集合与"已受理基线"比对，凡是基线之外的都算**新增** ⇒ 判红，
      #       要求人二选一：升版依赖（首选）或显式更新基线文件（写明理由与复核日期）。
      # 只在刷新路径执行：PR 路径若也跑这一步，缓存库一旦刷新就会把所有 PR 卡住，
      # 造成"每周一次全员被卡"的噪声（基线更新本该是低频、有意识的动作）。
      - name: 基线比对（新增漏洞必须有人签字）
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          python3 scripts/security/dependency-check-baseline-diff.py \
            --report build/reports/dependency-check/dependency-check-report.json \
            --baseline config/dependency-check-baseline.json

      # 2026-10-01（PR #16 引入 → PR #17 语义收紧）：扫描覆盖度自检。
      # 目的：让"绿"永远不可能是「什么都没识别出来」造成的。
      # 语义变化（PR #17，配合改用官方 Gradle 插件做真覆盖）：
      #   旧——覆盖度 0 只发 ::warning::（当时确实没有能力，属待升级项）；
      #   新——**覆盖度 0 直接 ::error:: + 非零退出**：既然门禁已能解析依赖图，
      #       再出现 0 条/0 已识别就说明能力回退（配置或数据源坏了），不允许以绿色示人。
      #       注意：升级为失败的只有「覆盖度」，**不是「漏洞数」**。
      # 任一上层步骤失败时本步骤仍执行（if: always()），此时报告可能不存在：
      # 上一步已让 job 红，这里如实报告即可；仅当上一步自称成功却没产出报告时才额外报错。
      - name: 扫描覆盖度自检（空心绿可见化）
        if: always()
        env:
          # 传入扫描步骤的结论：用于区分"报告缺失=上一步失败"与"自称成功却没报告"
          DC_STEP_OUTCOME: ${{ steps.owasp_scan.outcome }}
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib, sys

          REPORT = pathlib.Path("build/reports/dependency-check/dependency-check-report.json")
          fail = False
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = []

          def emit(msg):
              print(msg)
              lines.append(msg)

          if not REPORT.is_file():
              if os.environ.get("DC_STEP_OUTCOME") == "success":
                  emit("::error::扫描步骤自称成功，但未产出 "
                       "build/reports/dependency-check/dependency-check-report.json "
                       "→ 视为扫描未真正执行（门禁不得以空结果通过）。")
                  fail = True
              else:
                  emit("::warning::未生成 dependency-check-report.json——无法评估扫描覆盖度"
                       f"（扫描步骤结论 = {os.environ.get('DC_STEP_OUTCOME')}，详见上一步日志）。")
          else:
              rep = json.loads(REPORT.read_text(encoding="utf-8"))
              deps = rep.get("dependencies") or []
              # 「已识别」= 取得 CPE 包坐标（packages）或漏洞 ID，只有这种条目
              # 才可能参与 NVD 比对；仅收集到 evidence 的文件条目不算覆盖。
              identified = [d for d in deps if d.get("packages") or d.get("vulnerabilityIds")]
              with_vuln = [d for d in deps if d.get("vulnerabilities")]
              vuln_n = sum(len(d.get("vulnerabilities") or []) for d in with_vuln)
              ext = {}
              for d in deps:
                  e = pathlib.PurePosixPath(d.get("filePath", "")).suffix.lower() or "(无扩展名)"
                  ext[e] = ext.get(e, 0) + 1
              emit(f"扫描条目数 = {len(deps)}；已识别（CPE/漏洞 ID） = {len(identified)}；"
                   f"含漏洞条目 = {len(with_vuln)}（漏洞总数 {vuln_n}）")
              emit("条目类型分布：" + "、".join(f"{k}×{v}" for k, v in sorted(ext.items(), key=lambda kv: -kv[1])))
              scan_info = {d.get("name"): d.get("timestamp") for d in (rep.get("scanInfo", {}).get("dataSource") or [])}
              if scan_info:
                  emit("漏洞库状态：" + "；".join(f"{k}={v}" for k, v in scan_info.items()))
              if not deps:
                  emit("::error::扫描条目数为 0——**未解析到任何依赖**，覆盖度为 0，绿无意义"
                       "（检查根 build.gradle 的 dependencyCheck.scanConfigurations 与 -PowaspScan 是否生效）。")
                  fail = True
              elif not identified:
                  emit("::error::已识别组件 0 —— 已解析到依赖，却未取得任何可比对的 CPE 包坐标，"
                       "即对依赖漏洞的实际检测力为 0（NVD 库未生效 / CPE 匹配失败）。"
                       "**这不是'没有漏洞'，是扫描能力回退**，必须修复后才能恢复绿色。")
                  fail = True
              else:
                  emit(f"覆盖度：{len(identified)}/{len(deps)} 条取得 CPE/漏洞 ID，可参与 NVD 比对。")
                  # 「识别率」是能力指标（不是漏洞指标）：偏低说明依赖图中大量条目
                  # 无法映射到 CPE，属待改进项——先只告警，不阻断。
                  if len(identified) * 2 < len(deps):
                      emit(f"::warning::CPE 识别率偏低（{len(identified)}/{len(deps)} < 50%）——"
                           "覆盖虽非 0，但大量条目无法参与 NVD 比对，建议排查坐标/版本缺失。")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n### OWASP Dependency-Check 覆盖度自检\n\n")
                  for line in lines:
                      # summary 里去掉 annotation 前缀（那只是给 CI 日志用的）
                      fh.write("- " + line.replace('::error::', '❌ ').replace('::warning::', '⚠️ ') + "\n")

          if fail:
              print("::error::覆盖度自检未通过：本次扫描不构成有效覆盖（见上方 ❌ 说明）。")
              sys.exit(1)
          PYEOF

      - name: 上传 OWASP 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          # PR #17：报告路径随「官方 Gradle 插件 + 聚合任务」迁到根项目 build 目录
          path: |
            build/reports/dependency-check/dependency-check-report.html
            build/reports/dependency-check/dependency-check-report.json
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # 4. SAST: SpotBugs + FindSecBugs 静态安全扫描（P2-T7）
  # -----------------------------------------------------------------------------
  # 在根 build.gradle 中已配置 spotbugs-gradle-plugin:5.1.5 + findsecbugs:1.13.0
  # effort=max, reportLevel=low（threshold=low），产出 HTML + XML 报告
  # 排除测试代码（spotbugsTest.enabled=false）和 protobuf 生成代码
  # ============================================================
  sast-spotbugs:
    timeout-minutes: 25  # 批次⑦起含 6 个 composite build 的编译+扫描（此前观测峰值 2.6 min；composite 增量本机实测约 2 min）
    name: SAST - SpotBugs + FindSecBugs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-sast-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-sast-

      - name: 运行 SpotBugs + FindSecBugs（spotbugsAll 聚合任务）
        run: ./gradlew spotbugsAll --no-daemon

      # P2-C7: SpotBugs CI 门禁
      # 根 build.gradle 中 SpotBugs 可能配置 ignoreFailures=true（避免 Gradle 直接失败），
      # 此处独立解析 XML 报告，发现任何 <BugInstance> 即 exit 1，强制 SAST 门禁。
      # 覆盖所有模块的 build/reports/spotbugs/main.xml。
      # 注意：必须统计 <BugInstance（真实 finding）而非 <Bug——后者会误计入
      # 每个报告恒存在的 <BugCategory>/<BugPattern> 定义行（每模块约 22 行），
      # 导致 0 finding 时也误报失败（2026-08-28 修复）。
      - name: SpotBugs gate（解析 XML 报告，有 finding 则 fail）
        run: |
          set -e
          total_bugs=0
          while IFS= read -r report; do
            # 2026-08-29 修复：grep -c 在 0 匹配时输出 "0" 且退出码为 1，
            # 原先 `|| echo 0` 会再补一行 "0" 导致 count="0\n0"，
            # `[ "$count" -gt 0 ]` 报 integer expression expected（0 finding 也误红）。
            # 改为先取 count 再兜底默认 0。
            count=$(grep -c "<BugInstance" "$report" 2>/dev/null || true)
            count=${count:-0}
            if [ "$count" -gt 0 ]; then
              echo "[SpotBugs] $report: $count findings"
              total_bugs=$((total_bugs + count))
            fi
          done < <(find . -path "*/build/reports/spotbugs/main.xml" -type f 2>/dev/null)
          echo ">>> SpotBugs total findings: $total_bugs"
          if [ "$total_bugs" -gt 0 ]; then
            echo ">>> SpotBugs findings detected, failing build"
            exit 1
          fi
          echo ">>> SpotBugs gate passed (0 findings)"

      - name: 收集 SpotBugs HTML 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-html-reports
          path: '**/build/reports/spotbugs/main.html'
          if-no-files-found: ignore
          retention-days: 30

      - name: 收集 SpotBugs XML 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-xml-reports
          path: '**/build/reports/spotbugs/main.xml'
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # 4.5 Rust 依赖安全扫描：cargo audit（P2-C7）
  # -----------------------------------------------------------------------------
  # cargo audit 检查 mpc-engine Cargo.lock 中依赖是否有已知漏洞（RustSec advisory DB）
  # 现状（与下方 B1 说明一致，勿再写回"不阻断"）：本 job **阻断**，工具链由 job 自己装，
  # 装不上就是红；豁免走 .cargo/audit.toml 逐项附依据，不靠 continue-on-error 静默放行。
  # ============================================================
  cargo-audit:
    timeout-minutes: 15  # 观测峰值 3.3 min
    name: Cargo Audit (Rust deps)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # B1 修复（2026-08-31 交付前审计）：摘除 continue-on-error。
    # mpc-engine 是承载门限签名的密码学组件——Rust 依赖的 RustSec 漏洞
    # 与 Java 侧 CRITICAL/HIGH 阻断标准应当对等。豁免清单（.cargo/audit.toml，
    # 上游锁定/无修复版本逐项附依据）继续生效。
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo audit
        working-directory: mpc-engine
        run: |
          cargo install cargo-audit --locked
          # 豁免清单：mpc-engine/.cargo/audit.toml——cargo-audit 的默认发现路径
          # （.cargo/audit.toml，同 ~/.cargo/audit.toml 机制）。
          # 注：cargo-audit v0.22 无 --config 参数（此前误用导致 CI 失败）。
          cargo audit

  # ============================================================
  # 4.5b Rust 依赖安全扫描（观察期）：zk-groth16-service
  # -----------------------------------------------------------------------------
  # 2026-10-18 补：zk-groth16-service 与 mpc-engine 同属密码学 Rust 组件，但此前
  # RustSec 覆盖只写了 mpc-engine。按本仓「新门禁先观察、再转阻断」惯例，本 job
  # 先独立运行（**不列入 required checks**），观察数个发布周期后再提拔为阻断。
  # ============================================================
  cargo-audit-zk:
    timeout-minutes: 15
    name: Cargo Audit (zk-groth16-service)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo audit（zk-groth16-service）
        working-directory: zk-groth16-service
        run: |
          cargo install cargo-audit --locked
          # 豁免清单（如需）：zk-groth16-service/.cargo/audit.toml（默认发现路径）。
          cargo audit

  # ============================================================
  # 4.6 密钥泄漏扫描：gitleaks（P2-C7）
  # -----------------------------------------------------------------------------
  # gitleaks 扫描全仓库历史 commit 中的密钥/凭证泄漏（API key、private key、token 等）
  # 失败即阻断流水线（exit-code 1），防止密钥泄漏合入 master
  # ============================================================
  gitleaks-scan:
    timeout-minutes: 10  # 观测峰值 0.2 min
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5
        with:
          # 拉取完整历史以扫描所有 commit
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ============================================================
  # 5. DAST: OWASP ZAP 基线扫描 nexus-gateway API（P2-T7）
  # -----------------------------------------------------------------------------
  # 通过 docker-compose 启动 nexus-gateway + 依赖，等待健康检查通过后
  # 运行 ZAP 基线扫描（被动扫描，不发起攻击 payload）
  # 目标：http://localhost:8080（nexus-gateway API 端点）
  # 产出：HTML + XML + JSON 报告
  # 现状（与下方 B1 说明一致，勿再写回"不阻断"）：本 job **阻断**（continue-on-error 已摘）。
  # 但它在 PR 事件上**不跑**（下面 if != pull_request），且**不在 required 清单里**——
  # 这两点必须一起看：若将来把 DAST 加入 required 而 `if` 还在，PR 就会永远停在
  # "Expected — Waiting"（本仓 OWASP DC 那颗雷的同一形态，见
  # docs/dependency-check-update-policy.md 的 ⚠ 块）。
  # ============================================================
  dast-zap-baseline:
    timeout-minutes: 25  # 观测峰值 7.7 min
    if: github.event_name != 'pull_request'  # PR 不跑（需构建镜像/起栈，成本高）
    name: DAST - OWASP ZAP Baseline (gateway)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # B1 修复（2026-08-31 交付前审计）：摘除 continue-on-error。
    # 此前 DAST 连败 ~25 次被该开关静默吞掉（面板恒绿）；DAST 链路
    # （compose 依赖 + ZAP 镜像）已修复跑通（d98e65f），安全动态验证
    # 结果应真实反映在流水线状态上。
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 启动依赖并诊断容器状态
        run: |
          # Docker Compose override: docker-compose.dast.yml 设置 SERVER_PORT=8080
          # 确保gateway监听8080端口（环境变量优先级最高，覆盖任何Nacos远程配置）
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.dast.yml"

          # 启动所有依赖（|| true 防止 compose 因 nexus-core exit(1) 直接失败退出）
          # seata-server：nexus-gateway 的 Seata TC 依赖（分布式事务），
          # docker-compose.yml 中 gateway depends_on 未含 seata-server，
          # 需显式启动否则 gateway 报 can not connect to 127.0.0.1:8091
          $COMPOSE up -d seata-server 2>&1 || true
          $COMPOSE up -d nexus-gateway 2>&1 || true
          sleep 10

          # 诊断：检查每个关键容器状态
          echo "=== 容器状态 ==="
          $COMPOSE ps 2>&1 || true

          # 检查 nexus-core 是否在运行
          CORE_ID=$($COMPOSE ps -q nexus-core 2>/dev/null)
          if [ -n "$CORE_ID" ]; then
            CORE_STATUS=$(docker inspect --format '{{.State.Status}}' "$CORE_ID" 2>/dev/null || echo "unknown")
            CORE_EXIT=$(docker inspect --format '{{.State.ExitCode}}' "$CORE_ID" 2>/dev/null || echo "?")
            echo "nexus-core 状态: $CORE_STATUS, 退出码: $CORE_EXIT"
            if [ "$CORE_STATUS" != "running" ]; then
              echo "=== nexus-core 启动失败，日志（最后 300 行）==="
              $COMPOSE logs --tail 300 nexus-core 2>&1 || true
              exit 1
            fi
          else
            echo "=== nexus-core 容器未创建，尝试获取日志 ==="
            $COMPOSE logs --tail 300 nexus-core 2>&1 || true
            exit 1
          fi
          echo "nexus-core 已启动，等待 gateway 健康..."

          echo "等待 gateway 健康检查通过（最长 180s）..."
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; do echo "等待中..."; sleep 3; done' && echo "gateway 已就绪" || {
            echo "gateway 启动超时，跳过 DAST"
            echo "=== nexus-core 容器日志（最后 150 行）==="
            $COMPOSE logs --tail 150 nexus-core 2>&1 || true
            echo "=== nexus-gateway 容器日志（最后 1000 行）==="
            $COMPOSE logs --tail 1000 nexus-gateway 2>&1 || true
            echo "=== 健康端点诊断 ==="
            curl -s -o /dev/null -w "HTTP 状态码: %{http_code}\n" http://localhost:8080/actuator/health 2>&1 || echo "curl 失败"
            curl -s http://localhost:8080/actuator/health 2>&1 || echo "无响应"
            echo "=== 端口 8080 监听状态 ==="
            $COMPOSE exec -T nexus-gateway /busybox netstat -tlnp 2>/dev/null || true
            exit 1
          }

      - name: OWASP ZAP 基线扫描
        run: |
          mkdir -p reports/zap
          # 镜像来源：GHCR 是官方一手源，runner 侧直连，做首选；DaoCloud 仅兜底。
          # 旧首选 `ghcr.io/zaproxy/zap-stable:latest` 的**仓库名是错的**——官方 GHCR 路径是
          # ghcr.io/zaproxy/zaproxy:stable（只有 Docker Hub 才叫 zaproxy/zap-stable，见
          # https://www.zaproxy.org/docs/docker/about/）。GHCR 对不存在的仓库一律回 denied，
          # 所以那一腿从来没成功过，全靠兜底镜像撑着；兜底一抖，主干就红
          # （run 38904199769 与 38904779893 同一串：ghcr denied + daocloud TLS handshake timeout）。
          # 只重试"暂时性"错误（TLS 握手超时、连接被重置这类镜像链路抖动）；"永久性"错误
          # （denied / 仓库不存在）立刻换下一个来源——重试既救不回来，也只会拖长定位。
          # 拉不到仍然红：本 job 的 continue-on-error 已按 B1 摘除，不静默跳过。
          pull_ref() {
            local ref="$1" out
            for try in 1 2 3; do
              if out=$(docker pull "$ref" 2>&1); then
                printf '%s\n' "$out"
                return 0
              fi
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -Eqi "denied|unauthorized|not found|manifest unknown|repository does not exist"; then
                echo "永久性拉取错误，不再重试：$ref"
                return 2
              fi
              echo "暂时性拉取失败（第 $try/3 次），退避后重试：$ref"
              sleep $((15 * try))
            done
            return 1
          }

          SRC=""
          for REF in ghcr.io/zaproxy/zaproxy:stable docker.m.daocloud.io/zaproxy/zap-stable:latest; do
            if pull_ref "$REF"; then
              SRC="$REF"
              break
            fi
          done
          if [ -z "$SRC" ]; then
            echo "::error::ZAP 镜像两个来源都拉不到（ghcr.io/zaproxy/zaproxy:stable、docker.m.daocloud.io/zaproxy/zap-stable:latest），错误串已在上方打印。这是取数链路故障，不是扫描结论——先确认 runner 到 ghcr.io 的可达性，再判断是否真有安全问题。"
            exit 1
          fi
          echo "ZAP 镜像来源：$SRC"
          docker tag "$SRC" zaproxy/zap-stable:latest
          docker image inspect zaproxy/zap-stable:latest > /dev/null
          docker run --rm -t --network=host \
            -v "$PWD/reports/zap:/zap/wrk:rw" \
            zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:8080 \
            -r zap-report.html \
            -x zap-report.xml \
            -J zap-report.json \
            -I

      - name: 上传 ZAP 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: reports/zap/
          if-no-files-found: ignore
          retention-days: 30

      - name: 关闭服务
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dast.yml down || true

  # ============================================================
  # 6. 安全发现分诊：高危漏洞自动创建 GitHub Issue（P2-T7）
  # -----------------------------------------------------------------------------
  # 解析 Trivy JSON 报告，对 CRITICAL/HIGH 漏洞自动创建 GitHub Issue
  # 去重：通过 label "security-triage" + 漏洞指纹（CVE+包名）避免重复创建
  # SLA：P0(CRITICAL) 24h / P1(HIGH) 7d / P2(MEDIUM) 30d（见 docs/security-sla.md）
  # ============================================================
  security-issue-triage:
    timeout-minutes: 10  # 观测峰值 0.1 min
    name: Security Issue Triage
    runs-on: ubuntu-24.04
    needs: [trivy-fs-scan]
    # 审计修复：原条件 result == 'success' 使 triage 只在扫描【通过】时运行——
    # 有 CRITICAL/HIGH 时 job 失败反而跳过建 Issue，无漏洞时又无漏可报，
    # 自动分诊永不生效。改为扫描已执行（未跳过/未取消）即运行，
    # 扫描失败（发现漏洞）时对报告中的漏洞建 Issue。
    if: ${{ !cancelled() && needs.trivy-fs-scan.result != 'skipped' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      # Python 版本口径（2026-10-06 新增，全仓统一 3.14）：
      # 本 job 用 python3 跑 scripts/security/trivy-to-issues.py 自动建 Issue——
      # 此前无 setup-python，跑在 runner **预装**的 python3 上，版本随镜像漂移；
      # 本 job 在 push/cron 路径上**无人值守**，镜像升级导致的行为变化不会被及时发现。
      # 现统一钉 3.14。该脚本仅用标准库（argparse/json/os/subprocess/sys/datetime），
      # 无需额外 pip 安装；它调用的 gh CLI 由 ubuntu runner 预装，与本步骤无关。
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: 下载 Trivy 报告
        uses: actions/download-artifact@v7
        with:
          name: trivy-fs-reports

      - name: 高危漏洞自动创建 GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/security/trivy-to-issues.py \
            --report trivy-fs-results.json \
            --repo "$REPO" \
            --min-severity HIGH \
            --label security-triage
