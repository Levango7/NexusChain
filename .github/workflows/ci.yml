name: NexusChain CI/CD Pipeline

# P1-T9: CI/CD 流水线
# -----------------------------------------------------------------------------
# 触发：push / pull_request 到 master
# 环境：JDK 17 (Amazon Corretto) + Gradle 依赖缓存
# 流程：编译 → 测试 → 覆盖率报告 → Codecov 上传 → JAR 产物上传 → Docker 构建/推送
#
# 注：CI 运行于 Linux runner，使用 ./gradlew（Windows 本地开发用 gradlew.bat）。
#     matrix.os 可扩展为 [ubuntu-24.04, windows-latest] 做跨 OS 验证。
#
# 2026-10-22（PLAN-024）：runner 标签由 `ubuntu-26.04` 统一切到 **`ubuntu-24.04`**。
# ⚠️ 归因已修正：最初把「job 排队 15~60 分钟」归因为「26.04 标签池为空」，但实测**不支持**该结论 ——
#   · incident 前（2026-10-22 15:0xZ）：26.04 的 PR 排队 3.5 分钟、24.04 的 PR 4.4 分钟，**无差异**；
#   · 15:28Z 起 GitHub Actions 官方 incident（degraded_performance）期间，两个标签**同时**排队 30+ 分钟且
#     全仓 in_progress=0 ⇒ 排队主因在平台侧。
# 因此切标签**不宣称**能缩短排队；理由是 24.04 为最成熟、供给最足的 LTS 镜像（低风险对冲，产物不受影响）。
# 代价：24.04 的系统库安全更新比 26.04 晚一档（GitHub 每周重建镜像，补丁仍跟进）。
#   已登记为 roadmap #32，可随时回退。
# 复核方法：合并后对比同一 PR 的"run 创建 → 首个 job 启动"间隔（本 PR 自身即为对照样本）。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# （concurrency 归一说明 2026-10-19：本批原在此处新增了等价并发组；origin/master 的
# #142 已以 `event_name == 'pull_request'` 实现覆盖 4 个 workflow（ci / k8s-sync /
# performance-test / security-scan），语义等价且面更广——合并消重后保留 #142 版本，
# 其块位于下方 env 之后。）

env:
  # 关闭 daemon（CI 每次均为全新 runner，daemon 无意义且浪费资源）
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dfile.encoding=UTF-8"

# 并发控制（2026-10-18）
# ------------------------------------------------------------
# 同一 ref 的新 push 取消旧 run，避免同一 PR 反复 push 时堆积重复 run。
# **只对 pull_request 取消**：master push 若也取消，连续合并时中间提交会
# 失去 CI 验证（那正是本仓最需要信号的地方）。
# 已知边界：按 <workflow>-<ref> 分组只去重同一 ref，减少不了跨 PR 拥堵。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================
  # 代码卫生棘轮门禁（2026-09-21 审查新增）
  # ------------------------------------------------------------
  # 背景：审查记录了三类日志卫生缺陷 —— printStackTrace() 绕过日志框架
  # （无级别/时间戳/logger 名，与 traceId 无法关联）、System.out.print*
  # 写 stdout、以及空 catch 静默吞异常。
  #
  # 为什么不一次性清零：其中相当一部分位于加密/编码核心
  # （Ed25519 / SHA3Utility / Uint256 等）。批量重构这些文件的风险高于
  # 收益 —— 可能改变异常传播路径，且为其注入 logger 需引入新依赖
  # （实测：nexus-consortium/common 无 slf4j，注入 @Slf4j 直接编译失败）。
  #
  # 因此采用**棘轮**策略：
  #   · 历史违规记入 scripts/code-hygiene-baseline.txt，不阻断构建
  #   · 任何**新增**违规立即失败
  #   · 基线只应收缩；修完历史违规后运行
  #     `python scripts/check-code-hygiene.py --update-baseline`
  #
  # 本 job 无外部依赖（纯 Python 3 标准库），秒级完成。
  # ============================================================
  code-hygiene:
    name: Code Hygiene (ratchet gate)
    runs-on: ubuntu-24.04
    # 2026-10-18：5 → 8。本 job 是 required context，而新增的「迁移版本号棘轮」
    # step 需要一次 `git fetch --depth=2 origin master`。原 5 分钟是按"纯 Python、
    # 秒级完成"定的；加了网络取数后，若 runner 网络抖动导致超时，这个 required job
    # 会变红并**挡住所有人的合并**——比漏检更糟。8 分钟留足余量。
    timeout-minutes: 8
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      # Python 版本口径（2026-10-06 统一）：全仓 Python 调用统一钉 **3.14**。
      # 此前本 job 用 setup-python@v6 装 3.12，而 build-and-test 里的
      # cargo-test-to-junit.py / test_nexus_sdk.py 用的是 runner **预装**的
      # python3 —— 两个 job 的 Python **来源不同、版本不受控**：
      #   · code-hygiene      → /opt/hostedtoolcache/Python/3.12.14/x64
      #   · build-and-test    → runner 自带 python3（版本随镜像漂移）
      # 后果：同仓两套解释器，一处通过不保证另一处通过；runner 镜像升级
      # 会静默改变 build-and-test 的行为（无 setup 步骤 → 无版本锚点）。
      # 现统一为 3.14：当前稳定主版本，且为全仓选中版本的下界。
      # 选用 '3.14'（不带补丁号）而非 '3.14.8'：让 setup-python 自动跟进
      # 最新安全补丁，避免钉死补丁号后漏掉 CVE 修复。
      # 新增 Python 调用步骤时：**必须**同时加本步骤，不得依赖 runner 预装。
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: 代码卫生棘轮检查（新增 printStackTrace / System.out / 空 catch）
        run: python scripts/check-code-hygiene.py

      # 打包一致性（2026-09-21 新增）
      # 背景：nexus-core 的 jar 任务排除了 application*.properties/yml
      # （为避免 core 作为库时污染下游服务的配置链），但其注释断言
      # 「core 独立运行形态（Dockerfile 源码全量构建）不受影响」**与事实不符**
      # —— Dockerfile 用的正是那个 jar。后果：容器内 nexus-core 启动即失败
      # （PlaceholderResolutionException: 'transaction.day.count'），
      # DAST 门禁因此从未真正扫描过任何东西。
      # 这类「A 处修复破坏 B 处」的缺陷单文件静态检查看不出，需跨文件校验。
      - name: 打包一致性检查（jar 排除配置 → 容器必须另行提供）
        run: python scripts/check-packaging-consistency.py

      # 版本口径一致性（2026-09-28 新增）
      # 背景：版本号漂移已发生三次——README 头注停在 2.50.0；v2.50.2 发版时
      # version.properties 仍为 2.50.0 导致 jar 名错位；2026-09-17 审计发现
      # README 硬编码 v2.40.0。build.gradle 与 version.properties 必须同步
      # 修改（见 version.properties 内注释），README 版本口径头注必须包含
      # 当前版本号。
      - name: 版本口径一致性检查（build.gradle / version.properties / README）
        run: bash scripts/check-version-consistency.sh

      # 调度锁门禁（2026-10-13 新增）
      # 背景：多副本部署（values-prod replicaCount>1）下每个 @Scheduled 每副本各跑一遍，
      # 资金/运维类调度器漏锁会造成重复动账 —— #95/#96/#97/#99 已逐一补锁。
      # 本门禁要求：每个 @Scheduled 要么带 @SchedulerLock，要么落在两本"只准缩不准涨"的账里
      # （scripts/scheduler-lock-baseline.txt 历史债务 / scheduler-lock-exemptions.txt 豁免〔理由必填〕）。
      # 注意：**依赖进程内状态**的调度器加锁反而有害（锁会把执行权交给没有该状态的副本），
      # 那类走豁免账并注明"正确修法是持久化"，见 docs/plan/PLAN-gateway-scheduler-inmemory-state-persistence.md。
      # 先跑 --selftest：拿四个合成样本钉住解析器（缺锁/带锁/同行写法/纯注释提及），
      # 防止解析器静默坏掉后"空判绿"。
      - name: 调度锁门禁（@Scheduled 必须带锁或显式豁免）
        run: |
          python scripts/check-scheduler-lock.py --selftest
          python scripts/check-scheduler-lock.py

      # ============================================================
      # 迁移版本号棘轮门禁（2026-10-18 新增）
      # ------------------------------------------------------------
      # 背景（真实事故）：PR #106 带 V99–V102，而 V103 已被另一个 PR
      # （KEK 轮换）合入 master ⇒ V99–V102 变成「低号后到」。Flyway
      # **未配 out-of-order**（默认 false）⇒ 在**已应用 V103 的存量库**上
      # 启动即抛 FlywayException: Detected resolved migration not applied
      # to database: 99。
      #
      # 为什么 CI 与 strict 都治不了它：
      #   · CI 跑在**全新库**上，V1→…→V103 按序应用必然通过；
      #   · `strict: true`（要求分支更新到最新）只改变 CI 跑在哪个 base 上，
      #     而无论哪个 base 都是全新库。
      # ⇒ 唯一对症的做法：**直接断言版本号单调性**。
      #
      # 作用域按**迁移目录**（不按全局）：本仓 5 个模块各有独立数据源
      # （gateway 86 / bridge 5 / signing 4 / wallet 4 / consortium 1），
      # V1–V4 跨目录同号是**合法**的——按全局判会把合法状态判红。
      #
      # 先跑 --selftest：合成样本钉住判定函数（含 #106 事故形态、
      # 「恰等于 base_max 也算违规」、以及「跨目录同号必须放过」），
      # 防止解析器/判定静默坏掉后空判绿或全判红。
      # ============================================================
      - name: 迁移版本号棘轮门禁（新增迁移必须 > 该目录 base 最大值）
        run: |
          python scripts/check-migration-version-ratchet.py --selftest
          git fetch --depth=2 origin master
          python scripts/check-migration-version-ratchet.py --base FETCH_HEAD

  # ============================================================
  # Explorer 前端门禁（2026-09-16 审查新增）
  # ------------------------------------------------------------
  # 背景：nexus-explorer 此前在全部 workflow 中出现 0 次 —— 前端与其 BFF
  # 无任何 CI 覆盖。package.json 声明了 lint/test 脚本却无人调用，于是
  # 「设计令牌未注入产物」「透明度修饰符被静默丢弃」「跨层字段契约断裂」
  # 这类缺陷可以长期存在于主分支（已实测确认）。
  #
  # 覆盖五道检查：
  #   1. format:check  —— Prettier 格式
  #   2. lint          —— ESLint
  #   3. test:coverage —— Vitest（含页面级 / 路由可达性 / 覆盖率阈值）
  #   4. build         —— tsc + vite build
  #   5. verify:build  —— 构建产物完整性（令牌注入、源码类名→产物规则、
  #                       透明度 alpha 实际生效）
  # 第 5 项是组件测试与类型检查都无法替代的：它们跑在 jsdom 中，不加载
  # 产物 CSS，因此「类名写了但 CSS 没生成」只能在校验产物时发现。
  # ============================================================
  explorer-frontend:
    name: Explorer Frontend (lint / test / build / artifacts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nexus-explorer
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      # Node 26 采纳（2026-10-06 决策，依据 PR #25 实测数据，提前于官方 LTS 升格日）：
      # ─ 实证：PR #25 试验跑（run 37073643914）本 job 实测 `node: v26.10.0`，
      #   lint / vitest / tsc build / 产物校验全绿（39s），无行为漂移。
      # ─ 为何不等 2026-10-28 LTS 升格：Node 官方 schedule.json 显示
      #   v24(Krypton) 于 2026-10-20 转 Maintenance、v22(Jod) 早已于 2025-10-21
      #   转 Maintenance。即「先跳 24 过渡」会落入一个 8 天后即进维护期的版本，
      #   是比直接上 26 更差的选择；而 22 现处维护期（仅安全补丁）无长期价值。
      # ─ 为何 26 的 Current 身份可接受：本仓 Node 用途仅为构建/测试工具链
      #   （vitest/tsc/hardhat），非生产运行时产物；且已由本 job + Hardhat job
      #   双线实测通过。升级更早 = 更早暴露 breaking、更早淘汰旧路径。
      - name: Setup Node 26
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: nexus-explorer/package-lock.json

      - name: 安装依赖
        # 2026-10-11 韧性：npm registry 瞬时不可用（5xx / 超时）会直接失败，非代码问题。
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund; then exit 0; fi
            echo "::warning::npm ci 第 ${attempt} 次失败（疑似 registry 抖动），15s 后重试"
            sleep 15
          done
          echo "::error::npm ci 连续 3 次失败"; exit 1

      - name: Prettier 格式检查
        working-directory: nexus-explorer/frontend
        run: npm run format:check

      - name: ESLint
        working-directory: nexus-explorer/frontend
        run: npm run lint

      - name: Vitest（含覆盖率阈值）
        working-directory: nexus-explorer/frontend
        run: npm run test:coverage

      - name: 构建
        working-directory: nexus-explorer/frontend
        run: npm run build

      - name: 构建产物完整性校验
        working-directory: nexus-explorer/frontend
        run: npm run verify:build

      - name: 设计令牌对比度校验（WCAG 2.1 AA）
        working-directory: nexus-explorer/frontend
        run: npm run verify:contrast

      # BFF（nexus-explorer/backend）此前无 tsconfig.json、lint 脚本无 eslint
      # 依赖与配置 —— 实机运行 `npm run lint` 返回 exit 2，`npm run build`
      # 因缺 tsconfig 必然失败。2026-09-16 审查已补齐，此处纳入门禁。
      - name: BFF typecheck
        working-directory: nexus-explorer/backend
        run: npm run typecheck

      - name: BFF lint
        working-directory: nexus-explorer/backend
        run: npm run lint

      - name: BFF build
        working-directory: nexus-explorer/backend
        run: npm run build

  # ============================================================
  # 构建 & 测试 & 覆盖率
  # ============================================================
  build-and-test:
    timeout-minutes: 60  # 观测 15.9–35.4 min（近 10 次）
    # check 名称必须完全固定：分支保护按 context 名精确匹配。两个坑都实测过 ——
    # ① 名称含 matrix.os 变量，runner 漂移后名称跟着变；
    # ② 即使名称写死，只要 job 带 matrix，GitHub 仍会自动追加 "(matrix 值)" 后缀
    #    （实测上报为 "Build & Test (JDK 17) (ubuntu-26.04)"）。
    # 两者都会让 required check「永不上报」→ master 上所有 PR 永久 blocked。
    # 故本 job 不使用 matrix；将来若需跨 OS 验证，另建独立 job 并各用固定名称。
    name: Build & Test (JDK 17)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Setup JDK 17 (Amazon Corretto)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      # Python 版本口径（2026-10-06 新增）：本 job 此前**无 setup-python**，
      # 直接依赖 runner 预装的 python3。这里跑着 SDK Python 回归
      # （tests/test_nexus_sdk.py）与 Rust 测试 XML 转换
      # （scripts/cargo-test-to-junit.py），两者都因此**没有版本锚点** ——
      # runner 镜像升级会静默改变行为，且与 code-hygiene job 的 3.12 不一致。
      # 现显式钉 3.14，与 code-hygiene job 同版本，消除跨 job 解释器分裂。
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Ensure gradlew is LF
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # P2-C6: Gradle wrapper 完整性校验
      # 重新生成 wrapper 并与仓库版本对比，确保 gradle/wrapper/ 下文件未被篡改、版本一致。
      # 若 runner 上 wrapper 与仓库不一致（例如被 PR 修改但未同步），git diff --exit-code 会非零退出。
      # 注意：仓库 wrapper 已随 ca7e0ba 升级到 Gradle 8.14（huaweicloud 镜像 + networkTimeout=600000 定制），
      # 校验命令必须与仓库 gradle-wrapper.properties 的版本、distribution URL、networkTimeout 完全一致，
      # 否则重新生成必然产生 diff（如旧参数 8.5 会把 properties 改回 8.5）导致误报失败。
      - name: Validate Gradle wrapper
        run: |
          # 本步骤真正要守的东西是最后那行 `git diff --exit-code gradle/wrapper/`
          # （仓库 wrapper 与"重新生成的结果"必须一致，防篡改/防漂移）。
          # 但生成命令本身会去**实测 distribution URL 可达性**（Gradle :wrapper 的设计），
          # 于是第三方镜像抖一下就把整条 Build & Test 判红。实测代价：
          #   master `8439b39a` 的 run `38892843985` 红在
          #   `Execution failed for task ':wrapper' > Test of distribution url
          #    https://mirrors.huaweicloud.com/gradle/gradle-8.14-bin.zip failed`，
          #   而**同一内容**的 #114 PR run 是绿的、**上一条** master run（`636f52b8`）也是绿的，
          #   且该提交对 `gradle/wrapper/` 的改动文件数=0 ⇒ 外部可用性抖动，不是代码回归。
          # 处置口径同 #87（Docker Hub 匿名 429）：**只重试"镜像不可达"这一类**；
          # wrapper 真漂移（git diff 非零）绝不重试、绝不解释——那是它该红的理由。
          ATTEMPTS=3
          RETRY_BASE_SLEEP=30
          OUT=/tmp/wrapper-gen.log
          i=0
          rc=1
          mirror_flaky=0
          while [ "$i" -lt "$ATTEMPTS" ]; do
            i=$((i + 1))
            if ./gradlew wrapper --gradle-version 8.14 \
                 --gradle-distribution-url https://mirrors.huaweicloud.com/gradle/gradle-8.14-bin.zip \
                 --network-timeout 600000 >"$OUT" 2>&1; then
              rc=0
              break
            fi
            if grep -q "Test of distribution url" "$OUT"; then
              mirror_flaky=1
              echo "::warning::Gradle 发行镜像不可达（第 ${i}/${ATTEMPTS} 次尝试）——外部可用性抖动，非 wrapper 漂移"
              sleep "$((i * RETRY_BASE_SLEEP))"
            else
              break   # 不是镜像问题，重试没有意义，直接落到下面的失败输出
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::Validate Gradle wrapper 的前置生成步骤失败（rc=${rc}，尝试 ${i}/${ATTEMPTS}，镜像抖动=${mirror_flaky}）"
            echo "归因指引："
            echo "  · 日志含 'Test of distribution url ... failed' ⇒ huaweicloud 镜像不可达，属外部依赖抖动。"
            echo "    判据（不要猜）：同一 head 的 PR run 是否绿 + 本次提交是否改动 gradle/wrapper/。"
            echo "  · 否则才是仓库 wrapper 自身的问题，看下面的日志尾部。"
            tail -40 "$OUT"
            exit 1
          fi
          echo "wrapper 重新生成成功（第 ${i}/${ATTEMPTS} 次尝试）"
          # ↓ 真正的门禁：有 diff 就是漂移，不重试、不解释
          git diff --exit-code gradle/wrapper/ || {
            echo "::error::gradle/wrapper/ 与重新生成的结果不一致（这才是本步骤要守的：wrapper 漂移/被篡改）"
            git --no-pager diff -- gradle/wrapper/ | head -40
            exit 1
          }

      # 版权头合规门禁（2026-09-17 立即项 #1）：LGPL 派生范围声明 + 越界 GNU 许可头防护。
      # 背景：nexus-core 为上游 java-nexuscore 的 LGPL-3.0 派生代码（166 个 Java 文件带
      # LGPL 头 + nexus-core/LICENSE 为 LGPL 全文），而整仓此前仅声明 Apache-2.0。
      # 声明与范围清单见 NOTICE / docs/licensing.md。
      - name: 版权头合规检查 (license headers)
        run: bash scripts/check-license-headers.sh

      - name: 编译 (compileJava + compileTestJava)
        run: ./gradlew compileJava compileTestJava --no-daemon

      # 测试体系中期建设（2026-08-30）：test → check（含覆盖率门禁）。
      # check 隐含 test + jacocoTestCoverageVerification（根 build.gradle 已全局
      # check.dependsOn 接线）——覆盖率不达 0.30 即 CI 失败，门禁从"定义了
      # 但从不运行"（审计三层落差）变为真实生效。
      # nexus-gateway 的 test 任务 excludeTags 'integration'，那 10 类 / 67 用例
      # 由下方「Gateway 集成测试」步骤单独阻断执行（拆分理由只剩执行速度，
      # 不是「缺基础设施必红」——本 job 无 services: 容器，它们实测全绿）。
      - name: 测试 + 覆盖率门禁 (check)
        run: ./gradlew check --continue --no-daemon

      # Gateway 集成测试（阻断）——2026-09-29 从"允许失败"里拆出来。
      # 背景：nexus-gateway/build.gradle 的 test 任务 excludeTags 'integration'，本步骤又挂
      # continue-on-error，两道兜底叠加使 gateway 装配类缺陷在 CI 上完全不可见。先例：
      # settlement 的 risk.* 三个新包未入仓储扫描白名单 → 启动即崩，存活约 4 天且全绿。
      # 原注释"这些测试需要基础设施、不属于代码缺陷"经实测不成立：10 个类里只有 3 个红，
      # 且红因是 product 侧 500（TCC 与调用方不同事务的乐观锁冲突），不是缺服务；
      # 已由 PR #40 修复并摘除 knownRed 标签。
      # 2026-10-06 收敛：同一步骤此前跑 contextSmokeTest + 一条 continue-on-error 的全量
      # integrationTest。knownRed 清空后两者选择集相同（run 37387904585 实测各 10 类 /
      # 67 用例 / 0 红），等于跑两遍且第二遍不判定，故合并为本步骤一条阻断。
      - name: Gateway 集成测试（全上下文装配，阻断）
        run: ./gradlew :nexus-gateway:integrationTest --no-daemon

      # P2-C6: composite build 模块测试门禁
      # settings.gradle 中 includeBuild 的模块（nexus-settlement/compliance/analytics/oracle）
      # 不被根 `./gradlew check` 覆盖，需单独执行其任务。
      # 这些模块自带 settings.gradle，通过 includeBuild 纳入统一构建，
      # 可通过根 gradlew 以 `:nexus-settlement:check` 形式调用（Gradle 8.x composite build 支持）。
      # 覆盖率门禁收编（2026-09-05 起）：settlement/oracle 0.30；2026-10-18 批次⑦
      # 复核发现 compliance/analytics 的模块级 0.50 门禁**已配置但 CI 只跑 test**
      # （与"写了门禁从不运行"同病灶）——本地实测四个模块 check 全绿后统一翻为
      # check：测试照跑（check 依赖 test）+ 覆盖率验证 + jacocoTestReport XML
      # （下方 codecov 上传，含 composite 报告生成步骤）。
      - name: Test composite build modules
        run: |
          ./gradlew :nexus-settlement:check :nexus-compliance:check :nexus-analytics:check :nexus-oracle:check --no-daemon

      # 测试体系中期建设（2026-08-30）：影子测试资产纳入 CI。
      # 此前仅本地跑过的两模块，现纳入门禁（测试探活审计项）：
      # - nexus-consortium：includeBuild 且自带 settings.gradle，根 check 不覆盖，
      #   43 个测试文件/约 321 用例（PoA + 国密 SM2/3/4）——组合路径：
      #   consortium 是 includeBuild 声明的构建名，测试任务为 :nexus-consortium:consortium:test
      #   覆盖率门禁（2026-09-05 收编、2026-10-18 批次⑦核对）：consortium 构建树
      #   自带子模块级门禁——common/consortium/crypto 均 0.30（crypto 的"0.00 占位"
      #   已由补测批次提升为 0.30，此处旧注释同步修正）。
      # - nexus-api-gateway：根构建 include 的 21 用例（AuthenticationFilter/RateLimitFilter），
      #   2026-10-18 批次⑦：模块级 0.50 门禁已配置但 CI 长期只跑 test，本地实测
      #   check 全绿后翻为 check。
      - name: Test consortium + api-gateway (shadow test assets)
        run: |
          ./gradlew :nexus-consortium:consortium:check :nexus-consortium:common:check :nexus-consortium:crypto:check :nexus-api-gateway:check --no-daemon

      # Node 版本口径（2026-10-18 批次⑦遗留疑点修复）：本 job 有 4 处 npm ——
      # SDK TypeScript（下方 SDK 步骤）、DevTools CLI、explorer frontend
      # test+build——此前**无 setup-node**，靠 runner 预装版本，等于没有版本
      # 锚点（runner 镜像升级会静默改变行为）。这与本 job 早前 Python 口径
      # 问题同类（见上方 Setup Python 注释），与其同法显式钉版：
      # 三处 package.json engines 均为 ">=24.0.0 <27.0.0"，与其余 Node job
      # （Explorer Frontend / Hardhat E2E，均 26）统一钉 26。
      - name: Setup Node 26
        uses: actions/setup-node@v5
        with:
          node-version: '26'

      # ① SDK 三语言回归（2026-09-05）：B 批（5f62509）产出的 Go 13 / Python 15 /
      # TS 8 用例此前仅本地验证、未进 CI——对外交付物无回归保护（如 core 的
      # JSON-RPC envelope 变更时三语言 SDK 不会告警）。三语言均为零基础设施
      # 测试（Go 标准库测试 / Python stdlib unittest / Node 内置 test runner），
      # ubuntu runner 预装 Go/Node/Python，零额外环境成本。
      # Java SDK 由根构建 check + codecov 覆盖，不在此列。
      - name: SDK Go regression
        working-directory: nexus-sdk/go
        run: go test ./nexus/

      - name: SDK Python regression
        working-directory: nexus-sdk/python
        run: python3 tests/test_nexus_sdk.py

      - name: SDK TypeScript regression
        working-directory: nexus-sdk
        run: |
          npm install
          npm run test:ts

      # DevTools CLI 构建 + 冒烟（2026-10-06）：nexus-devtools 此前全目录无
      # tsconfig.json——`npm run build`（tsc）只打印帮助并以退出码 1 结束，
      # bin 声明的 dist/index.js 从未能生成（发布交付物不可构建；该包亦 0 锁
      # 文件、0 CI 覆盖）。补 tsconfig + 锁文件后纳入 CI；npm ci 同时验证
      # engine-strict 的第 3 个（此前唯一无 CI 环节的）安装点。
      - name: DevTools CLI build + smoke
        working-directory: nexus-devtools
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node dist/index.js --help > /dev/null

      # ③ helm charts 门禁（2026-09-05）：lint + template 渲染 umbrella 与全部
      # 子 chart，防止部署资产腐化（此前 chart 改坏要到真部署时才发现）。
      # runner 预装 helm 3.x；模板无 required 硬约束，默认值可完整渲染。
      - name: Helm charts lint + template
        run: |
          for chart in deploy/helm/charts/*/; do
            name=$(basename "$chart")
            echo "=== helm lint $name ==="
            helm lint "$chart"
            echo "=== helm template $name ==="
            helm template "t-$name" "$chart" > /dev/null
          done
          echo "=== helm lint umbrella (nexus-chain) ==="
          helm lint deploy/helm
          helm template t-umbrella deploy/helm > /dev/null

      # MPC-P2-C6: 三个关键回归测试门禁（双花防御 / 桥资金守恒 / 门限签名）
      # 这些测试覆盖核心安全不变量，单独显式执行以确保被运行（即使其他测试被 skip）。
      # - ReplayProtectionTest：跨链消息重放保护（双花防御核心）
      # - DefaultInsuranceFundTest：保险基金账本守恒（桥资金守恒）
      # - 门限签名端到端：GG20 退役（PLAN-001-R2，2026-10-08）后由独立 job
      #   `mpc-java-cluster-e2e` 的 CGGMP21 集群回归承担（真实 3 进程 keygen），
      #   本 job 内不再有 GG20 MpcEndToEndTest 可跑。
      - name: 关键回归测试（双花防御 / 桥资金守恒）
        run: |
          ./gradlew :nexus-bridge:test \
            --tests "org.nexus.bridge.security.ReplayProtectionTest" \
            --tests "org.nexus.bridge.safety.DefaultInsuranceFundTest" \
            --no-daemon

      # 短期项 #5（2026-09-17）：explorer 前端进入 CI 门禁。
      # 此前 10 个 vitest 测试文件（93 用例）没有任何 CI job 执行——
      # 前端回归零保护（审计发现）。此处与其余 Node job 同用 Node 26。
      - name: Explorer Frontend tests (vitest)
        working-directory: nexus-explorer/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test

      # 短期项 #5 附带：explorer 前端 TS 类型检查（build 依赖 tsc）
      - name: Explorer Frontend type-check (tsc)
        working-directory: nexus-explorer/frontend
        run: npm run build

      # P2-C6: Rust 测试（mpc-engine）
      # 通过 dtolnay/rust-toolchain 安装 Rust 工具链，作为强制门禁。
      # 工具链口径由仓根 `rust-toolchain.toml` 声明（2026-10-06 新增）——
      # 本 action 会读取该文件的 channel，故本地 rustup 与 CI 用同一 channel，
      # 消除「本地绿 / CI 红」的漂移。此处 `@stable` 仅为 action 自身的解析
      # 入口，实际版本以 rust-toolchain.toml 为准。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # 显式安装 rustfmt 与 clippy 组件，供下方格式检查与 lint 门禁使用。
          # 注：working-directory 不是本 action 的有效输入（工具链为全局安装，
          # 各步骤以自身的 working-directory 键控制 cwd），移除以消除 runner
          # "Unexpected input(s)" 警告（CI annotation 曾双报：该警告 + exit code 1）。
          components: rustfmt,clippy

      # 安装 protoc（Protocol Buffers 编译器）——prost-build 在 cargo clippy/test 编译时需要。
      # 必须在 clippy/test 之前安装，否则 build script 报 "Could not find protoc"。
      - name: Install protoc for Rust build scripts
        # 2026-10-11 韧性：apt 镜像/网络抖动是 GitHub runner 常见瞬时失败，非代码问题。
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler; then exit 0; fi
            echo "::warning::apt 安装 protoc 第 ${attempt} 次失败，15s 后重试"
            sleep 15
          done
          echo "::error::apt 安装 protoc 连续 3 次失败"; exit 1

      # C 批：Rust 编译缓存（Cargo registry + target 增量产物）。两个 Rust 工程
      # 各自独立缓存（workspaces 按 Cargo.lock 指纹 keying），命中后
      # fmt/clippy/test 的依赖编译跳过，Rust 相关步骤显著提速。
      - name: Rust build cache (mpc-engine)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mpc-engine

      - name: Rust build cache (zk-groth16-service)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zk-groth16-service

      # Rust 代码格式检查（rustfmt 门禁）。
      # `cargo fmt --all -- --check` 不修改文件，仅检查是否符合 rustfmt.toml 规则；
      # 不符合则非零退出，阻断 CI。开发者本地运行 `cargo fmt` 自动格式化。
      # rustfmt.toml 位于 mpc-engine/ 目录，配置 edition=2021、max_width=100 等。
      - name: Rust format check (cargo fmt)
        working-directory: mpc-engine
        run: cargo fmt --all -- --check

      # Rust lint 检查（clippy 门禁）。
      # `cargo clippy --all-targets` 检查 src/ 与 tests/ 的所有代码（含测试）；
      # `-D warnings` 将所有 warning 视为 error，强制零 warning 门禁，阻断 CI。
      # 常见 clippy 修正：冗余 clone、不必要的 mut、风格统一等。
      - name: Rust lint check (cargo clippy)
        working-directory: mpc-engine
        run: cargo clippy --all-targets --features tls -- -D warnings

      # MPC-B2-T1/T2: 集成测试去 #[ignore] 后需集群环境，普通 cargo test 只跑 lib 单测；
      # 分布式 E2E（3 节点集群）由下方独立步骤先启动集群再运行。
      #
      # JUnit XML（2026-10-05）：cargo test 只打印文本，无 XML 产出，导致
      # Rust 侧结果在 CI 工件里完全缺席。此处 tee 原始日志后用
      # scripts/cargo-test-to-junit.py 转换，产出与 Java/Gradle 同构的
      # JUnit XML（落在 build/test-results/rust/，被下方 artifact glob 覆盖）。
      # **pipefail 防护**：Actions 默认 shell 为 `bash -e {0}`，不含 pipefail，
      # 管道退出码取 tee（恒 0），会**静默吞掉 Rust 测试失败**。故显式取
      # ${PIPESTATUS[0]} 作为门禁判定依据。
      - name: Rust tests (mpc-engine, lib)
        working-directory: mpc-engine
        run: |
          mkdir -p build/test-results/rust
          cargo test --no-fail-fast --lib 2>&1 | tee build/test-results/rust/raw-lib.log
          rc=${PIPESTATUS[0]}
          python3 ../scripts/cargo-test-to-junit.py build/test-results/rust/raw-lib.log \
            -o build/test-results/rust/mpc-engine-lib.xml --suite mpc-engine-lib \
            || echo "::warning::cargo-test-to-junit.py 转换失败（mpc-engine lib），XML 缺失但不阻断门禁"
          exit $rc

      # CGGMP21 协议 E2E（进程内，GG20 退役后取代原 3 节点集群 integration_test）：
      # keygen→aux→assemble→2-of-3 sign→验签 全链路在进程内跑通（无需外部集群，
      # 无证书/端口依赖）；恢复 E2E 覆盖份额落盘→重启→恢复→签名。
      # 真实多进程集群 E2E 由独立 job `mpc-java-cluster-e2e` 承担。
      # JUnit XML 转换同上；${PIPESTATUS[0]} 用于防止 tee 吞掉失败。
      - name: MPC CGGMP21 E2E (in-process protocol tests)
        working-directory: mpc-engine
        run: |
          mkdir -p build/test-results/rust
          cargo test --features tls --test cggmp_dkg_sim --test cggmp_threshold_e2e \
            --test cggmp_rpc_e2e --test cggmp_persistence_recovery --no-fail-fast 2>&1 \
            | tee build/test-results/rust/raw-cggmp-e2e.log
          rc=${PIPESTATUS[0]}
          python3 ../scripts/cargo-test-to-junit.py build/test-results/rust/raw-cggmp-e2e.log \
            -o build/test-results/rust/mpc-engine-cggmp-e2e.xml --suite mpc-engine-cggmp-e2e \
            || echo "::warning::cargo-test-to-junit.py 转换失败（mpc-engine cggmp e2e），XML 缺失但不阻断门禁"
          exit $rc

      # P2-C7 / ZK-A1-R5(a): zk-groth16-service 单测（bridge 动态电路 + 仪式导入回归）
      # 复用上方已安装的 Rust 工具链；bridge.rs 内含 #[cfg(test)] 单测（真实 Groth16 往返）。
      # JUnit XML 转换同上；${PIPESTATUS[0]} 同样用于防止 tee 吞掉失败。
      - name: Rust tests (zk-groth16-service)
        working-directory: zk-groth16-service
        run: |
          mkdir -p build/test-results/rust
          cargo test --no-fail-fast 2>&1 | tee build/test-results/rust/raw-unit.log
          rc=${PIPESTATUS[0]}
          python3 ../scripts/cargo-test-to-junit.py build/test-results/rust/raw-unit.log \
            -o build/test-results/rust/zk-groth16-service.xml --suite zk-groth16-service \
            || echo "::warning::cargo-test-to-junit.py 转换失败（zk-groth16-service），XML 缺失但不阻断门禁"
          exit $rc

      # ZK-A1-R5(b)(c): HTTP E2E（setup→prove→verify 全链路 curl 断言）+ bench 阈值断言
      # scripts/zk-e2e.sh 启动服务并断言：真实配对 valid=true、错误输入 valid=false、
      # /v1/bench verify_avg_ms < 100ms。服务为 arkworks 真实实现，验证不依赖 Java 侧。
      - name: ZK service E2E (HTTP 全链路 + bench 阈值)
        working-directory: zk-groth16-service
        run: |
          cargo build --release
          bash ../scripts/zk-e2e.sh --start

      - name: 生成 JaCoCo 覆盖率报告
        run: ./gradlew jacocoTestReport --no-daemon

      # composite 模块覆盖率报告（2026-10-18 批次⑦）：根 jacocoTestReport 聚合
      # 任务只覆盖根 subprojects——composite 模块的报告需显式点名生成（其
      # check 已在上方步骤运行、test 执行数据即用）。HTML/XML artifact 的
      # glob 为 ** 递归，生成后自动包含。
      - name: 生成 JaCoCo 覆盖率报告（composite 模块）
        run: |
          ./gradlew :nexus-settlement:jacocoTestReport \
            :nexus-compliance:jacocoTestReport \
            :nexus-analytics:jacocoTestReport \
            :nexus-oracle:jacocoTestReport \
            :nexus-api-gateway:jacocoTestReport \
            :nexus-consortium:consortium:jacocoTestReport \
            :nexus-consortium:common:jacocoTestReport \
            :nexus-consortium:crypto:jacocoTestReport \
            --no-daemon

      - name: 上传覆盖率到 Codecov
        # codecov v5（composite）内部钉了 node20 的 actions/github-script@60a0d…（OIDC token
        # 步骤），是 Node24 迁移后全仓最后一条 node20 残留；v6/v7 内部已改钉
        # github-script@ed59741…#v8.0.0（runs.using: node24），升 v7 消除该残留。
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./nexus-gateway/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-bridge/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-core/nexus-core/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-signing-service/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-wallet-service/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-sdk/java/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-settlement/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-compliance/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-analytics/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-oracle/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-api-gateway/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-consortium/consortium/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-consortium/common/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-consortium/crypto/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          verbose: true

      # artifact 命名（2026-10-18 批次⑦遗留疑点修复）：本 job 按设计**无 matrix**
      # （见 job 头部注释，为保住 required check 名称而放弃 matrix），四个
      # artifact 名中的 `-${{ matrix.os }}` 是模板残留——表达式恒为空串，
      # 实际名等同 "xxx-"（带尾横线）。本处及下方 test-results / rust-test-logs /
      # jar-artifacts 三处一并移除。
      - name: 上传 JaCoCo HTML 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: |
            **/build/reports/jacoco/test/html
            **/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore
          retention-days: 14

      # 测试结果 XML（flaky 取证）：PR #28 教训——治理窗口 flaky 定位时 artifact
      # 只有 jacoco 报告，失败用例名拿不到，只能靠代码模式推断。XML 里每条
      # <testcase> 带 classname/name/failure 正文，直接可得「哪个用例在哪个
      # 断言上失败」。if: always() 保证红跑也上传；XML 紧凑，14 天保留足够
      # 覆盖一次 flaky 的取证窗口。
      #
      # 覆盖面（2026-10-05 修正）：此前只匹配 [test]/*.xml 单层目录，于是
      # ① nexus-integrationTest（同模块内名为 integrationTest → 落在
      #    build/test-results/integrationTest/）②composite build 的 4 个
      #    includeBuild 模块（settlement/compliance/analytics/oracle，其
      #    build 目录不在根 project 下，需 build/ 或 module/build/ 前缀）
      # 两类结果**全部拿不到**。本 job 已在跑这些任务（见上方各 step），
      # 却因 glob 未覆盖而无法取证——「跑了但查不到」比「没跑」更难排查。
      # 现改为 **/build/test-results/**/*.xml 递归匹配任意任务目录名；
      # 另补 nexus-core/nexus-core/build/... 前缀，覆盖 Hardhat E2E 在
      # build-and-test 内以 --tests 跑出的那一批（其报告落该路径）。
      - name: 上传测试结果 XML（flaky 取证）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            nexus-core/nexus-core/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

      # Rust 原始日志（2026-10-05）：cargo test 文本输出比 XML 信息更全——
      # XML 只留失败正文，而 panic 前的 warning、编译告警、被 drop 的
      # `failures:` 汇总都在文本里。XML 用于机器判定，raw log 用于人肉取证，
      # 两者并存。**/build/test-results/rust/*.log 精确限定，不误收其他日志。
      - name: 上传 Rust 原始测试日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-logs
          path: |
            **/build/test-results/rust/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传 JAR 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: jar-artifacts
          path: |
            **/build/libs/*.jar
          if-no-files-found: ignore
          retention-days: 14

  # ============================================================
  # C 批：CGGMP21 Java 集群 E2E 回归（C1 独立 job 结构）
  # ------------------------------------------------------------
  # CggmpMpcE2EClusterTest 在 JVM 内拉起 3 个 mpc-engine 子进程，经
  # gRPC + mTLS + Bearer auth 驱动 CGGMP21 keygen(t=2, n=3) 全链路，
  # 断言三方产出一致聚合公钥。此前为 Windows 本地手工验证（I 批），
  # 现纳入 CI 回归（C 批：测试路径 env 化 + 本 job）。
  #
  # 结构决策（C1）：独立 job 而非并入 build-and-test——
  #  1) 失败隔离：Rust release 编译 / 集群时序波动不拖累 Java 主链与覆盖率门禁；
  #  2) 覆盖率不回灌：集群 E2E 的覆盖依赖真实引擎进程，CI 常规 check
  #     仍排除该类（signing-service 门禁口径 0.36 不变，诚实口径）。
  #
  # 流程：GMP 工具链（cggmp21 rug 硬依赖）→ rust-cache → cargo build
  # --release --features tls → start-mpc-cluster.sh --setup-only（生成
  # mTLS 证书 + node{1,2,3}.json，不启动引擎）→ gradle 显式点名运行
  # （-PincludeClusterE2E 解除 test 任务级 exclude——--tests 过滤不
  # 穿透 exclude）。引擎进程由测试 @AfterAll 自毁，无需 trap 清理。
  # ============================================================
  mpc-java-cluster-e2e:
    name: MPC Java Cluster E2E (CGGMP21 3-node)
    runs-on: ubuntu-24.04
    needs: build-and-test
    timeout-minutes: 45
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Setup JDK 17 (Amazon Corretto)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Ensure gradlew is LF
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # GMP 工具链：cggmp21 → rug 硬依赖（gmp/mpfr），m4 为其构建脚本所需；
      # protoc 供 mpc-engine build.rs（prost-build）；openssl 供证书生成
      # （runner 预装，显式列出以保证）。
      - name: Install GMP toolchain + protoc
        # 2026-10-11 韧性：apt 镜像/网络抖动是 GitHub runner 常见瞬时失败，非代码问题。
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libgmp-dev libmpfr-dev m4 protobuf-compiler openssl; then exit 0; fi
            echo "::warning::apt 安装 GMP 工具链 第 ${attempt} 次失败，15s 后重试"
            sleep 15
          done
          echo "::error::apt 安装 GMP 工具链 连续 3 次失败"; exit 1

      - name: Setup Rust toolchain
        # `working-directory` 不是本 action 的有效输入（valid inputs: toolchain /
        # targets / target / components），带上它每次运行都产生一条
        # "Unexpected input(s)" 警告（master run 37387904585 两个 job 的 annotation
        # 实测）。工具链是全局安装，各步骤用自身的 working-directory 键控制 cwd，
        # 与 build-and-test job 的处理保持一致（该处已先行移除）。
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache (mpc-engine)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mpc-engine

      - name: Build mpc-engine (release, tls)
        working-directory: mpc-engine
        run: cargo build --release --features tls

      # 仅生成证书与节点 JSON 配置（node{1,2,3}.json 内嵌绝对证书路径），
      # 不启动引擎——测试自行拉起 3 进程并自毁。
      - name: Generate cluster certs + node configs (setup-only)
        working-directory: mpc-engine
        run: bash scripts/start-mpc-cluster.sh --setup-only

      - name: Run CggmpMpcE2EClusterTest (CGGMP21 keygen 2-of-3)
        run: |
          ./gradlew :nexus-signing-service:test -PincludeClusterE2E \
            --tests "org.nexus.signing.mpc.cggmp.CggmpMpcE2EClusterTest" \
            --no-daemon
        env:
          MPC_ENGINE_BIN: ${{ github.workspace }}/mpc-engine/target/release/mpc-engine

      # 测试结果 XML（2026-10-05 新增）：本 job 独立于 build-and-test，
      # 此前的工件上传只覆盖 build-and-test job——mpc-java-cluster-e2e 只在
      # **失败时** 传日志（mpc-cluster-e2e-logs），成功路径零 XML 落盘。
      # 后果：CGGMP21 keygen 集群回归到底跑了几个用例、是否发生 assumeTrue
      # 静默跳过，**无法从工件侧核实**——只能翻运行日志。
      # 与 build-and-test 同口径：if: always() + 递归 glob，红绿均留证。
      - name: 上传测试结果 XML（集群回归取证）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-mpc-cluster-e2e
          path: |
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload engine logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mpc-cluster-e2e-logs
          path: |
            mpc-engine/logs/**
            nexus-signing-service/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # K 批验收：kind 真集群冒烟——mpc-engine chart K8s 语义验证
  # ------------------------------------------------------------
  # 冒烟范围决策：只装 mpc-engine 子 chart（不装 umbrella——全栈需
  # Nacos/PG/Redis 等基础设施，kind 内不具备；冒烟目标是 MPC 的 K8s
  # 语义，不是全栈）。验证链：
  #   kind 3 节点集群 → 本机构建 mpc-engine 镜像 + kind load（免
  #   GHCR 拉取）→ generate-certs.sh 产 mTLS 证书 → helm install →
  #   StatefulSet 3 Pod 全 Ready（PVC 挂载 /app/sessions、env 注入
  #   MPC_ENGINE_SESSION_DIR/MPC_STORAGE_KEY_VERSION——⑤批持久化
  #   接线的部署面验证）→ Pod 内 keyshare 目录可写断言。
  # 镜像 tag 用 <sha>（与 global.env 回退链一致，冒烟专用）。
  # ============================================================
  mpc-kind-smoke:
    name: MPC Kind Smoke (mpc-engine chart on K8s)
    runs-on: ubuntu-24.04
    needs: build-and-test
    timeout-minutes: 50
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        # `working-directory` 不是本 action 的有效输入（valid inputs: toolchain /
        # targets / target / components），带上它每次运行都产生一条
        # "Unexpected input(s)" 警告（master run 37387904585 两个 job 的 annotation
        # 实测）。工具链是全局安装，各步骤用自身的 working-directory 键控制 cwd，
        # 与 build-and-test job 的处理保持一致（该处已先行移除）。
        uses: dtolnay/rust-toolchain@stable

      # GMP 工具链：cggmp21 rug 硬依赖（gmp/mpfr + m4）+ protoc（prost-build）
      - name: Install GMP toolchain + protoc
        # 2026-10-11 韧性：apt 镜像/网络抖动是 GitHub runner 常见瞬时失败，非代码问题。
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libgmp-dev libmpfr-dev m4 protobuf-compiler openssl; then exit 0; fi
            echo "::warning::apt 安装 GMP 工具链 第 ${attempt} 次失败，15s 后重试"
            sleep 15
          done
          echo "::error::apt 安装 GMP 工具链 连续 3 次失败"; exit 1

      - name: Rust build cache (mpc-engine)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mpc-engine

      - name: Build mpc-engine (release, tls)
        working-directory: mpc-engine
        run: cargo build --release --features tls

      - name: Build mpc-engine image
        # 2026-10-11 韧性加固：与 security-scan.yml 的镜像构建同款——Docker Hub
        # 认证端点瞬时不可用会让 docker build 直接 exit 1（非代码问题）。
        # 加有界重试（3 次 / 间隔 15s）。
        run: |
          for attempt in 1 2 3; do
            if docker build -t mpc-engine:kind-smoke -f mpc-engine/Dockerfile .; then
              exit 0
            fi
            echo "::warning::docker build 第 ${attempt} 次失败（疑似 registry 抖动），15s 后重试"
            sleep 15
          done
          echo "::error::docker build 连续 3 次失败"
          exit 1

      # kind 3 节点集群：StatefulSet 反亲和（podAntiAffinity hard）要求
      # 3 副本可调度到不同 Node——3 worker 验证该约束在真实拓扑下成立
      - name: Create kind cluster (3 workers)
        uses: helm/kind-action@v1
        with:
          cluster_name: mpc-smoke
          config: .github/kind-config.yaml

      - name: Load mpc-engine image into kind
        run: kind load docker-image mpc-engine:kind-smoke --name mpc-smoke

      # 生成 mTLS 证书：SAN 覆盖 localhost/127.0.0.1（Pod DNS 名不进 SAN——
      # 客户端 overrideAuthority 对齐，与既有 e2e 证书同语义）
      - name: Generate mTLS certs
        working-directory: mpc-engine
        run: bash scripts/generate-certs.sh -f

      # helm install 只装 mpc-engine 子 chart；镜像指向 kind 内本地 tag；
      # storageKey 冒烟值 64 hex（真值由生产 sealed-secrets 注入）。
      # 证书走临时 values 文件——--set-file 的键名点号（tls.crt）会把
      # node-0 再拆一层成 {tls:{crt:...}}，range 展开拿到 map 而非 string
      # （首跑 fe21c9f 实证）；YAML 文件里点号键安全。
      - name: Helm install mpc-engine (subchart only)
        run: |
          # 直接构造（键行 6 空格、block 值 8 空格——YAML block scalar 缩进对齐）
          {
            echo "secrets:"
            echo "  tlsCerts:"
            for spec in "node-0 1" "node-1 2" "node-2 3"; do
              set -- $spec
              echo "    $1:"
              echo "      tls.crt: |"
              sed 's/^/        /' mpc-engine/certs/node$2.crt
              echo "      tls.key: |"
              sed 's/^/        /' mpc-engine/certs/node$2.key
            done
            echo "    ca:"
            echo "      tls.crt: |"
            sed 's/^/        /' mpc-engine/certs/ca.crt
          } > /tmp/mpc-tls-values.yaml
          helm install mpc deploy/helm/charts/mpc-engine \
            --namespace nexus \
            --create-namespace \
            -f /tmp/mpc-tls-values.yaml \
            --set image.repository=mpc-engine \
            --set image.tag=kind-smoke \
            --set image.pullPolicy=Never \
            --set serviceMonitor.enabled=false \
            --set storageKey=4242424242424242424242424242424242424242424242424242424242424242
          rm -f /tmp/mpc-tls-values.yaml

      - name: Wait for StatefulSet rollout (3 replicas Ready)
        run: |
          kubectl rollout status statefulset/mpc-engine -n nexus --timeout=180s
          kubectl get pods -n nexus -o wide

      # ⑤批持久化接线部署面验证：PVC 挂载 + 会话目录可写 + env 注入
      - name: Verify session PVC + persistence env wiring
        run: |
          echo "=== PVCs (expect 2 kinds: mpc-config + mpc-sessions) ==="
          kubectl get pvc -n nexus
          for p in 0 1 2; do
            echo "=== mpc-engine-$p persistence wiring ==="
            kubectl exec -n nexus mpc-engine-$p -- sh -c 'ls -ld /app/sessions || echo MISSING_SESSIONS_DIR'
            kubectl exec -n nexus mpc-engine-$p -- sh -c 'echo smoke > /app/sessions/.write-test && cat /app/sessions/.write-test && rm /app/sessions/.write-test'
          done
          echo "=== env wiring ==="
          kubectl exec -n nexus mpc-engine-0 -- sh -c 'env | grep -E "MPC_ENGINE_SESSION_DIR|MPC_STORAGE_KEY_VERSION|MPC_CONFIG_PATH" || true'

      # 协议冒烟：Pod 0 上起一轮 keygen 首轮（CgStartKeygen 广播消息 = 引擎
      # 在 K8s 内可驱动协议），用 grpcurl 不现实（容器无该二进制）——用
      # kubectl exec + 环境变量直查进程日志中的启动横幅做最低限度验证
      - name: Engine startup banner check (all pods)
        run: |
          for p in 0 1 2; do
            echo "=== mpc-engine-$p startup log ==="
            kubectl logs -n nexus mpc-engine-$p | tail -20
            kubectl logs -n nexus mpc-engine-$p | grep -q "starting mpc-engine gRPC server" \
              || { echo "ERROR: mpc-engine-$p startup banner missing"; exit 1; }
          done

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get all,pvc -n nexus || true

      # 测试结果 XML（2026-10-05 新增）：本 job 不含 Java 测试（K8s 冒烟），
      # 但 helm/kind 步骤若中途改为跑断言型检查，XML 通道预留并可空跑
      # （if-no-files-found: ignore）。保持与其余 job 一致的上传口径，避免
      # 后续新增测试任务时再次漏挂工件。
      - name: 上传测试结果 XML（如存在）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-mpc-kind-smoke
          path: |
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

  # ============================================================
  # Flyway 数据库迁移预检（Task 284）
  # ------------------------------------------------------------
  # 目的：在 CI 阶段验证各模块的 Flyway 迁移脚本可顺序应用、无语法/冲突错误，
  #       避免迁移缺陷流入 staging/prod。
  # 实现：启动 MySQL 8.0 service container，对清单内的 MySQL 模块
  #       使用 Flyway 11 官方镜像执行 migrate（每模块独立 schema，互不干扰）。
  # 触发：与 build-and-test 并行，仅依赖源码中的迁移脚本，不依赖编译产物。
  # ============================================================
  flyway-migration-check:
    timeout-minutes: 10  # 观测峰值 0.9 min
    name: Flyway 迁移预检
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: nexus_ci
          MYSQL_DATABASE: nexus_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pnexus_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pnexus_ci --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      # 对所有含 db/migration 的模块逐一执行 flyway migrate。
      # 每模块使用独立 schema（ci_<module>），避免不同模块 V1__init_schema.sql 等同版本号冲突。
      # 通过 --add-host=host.docker.internal:host-gateway 让 flyway 容器访问
      # service container 暴露在 host 127.0.0.1:3306 的 MySQL。
      - name: Flyway migrate 验证（所有含迁移脚本的模块）
        run: |
          set -euo pipefail
          # Flyway 11.x 官方镜像（Boot 4.0.8 BOM 管理 flyway-core 11.x，版本对齐）
          FLYWAY_IMG="flyway/flyway:11"
          # 含 db/migration 的模块列表（模块逻辑名 : 迁移脚本目录）
          # 2026-08-28 修复：
          #   1) nexus-consortium 迁移脚本真实路径是 nexus-consortium/consortium/...
          #      （settings.gradle includeBuild 'nexus-consortium'），此前误写
          #      consortium/consortium/... 导致 docker 挂载空目录、Flyway 迁移失败。
          #   2) nexus-consortium 是 PostgreSQL 模块（迁移脚本 BYTEA 语法，build.gradle
          #      依赖 flyway-database-postgresql），本预检 job 的 service container 是
          #      MySQL 8.0，方言不匹配无法迁移验证——从 MySQL 预检列表移除，
          #      consortium 的 PG 迁移验证在 PostgreSQL 环境（本地/部署流水线）进行。
          # 2026-09-29 增补：nexus-signing-service 亦为 MySQL 模块（application.yml
          # jdbc:mysql），此前遗漏未纳入预检；本地以 flyway:11 + MySQL 8.0 实测
          # V1__init_signing_approval_table.sql 可通过，纳入清单防止后续迁移漂移。
          declare -a MODULES=(
            "nexus-gateway:nexus-gateway/src/main/resources/db/migration"
            "nexus-wallet-service:nexus-wallet-service/src/main/resources/db/migration"
            "nexus-bridge:nexus-bridge/src/main/resources/db/migration"
            "nexus-signing-service:nexus-signing-service/src/main/resources/db/migration"
          )
          for ENTRY in "${MODULES[@]}"; do
            MODULE_NAME="${ENTRY%%:*}"
            MIG_PATH="${ENTRY#*:}"
            echo "::group::Flyway migrate for ${MODULE_NAME} (${MIG_PATH})"
            DB_NAME="ci_$(echo "${MODULE_NAME}" | tr '-' '_')"
            mysql -h 127.0.0.1 -P 3306 -uroot -pnexus_ci -e "CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\`;"
            docker run --rm \
              --add-host=host.docker.internal:host-gateway \
              -v "${PWD}/${MIG_PATH}:/flyway/sql:ro" \
              "${FLYWAY_IMG}" \
              -url="jdbc:mysql://host.docker.internal:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false" \
              -user=root \
              -password=nexus_ci \
              -locations=filesystem:/flyway/sql \
              -baselineOnMigrate=true \
              -connectRetries=10 \
              migrate
            echo ">>> ${MODULE_NAME} migration OK"
            echo "::endgroup::"
          done

  # ============================================================
  # Hardhat L1/L2 E2E（测试体系中期建设 2026-08-30）
  # ------------------------------------------------------------
  # 审计缺口：5 个 Hardhat 集成测试类（L2L1EndToEndTest/OnChainGovernance×2/
  # BridgeFullLifecycle/PaymentFlow/ValidationPipeline，46 用例）此前仅在
  # 本地手动运行——测试自带 assumeTrue 优雅跳过，CI 中装了 Node 也从未
  # 显式执行，属"影子测试资产"。
  # 环境：Node 26（2026-10-06 由 22 升级，见下方 Setup 步骤注释）+ JDK 17。
  # 测试基类自适应：npm install → 启动 npx hardhat node → 部署合约，
  # 任一步失败即整类跳过（不红）。
  # 该 job 已为强制门禁（2026-08-30 首轮真实执行毕业，无 continue-on-error 遮错；原观察模式注释已废弃）。
  # ============================================================
  hardhat-e2e:
    name: Hardhat L1/L2 E2E (Node 26)
    runs-on: ubuntu-24.04
    # 观察模式已毕业（2026-08-30 首轮真实执行：33 用例运行/0 失败，
    # 5 类全部真实执行——治理 12/桥 4/校验管道 11/L2↔L1 6；其余 13 用例为
    # 环境断言下的合法 assumeTrue 跳过），转为强制门禁。
    timeout-minutes: 30
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Setup JDK 17 (Amazon Corretto)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      # Node 26 采纳（2026-10-06）：本步骤原是「Node 22（Hardhat EDR 兼容 LTS）」——
      # 22 是为规避 EDR 兼容问题特意选的。但台账 docs/testing/skipped-tests.md §2.1
      # 记的**是 Node v25** 不兼容，从未验证过 26；交叉大版本不能靠类推。
      # PR #25 试验跑（run 37073643914）已实测：node v26.10.0 下本 job
      # BUILD SUCCESSFUL，33 用例真实执行（L2L1↔L1 6 / 链上治理 6 / 治理执行器 6 /
      # 桥全生命周期 4 / 校验管道 11），与 2026-08-30 毕业时数字一致 → 无回归。
      # 唯一的 grep "Skipped" 计数为 1，经查是**测试名** burnReplayIsSkipped 的
      # 假阳性，非真实跳过（5 个测试类均真实执行）。故 22→26 成立，采用 26。
      - name: Setup Node 26 (Hardhat EDR 实测兼容)
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: nexus-core/nexus-core/src/test/resources/l1-test/package-lock.json

      # l1-test npm 依赖预装（测试基类 @BeforeAll 检测 node_modules 存在则跳过安装，
      # 预装可显著缩短测试内启动路径并使依赖问题在本步骤独立暴露）
      - name: Pre-install l1-test npm dependencies
        working-directory: nexus-core/nexus-core/src/test/resources/l1-test
        run: npm ci --no-audit --no-fund

      - name: Hardhat E2E（5 个集成测试类）
        run: |
          ./gradlew :nexus-core:nexus-core:test \
            --tests "org.nexus.l2.integration.L2L1EndToEndTest" \
            --tests "org.nexus.governance.OnChainGovernanceIntegrationTest" \
            --tests "org.nexus.governance.GovernanceExecutorOnChainIntegrationTest" \
            --tests "org.nexus.integration.BridgeFullLifecycleIntegrationTest" \
            --tests "org.nexus.integration.ValidationPipelineIntegrationTest" \
            --no-daemon --info 2>&1 | tee hardhat-e2e-output.log
          # 台账自约束（docs/testing/skipped-tests.md §5.4）：CI 须报告跳过数
          echo "===== Hardhat E2E 跳过/执行统计 ====="
          grep -cE "Skipped|skipped" hardhat-e2e-output.log || echo "0 skipped lines"

      # 测试结果 XML（2026-10-05 新增）：本 job 的 5 个集成测试类此前零工件——
      # 那批测试的显著特征是 **assumeTrue 优雅跳过**（Hardhat 节点起不来即整类跳过），
      # 因此「跳过 vs 真跑」的区分是这一类门禁的核心风险。XML 的 <testcase>
      # 带 <skipped/> 标记，是审计 skipped-tests.md 台账的**唯一机器可读来源**
      # （此前只能靠 grep 运行日志的 Skipped 字样，脆弱且不可复核）。
      # 同时上传 tee 出来的原始日志，两相对照。
      - name: 上传测试结果 XML + 运行日志（Hardhat E2E 取证）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-hardhat-e2e
          path: |
            nexus-core/nexus-core/build/test-results/**/*.xml
            hardhat-e2e-output.log
          if-no-files-found: ignore
          retention-days: 14

  # ============================================================
  # CD：master 分支构建并推送 Docker 镜像到 GitHub Container Registry
  # ============================================================
  docker-build:
    name: Docker Build & Push (${{ matrix.module }})
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    # GHCR 推送需要 packages: write 权限（默认 GITHUB_TOKEN 无此权限，
    # 导致 "denied: installation not allowed to Create organization package"）。
    permissions:
      contents: read
      packages: write
    # B2 修复（2026-08-31 交付前审计）：摘除 continue-on-error。
    # 原注释"REQ-02: 单模块构建失败不阻断其他模块"的代价是 master 可带着
    # 残缺镜像集前进（fail-fast: false 已保证并行互不阻断；单个失败整体红）。
    # GHCR 组织包创建权限此前已修（packages: write + 镜像 tag 小写化），
    # 剩余失败属真实构建问题，应阻断而非静默。
    # Rust 模块多阶段构建耗时较长，通过 matrix.include 放宽至 25min
    timeout-minutes: ${{ matrix.timeout-minutes || 20 }}
    env:
      REGISTRY: ghcr.io
      # IMAGE_PREFIX 已移除：github.repository 含大写（Levango7/NexusChain），
      # Docker tag 必须全小写，改由下方 step 输出 steps.img_prefix.outputs.prefix。
    strategy:
      fail-fast: false
      # max-parallel: 4 控制并发，避免触发 GitHub Actions 并发限额
      max-parallel: 4
      matrix:
        # REQ-02: 全部 13 个含 Dockerfile 的模块
        module:
          - nexus-core
          - nexus-gateway
          - nexus-bridge
          - nexus-signing-service
          - nexus-wallet-service
          - nexus-api-gateway
          - nexus-settlement
          - nexus-compliance
          - nexus-analytics
          - nexus-oracle
          - mpc-engine
          - zk-groth16-service
          # 2026-10-12 新增：区块浏览器镜像（Express BFF 同源托管前端产物）。
          # 仅 master push 触发（本 job 的 if 条件），不影响 PR 检查集。
          - nexus-explorer
        # Rust 多阶段构建耗时较长，单独放宽 timeout（wrapper 下载 + cargo 全量编译）
        include:
          - module: mpc-engine
            timeout-minutes: 25
          - module: zk-groth16-service
            timeout-minutes: 25
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: Compute lowercase image prefix
        id: img_prefix
        # Bash 参数扩展 ${VAR,,} 转 lowercase——Docker tag 不允许大写字符，
        # github.repository 产生 "Levango7/NexusChain" 会导致
        # "invalid tag ... repository name must be lowercase" 构建失败。
        run: echo "prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2026-10-12 韧性：镜像构建/推送改为「有界重试 + 显式裁决」。
      #
      # 实证（master push run 37986212517，2026-10-09）：12 个 Docker Build & Push
      # 与 MPC Kind Smoke 同批全红，唯一根因是 Docker Hub 匿名拉取被限流 ——
      # 日志原文 `429 Too Many Requests`（registry-1.docker.io 的 busybox:1.36.1、
      # rust:1.88 manifest），而同 run 的 Build & Test / MPC 集群 E2E / Flyway /
      # Hardhat / Code Hygiene 全绿 ⇒ 红的不是代码，是取基础镜像这一步。
      # 本 matrix 此前已限 max-parallel: 4 仍整片红 ⇒ 不是我们自己并发过猛，
      # 而是**匿名配额按出口 IP 共享**（同一批 GitHub hosted runner 用户共用）。
      #
      # 覆盖范围（诚实说明）：重试能扛住突发限流与瞬时 5xx；若撞上是 6 小时
      # **配额耗尽**，180s 退避也不够 —— 根治需要给 docker.io 配访问凭据
      # （认证额度按账号计，不再与陌生 runner 共享），或把基础镜像改经
      # GHCR/ECR 中转。仓库当前 secrets 只有 NVD_API_KEY，故本 PR 不引入
      # "凭据存在才启用"的空跑步骤（CI 里永不执行的断言等于没有断言）。
      #
      # 语义不变量：三条 attempt 全失败才判红（下方裁决步骤），**不挂
      # continue-on-error** —— 该 job 在 B2 审计时已特意摘掉 continue-on-error，
      # 就是为了不让 master 带着残缺镜像集前进（见上方注释）。三步 `with:`
      # 必须逐字一致，改动时三处一起改。
      # ============================================================
      - name: Build and push image (attempt 1)
        id: push1
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          # 所有模块 Dockerfile 均从 repo 根目录 COPY（gradlew/build.gradle/
          # settings.gradle/gradle/ 及 project() 依赖模块），故 context 必须为根。
          # file 字段指定各模块 Dockerfile 路径。
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img_prefix.outputs.prefix }}/${{ matrix.module }}:latest
            ${{ env.REGISTRY }}/${{ steps.img_prefix.outputs.prefix }}/${{ matrix.module }}:${{ github.sha }}

      - name: 重试退避（60s）
        if: steps.push1.outcome == 'failure'
        run: sleep 60

      - name: Build and push image (attempt 2)
        id: push2
        if: steps.push1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img_prefix.outputs.prefix }}/${{ matrix.module }}:latest
            ${{ env.REGISTRY }}/${{ steps.img_prefix.outputs.prefix }}/${{ matrix.module }}:${{ github.sha }}

      - name: 重试退避（120s）
        if: steps.push1.outcome == 'failure' && steps.push2.outcome == 'failure'
        run: sleep 120

      - name: Build and push image (attempt 3)
        id: push3
        if: steps.push1.outcome == 'failure' && steps.push2.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img_prefix.outputs.prefix }}/${{ matrix.module }}:latest
            ${{ env.REGISTRY }}/${{ steps.img_prefix.outputs.prefix }}/${{ matrix.module }}:${{ github.sha }}

      # 裁决：三个 outcome 里有一个 success 才算成；全败必须判红。
      # 用 outcome（真实结果）而不是 conclusion（被 continue-on-error 洗成 success）。
      - name: 裁决（三次皆失败才红）
        if: always()
        run: |
          ok=0
          for o in "${{ steps.push1.outcome }}" "${{ steps.push2.outcome }}" "${{ steps.push3.outcome }}"; do
            if [ "$o" = "success" ]; then ok=1; fi
          done
          if [ "$ok" = "1" ]; then
            echo "镜像构建推送成功（attempt1=${{ steps.push1.outcome }} attempt2=${{ steps.push2.outcome }} attempt3=${{ steps.push3.outcome }}）"
            exit 0
          fi
          echo "::error::docker build/push 连续 3 次失败（attempt1=${{ steps.push1.outcome }} attempt2=${{ steps.push2.outcome }} attempt3=${{ steps.push3.outcome }}）。若三次都是 429 Too Many Requests，则属 Docker Hub 匿名配额耗尽而非代码问题 —— 处置：给 docker.io 配访问凭据（认证额度按账号计），或把 busybox/gradle/rust/debian/node 等基础镜像改经 GHCR/ECR 中转。"
          exit 1

  # ============================================================================
  # 依赖栈健康门禁（2026-10-27 新增）
  #
  # 为什么需要它：2026-10-25 的 P0（#233 把 LocalRpcInterceptor 改成显式 401 后，
  # /height 探针漏配白名单 ⇒ core unhealthy ⇒ compose 里 depends_on: service_healthy
  # 的 gateway / signing 全链起不来）**只有 DAST job 抓到** —— 因为只有 DAST 真正
  # 启动了完整 compose 栈。而 DAST 不在 required contexts 里，
  # 于是出现「PR 8/8 绿，主干却红了」。
  #
  # 本 job 只做一件事：把 core 及其依赖拉起来，等它 healthy。core 的探针路径一旦
  # 被鉴权拦住，这里几分钟内就会红，且失败信息直接指向 unhealthy 的容器名
  # （比 DAST 的日志更好定位）。
  #
  # 刻意**只起 nexus-core**（不整栈）：core 是那次事故的失败点，且它的镜像
  # FROM gradle:8.14 + busybox（不含 gcr.io），构建约 2 分钟。
  # 整栈会把 13 个镜像全构建一遍（20+ 分钟），得不偿失。
  #
  # 未加入 required contexts（那要改分支保护，属流程决策）；先作为普通检查暴露问题，
  # 攒够稳定性数据后再由 orchestrator 决定是否升级为阻断。
  # ============================================================================
  compose-smoke:
    name: Compose Smoke (core 能起来)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # --wait 会等到所有服务 healthy 或超时；core 的 healthcheck 就是
      # docker-compose.yml 里的 wget http://localhost:19585/height
      # —— 与 k8s 的 liveness/readiness 同一路径，探针漏配在这里必然暴露。
      - name: 启动 core 及其依赖并等待 healthy
        run: |
          docker compose up -d --wait --wait-timeout 300 nexus-core

      - name: 失败时导出诊断
        if: failure()
        run: |
          echo "===== compose ps ====="
          docker compose ps -a || true
          echo "===== nexus-core 日志（末尾 200 行）====="
          docker compose logs --tail=200 nexus-core || true
          echo "===== nexus-pgsql 日志（末尾 100 行）====="
          docker compose logs --tail=100 nexus-pgsql || true

      - name: 清理
        if: always()
        run: docker compose down -v --remove-orphans || true
