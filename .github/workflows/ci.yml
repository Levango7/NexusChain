name: NexusChain CI/CD Pipeline

# P1-T9: CI/CD 流水线
# -----------------------------------------------------------------------------
# 触发：push / pull_request 到 master
# 环境：JDK 17 (Amazon Corretto) + Gradle 依赖缓存
# 流程：编译 → 测试 → 覆盖率报告 → Codecov 上传 → JAR 产物上传 → Docker 构建/推送
#
# 注：CI 运行于 Linux runner，使用 ./gradlew（Windows 本地开发用 gradlew.bat）。
#     matrix.os 可扩展为 [ubuntu-latest, windows-latest] 做跨 OS 验证。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # 关闭 daemon（CI 每次均为全新 runner，daemon 无意义且浪费资源）
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dfile.encoding=UTF-8"

jobs:
  # ============================================================
  # 构建 & 测试 & 覆盖率
  # ============================================================
  build-and-test:
    name: Build & Test (JDK 17 / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 可扩展为 [ubuntu-latest, windows-latest] 做跨 OS 验证
        os: [ubuntu-latest]
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Ensure gradlew is LF
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # P2-C6: Gradle wrapper 完整性校验
      # 重新生成 wrapper 并与仓库版本对比，确保 gradle/wrapper/ 下文件未被篡改、版本一致。
      # 若 runner 上 wrapper 与仓库不一致（例如被 PR 修改但未同步），git diff --exit-code 会非零退出。
      # 注意：仓库 wrapper 已随 ca7e0ba 升级到 Gradle 8.14（huaweicloud 镜像 + networkTimeout=600000 定制），
      # 校验命令必须与仓库 gradle-wrapper.properties 的版本、distribution URL、networkTimeout 完全一致，
      # 否则重新生成必然产生 diff（如旧参数 8.5 会把 properties 改回 8.5）导致误报失败。
      - name: Validate Gradle wrapper
        run: |
          ./gradlew wrapper --gradle-version 8.14 --gradle-distribution-url https://mirrors.huaweicloud.com/gradle/gradle-8.14-bin.zip --network-timeout 600000
          git diff --exit-code gradle/wrapper/

      - name: 编译 (compileJava + compileTestJava)
        run: ./gradlew compileJava compileTestJava --no-daemon

      # 测试体系中期建设（2026-08-30）：test → check（含覆盖率门禁）。
      # check 隐含 test + jacocoTestCoverageVerification（根 build.gradle 已全局
      # check.dependsOn 接线）——覆盖率不达 0.30 即 CI 失败，门禁从"定义了
      # 但从不运行"（审计三层落差）变为真实生效。
      - name: 测试 + 覆盖率门禁 (check)
        run: ./gradlew check --continue --no-daemon

      # P2-C6: composite build 模块测试门禁
      # settings.gradle 中 includeBuild 的模块（nexus-settlement/compliance/analytics/oracle）
      # 不被根 `./gradlew check` 覆盖，需单独执行其任务。
      # 这些模块自带 settings.gradle，通过 includeBuild 纳入统一构建，
      # 可通过根 gradlew 以 `:nexus-settlement:check` 形式调用（Gradle 8.x composite build 支持）。
      # 2026-09-05（覆盖率门禁收编）：settlement/oracle 自带模块级
      # jacocoTestCoverageVerification（0.30 下限，实测通过），test→check 激活门禁
      # （check 仍依赖 test，测试照跑）；compliance/analytics 暂无门禁，保持 test。
      - name: Test composite build modules
        run: |
          ./gradlew :nexus-settlement:check :nexus-compliance:test :nexus-analytics:test :nexus-oracle:check --no-daemon

      # 测试体系中期建设（2026-08-30）：影子测试资产纳入 CI。
      # 此前仅本地跑过的两模块，现纳入门禁（测试探活审计项）：
      # - nexus-consortium：includeBuild 且自带 settings.gradle，根 check 不覆盖，
      #   43 个测试文件/约 321 用例（PoA + 国密 SM2/3/4）——组合路径：
      #   consortium 是 includeBuild 声明的构建名，测试任务为 :nexus-consortium:consortium:test
      #   2026-09-05（覆盖率门禁收编）：consortium 构建树自带子模块级门禁
      #   （common/consortium 0.30，crypto 0.00 占位——实测指令覆盖 0/4259），
      #   test→check 激活；check 仍依赖 test，测试照跑。
      # - nexus-api-gateway：根构建 include 的 21 用例（AuthenticationFilter/RateLimitFilter），
      #   暂无模块级门禁，保持 test
      - name: Test consortium + api-gateway (shadow test assets)
        run: |
          ./gradlew :nexus-consortium:consortium:check :nexus-consortium:common:check :nexus-consortium:crypto:check :nexus-api-gateway:test --no-daemon

      # ① SDK 三语言回归（2026-09-05）：B 批（5f62509）产出的 Go 13 / Python 15 /
      # TS 8 用例此前仅本地验证、未进 CI——对外交付物无回归保护（如 core 的
      # JSON-RPC envelope 变更时三语言 SDK 不会告警）。三语言均为零基础设施
      # 测试（Go 标准库测试 / Python stdlib unittest / Node 内置 test runner），
      # ubuntu runner 预装 Go/Node/Python，零额外环境成本。
      # Java SDK 由根构建 check + codecov 覆盖，不在此列。
      - name: SDK Go regression
        working-directory: nexus-sdk/go
        run: go test ./nexus/

      - name: SDK Python regression
        working-directory: nexus-sdk/python
        run: python3 tests/test_nexus_sdk.py

      - name: SDK TypeScript regression
        working-directory: nexus-sdk
        run: |
          npm install
          npm run test:ts

      # ③ helm charts 门禁（2026-09-05）：lint + template 渲染 umbrella 与全部
      # 子 chart，防止部署资产腐化（此前 chart 改坏要到真部署时才发现）。
      # runner 预装 helm 3.x；模板无 required 硬约束，默认值可完整渲染。
      - name: Helm charts lint + template
        run: |
          for chart in deploy/helm/charts/*/; do
            name=$(basename "$chart")
            echo "=== helm lint $name ==="
            helm lint "$chart"
            echo "=== helm template $name ==="
            helm template "t-$name" "$chart" > /dev/null
          done
          echo "=== helm lint umbrella (nexus-chain) ==="
          helm lint deploy/helm
          helm template t-umbrella deploy/helm > /dev/null

      # P2-C6: 三个关键回归测试门禁（双花防御 / 桥资金守恒 / 门限签名）
      # 这些测试覆盖核心安全不变量，单独显式执行以确保被运行（即使其他测试被 skip）。
      # - ReplayProtectionTest：跨链消息重放保护（双花防御核心）
      # - DefaultInsuranceFundTest：保险基金账本守恒（桥资金守恒）
      # - MpcEndToEndTest：MPC 门限签名端到端（t-of-n 阈值签名正确性）——
      #   时序修正（2026-08-30 审计）：此前在本步骤执行，位于 Rust 3 节点集群
      #   启动【之前】，assumeTrue(healthy) 恒 false → CI 中此"关键门禁"实际
      #   永远静默跳过。现移至下方 "MPC distributed E2E" 集群启动之后执行。
      - name: 关键回归测试（双花防御 / 桥资金守恒）
        run: |
          ./gradlew :nexus-bridge:test \
            --tests "org.nexus.bridge.security.ReplayProtectionTest" \
            --tests "org.nexus.bridge.safety.DefaultInsuranceFundTest" \
            --no-daemon

      # P2-C6: Rust 测试（mpc-engine）
      # 通过 dtolnay/rust-toolchain@stable 显式安装 Rust 工具链，作为强制门禁。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          working-directory: mpc-engine
          # 显式安装 rustfmt 与 clippy 组件，供下方格式检查与 lint 门禁使用。
          components: rustfmt,clippy

      # 安装 protoc（Protocol Buffers 编译器）——prost-build 在 cargo clippy/test 编译时需要。
      # 必须在 clippy/test 之前安装，否则 build script 报 "Could not find protoc"。
      - name: Install protoc for Rust build scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler

      # C 批：Rust 编译缓存（Cargo registry + target 增量产物）。两个 Rust 工程
      # 各自独立缓存（workspaces 按 Cargo.lock 指纹 keying），命中后
      # fmt/clippy/test 的依赖编译跳过，Rust 相关步骤显著提速。
      - name: Rust build cache (mpc-engine)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mpc-engine

      - name: Rust build cache (zk-groth16-service)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zk-groth16-service

      # Rust 代码格式检查（rustfmt 门禁）。
      # `cargo fmt --all -- --check` 不修改文件，仅检查是否符合 rustfmt.toml 规则；
      # 不符合则非零退出，阻断 CI。开发者本地运行 `cargo fmt` 自动格式化。
      # rustfmt.toml 位于 mpc-engine/ 目录，配置 edition=2021、max_width=100 等。
      - name: Rust format check (cargo fmt)
        working-directory: mpc-engine
        run: cargo fmt --all -- --check

      # Rust lint 检查（clippy 门禁）。
      # `cargo clippy --all-targets` 检查 src/ 与 tests/ 的所有代码（含测试）；
      # `-D warnings` 将所有 warning 视为 error，强制零 warning 门禁，阻断 CI。
      # 常见 clippy 修正：冗余 clone、不必要的 mut、风格统一等。
      - name: Rust lint check (cargo clippy)
        working-directory: mpc-engine
        run: cargo clippy --all-targets --features tls -- -D warnings

      # MPC-B2-T1/T2: 集成测试去 #[ignore] 后需集群环境，普通 cargo test 只跑 lib 单测；
      # 分布式 E2E（3 节点集群）由下方独立步骤先启动集群再运行。
      - name: Rust tests (mpc-engine, lib)
        working-directory: mpc-engine
        run: cargo test --no-fail-fast --lib

      # MPC-B2-T2: 分布式 E2E（3 节点集群）——ubuntu runner + openssl + protoc
      # （tonic_build 需系统 protoc）+ cargo test --features tls --test integration_test。
      # start-mpc-cluster.sh -d 自动生成 mTLS 证书、编译并后台启动 3 节点（50051-50053）。
      - name: MPC distributed E2E (3-node cluster)
        working-directory: mpc-engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler openssl
          bash scripts/start-mpc-cluster.sh -d
          trap 'bash scripts/start-mpc-cluster.sh -k' EXIT
          cargo test --features tls --test integration_test

      # MPC Java E2E（时序修正后移到此处）：Rust 3 节点集群已由上一步启动，
      # MpcEndToEndTest 的 assumeTrue(healthy) 现在实际可达——真实执行
      # DKG→Sign→Aggregate→ECDSA 验签的门限签名 Java 侧回归。
      # 集群由上方 trap 在 job 结束时统一清理，此处无需重复。
      - name: MPC Java E2E (MpcEndToEndTest, after cluster start)
        run: |
          ./gradlew :nexus-signing-service:test \
            --tests "org.nexus.signing.mpc.MpcEndToEndTest" \
            --no-daemon

      # P2-C7 / ZK-A1-R5(a): zk-groth16-service 单测（bridge 动态电路 + 仪式导入回归）
      # 复用上方已安装的 Rust 工具链；bridge.rs 内含 #[cfg(test)] 单测（真实 Groth16 往返）。
      - name: Rust tests (zk-groth16-service)
        working-directory: zk-groth16-service
        run: cargo test --no-fail-fast

      # ZK-A1-R5(b)(c): HTTP E2E（setup→prove→verify 全链路 curl 断言）+ bench 阈值断言
      # scripts/zk-e2e.sh 启动服务并断言：真实配对 valid=true、错误输入 valid=false、
      # /v1/bench verify_avg_ms < 100ms。服务为 arkworks 真实实现，验证不依赖 Java 侧。
      - name: ZK service E2E (HTTP 全链路 + bench 阈值)
        working-directory: zk-groth16-service
        run: |
          cargo build --release
          bash ../scripts/zk-e2e.sh --start

      - name: 生成 JaCoCo 覆盖率报告
        run: ./gradlew jacocoTestReport --no-daemon

      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./nexus-gateway/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-bridge/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-core/nexus-core/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-signing-service/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-wallet-service/build/reports/jacoco/test/jacocoTestReport.xml,./nexus-sdk/java/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          verbose: true

      - name: 上传 JaCoCo HTML 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports-${{ matrix.os }}
          path: |
            **/build/reports/jacoco/test/html
            **/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传 JAR 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifacts-${{ matrix.os }}
          path: |
            **/build/libs/*.jar
          if-no-files-found: ignore
          retention-days: 14

  # ============================================================
  # C 批：CGGMP21 Java 集群 E2E 回归（C1 独立 job 结构）
  # ------------------------------------------------------------
  # CggmpMpcE2EClusterTest 在 JVM 内拉起 3 个 mpc-engine 子进程，经
  # gRPC + mTLS + Bearer auth 驱动 CGGMP21 keygen(t=2, n=3) 全链路，
  # 断言三方产出一致聚合公钥。此前为 Windows 本地手工验证（I 批），
  # 现纳入 CI 回归（C 批：测试路径 env 化 + 本 job）。
  #
  # 结构决策（C1）：独立 job 而非并入 build-and-test——
  #  1) 失败隔离：Rust release 编译 / 集群时序波动不拖累 Java 主链与覆盖率门禁；
  #  2) 覆盖率不回灌：集群 E2E 的覆盖依赖真实引擎进程，CI 常规 check
  #     仍排除该类（signing-service 门禁口径 0.36 不变，诚实口径）。
  #
  # 流程：GMP 工具链（cggmp21 rug 硬依赖）→ rust-cache → cargo build
  # --release --features tls → start-mpc-cluster.sh --setup-only（生成
  # mTLS 证书 + node{1,2,3}.json，不启动引擎）→ gradle 显式点名运行
  # （-PincludeClusterE2E 解除 test 任务级 exclude——--tests 过滤不
  # 穿透 exclude）。引擎进程由测试 @AfterAll 自毁，无需 trap 清理。
  # ============================================================
  mpc-java-cluster-e2e:
    name: MPC Java Cluster E2E (CGGMP21 3-node)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Ensure gradlew is LF
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # GMP 工具链：cggmp21 → rug 硬依赖（gmp/mpfr），m4 为其构建脚本所需；
      # protoc 供 mpc-engine build.rs（prost-build）；openssl 供证书生成
      # （runner 预装，显式列出以保证）。
      - name: Install GMP toolchain + protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev libmpfr-dev m4 protobuf-compiler openssl

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          working-directory: mpc-engine

      - name: Rust build cache (mpc-engine)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mpc-engine

      - name: Build mpc-engine (release, tls)
        working-directory: mpc-engine
        run: cargo build --release --features tls

      # 仅生成证书与节点 JSON 配置（node{1,2,3}.json 内嵌绝对证书路径），
      # 不启动引擎——测试自行拉起 3 进程并自毁。
      - name: Generate cluster certs + node configs (setup-only)
        working-directory: mpc-engine
        run: bash scripts/start-mpc-cluster.sh --setup-only

      - name: Run CggmpMpcE2EClusterTest (CGGMP21 keygen 2-of-3)
        run: |
          ./gradlew :nexus-signing-service:test -PincludeClusterE2E \
            --tests "org.nexus.signing.mpc.cggmp.CggmpMpcE2EClusterTest" \
            --no-daemon
        env:
          MPC_ENGINE_BIN: ${{ github.workspace }}/mpc-engine/target/release/mpc-engine

      - name: Upload engine logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpc-cluster-e2e-logs
          path: |
            mpc-engine/logs/**
            nexus-signing-service/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # Flyway 数据库迁移预检（Task 284）
  # ------------------------------------------------------------
  # 目的：在 CI 阶段验证各模块的 Flyway 迁移脚本可顺序应用、无语法/冲突错误，
  #       避免迁移缺陷流入 staging/prod。
  # 实现：启动 MySQL 8.0 service container，对每个含 db/migration 的模块
  #       使用 Flyway 9 官方镜像执行 migrate（每模块独立 schema，互不干扰）。
  # 触发：与 build-and-test 并行，仅依赖源码中的迁移脚本，不依赖编译产物。
  # ============================================================
  flyway-migration-check:
    name: Flyway 迁移预检
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: nexus_ci
          MYSQL_DATABASE: nexus_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pnexus_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pnexus_ci --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      # 对所有含 db/migration 的模块逐一执行 flyway migrate。
      # 每模块使用独立 schema（ci_<module>），避免不同模块 V1__init_schema.sql 等同版本号冲突。
      # 通过 --add-host=host.docker.internal:host-gateway 让 flyway 容器访问
      # service container 暴露在 host 127.0.0.1:3306 的 MySQL。
      - name: Flyway migrate 验证（所有含迁移脚本的模块）
        run: |
          set -euo pipefail
          # Flyway 11.x 官方镜像（Boot 4.0.8 BOM 管理 flyway-core 11.x，版本对齐）
          FLYWAY_IMG="flyway/flyway:11"
          # 含 db/migration 的模块列表（模块逻辑名 : 迁移脚本目录）
          # 2026-08-28 修复：
          #   1) nexus-consortium 迁移脚本真实路径是 nexus-consortium/consortium/...
          #      （settings.gradle includeBuild 'nexus-consortium'），此前误写
          #      consortium/consortium/... 导致 docker 挂载空目录、Flyway 迁移失败。
          #   2) nexus-consortium 是 PostgreSQL 模块（迁移脚本 BYTEA 语法，build.gradle
          #      依赖 flyway-database-postgresql），本预检 job 的 service container 是
          #      MySQL 8.0，方言不匹配无法迁移验证——从 MySQL 预检列表移除，
          #      consortium 的 PG 迁移验证在 PostgreSQL 环境（本地/部署流水线）进行。
          declare -a MODULES=(
            "nexus-gateway:nexus-gateway/src/main/resources/db/migration"
            "nexus-wallet-service:nexus-wallet-service/src/main/resources/db/migration"
            "nexus-bridge:nexus-bridge/src/main/resources/db/migration"
          )
          for ENTRY in "${MODULES[@]}"; do
            MODULE_NAME="${ENTRY%%:*}"
            MIG_PATH="${ENTRY#*:}"
            echo "::group::Flyway migrate for ${MODULE_NAME} (${MIG_PATH})"
            DB_NAME="ci_$(echo "${MODULE_NAME}" | tr '-' '_')"
            mysql -h 127.0.0.1 -P 3306 -uroot -pnexus_ci -e "CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\`;"
            docker run --rm \
              --add-host=host.docker.internal:host-gateway \
              -v "${PWD}/${MIG_PATH}:/flyway/sql:ro" \
              "${FLYWAY_IMG}" \
              -url="jdbc:mysql://host.docker.internal:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false" \
              -user=root \
              -password=nexus_ci \
              -locations=filesystem:/flyway/sql \
              -baselineOnMigrate=true \
              -connectRetries=10 \
              migrate
            echo ">>> ${MODULE_NAME} migration OK"
            echo "::endgroup::"
          done

  # ============================================================
  # Hardhat L1/L2 E2E（测试体系中期建设 2026-08-30）
  # ------------------------------------------------------------
  # 审计缺口：5 个 Hardhat 集成测试类（L2L1EndToEndTest/OnChainGovernance×2/
  # BridgeFullLifecycle/PaymentFlow/ValidationPipeline，46 用例）此前仅在
  # 本地手动运行——测试自带 assumeTrue 优雅跳过，CI 中装了 Node 也从未
  # 显式执行，属"影子测试资产"。
  # 环境：Node 22 LTS（Hardhat EDR 与 Node 25 不兼容，见 docs/testing/
  # skipped-tests.md §2.1）+ JDK 17。测试基类自适应：npm install →
  # 启动 npx hardhat node → 部署合约，任一步失败即整类跳过（不红）。
  # 该 job 已为强制门禁（2026-08-30 首轮真实执行毕业，无 continue-on-error 遮错；原观察模式注释已废弃）。
  # ============================================================
  hardhat-e2e:
    name: Hardhat L1/L2 E2E (Node 22)
    runs-on: ubuntu-latest
    # 观察模式已毕业（2026-08-30 首轮真实执行：33 用例运行/0 失败，
    # 5 类全部真实执行——治理 12/桥 4/校验管道 11/L2↔L1 6；其余 13 用例为
    # 环境断言下的合法 assumeTrue 跳过），转为强制门禁。
    timeout-minutes: 30
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Setup Node 22 (Hardhat EDR 兼容 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nexus-core/nexus-core/src/test/resources/l1-test/package-lock.json

      # l1-test npm 依赖预装（测试基类 @BeforeAll 检测 node_modules 存在则跳过安装，
      # 预装可显著缩短测试内启动路径并使依赖问题在本步骤独立暴露）
      - name: Pre-install l1-test npm dependencies
        working-directory: nexus-core/nexus-core/src/test/resources/l1-test
        run: npm ci --no-audit --no-fund

      - name: Hardhat E2E（5 个集成测试类）
        run: |
          ./gradlew :nexus-core:nexus-core:test \
            --tests "org.nexus.l2.integration.L2L1EndToEndTest" \
            --tests "org.nexus.governance.OnChainGovernanceIntegrationTest" \
            --tests "org.nexus.governance.GovernanceExecutorOnChainIntegrationTest" \
            --tests "org.nexus.integration.BridgeFullLifecycleIntegrationTest" \
            --tests "org.nexus.integration.ValidationPipelineIntegrationTest" \
            --no-daemon --info 2>&1 | tee hardhat-e2e-output.log
          # 台账自约束（docs/testing/skipped-tests.md §5.4）：CI 须报告跳过数
          echo "===== Hardhat E2E 跳过/执行统计 ====="
          grep -cE "Skipped|skipped" hardhat-e2e-output.log || echo "0 skipped lines"

  # ============================================================
  # CD：master 分支构建并推送 Docker 镜像到 GitHub Container Registry
  # ============================================================
  docker-build:
    name: Docker Build & Push (${{ matrix.module }})
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # GHCR 推送需要 packages: write 权限（默认 GITHUB_TOKEN 无此权限，
    # 导致 "denied: installation not allowed to Create organization package"）。
    permissions:
      contents: read
      packages: write
    # B2 修复（2026-08-31 交付前审计）：摘除 continue-on-error。
    # 原注释"REQ-02: 单模块构建失败不阻断其他模块"的代价是 master 可带着
    # 残缺镜像集前进（fail-fast: false 已保证并行互不阻断；单个失败整体红）。
    # GHCR 组织包创建权限此前已修（packages: write + 镜像 tag 小写化），
    # 剩余失败属真实构建问题，应阻断而非静默。
    # Rust 模块多阶段构建耗时较长，通过 matrix.include 放宽至 25min
    timeout-minutes: ${{ matrix.timeout-minutes || 20 }}
    env:
      REGISTRY: ghcr.io
      # IMAGE_PREFIX 已移除：github.repository 含大写（Levango7/NexusChain），
      # Docker tag 必须全小写，改由下方 step 输出 steps.img_prefix.outputs.prefix。
    strategy:
      fail-fast: false
      # max-parallel: 4 控制并发，避免触发 GitHub Actions 并发限额
      max-parallel: 4
      matrix:
        # REQ-02: 全部 12 个含 Dockerfile 的模块
        module:
          - nexus-core
          - nexus-gateway
          - nexus-bridge
          - nexus-signing-service
          - nexus-wallet-service
          - nexus-api-gateway
          - nexus-settlement
          - nexus-compliance
          - nexus-analytics
          - nexus-oracle
          - mpc-engine
          - zk-groth16-service
        # Rust 多阶段构建耗时较长，单独放宽 timeout（wrapper 下载 + cargo 全量编译）
        include:
          - module: mpc-engine
            timeout-minutes: 25
          - module: zk-groth16-service
            timeout-minutes: 25
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Compute lowercase image prefix
        id: img_prefix
        # Bash 参数扩展 ${VAR,,} 转 lowercase——Docker tag 不允许大写字符，
        # github.repository 产生 "Levango7/NexusChain" 会导致
        # "invalid tag ... repository name must be lowercase" 构建失败。
        run: echo "prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          # 所有模块 Dockerfile 均从 repo 根目录 COPY（gradlew/build.gradle/
          # settings.gradle/gradle/ 及 project() 依赖模块），故 context 必须为根。
          # file 字段指定各模块 Dockerfile 路径。
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img_prefix.outputs.prefix }}/${{ matrix.module }}:latest
            ${{ env.REGISTRY }}/${{ steps.img_prefix.outputs.prefix }}/${{ matrix.module }}:${{ github.sha }}
