name: NexusChain CI/CD Pipeline

# v1.9.2 修复：
# - 触发分支从 main/develop 改为 master（代码实际所在分支）
# - 删除指向已归档目录 nexus-exchange-wallet 的死步骤
# - 全部模块统一由根 gradlew 寻址（composite build 子模块用 :name:test，
#   nexus-consortium 为嵌套子项目用 :nexus-consortium:consortium:test）

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # 主 composite build 内模块（根 gradlew 直接寻址）
      - name: Build & Test Core
        run: ./gradlew :nexus-core:nexus-core:test --no-daemon

      - name: Build & Test Gateway
        run: ./gradlew :nexus-gateway:test :nexus-gateway:jacocoTestReport --no-daemon

      - name: Build & Test Bridge
        run: ./gradlew :nexus-bridge:test --no-daemon

      - name: Build & Test SDK (Java)
        run: ./gradlew :nexus-sdk:java:test --no-daemon

      - name: Build & Test Signing Service
        run: ./gradlew :nexus-signing-service:test --no-daemon

      - name: Build & Test Wallet Service
        run: ./gradlew :nexus-wallet-service:test --no-daemon

      # composite includeBuild 模块（从根寻址）
      - name: Build & Test Settlement
        run: ./gradlew :nexus-settlement:test --no-daemon

      - name: Build & Test Compliance
        run: ./gradlew :nexus-compliance:test --no-daemon

      - name: Build & Test Analytics
        run: ./gradlew :nexus-analytics:test --no-daemon

      - name: Build & Test Oracle
        run: ./gradlew :nexus-oracle:test --no-daemon

      - name: Build & Test Consortium
        run: ./gradlew :nexus-consortium:consortium:test --no-daemon

      - name: Upload Gateway JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-jacoco
          path: nexus-gateway/build/reports/jacoco/test/html

  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v1.9.2：阻断模式（exit-code 1）。依赖已升级至 CVE 安全版本：
      #   - BouncyCastle 1.70 → 1.78（bcprov-jdk15on → bcprov-jdk18on）
      #   - Netty 4.1.90.Final → 4.1.108.Final
      #   - Logback 1.2.11 → 1.2.13（CVE-2023-6378）
      # Trivy 发现 CRITICAL/HIGH/MEDIUM 漏洞将阻断流水线。
      - name: Trivy filesystem scan (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1

  docker-build:
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [nexus-gateway, nexus-bridge]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.module }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ github.sha }}

  # v1.9.2：无真实部署基础设施前禁用，避免伪造部署记录。
  deploy:
    needs: docker-build
    if: false  # TODO: pending real deployment infrastructure
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deployment is not yet implemented."
          # TODO: kubectl apply or docker-compose pull + up
