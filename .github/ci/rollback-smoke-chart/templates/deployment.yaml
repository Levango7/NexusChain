apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-smoke
  labels:
    app.kubernetes.io/name: rollback-smoke
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rollback-smoke
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rollback-smoke
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # 随 revision 变化 ⇒ 每次 upgrade 都产生新 ReplicaSet ⇒ rollout history 才有内容
        smokemarker: {{ .Values.revisionMarker | quote }}
    spec:
      containers:
        - name: smoke
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
